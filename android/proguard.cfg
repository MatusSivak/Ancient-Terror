-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose
-optimizations !code/simplification/arithmetic,!field/*,!class/merging/*

-keep public class * extends android.app.Activity
-keep public class * extends android.app.Application
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider
-keep public class com.android.vending.licensing.ILicensingService
-keep class com.android.vending.billing.**

# libGDX Android backend creates input classes via reflection.
# Keep constructors and class names stable in release minification.
-keep class com.badlogic.gdx.backends.android.** { *; }
-keep class com.badlogic.gdx.graphics.g2d.** { *; }
-keep class com.badlogic.gdx.graphics.Color { *; }
-keep class com.badlogic.gdx.scenes.scene2d.** { *; }
# Scene2D clipping pools Rectangle via reflection; no-arg ctor must remain accessible.
-keep class com.badlogic.gdx.math.Rectangle { public <init>(); }
# Custom SkinComposer widgets are instantiated reflectively from sgx-ui.json.
-keep class com.ray3k.skincomposer.** { *; }
# VisUI skin JSON (embedded in dependency assets) references classes by name.
-keep class com.kotcrab.vis.ui.** { *; }
# Desktop-only API referenced by VisUI file utils; not present on Android runtime.
-dontwarn com.apple.eio.FileManager

# RxJava 1 unsafe queue internals resolve field offsets via reflection by exact field names.
# Obfuscating these classes breaks producerIndex/consumerIndex lookup at runtime.
-keep class rx.internal.util.unsafe.** { *; }

-keepclasseswithmembernames class * {
	native <methods>;
}

-keepclasseswithmembernames class * {
	public <init>(android.content.Context, android.util.AttributeSet);
}

-keepclasseswithmembernames class * {
	public <init>(android.content.Context, android.util.AttributeSet, int);
}

-keepclassmembers enum * {
	public static **[] values();
	public static ** valueOf(java.lang.String);
}

-keep class * implements android.os.Parcelable {
	public static final android.os.Parcelable$Creator *;
}

-dontwarn java.beans.BeanInfo
-dontwarn java.beans.IntrospectionException
-dontwarn java.beans.Introspector
-dontwarn java.beans.PropertyDescriptor

# Core game content is loaded dynamically through Class.forName(...),
# so names and members must remain stable in minified release builds.
-keep class sk.sivak.eldritchhorror.core.** { *; }
