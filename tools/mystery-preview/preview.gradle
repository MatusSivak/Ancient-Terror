gradle.projectsEvaluated {
    def desktop = gradle.rootProject.project(':desktop')
    desktop.sourceSets.create('mysteryPreview') {
        java.srcDir new File(gradle.rootProject.projectDir, 'tools/mystery-preview')
        compileClasspath += desktop.sourceSets.main.runtimeClasspath
        runtimeClasspath += desktop.sourceSets.main.runtimeClasspath
    }
    desktop.tasks.register('previewMysteries', JavaExec) {
        dependsOn desktop.tasks.named('mysteryPreviewClasses')
        classpath = desktop.sourceSets.mysteryPreview.runtimeClasspath
        mainClass.set('MysteryPreview')
        workingDir = new File(gradle.rootProject.projectDir, 'assets')
    }
}
