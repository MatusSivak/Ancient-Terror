<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ancient Terror · Bug reports</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><p class="eyebrow">ANCIENT TERROR / DEVELOPER TOOLS</p><h1>Bug reports</h1><p id="project">Firestore report explorer</p></div><button id="refresh">Refresh reports</button></header>

<main><aside><div class="filters"><label for="search">Search reports</label><input id="search" type="search" placeholder="Description, ID, metadata…"><div class="filter-row"><label>Status<select id="status"><option value="">All statuses</option></select></label><label>Platform<select id="platform"><option value="">All platforms</option></select></label></div><label>Sort<select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label></div><p id="count"></p><div id="reports"></div></aside><article id="detail"><div class="empty"><h2>Select a report</h2><p>Inspect the screenshot, description, save file, and complete report metadata.</p></div></article></main>
</body></html>
