gradle.projectsEvaluated {
    def desktop = gradle.rootProject.project(':desktop')
    desktop.sourceSets.create('yigPreview') {
        java.srcDir new File(gradle.rootProject.projectDir, 'tools/yig-preview')
        compileClasspath += desktop.sourceSets.main.runtimeClasspath
        runtimeClasspath += desktop.sourceSets.main.runtimeClasspath
    }
    desktop.tasks.register('previewYig', JavaExec) {
        dependsOn desktop.tasks.named('yigPreviewClasses')
        classpath = desktop.sourceSets.yigPreview.runtimeClasspath
        mainClass.set('YigPreview')
        workingDir = new File(gradle.rootProject.projectDir, 'assets')
    }
}
