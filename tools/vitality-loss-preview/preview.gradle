gradle.projectsEvaluated {
    def desktop = gradle.rootProject.project(':desktop')
    desktop.sourceSets.create('vitalityLossPreview') {
        java.srcDir new File(gradle.rootProject.projectDir, 'tools/vitality-loss-preview')
        compileClasspath += desktop.sourceSets.main.runtimeClasspath
        runtimeClasspath += desktop.sourceSets.main.runtimeClasspath
    }
    desktop.tasks.register('previewVitalityLoss', JavaExec) {
        dependsOn desktop.tasks.named('vitalityLossPreviewClasses')
        classpath = desktop.sourceSets.vitalityLossPreview.runtimeClasspath
        mainClass.set('VitalityLossPreview')
        workingDir = new File(gradle.rootProject.projectDir, 'assets')
    }
}
