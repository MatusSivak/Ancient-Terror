ancientOne.azathoth.special=Skaza postúpi za každý\nžetón na zelenom znamení.
ancientOne.azathoth.midnight=Svet je pohltený!
ancientOne.azathoth.win=Vyrieš 3 záhady.
ancientOne.azathoth.flavor=Vonku v bezmyšlienkovom prázdne ma niesol démon,\nza žiarivé zhluky priestoru a rozmerov,\naž predo mnou nezostal čas ani hmota,\niba Chaos, bez tvaru a bez miesta.
ancientOne.azathoth.endGame=[RED]Svet je pohltený![]\n \nZemetrasenia a sopečné erupcie trhajú zemskú kôru.\nPrehral si hru.
ancientOne.cthulhu.special=Keď sa vyšetrovateľ presunie do víru,\nstane sa Zdržaným a stratí 1 Príčetnosť.
ancientOne.cthulhu.reckoning=Pod každým vyšetrovateľom na mori sa objaví vír.
ancientOne.cthulhu.midnight=Cthulhu sa prebúdza!
ancientOne.cthulhu.win=Vyrieš 3 záhady.
ancientOne.cthulhu.flavor=Vo svojom dome v R'lyehu\nmŕtvy Cthulhu čaká a sníva.\nNie je mŕtve to, čo večne leží,\na s podivnými eónmi môže zomrieť i smrť.
ancientOne.cthulhu.endGame=[RED]Veľkňaz Cthulhu povstáva a podmaňuje si Zem.[]\n \nPrehral si hru.
ancientOne.cthulhu.awaken.name=Cthulhu - Prebudený
ancientOne.cthulhu.awaken.alt=Veľkňaz Veľkých Starých
ancientOne.cthulhu.awaken.special=Keď sa vyšetrovateľ presunie do víru,\nstane sa Zdržaným, stratí 1 Príčetnosť a Cthulhuho sila stúpne!
ancientOne.cthulhu.awaken.reckoning=Každý vyšetrovateľ stratí Príčetnosť rovnakú ako Cthulhuho sila.
ancientOne.cthulhu.awaken.midnight=Vždy, keď by mala postúpiť skaza,\nnamiesto toho stúpne Cthulhuho sila!
ancientOne.cthulhu.awaken.win=Vyrieš 3 záhady.\nPoraz Cthulhua.
ancientOne.cthulhu.awaken.flavor=...morálka odhodená bokom, všetci kričia, zabíjajú a hodujú v radosti.\n...celá zem by vzbĺkla holokaustom extázy a slobody.
ancientOne.shubNiggurath.reckoning=Na náhodné miesto sa zrodí príšera.\nAk je na mape 10+ príšer, skaza postúpi dvakrát.
ancientOne.shubNiggurath.midnight=Shub-Niggurath sa prebúdza!
ancientOne.shubNiggurath.win=Vyrieš 3 záhady.
ancientOne.shubNiggurath.flavor=Pekelná bytosť podobná mračnu, Shub-Niggurath,\nna počesť ktorej bezmenné kulty vykonávajú\nobrad Kozy s tisíckou mláďat.
ancientOne.shubNiggurath.endGame=[RED]Z najdivokejších kútov Zeme sa vynoria temné mláďatá a zahltia ľudstvo.[]\n \nPrehral si hru.
ancientOne.shubNiggurath.awaken.name=Shub-Niggurath - Prebudená
ancientOne.shubNiggurath.awaken.alt=Čierna koza z lesov\ns tisíckou mláďat
ancientOne.shubNiggurath.awaken.reckoning=Každý vyšetrovateľ na rovnakom mieste ako Shub-Niggurath s ňou vykoná stretnutie.
ancientOne.shubNiggurath.awaken.midnight=Vždy, keď by mala postúpiť skaza, Shub-Niggurath zrodí 1 príšeru.\nAk je so Shub-Niggurath 5+ príšer, prehrávaš hru.
ancientOne.shubNiggurath.awaken.win=Vyrieš 3 záhady. Poraz Shub-Niggurath.
ancientOne.shubNiggurath.awaken.flavor=Ia! Shub-Niggurath! Čierna koza z lesov s tisíckou mláďat!
ancientOne.yogSothoth.reckoning=Skaza postúpi za každého vyšetrovateľa na bráne,\npokiaľ neodhodí 1 kúzlo.
ancientOne.yogSothoth.midnight=Yog-Sothoth sa prebúdza!
ancientOne.yogSothoth.win=Vyrieš 3 záhady.
ancientOne.yogSothoth.flavor=Yog-Sothoth pozná bránu.\nYog-Sothoth je brána.\nYog-Sothoth je kľúč aj strážca brány.\nMinulosť, prítomnosť aj budúcnosť sú v Yog-Sothothovi jedno.
ancientOne.yogSothoth.endGame=[RED]Yog-Sothoth zmietne príčetné smrteľné rasy a prinesie vek temnoty, šialenstva a absolútneho zla.[]\n \nPrehral si hru.
ancientOne.yogSothoth.awaken.name=Yog-Sothoth - Prebudený
ancientOne.yogSothoth.awaken.alt=Požierač duší
ancientOne.yogSothoth.awaken.reckoning=Yog-Sothothova sila stúpne za každého vyšetrovateľa na bráne,\npokiaľ neodhodí 1 kúzlo.
ancientOne.yogSothoth.awaken.midnight=Vždy, keď by mala postúpiť skaza, namiesto toho stúpne Yog-Sothothova sila!\nPri plnej sile prehrávaš hru.
ancientOne.yogSothoth.awaken.win=Vyrieš 4 záhady.
ancientOne.yogSothoth.awaken.flavor=Jedovatý Yog-Sothoth,\nktorý kypí ako pradávny sliz v jadrovom chaose\nza najvzdialenejšími hranicami priestoru a času!
