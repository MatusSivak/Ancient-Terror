mystery.progress=Postup:
mystery.current=Aktívna záhada {0}/{1}
mystery.azathoth.seed.name=Semeno démonického sultána
mystery.azathoth.seed.flavor=Nad Tunguskou preletela zelená kométa a zanechala za sebou les spálených, vyvrátených stromov. Kameň pod kráterom sa stále hýbe a každú noc sa zavŕtava hlbšie. Čosi v jeho vnútri odpovedá na volanie spoza najvzdialenejších hviezd.
mystery.azathoth.seed.text=Vyšetrovateľ môže v Tunguske preskúmať mŕtvy les a hľadať stopy po dopade (Test Observation). Ak uspeje, objaví zvláštny zelený meteorit a môže minúť 2 Clue, aby posunul aktívnu záhadu.
mystery.azathoth.omen.name=Znamenie skazy
mystery.azathoth.omen.flavor=Mesiac Nemesis visí tam, kde by nijaký mesiac nemal byť, a vidno ho z každého kúta sveta. Astronómovia nedokážu vysvetliť jeho dráhu a každú noc sa zdá bližšie. Ľudia na uliciach si šepkajú rovnaké varovanie v jazykoch, ktoré sa nikdy neučili.
mystery.azathoth.omen.text=Keď vyšetrovateľ zavrie bránu, môže minúť 1 Clue a posunúť aktívnu záhadu.
mystery.azathoth.occult.name=Okultný výskum
mystery.azathoth.occult.flavor=Obyčajní ľudia sa prebúdzajú s medzerami v pamäti a stránkami podivných výpočtov pri posteli. Šani prenikli do ľudských myslí a urobili zo svojich hostiteľov nevedomých služobníkov. Obrady vo vzdialených mestách sa postupne spájajú do jediného zaklínania privolávajúceho Azathotha.
mystery.azathoth.occult.text=Po vyriešení výskumného stretnutia môže vyšetrovateľ minúť 1 Clue získanú z tohto stretnutia a posunúť aktívnu záhadu.
mystery.azathoth.trueName.name=Pravé meno
mystery.azathoth.trueName.flavor=Zabudnuté knihy uchovávajú roztrúsené slabiky Azathothovho pravého mena. Tí, ktorí úlomky porovnávajú, počujú slabé pískanie aj v úplnom tichu. Texty sľubujú moc každému, kto meno vysloví trikrát, no ich okraje pokrývajú varovania napísané roztrasenými rukami.
mystery.azathoth.trueName.text=Vyšetrovateľ môže na označenom mieste skúsiť nájsť informácie o Azathothovom pravom mene; môže minúť 2 Clue a posunúť aktívnu záhadu.
mystery.azathoth.greenFlame.name=Zelený plameň
mystery.azathoth.greenFlame.flavor=Spev kultistov utíchne, keď z pukliny v zemi vyrazí zelený oheň. Plazí sa po kameni bez toho, aby ho spálil, a zhlukuje sa do tvaru skláňajúceho sa k uctievačom. Výkriky víťazstva slabnú: bytosť, ktorú privolali, práve opúšťa ochranný kruh.
mystery.azathoth.greenFlame.text=Na konci fázy mýtov, ak bol porazený epický Tulzscha, vyrieš túto záhadu.
mystery.azathoth.voice.name=Hlas Azathotha
mystery.azathoth.voice.flavor=Requiem per Shuggay sa zachovalo len v niekoľkých poškodených partitúrach. Hudobníci tvrdia, že operu nemožno zahrať, no jej nedokončené melódie ich prenasledujú v snoch. Skladateľa popravili za kacírstvo; poznámky na okrajoch naznačujú, že záverečná časť bola určená poslucháčom mimo nášho sveta.
mystery.azathoth.voice.text=Keď by vyšetrovateľ získal artefakt, môže namiesto toho získať artefakt "Requiem per Shuggay". Na konci fázy mýtov môže vyšetrovateľ minúť COMPLEXITY Clue a odhodiť artefakt "Requiem per Shuggay", aby vyriešil túto záhadu.
mystery.cthulhu.queen.name=Kráľovná Hlbiných
mystery.cthulhu.queen.flavor=Vody nad Y'ha-nthlei sa búria, keď Matka Hydra vystupuje z potopeného mesta. Pozdĺž pobrežia sa pod hladinou zhromažďujú jej deti a čakajú na rozkaz. Pradávny meč môže byť nádejou na jej porážku, ak sa podarí nájsť jeho úkryt skôr, než príliv prinesie jej vojsko na breh.
mystery.cthulhu.queen.text=Keď by vyšetrovateľ získal artefakt, môže namiesto toho získať artefakt "Sword of Y'ha-Talla". Na konci fázy mýtov, ak bol porazený epický Hydra, vyrieš túto záhadu.
mystery.cthulhu.threateningSeas.name=Hroziace moria
mystery.cthulhu.threateningSeas.flavor=Nad potopenými mestami, ktorých mená poznajú len zakázané spisy, sa hromadia búrky. Pri Y'ha-nthlei miznú lode a námorníci hovoria o hlasoch prenikajúcich v noci cez trup. Pod víriacimi vodami Hlbiní odriekajú spevy, ktoré majú narušiť spánok ich pána.
mystery.cthulhu.threateningSeas.text=Vyšetrovateľ môže na mieste s vírom skúsiť predĺžiť Cthulhuho spánok (Test Lore -1). Ak uspeje, môže minúť 1 Clue a odhodiť 1 kúzlo, aby zavrel vír a posunul aktívnu záhadu.
mystery.cthulhu.deepOnesAttack.name=Útok Hlbiných!
mystery.cthulhu.deepOnesAttack.flavor=Rybárske dediny celé týždne znášali prudké búrky. Preživší teraz nachádzajú medzi troskami stopy blanitých nôh a po zotmení počujú praskať dvere. More priviedlo k brehom vojsko a bytosti postupujúce dažďom presne vedia, do ktorých domov majú vstúpiť.
mystery.cthulhu.deepOnesAttack.text=Vyšetrovateľ môže na mieste s vírom skúsiť odraziť inváziu Hlbiných. Ak porazí prepadávajúceho Hlbinného, môže minúť 1 Clue, aby zavrel vír a posunul aktívnu záhadu.
mystery.cthulhu.starsRight.name=Hviezdy sú priaznivé!
mystery.cthulhu.starsRight.flavor=Spiaci ľudia po celom svete vidia obrovské kamenné dvere otvárajúce sa pod morom. Niektorí opúšťajú domovy a mieria k pobrežiu, iní vyrezávajú do stien neznáme súhvezdia. Cthulhuho sny prenikajú čoraz ďalej a jeho uctievači veria, že určená hodina sa blíži.
mystery.cthulhu.starsRight.text=Po vyriešení výskumného stretnutia môže vyšetrovateľ minúť 1 Clue získanú z tohto stretnutia a posunúť aktívnu záhadu.
mystery.cthulhu.watchingStars.name=Pozorovanie hviezd
mystery.cthulhu.watchingStars.flavor=Z potopeného mesta Yhe povstáva Cthylla pod oblohou plnou neznámych hviezd. Cthulhuho dcéra nesie desivý prísľub: ak telo jej otca zahynie, môže mu znovu dať život. Jeho porážka bude znamenať len málo, kým ona zostane mimo dosahu.
mystery.cthulhu.watchingStars.text=Na konci fázy mýtov, ak bol porazený epický Cthylla, vyrieš túto záhadu.
mystery.cthulhu.rlyehRisen.name=R'lyeh povstáva
mystery.cthulhu.rlyehRisen.flavor=Tam, kde mapy ukazujú iba šíry oceán, sa vynoril ostrov. Jeho mokré veže sa nakláňajú v nemožných uhloch a ulice akoby menili smer, keď sa nikto nepozerá. Po vekoch pod hladinou stojí R'lyeh opäť pod slnkom; jeho najhlbšie brány sú ešte stále zapečatené.
mystery.cthulhu.rlyehRisen.text=Vyšetrovateľ môže na označenom mieste preskúmať ostrovné mesto R'lyeh. Úspešné stretnutie posunie aktívnu záhadu.
mystery.cthulhu.risenSea.name=Povstalý z mora
mystery.cthulhu.risenSea.flavor=Prastarý znak je zlomený a brány R'lyehu sa otvorili. Cthulhu vystupuje z príboja a sny živých sa menia na hrôzu. Aj ďaleko vo vnútrozemí ľudia mlknú a obracajú sa k moru, načúvajúc čomusi príliš obrovskému, aby to dokázali počuť.
mystery.cthulhu.risenSea.text=Keď je porazený epický Cthulhu, vyrieš túto záhadu.
mystery.shub.blasphemy.name=Rúhanie čiernej kozy
mystery.shub.blasphemy.flavor=Čierne litánie priviedli Yeba z Čierneho ohňa. Kadiaľ prejde, polia vädnú a známe chodníky miznú pod odporným porastom. Uctievači ho nasledujú z bezpečnej vzdialenosti a pripravujú vyľudnenú krajinu na príchod Shub-Niggurath.
mystery.shub.blasphemy.text=Na konci fázy mýtov, ak bol porazený epický Yeb, vyrieš túto záhadu.
mystery.shub.hourLens.name=Hodina mesačnej šošovky
mystery.shub.hourLens.flavor=Nad strechami Goatswoodu sústreďujú podivné zrkadlá mesačné svetlo do jedinej šošovky. Za jasných nocí dedinčania bez slova opúšťajú domovy a vstupujú do lesa. Tí, ktorí sa vrátia, nechávajú závesy zatiahnuté a spoza ich dverí sa ozývajú ťažké, nepravidelné kroky.
mystery.shub.hourLens.text=Vyšetrovateľ môže v Londýne sledovať rituál premieňajúci uctievačov Shub-Niggurath na Kozie plody. Ak porazí prepadávajúceho Kozieho plodu, môže minúť 2 Clue a posunúť aktívnu záhadu.
mystery.shub.spawn.name=Plod čiernej kozy
mystery.shub.spawn.flavor=Nug začal uvoľňovať cestu Čiernej koze. Osady za ním zostávajú prázdne a ich múry trhajú korene, ktoré vyrástli za jedinú noc. Zo zvrátených dvojčiat Shub-Niggurath si práve on vybral pripraviť svet zničením všetkého, čo by sa jej mohlo postaviť.
mystery.shub.spawn.text=Na konci fázy mýtov, ak bol porazený epický Nug, vyrieš túto záhadu.
mystery.shub.nature.name=Povaha Všematky
mystery.shub.nature.flavor=Zvieratá napádajú svojich chovateľov a v sadoch dozrieva ovocie, ktoré pod šupkou pulzuje. Skaza putuje z miesta na miesto spolu s uctievačmi Shub-Niggurath. Dôkladný výskum môže odhaliť, ako sa jej vplyv šíri, hoci každý živý exemplár sa zúfalo snaží uniknúť z klietky.
mystery.shub.nature.text=Po vyriešení výskumného stretnutia môže vyšetrovateľ minúť 1 Clue získanú z tohto stretnutia a posunúť aktívnu záhadu.
mystery.shub.hunting.name=Lov na tisícku
mystery.shub.hunting.flavor=Správy o podivných šelmách už neprichádzajú len z odľahlých miest. Tisíc mladých sa šíri lesmi, poľami aj okrajmi miest. Lovci sa vracajú s protichodnými opismi, no všetky stopy vedú k rovnakému záveru: tvory sa množia rýchlejšie, než ich ktokoľvek dokáže spočítať.
mystery.shub.hunting.text=Keď je porazená ne-epická príšera, aktívny vyšetrovateľ môže minúť 2 Clue a posunúť aktívnu záhadu podľa odolnosti príšery.
mystery.shub.rituals.name=Rituály v divočine
mystery.shub.rituals.flavor=Na čistinkách ďaleko od ciest horia ohne. Kult Čiernej kozy okolo nich spieva, až ľudské hlasy vystrieda zvierací rev. Z temnoty za dosahom plameňov čosi odpovedá a každý ďalší obrad priťahuje neviditeľných poslucháčov bližšie.
mystery.shub.rituals.text=Vyšetrovateľ môže na označenom mieste skúsiť určiť účel rituálu (Test Observation). Ak uspeje, môže minúť 2 Clue a posunúť aktívnu záhadu.
mystery.shub.battleWoods.name=Bitka v lesoch
mystery.shub.battleWoods.flavor=Les sa prehýba pod obrovským mračnom mäsa a zvíjajúcich sa končatín. Odtlačky kopýt sa plnia čiernou vodou tam, kadiaľ prechádza Shub-Niggurath, a stromy sa chvejú, keď spomedzi koreňov vychádzajú jej mladé. Matka oblúd nadobudla podobu; les už neposkytuje nijaký úkryt.
mystery.shub.battleWoods.text=Keď je porazený epický Shub-Niggurath, vyrieš túto záhadu.
mystery.yog.spawn.name=Plod Yog-Sothotha
mystery.yog.spawn.flavor=Dieťa Lavinie Whateleyovej prerástlo všetky vysvetlenia, ktoré susedia ponúkali. Po kopcoch sa teraz neviditeľne pohybuje čosi obrovské a zanecháva rozdrvené ploty a vyprázdnené stodoly. Jeho nočné výkriky nesú meno, ktoré sa neodvážia vytlačiť ani najstaršie knihy Dunwichu.
mystery.yog.spawn.text=Na konci fázy mýtov, ak bol porazený epický Dunwich Horror, vyrieš túto záhadu.
mystery.yog.whereBrokeThrough.name=Kde sa prerazili Starí
mystery.yog.whereBrokeThrough.flavor=Dvere sa otvárajú na miesta, ktoré nemôžu existovať, a známe izby siahajú ďalej, než dovoľujú ich múry. Yog-Sothoth tlačí na hranice nášho sveta. Okolo každej trhliny sa vzduch chveje, akoby samotná skutočnosť bola sklenenou tabuľou tesne pred rozbitím.
mystery.yog.whereBrokeThrough.text=Keď vyšetrovateľ zavrie bránu, môže odhodiť 2 kúzla, aby zapečatil trhlinu a posunul aktívnu záhadu.
mystery.yog.beyondOne.name=Ten z beyondu
mystery.yog.beyondOne.flavor=Pre Yog-Sothotha sú včerajšok a zajtrajšok blízke ako susedné izby. Tí, ktorí hľadajú jeho poznanie, zahliadnu stratené mestá, nezrodené hviezdy aj okamihy vlastnej smrti. Odhalenia do seba zapadajú s desivou presnosťou, no po každej odpovedi je ťažšie spomenúť si na cestu domov.
mystery.yog.beyondOne.text=Po vyriešení výskumného stretnutia môže vyšetrovateľ minúť 1 Clue získanú z tohto stretnutia a posunúť aktívnu záhadu.
mystery.yog.stoneCircles.name=Kamenné kruhy
mystery.yog.stoneCircles.flavor=Pradávne kamene vrhajú tiene, ktoré neposlúchajú slnko. Na týchto zabudnutých miestach sa schádzajú Yog-Sothothovi uctievači a opakujú slová staršie než samotné monumenty. Keď ich hlasy zosilnejú, v prázdnom priestore uprostred každého kruhu sa začína črtať iná obloha.
mystery.yog.stoneCircles.text=Vyšetrovateľ môže na označenom mieste skúsiť narušiť rituál (Test Lore -1). Ak uspeje, môže minúť 2 Clue a posunúť aktívnu záhadu. Ak zlyhá, prepadne ho Kultista!
mystery.yog.void.name=Prázdnota medzi svetmi
mystery.yog.void.flavor=Staré spisy opisujú prázdnotu medzi rozmermi, v ktorej bol kedysi uväznený Yog-Sothoth. Cestovatelia pri jej prahu nevidia hviezdy, obzor ani náznak vzdialenosti. V tej neprítomnosti však čosi čaká a cesta späť nemusí zostať tam, kde ju zanechali.
mystery.yog.void.text=Vyšetrovateľ môže na bráne cestovať do prázdnoty medzi svetmi. Úspešné stretnutie posunie aktívnu záhadu.
mystery.yog.arcane.name=Arkánne porozumenie
mystery.yog.arcane.flavor=Kúzla, ktoré si kedysi vyžadovali námahu, teraz účinkujú takmer skôr, než zaznejú ich slová. Za touto ľahkosťou sa skrýva rastúci zásah: cudzie hlasy v myšlienkach ponúkajú ešte väčšie zázraky. Mágiou preniká Yog-Sothothova prítomnosť a priťahuje jej používateľov bližšie k jeho vôli.
mystery.yog.arcane.text=Keď vyšetrovateľ uspeje v teste Lore pri riešení efektu kúzla, môže minúť 1 Clue a odhodiť toto kúzlo, aby posunul aktívnu záhadu.
mystery.yog.keyGate.name=Kľúč a brána
mystery.yog.keyGate.flavor=Hranice medzi svetmi sa rozpadajú. Za každou otvorenou bránou sa nemožné svetlá spájajú do prítomnosti príliš rozsiahlej pre jediný tvar. Yog-Sothoth je priechodom aj tým, čo za ním čaká; ak sa má niekto tej hrôze postaviť, musí prekročiť prah.
mystery.yog.keyGate.text=Vyšetrovateľ môže na bráne čeliť Yog-Sothothovi. Úspešné stretnutie posunie aktívnu záhadu.

rumor.progress=Postup:
rumor.ongoing=Prebiehajúca fáma
rumor.objective=Cieľ:
rumor.failure=Zlyhanie:
rumor.requires=Vyžaduje:
rumor.timeLeft=Zostávajúci čas:
rumor.card.fracturedReality.title=Rozštiepená realita
rumor.card.fracturedReality.flavor=Zvláštny jav je ozvenou\ndávnej katastrofickej skazy Mu.\nDôsledky prehnaných ambícií hadích ľudí\nsi stále vyberajú svoju daň.
rumor.card.fracturedReality.objective=[#GOOD]Na mieste fámy zavri starobylý portál vytvorený dávno mŕtvym čarodejom z Mu.[]
rumor.card.fracturedReality.failure=[#BAD]Skaza postúpi za každú vyloženú bránu.[]
rumor.card.fracturedReality.reckoning=[#BAD]Odpočet.[]
rumor.card.growingMadness.title=Rastúce šialenstvo
rumor.card.growingMadness.flavor=Snívaš o živote šialeného mága\npred tisíckami rokov v Atlantíde.\nSnívaš aj o tom istom mágovi,\nktorý je dodnes živý na nezmapovanom ostrove.
rumor.card.growingMadness.objective=[#GOOD]Na mieste fámy nájdi nezmapovaný ostrov.[]
rumor.card.growingMadness.failure=[#BAD]Každý vyšetrovateľ stratí 3 Sanity.[]
rumor.card.growingMadness.reckoning=[#BAD]Hlavný vyšetrovateľ získa stav Šialenstvo. Odpočítaj za každý stav Šialenstvo, ktorý má.[]
rumor.card.lostKnowledge.title=Stratené poznanie
