rumor.card.fracturedReality.title=Rozštiepená realita
rumor.card.fracturedReality.flavor=Zvláštny jav je ozvenou\ndávnej katastrofickej skazy Mu.\nDôsledky prehnaných ambícií hadích ľudí\nsi stále vyberajú svoju daň.
rumor.card.fracturedReality.objective=[#GOOD]Na mieste fámy zavri starobylý portál vytvorený dávno mŕtvym čarodejom z Mu.[]
rumor.card.fracturedReality.failure=[#BAD]Skaza postúpi za každú vyloženú bránu.[]
rumor.card.fracturedReality.reckoning=[#BAD]Odpočet.[]
rumor.card.growingMadness.title=Rastúce šialenstvo
rumor.card.growingMadness.flavor=Snívaš o živote šialeného mága\npred tisíckami rokov v Atlantíde.\nSnívaš aj o tom istom mágovi,\nktorý je dodnes živý na nezmapovanom ostrove.
rumor.card.growingMadness.objective=[#GOOD]Na mieste fámy nájdi nezmapovaný ostrov.[]
rumor.card.growingMadness.failure=[#BAD]Každý vyšetrovateľ stratí 3 Príčetnosti.[]
rumor.card.growingMadness.reckoning=[#BAD]Hlavný vyšetrovateľ získa stav Šialenstvo. Odpočítaj za každý stav Šialenstvo, ktorý má.[]
rumor.card.lostKnowledge.title=Stratené poznanie
rumor.card.lostKnowledge.flavor=Tvoj kontakt v hlavnom meste váha hovoriť\no tých, ktorým hovoria „Strážcovia“.\nVravel, že pracujú pre rôzne vlády,\nale zodpovedajú sa inej autorite.
rumor.card.lostKnowledge.objective=[#GOOD]Poraz Tick Tock Men.[]
rumor.card.lostKnowledge.failure=[#BAD]-Všetky stopy na hernej ploche sa odhodia.[]\n[#BAD]-Každý vyšetrovateľ odhodí všetky svoje stopy.[]
rumor.card.lostKnowledge.reckoning=[#BAD]Odpočet.[]
rumor.card.starsAligned.title=Hviezdy sa zoradili
rumor.card.starsAligned.flavor=Tucet podozrivo vyzerajúcich cudzincov sa usadil v Paname\ns veľkou zbierkou astronomických príručiek.\nNa tomto mieste a v tomto čase je niečo výnimočné,\nčo im umožňuje trhať tkanivo reality.
rumor.card.starsAligned.objective=[#GOOD]Na mieste fámy nájdi a odstráň týchto cudzincov.[]
rumor.card.starsAligned.reckoning=[#BAD]Znamenie postúpi.[]
rumor.card.windWalker.title=Veterný kráčač
rumor.card.windWalker.flavor=Počasie sa zhoršuje. Sneh a ľad pokrývajú mestá,\nktoré vo svojej histórii nič také nezažili.
rumor.card.windWalker.objective=[#GOOD]Poraz Veterného kráčača.[]
rumor.card.windWalker.failure=[#BAD]-Každý vyšetrovateľ sa stane Zdržaným.\n-Každý vyšetrovateľ stratí 6 Zdravia.[]
rumor.card.windWalker.reckoning=[#BAD]Odpočet.[]

