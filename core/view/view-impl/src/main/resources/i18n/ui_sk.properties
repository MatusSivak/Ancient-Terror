ancientOne.awakened=Prebudený
ancientOne.yig.awakening=Yig sa prebúdza! Na pole 7, Yigov brloh, umiestni 1 kultistu.
ancientOne.yig.reckoning.cultist=Zúčtovanie: Na aktívnej expedícii sa objaví Kultista.
ancientOne.yig.reckoning.cultistRandom=Zúčtovanie: Na náhodnom mieste sa objaví Kultista.
ancientOne.yig.reckoning.doom=Na aktívnej expedícii sú 2 alebo viac príšer. Skaza postupuje o 1.
ancientOne.yig.endGame=Posledné zvony utíchnu. Ulice zaplavia hady a Yig sa ovinie okolo ruín ľudstva.\n\nJeho deti zdedili Zem. Pod oblohou, ktorá už nespozná úsvit, Otec hadov zavrie oči.\n\nJeho pomsta je dokonaná.
