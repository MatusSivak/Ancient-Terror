mystery.progress=Postup:
mystery.current=Aktívna záhada
mystery.azathoth.seed.name=Semeno démonického sultána
mystery.azathoth.seed.flavor=Z neba spadla zvláštna zelená kométa.\nAj po dopade sa meteorit pomaly zavŕtava hlbšie do zeme.
mystery.azathoth.seed.text=Vyšetrovateľ môže v Tunguske\npreskúmať mŕtvy les a hľadať stopy po dopade\n(Test Pozorovania).\nAk uspeje, objaví zvláštny zelený meteorit\na môže minúť 2 stopy, aby posunul aktívnu záhadu.
mystery.azathoth.omen.name=Znamenie skazy
mystery.azathoth.omen.flavor=Na nočnej oblohe sa objavil Mesiac Nemesis,\nviditeľný pre všetkých a predznamenávajúci blížiacu sa skazu.
mystery.azathoth.omen.text=Keď vyšetrovateľ zavrie bránu\nzodpovedajúcu aktuálnemu znameniu,\nmôže minúť 1 stopu a posunúť aktívnu záhadu.
mystery.azathoth.occult.name=Okultný výskum
mystery.azathoth.occult.flavor=Šani ovládajú nevinné obete po celom svete\na používajú ich na privolanie Azathotha.
mystery.azathoth.occult.text=Po vyriešení výskumného stretnutia\nmôže vyšetrovateľ minúť 1 stopu získanú z tohto stretnutia\na posunúť aktívnu záhadu.
mystery.azathoth.trueName.name=Pravé meno
mystery.azathoth.trueName.flavor=Úlomky Azathothovho pravého mena sa nachádzajú v dávno zabudnutých zväzkoch.\nHovorí sa, že ak niekto vysloví jeho meno nahlas trikrát,\nrúhavý zvuk rečníkovi prinesie veľkú moc.
mystery.azathoth.trueName.text=Vyšetrovateľ môže na označenom mieste skúsiť nájsť informácie o Azathothovom pravom mene;\nmôže minúť 2 stopy a posunúť aktívnu záhadu.
mystery.azathoth.greenFlame.name=Zelený plameň
mystery.azathoth.greenFlame.flavor=V odpovedi na invokáciu kultu\nz pukliny vyšľahol prúd zeleného plameňa,\nktorý sa hnal po stenách ako živá bytosť.
mystery.azathoth.greenFlame.text=Na konci fázy mýtov, ak bol porazený epický Tulzscha, vyrieš túto záhadu.
mystery.azathoth.voice.name=Hlas Azathotha
mystery.azathoth.voice.flavor=Väčšina hudobníkov označuje túto taliansku operu z 18. storočia za nehrateľnú.\nNie je prekvapením, že skladateľa popravili za kacírstvo.
mystery.azathoth.voice.text=Keď by vyšetrovateľ získal artefakt, môže namiesto toho získať\nartefakt „Requiem per Shuggay“.\nNa konci fázy mýtov\nmôže vyšetrovateľ minúť COMPLEXITY stôp\na odhodiť artefakt „Requiem per Shuggay“,\naby vyriešil túto záhadu.
mystery.cthulhu.queen.name=Kráľovná Hlbiných
mystery.cthulhu.queen.flavor=Matka Hydra povstáva zo svojho domova v Y'ha-nthlei,\naby dohliadla na zástupy svojich detí.
mystery.cthulhu.queen.text=Keď by vyšetrovateľ získal artefakt, môže namiesto toho získať\nartefakt „Sword of Y'ha-Talla“.\nNa konci fázy mýtov,\nak bol porazený epický Hydra,\nvyrieš túto záhadu.
mystery.cthulhu.threateningSeas.name=Hroziace moria
mystery.cthulhu.threateningSeas.flavor=Po celom svete sa tvoria búrky\nnad potopenými mestami, ktoré Hlbiní nazývajú domovom,\nako Y'ha-nthlei a Ahu-Y'hloa.
mystery.cthulhu.threateningSeas.text=Vyšetrovateľ môže na mieste s vírom\nskúsiť predĺžiť Cthulhuho spánok (Test Vedomostí -1).\nAk uspeje, môže minúť 1 stopu a odhodiť 1 kúzlo,\naby zavrel vír a posunul aktívnu záhadu.
mystery.cthulhu.deepOnesAttack.name=Útok Hlbiných!
mystery.cthulhu.deepOnesAttack.flavor=Strašné búrky sužujú rybárske dediny po celom svete,\nale je to len predohra k invázii armády Hlbiných!
mystery.cthulhu.deepOnesAttack.text=Vyšetrovateľ môže na mieste s vírom\nskúsiť odraziť inváziu Hlbiných.\nAk porazí prepadávajúceho Hlbinného, môže minúť 1 stopu,\naby zavrel vír a posunul aktívnu záhadu.
mystery.cthulhu.starsRight.name=Hviezdy sú priaznivé!
mystery.cthulhu.starsRight.flavor=Po celom svete Cthulhuho uctievači\na citliví snívajúci podliehajú šialenstvu.\nHrnie sa k moru, aby boli svedkami návratu Prastarého.
mystery.cthulhu.starsRight.text=Po vyriešení výskumného stretnutia\nmôže vyšetrovateľ minúť 1 stopu získanú z tohto stretnutia\na posunúť aktívnu záhadu.
mystery.cthulhu.watchingStars.name=Pozorovanie hviezd
mystery.cthulhu.watchingStars.flavor=Zo zatopeného mesta Yhe povstáva Cthylla, aby naplnila svoj osud.\nDcéra Cthulhua porodí jeho reinkarnáciu,\nak bude jeho telo zničené.
mystery.cthulhu.watchingStars.text=Na konci fázy mýtov, ak bol porazený epický Cthylla, vyrieš túto záhadu.
mystery.cthulhu.rlyehRisen.name=R'lyeh povstáva
mystery.cthulhu.rlyehRisen.flavor=Pred vekmi bolo mesto R'lyeh uvrhnuté na dno oceánu\nzabudnutou katastrofou. Zostalo tam uväznené,\nčakajúc na správny čas návratu.\nTeraz ten čas nadišiel.
mystery.cthulhu.rlyehRisen.text=Vyšetrovateľ môže na označenom mieste\npreskúmať ostrovné mesto R'lyeh.\nÚspešné stretnutie posunie aktívnu záhadu.
mystery.cthulhu.risenSea.name=Povstalý z mora
mystery.cthulhu.risenSea.flavor=Konečne nastal čas,\nHlbiní prelomili starobylý pečaťový znak,\nktorý držal ich pána v spánku.\nCthulhu znovu povstáva\na sny všetkého živého zaplavuje šialenstvo.
mystery.cthulhu.risenSea.text=Keď je porazený epický Cthulhu,\nvyrieš túto záhadu.
mystery.shub.blasphemy.name=Rúhanie čiernej kozy
mystery.shub.blasphemy.flavor=Čierne litánie zazneli\na Yeb bol vyvolaný z Čierneho ohňa,\naby očistil zem pre príchod Shub-Niggurath.
mystery.shub.blasphemy.text=Na konci fázy mýtov,\nak bol porazený epický Yeb,\nvyrieš túto záhadu.
mystery.shub.hourLens.name=Hodina mesačnej šošovky
mystery.shub.hourLens.flavor=V malej dedine Goatswood sú na stĺpe usporiadané zvláštne zrkadlá,\nktoré sústreďujú mesačné svetlo cez šošovku.\nHovorí sa, že kult Čiernej kozy ju používa pri svojich temných obradoch.
mystery.shub.hourLens.text=Vyšetrovateľ môže v Londýne\nsledovať rituál premieňajúci uctievačov Shub-Niggurath na Kozie plody.\nAk porazí prepadávajúceho Kozieho plodu, môže minúť 2 stopy\na posunúť aktívnu záhadu.
mystery.shub.spawn.name=Plod čiernej kozy
mystery.shub.spawn.flavor=Dve rúhania Shub-Niggurath pripravia svet pre Čiernu kozu,\nničia každú možnú výzvu voči vláde ich matky.\nJedno z dvojice, Nug, už začalo svoju desivú úlohu.
mystery.shub.spawn.text=Na konci fázy mýtov,\nak bol porazený epický Nug,\nvyrieš túto záhadu.
mystery.shub.nature.name=Povaha Všematky
mystery.shub.nature.flavor=Shub-Niggurath prirodzene kazí všetok život, ktorý sa s ňou stretne.\nVšade, kde sa objavia jej uctievači,\nsa živé bytosti stávajú zúrivejšími a divokejšími.
mystery.shub.nature.text=Po vyriešení výskumného stretnutia\nmôže vyšetrovateľ minúť 1 stopu získanú z tohto stretnutia\na posunúť aktívnu záhadu.
mystery.shub.hunting.name=Lov na tisícku
mystery.shub.hunting.flavor=Potomstvo Shub-Niggurath, Tisíc mladých,\nzamoria planétu v čoraz väčších počtoch\na hrozia ovládnutím ľudstva.
mystery.shub.hunting.text=Keď je porazená ne-epická príšera,\naktívny vyšetrovateľ môže minúť 2 stopy\na posunúť aktívnu záhadu\npodľa odolnosti príšery.
mystery.shub.rituals.name=Rituály v divočine
mystery.shub.rituals.flavor=V najdivokejších kútoch planéty hučia ohne,\nkeď kult Čiernej kozy vykonáva beštiálne rituály.\nKultisti vyjú k Shub-Niggurath,\naby vypustila svoje deti na Zem.
mystery.shub.rituals.text=Vyšetrovateľ môže na označenom mieste\nskúsiť určiť účel rituálu (Test Pozorovania).\nAk uspeje, môže minúť 2 stopy\na posunúť aktívnu záhadu.
mystery.shub.battleWoods.name=Bitka v lesoch
mystery.shub.battleWoods.flavor=Divoká matka všetkých oblúd sa zhmotnila!\nJe to obrovský mrak,\nz ktorého sa vysúvajú a zasúvajú desiatky chápadiel.\nKade prejde, zanecháva veľké odtlačky kopýt.\nUzrieť jej pravú, desivú podobu\nznamená postaviť sa tvárou v tvár prapôvodnej hrôze.
mystery.shub.battleWoods.text=Keď je porazený epický Shub-Niggurath,\nvyrieš túto záhadu.
mystery.yog.spawn.name=Plod Yog-Sothotha
mystery.yog.spawn.flavor=Lavinia Whateley porodila čosi hrozné\na to stvorenie teraz volá svojho otca...
mystery.yog.spawn.text=Na konci fázy mýtov,\nak bol porazený epický Dunwich Horror,\nvyrieš túto záhadu.
mystery.yog.whereBrokeThrough.name=Kde sa prerazili Starí
mystery.yog.whereBrokeThrough.flavor=Yog-Sothoth sa snaží oslobodiť\nz priestoru medzi dimenziami\na pritom trhá diery v našej realite.
mystery.yog.whereBrokeThrough.text=Keď vyšetrovateľ zavrie bránu,\nmôže odhodiť 2 kúzla,\naby zapečatil trhlinu a posunul aktívnu záhadu.
mystery.yog.beyondOne.name=Ten z beyondu
mystery.yog.beyondOne.flavor=Yog-Sothoth existuje na všetkých miestach a vo všetkých časoch.\nPre každú dušu dosť hlúpu na to, aby ho hľadala,\nmôže Prastarý odomknúť bezhraničné poznanie a moc,\nale vždy to má svoju cenu.
mystery.yog.beyondOne.text=Po vyriešení výskumného stretnutia\nmôže vyšetrovateľ minúť 1 stopu získanú z tohto stretnutia\na posunúť aktívnu záhadu.
mystery.yog.stoneCircles.name=Kamenné kruhy
mystery.yog.stoneCircles.flavor=Po celom svete sa uctievači Yog-Sothotha\nzhromažďujú na pradávnych miestach moci,\nkaždé označené kruhom mohutných kameňov,\npoložených neznámymi silami pred tisíckami rokov.
mystery.yog.stoneCircles.text=Vyšetrovateľ môže na označenom mieste\nskúsiť narušiť rituál (Test Vedomostí -1).\nAk uspeje, môže minúť 2 stopy\na posunúť aktívnu záhadu.\nAk zlyhá, prepadne ho Kultista!
mystery.yog.void.name=Prázdnota medzi svetmi
mystery.yog.void.flavor=Hovorí sa, že dávno bol Yog-Sothoth uväznený\nna mieste úplnej neexistencie,\nv zvláštnej prázdnote medzi dimenziami.
mystery.yog.void.text=Vyšetrovateľ môže na bráne\ncestovať do prázdnoty medzi svetmi.\nÚspešné stretnutie posunie aktívnu záhadu.
mystery.yog.arcane.name=Arkánne porozumenie
mystery.yog.arcane.flavor=Ľudstvo sa nesmie zahrávať s arkánnymi energiami.\nYog-Sothoth je samotná podstata mágie\na človek pod vplyvom čarodejníctva\nsa nevyhnutne stane bábkou Prastarého.
mystery.yog.arcane.text=Keď vyšetrovateľ uspeje v teste Vedomostí\npri riešení efektu kúzla,\nmôže minúť 1 stopu a odhodiť toto kúzlo,\naby posunul aktívnu záhadu.
mystery.yog.keyGate.name=Kľúč a brána
mystery.yog.keyGate.flavor=Prastará hrôza trhá steny medzi svetmi\na prelieva sa cez trhliny reality.
mystery.yog.keyGate.text=Vyšetrovateľ môže na bráne\nčeliť Yog-Sothothovi.\nÚspešné stretnutie posunie aktívnu záhadu.

