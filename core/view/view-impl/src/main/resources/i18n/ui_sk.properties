# Yig
ancientOne.yig.name=Yig
ancientOne.yig.alt=Otec hadov
ancientOne.yig.setup=Odlož 6 Kultistov a 1 príšeru Hadí ľudia.\nPriprav špeciálne stretnutia v K'n-yane.
ancientOne.yig.special=Kultisti: Will (0), Hrôza 1; Strength (-1), Zranenie 2; Odolnosť 1. Strata Health pri ich teste Strength spôsobí Otravu.
ancientOne.yig.selection.special=Keď vyšetrovateľ stratí Health pri teste Strength proti Kultistovi,\nzíska Otravu.
ancientOne.yig.reckoning=Na aktívnej expedícii sa objaví\nKultista. Ak sú potom na tom mieste\n2+ príšery, Skaza postúpi o 1.
ancientOne.yig.midnight=Yig sa prebúdza. Na pole 7\numiestni 1 kultistu. Otrávení\nvyšetrovatelia získajú Prekliatie.
ancientOne.yig.win=Vyrieš 3 záhady, potom čel Yigovi.
ancientOne.yig.flavor=Pod zabudnutými chrámami sa zvíja\nOtec hadov. Všetky hady sú\njeho deťmi a žiadne nezomrie\nnepovšimnuté. Na tých, čo im ublížia,\nzošle svoju pradávnu kliatbu.
ancientOne.yig.awaken.alt=Hadie hniezdo
ancientOne.yig.awaken.flavor=Chrámové kamene pukajú pod\njeho dvíhajúcimi sa závitmi. Po celom svete\nodpovedajú hady na volanie otca.\nYig prišiel vziať si krv\ntých, čo zabíjali jeho deti.\nJeho pomsta nikoho neušetrí.
ancientOne.yig.awaken.special=Vždy, keď by Skaza mala ustúpiť,\nmôžeš namiesto toho odhodiť jeden\nstav Prekliatie.
ancientOne.yig.awaken.reckoning=Na náhodnom mieste sa objaví jeden Kultista.
ancientOne.yig.awaken.win=Vyrieš tri záhady,\npotom poraz Yiga a zvíťazíš.
ancientOne.features.yigEncounters=72 výskumných stretnutí a osem špeciálnych stretnutí v K'n-yane
mystery.yig.CROWN_OF_THE_SERPENT.name=Hadia koruna
mystery.yig.CROWN_OF_THE_SERPENT.flavor=Zlatá hadia koruna dáva svojmu nositeľovi hlas, ktorému ostatní nedokážu odporovať. Tí, ktorých pripúta do služby, strácajú svoju vernosť, potom vlastné mená, až v nich zostane iba oddanosť. Pod prísľubom vlády Yigova vôľa čoraz pevnejšie zviera pána aj služobníkov.
mystery.yig.CROWN_OF_THE_SERPENT.text=Pri získaní artefaktu si môžeš namiesto neho vziať Serpent Crown. Koniec fázy mýtov: vlastník koruny môže testovať Will -1. Úspech: môžeš minúť CLUE_COST a odhodiť 2 vybavenia Spojenec → vyrieš túto záhadu.
mystery.yig.DESCENDANTS_OF_YIG.name=Potomkovia Yiga
mystery.yig.DESCENDANTS_OF_YIG.flavor=V odľahlých osadách rodiny skrývajú deti so studenou kožou a očami, ktoré nežmurkajú. Keď dospeli, začali miznúť ľudia a teraz zostávajú opustené celé domácnosti. Yigovi poloľudskí potomkovia sa zhromažďujú a na cestách k svojim zhromaždiskám zanechávajú zvlečené kože.
mystery.yig.DESCENDANTS_OF_YIG.text=Poraz epickú príšeru Deti Yiga → na konci fázy mýtov vyrieš túto záhadu.
mystery.yig.KN_YAN_UNEARTHED.name=Odhalený K'n-yan
mystery.yig.KN_YAN_UNEARTHED.flavor=Chodba pod zemou vedie do modro osvetlených jaskýň K'n-yanu. Ich nesmrteľní obyvatelia si pamätajú veky, na ktoré ľudské dejiny zabudli, a z pradávnych chrámov hľadia Yigove podobizne. Návštevníkov vítajú znepokojivou zdvorilosťou, no málokto z tých, ktorí zostúpia, sa znovu objaví na povrchu.
mystery.yig.KN_YAN_UNEARTHED.text=Stretnutie na značke: môžeš preskúmať K'n-yan. Úspešné stretnutie → posuň túto záhadu.
mystery.yig.MIGRATION_OF_SERPENTS.name=Sťahovanie hadov
mystery.yig.MIGRATION_OF_SERPENTS.flavor=Hady opúšťajú svoje úkryty v počtoch, ktoré nedokáže vysvetliť nijaké ročné obdobie. Prechádzajú cez cesty, rieky aj rušné ulice a všetky nasledujú rovnaké neviditeľné volanie. Ich stopy sa zbiehajú na miestach odvekých Yigových kultov, kde aj najmenšie hady nehybne čakajú ako na rozkaz.
mystery.yig.MIGRATION_OF_SERPENTS.text=Po výskumnom stretnutí môžeš minúť 1 Clue získanú z neho → posuň túto záhadu.
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.name=Vzostup hadích ľudí
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.flavor=Za zapečatenými dverami hadí ľudia znovu otvorili laboratóriá opustené ešte pred vznikom ľudskej civilizácie. Nezvestní sa vracajú zmenení, s podivnými jazvami a spomienkami, ktoré nemôžu byť ich vlastné. Dávne pokusy pokračujú a ich tvorcovia zisťujú, ako ľahko môžu preniknúť medzi nás.
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.text=Stretnutie na značke: môžeš testovať Observation -1. Úspech: môžeš minúť 2 Clue → odstráň túto značku a posuň túto záhadu. Neúspech: prepadne ťa Kultista.
mystery.yig.THE_WINGED_SERPENT.name=Okrídlený had
mystery.yig.THE_WINGED_SERPENT.flavor=Nad Tokijským zálivom krúži obrovský okrídlený had a jeho tieň prechádza cez lode aj preplnené nábrežia. Po každom zostupe zostávajú rozlámané sťažne a voda sfarbená krvou. Yigovi stúpenci zo skrytých svätýň sledujú jeho let a pripravujú obete na jeho ďalší návrat.
mystery.yig.THE_WINGED_SERPENT.text=Poraz epickú príšeru Okrídlený had → na konci fázy mýtov vyrieš túto záhadu.
mystery.yig.SERPENTS_NEST.name=Hadie hniezdo
mystery.yig.SERPENTS_NEST.flavor=Ruiny sa hmýria nespočetnými hadmi, keď z temnoty vystúpi Otec hadov. Yigovi uctievači pred ním zmĺknu; aj oni sa desia hnevu, ktorý privolali. Všetky stopy, skryté chrámy a zmiznuté životy viedli až sem, do srdca jeho hniezda.
mystery.yig.SERPENTS_NEST.text=Poraz epickú príšeru Yig → vyrieš túto záhadu.
