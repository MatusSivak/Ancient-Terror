tutorial.intro.openAncientOneInfo=Klikni sem a pozri si informácie o Prastarom, ktorému čelíme.
tutorial.ancientOne.azathothIntro=Azathoth, Démonický sultán. Ak sa prebudí, Zem bude zničená.
tutorial.ancientOne.solveMysteries=Aby si ho zastavil, musíš vyriešiť 3 záhady. V tomto tutoriáli vyriešiš iba jednu.
tutorial.ancientOne.viewMystery=Pozrime sa, ktorú záhadu musíš vyriešiť.
tutorial.mystery.tunguskaObjective=Cestuj do Tungusky a použi 2 stopy, aby si našiel stopy po dopade meteoritu.
tutorial.mystery.needClues=Momentálne nemáš žiadne stopy, takže ich musíš najprv získať.
tutorial.investigator.checkSpecial=Najprv si pozri špeciálnu akciu svojho vyšetrovateľa.
tutorial.investigator.spyGainClue=Ako akciu môže Špiónka získať 1 stopu, ak nemá žiadnu.
tutorial.actionPhase.start=Teraz začína Fáza akcií a môžeš v nej vykonať 2 akcie.
tutorial.actionPhase.firstAction=Vykonaj svoju prvú akciu: získaj 1 stopu.
tutorial.actionPhase.needSecondClue=Na vyriešenie záhady potrebuješ dve stopy. Kde nájdeš tú druhú?
tutorial.actionPhase.secondClueLocation=Tu - v Pyramídach.
tutorial.actionPhase.secondActionTravel=Použime tvoju druhú akciu, aby sme sa priblížili!
tutorial.actionPhase.travelIstanbul=Cestuj do Istanbulu.
tutorial.actionPhase.noActionsLeft=Použil si dve akcie, takže ti už nezostali žiadne.
tutorial.actionPhase.encounterIncoming=Fáza akcií sa skončila. Začína Fáza stretnutí.
tutorial.encounterPhase.fightMonsters=V tejto fáze musíš bojovať so všetkými príšerami na svojom priestore.
tutorial.encounterPhase.prepareManiac=Priprav sa na boj s Maniakom!
tutorial.encounterPhase.goodJob=Skvelá práca! Keďže tu už nie sú nepriatelia, môžeš si zvoliť ďalšie stretnutie.
tutorial.encounterPhase.finished=Fáza stretnutí sa skončila. Je čas na Fázu mýtov.
tutorial.mythosPhase.survivedGateOpened=Prežil si Fázu mýtov, ale otvorila sa jedna brána.
tutorial.mythosPhase.newRound=Začína nové kolo Fázou akcií a opäť môžeš vykonať 2 akcie.
tutorial.actionPhase2.travelPyramids=Cestuj ďalej do Pyramíd. Tvoja druhá stopa je tam.
tutorial.actionPhase2.executeFocus=Si tu. Teraz sa sústreď. Vykonaj akciu Sústreď sa.
tutorial.actionPhase2.focusToken=Získal si žetón Sústredenia. Môžeš ho použiť na prehodenie jednej kocky.
tutorial.encounterPhase2.researchClue=Je čas na Výskum. Ak uspeješ, získaš túto stopu.
tutorial.encounterPhase2.extraClues=Teraz máš viac stôp, než potrebuješ. Pozrime sa, čo prinesie Fáza mýtov.
tutorial.actionPhase3.finishMystery=Je čas cestovať do Tungusky a dokončiť túto záhadu. Si pripravený.
tutorial.actionPhase3.clickReserve=Trvá to príliš dlho. Klikni na Rezervu - možno tam nájdeš niečo užitočné na cestu.
tutorial.actionPhase3.obtainCharterFlight=Skvelé! Môžeš získať kartu Charter Flight! Okamžite ťa tam dopraví.
tutorial.actionPhase3.buyCharterFlight=Zvoľ 'Získať vybavenie' ako svoju druhú akciu a kúp kartu Charter Flight.
tutorial.actionPhase3.tunguskaArrival=Tunguska. Jasne vidíš obrovský kráter po dopade.
tutorial.encounterPhase3.useObservation=Použi svoju schopnosť Pozorovanie a zisti, čo sa tu stalo.
tutorial.encounterPhase3.discoveredMeteorite=Dokázal si to! Objavil si meteorit a posunul záhadu.
tutorial.encounterPhase3.mysteryResolvesNextMythos=Táto záhada sa vyrieši na konci nasledujúcej Fázy mýtov.
tutorial.outro.congratulations=Gratulujeme! Vyriešil si jednu záhadu, odomkol novú kartu a dokončil tutoriál.
tutorial.outro.readyQuestion=Si pripravený poraziť Prastarého?
tutorial.mysteryEncounter.veryUnsuccessfulRoll=To bol veľmi neúspešný hod!
tutorial.mysteryEncounter.checkInvestigatorPassive=Pozri si svojho vyšetrovateľa ešte raz a objav jeho pasívnu schopnosť.
tutorial.mysteryEncounter.sacrificeClueReroll=Musíš obetovať jednu stopu. Potom môžeš prehodiť dve kocky.
tutorial.research.noSuccessUseFocus=Nemáš žiadny úspech. Použi Sústredenie a prehoď jednu kocku.
