investigator.special.the_expedition_leader.action=Test Influence. Ak uspeješ, získaj 1 vybavenie Spojenec podľa vlastného výberu z rezervy alebo z odhadzovacieho balíčka.
investigator.special.the_expedition_leader.ability=Ak si na mieste Divočina, vyšetrovatelia na tvojom mieste hádžu o 1 kocku navyše pri riešení testov.
investigator.special.the_musician.action=Každý vyšetrovateľ na tvojom mieste si obnoví 1 Sanity.
investigator.special.the_musician.ability=Vyšetrovatelia na tvojom mieste hádžu o 1 kocku navyše pri riešení testov počas bojových stretnutí.
investigator.special.the_martial_artist.action=Min ľubovoľný počet Health alebo Sanity, potom si obnov rovnaký počet Health alebo Sanity.
investigator.special.the_martial_artist.ability=Keď si zlepšíš vlastnosť, môžeš si tú istú vlastnosť ihneď zlepšiť ešte raz.
investigator.special.the_rookie_cop.action=Presuň 1 príšeru podľa výberu s odolnosťou 3 alebo menej zo susedného miesta na tvoje miesto.
investigator.special.the_rookie_cop.ability=Počas fázy stretnutí si ostatní vyšetrovatelia na tvojom mieste môžu zvoliť stretnutie, akoby na mieste neboli žiadne príšery.
investigator.special.the_bootlegger.action=Ty a/alebo iný vyšetrovateľ na tvojom mieste sa môžete presunúť o 1 miesto po lodnej alebo vlakovej trase.
investigator.special.the_bootlegger.ability=Efekty ťa nemôžu prinútiť odhodiť tvoje vybavenia typu Predmet, Talizman alebo Spojenec, pokiaľ sa tak nerozhodneš.
investigator.special.the_handyman.action=Získaj 1 vybavenie podľa výberu s hodnotou 1 z rezervy. Alebo odhoď 1 kartu z rezervy a vykonaj 1 dodatočnú akciu.
investigator.special.the_handyman.ability=Ak vyšetrovateľ na tvojom mieste minie Focus na prehodenie kocky, môže namiesto toho prehodiť až 2 kocky.
investigator.special.the_violinist.action=Môžeš minúť 1 Clue a 1 Focus, aby si zlepšil 1 vlastnosť podľa výberu.
investigator.special.the_violinist.ability=Keď zavrieš bránu počas iného svetového stretnutia, získaj 1 Clue a 1 Focus.
investigator.special.the_waitress.action=Test Lore -1. Ak uspeješ, získaj 1 kúzlo.
investigator.special.the_butler.action=Vykonaj akciu Obchod a potom jednu dodatočnú akciu.
investigator.special.the_butler.ability=Keď sa ty alebo iný vyšetrovateľ na tvojom políčku pripravuje na cestu, získa jeden cestovný lístok navyše podľa vlastného výberu.
investigator.special.the_priest.action=Daj jednu zo svojich priaznivých kondícií inému vyšetrovateľovi na ľubovoľnom políčku.
investigator.special.the_priest.ability=Po zatvorení brány počas stretnutia v Inom svete získaj priaznivú kondíciu, ak žiadnu nemáš.
investigator.special.the_nun.action=Test Will. Za každý úspech môžeš ty alebo iný vyšetrovateľ na ľubovoľnom políčku odhodiť jednu kondíciu Šialenstva.
investigator.special.the_nun.ability=Pridaj jedna ku každej kocke hodenej pri riešení efektu priaznivej alebo nepriaznivej kondície.
investigator.special.the_explorer.action=Presuň sa o jedno políčko po neprebádanej ceste a potom vykonaj jednu dodatočnú akciu.
investigator.special.the_explorer.ability=Raz za kolo môžeš ty alebo iný vyšetrovateľ na tvojom políčku minúť o jedno Focus menej na zaplatenie efektu.
purchase.fullGame.investigators=8 bonusových vyšetrovateľov
investigator.special.the_waitress.ability=Môžeš minúť 1 Health, aby si hodil o 2 kocky navyše pri riešení testu Lore ako súčasť efektu kúzla.
investigator.special.the_redeemed_cultist.action=Ak je na tvojom mieste príšera Kultista, odhoď všetky príšery z tvojho miesta alebo presuň príšeru Kultista na akékoľvek iné miesto.
investigator.special.the_redeemed_cultist.ability=Zníž hrôzu príšer, s ktorými sa stretávaš, na 1.
investigator.special.the_actress.action=Min ľubovoľný počet zlepšení vlastností. Potom si zlepši 1 vlastnosť podľa výberu za každé minuté zlepšenie.
investigator.special.the_actress.ability=Raz za kolo môže vyšetrovateľ na tvojom mieste hodiť o 1 kocku navyše pri riešení testu.
investigator.special.the_shaman.action=Pozri sa na vrchné 2 brány v balíčku brán. Jednu bránu polož navrch balíčka brán a druhú na spodok.
investigator.special.the_shaman.ability=Keď zavrieš bránu počas iného svetového stretnutia, môžeš sa presunúť na ľubovoľné miesto obsahujúce Clue alebo bránu.
investigator.special.the_spy.action=Ak nemáš žiadne Clue, získaj 1 Clue.
investigator.special.the_spy.ability=Ak vyšetrovateľ na tvojom mieste minie Clue na prehodenie kocky, môže namiesto toho prehodiť až 2 kocky.
investigator.special.the_astronomer.action=Min 2 Clue a odhoď 1 príšeru na mieste obsahujúcom bránu.
investigator.special.the_astronomer.ability=Raz za kolo môžeš minúť 1 Sanity namiesto minutia 1 Clue.
investigator.special.the_entertainer.action=Vykonaj akciu, ktorú si už v tomto kole vykonal.
investigator.special.the_entertainer.ability=Ak by si mal minúť alebo stratiť Sanity ako súčasť efektu kúzla, môžeš minúť alebo stratiť o 1 Sanity menej.
investigator.special.the_soldier.action=Ty aj 1 príšera na tvojom mieste stratíte po 1 Health.
investigator.special.the_soldier.ability=Nemôžeš sa stať Zdržaným ani získať stav Zadržaný, pokiaľ sa tak nerozhodneš.
investigator.special.the_sailor.action=Presuň sa o 1 miesto po lodnej trase, potom vykonaj 1 dodatočnú akciu.
investigator.special.the_sailor.ability=Ak si na morskom mieste, vyšetrovatelia na tvojom mieste hádžu o 1 kocku navyše pri riešení testov.
investigator.special.the_politician.action=Iný vyšetrovateľ podľa tvojho výberu môže okamžite vykonať 1 dodatočnú akciu.
investigator.special.the_politician.ability=Keď vykonáš akciu Získanie vybavenia, môžeš dovoliť ostatným vyšetrovateľom získať ľubovoľné karty, ktoré kúpiš.
investigator.special.the_psychic.action=Môžeš vymeniť ľubovoľný počet Clue s vyšetrovateľom na akomkoľvek mieste.
investigator.special.the_psychic.ability=Raz za kolo, keď iný vyšetrovateľ získa nebežný stav, môžeš sa pozrieť na zadnú stranu tejto karty a získať 1 Clue.
investigator.special.the_ex_convict.action=Môžeš odhodiť 1 vybavenie typu Predmet alebo Talizman, aby si získal 1 Predmet alebo Talizman podľa výberu z rezervy s hodnotou najviac o 1 vyššou než hodnota odhodenej karty.
investigator.special.the_ex_convict.ability=Kedykoľvek hodíš 1 počas testu, môžeš túto kocku prehodiť.
investigator.special.the_bounty_hunter.action=Test Influence. Ak uspeješ, môžeš minúť až 2 Focus a získať 1 Clue za každé minuté Focus.
investigator.special.the_bounty_hunter.ability=Keď porazíš príšeru počas bojového stretnutia, získaj 1 Focus.

