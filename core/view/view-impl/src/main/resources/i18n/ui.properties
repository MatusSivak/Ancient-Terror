ancientOne.azathoth.setup=Orb spawns\non the Green Omen.
ancientOne.azathoth.special=Doom advances for each\nOrb on Green Omen.
ancientOne.azathoth.midnight=The World is Devoured!
ancientOne.azathoth.win=Solve 3 Mysteries.
ancientOne.azathoth.flavor=Out in the mindless void the daemon bore me,\nPast the bright clusters of dimensioned space,\nTill neither time nor matter stretched before me,\nBut only Chaos, without form or place.
ancientOne.azathoth.endGame=Earthquakes and eruptions tear the world apart. Poison fills the sky.\n\nThe insects of Shaggai flee aboard their ships, seeking another world to doom.\n\nWhen the last life burns to ash, a new Outer God rises from Earth's ruins and joins Azathoth's court at the center of all things.
ancientOne.cthulhu.special=When an investigator moves into a vortex,\nhe becomes Delayed and loses one Sanity.
ancientOne.cthulhu.reckoning=Vortex is spawned under each investigator on a Sea.
ancientOne.cthulhu.midnight=Cthulhu awakens!
ancientOne.cthulhu.win=Solve 3 Mysteries.
ancientOne.cthulhu.flavor=In his house at R'lyeh\ndead Cthulhu waits dreaming.\nNot dead which eternal lie.\nStranger eons death may die.
ancientOne.cthulhu.endGame=[RED]The great priest Cthulhu rises and brings the earth beneath his sway.[]\n \nYou lost the game.
ancientOne.cthulhu.awaken.name=Cthulhu - Awaken
ancientOne.cthulhu.awaken.alt=High Priest of the Great Old Ones
ancientOne.cthulhu.awaken.special=When an investigator moves into a vortex, he becomes\nDelayed and loses one Sanity. Cthulhu's power rises!
ancientOne.cthulhu.awaken.reckoning=Each investigator loses Sanity equal to Cthulhu's power.
ancientOne.cthulhu.awaken.midnight=Each time Doom would advance,\nCthulhu's power rises instead!
ancientOne.cthulhu.awaken.win=Solve 3 Mysteries.\nDefeat Cthulhu.
ancientOne.cthulhu.awaken.flavor=...morals thrown aside and all men shouting and killing and revelling in joy.\n...all the earth would flame with a holocaust of ecstasy and freedom.
ancientOne.shubNiggurath.reckoning=Monster is spawned on a random space.\nDoom advances twice if there are 10+ monsters.
ancientOne.shubNiggurath.midnight=Shub-Niggurath awakens!
ancientOne.shubNiggurath.win=Solve 3 Mysteries.
ancientOne.shubNiggurath.flavor=The hellish cloud-like entity Shub-Niggurath,\nin whose honor nameless cults hold the rite\nof the Goat with a Thousand Young.
ancientOne.shubNiggurath.endGame=[RED]From the wildest corners of the earth, the dark young emerge to overwhelm humanity.[]\n \nYou lost the game.
ancientOne.shubNiggurath.awaken.name=Shub-Niggurath - Awaken
ancientOne.shubNiggurath.awaken.alt=The Black Goat of the Woods\nwith a Thousand Young
ancientOne.shubNiggurath.awaken.reckoning=Each investigator on the same space as Shub-Niggurath encounters it.
ancientOne.shubNiggurath.awaken.midnight=Each time Doom would advance, Shub-Niggurath spawns one monster.\nIf there are 5+ monsters with Shub-Niggurath, you lose the game.
ancientOne.shubNiggurath.awaken.win=Solve 3 Mysteries. Defeat Shub-Niggurath.
ancientOne.shubNiggurath.awaken.flavor=Ia! Shub-Niggurath! The Black Goat of the Woods with a Thousand Young!
ancientOne.yogSothoth.reckoning=Doom advances for each investigator on a Gate,\nunless he discards one Spell.
ancientOne.yogSothoth.midnight=Yog-Sothoth awakens!
ancientOne.yogSothoth.win=Solve 3 Mysteries.
ancientOne.yogSothoth.flavor=Yog-Sothoth knows the gate.\nYog-Sothoth is the gate.\nYog-Sothoth is the key and guardian of the gate.\nPast, present, future, all are one in Yog-Sothoth.
ancientOne.yogSothoth.endGame=[RED]Yog-Sothoth sweeps away the sane mortal races, ushering in an age of darkness, madness, and utter, insane evil.[]\n \nYou lost the game.
ancientOne.yogSothoth.awaken.name=Yog-Sothoth - Awaken
ancientOne.yogSothoth.awaken.alt=The Eater of Souls
ancientOne.yogSothoth.awaken.reckoning=Yog-Sothoth's power rises for each investigator on a Gate,\nunless he discards one Spell.
ancientOne.yogSothoth.awaken.midnight=Each time Doom would advance, Yog-Sothoth's power rises instead!\nAt full power, you lose the game.
ancientOne.yogSothoth.awaken.win=Solve 4 Mysteries.
ancientOne.yogSothoth.awaken.flavor=The noxious Yog-Sothoth,\nwho froths as primal slime in nuclear chaos\nbeyond the nethermost outposts of space and time!
