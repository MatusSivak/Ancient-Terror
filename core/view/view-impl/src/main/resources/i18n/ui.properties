investigator.special.the_expedition_leader.action=Test Influence. If you pass, gain 1 Ally Asset of your choice from the reserve or the discard pile.
investigator.special.the_expedition_leader.ability=If you are on a Wilderness space, investigators on your space roll 1 additional die when resolving tests.
investigator.special.the_musician.action=Each investigator on your space recovers 1 Sanity.
investigator.special.the_musician.ability=Investigators on your space roll 1 additional die when resolving tests during Combat Encounters.
investigator.special.the_martial_artist.action=Spend any number of Health or Sanity, then recover an equal number of Health or Sanity.
investigator.special.the_martial_artist.ability=When you improve a skill, you may immediately improve that skill again.
investigator.special.the_rookie_cop.action=Move 1 Monster of your choice with toughness 3 or less from an adjacent space to your space.
investigator.special.the_rookie_cop.ability=During the Encounter Phase, other investigators on your space may choose an encounter as if there are no Monsters on your space.
investigator.special.the_bootlegger.action=You and/or another investigator on your space may move one space along a Ship or Train path.
investigator.special.the_bootlegger.ability=Effects cannot cause you to discard your Item, Trinket, or Ally possessions unless you choose to.
investigator.special.the_handyman.action=Gain one Asset of your choice with value 1 from the reserve. Or discard one card from the reserve and perform an additional action.
investigator.special.the_handyman.ability=If an investigator on your space spends a Focus to reroll a die, he may reroll up to 2 dice instead.
investigator.special.the_violinist.action=You may spend one Clue and one Focus to improve one skill of your choice.
investigator.special.the_violinist.ability=When you close a Gate during an Other World Encounter, gain one Clue and one Focus.
investigator.special.the_waitress.action=Test Lore-1. If you pass, gain one Spell.
investigator.special.the_waitress.ability=You may spend one Health to roll two additional dice when resolving a Lore test as part of a Spell effect.
investigator.special.the_redeemed_cultist.action=If there is a Cultist Monster on your space, discard all Monsters on your space or move the Cultist Monster to any other space.
investigator.special.the_redeemed_cultist.ability=Reduce the horror of Monsters you encounter to 1.
investigator.special.the_actress.action=Spend any number of Skill Improvements. Then improve 1 Skill of your choice for each Improvement spent.
investigator.special.the_actress.ability=Once per round, an investigator on your space may roll 1 additional die when resolving a test.
investigator.special.the_shaman.action=Look at the top 2 Gates in the Gate stack. Put 1 Gate on the top of the Gate stack, and the other on the bottom.
investigator.special.the_shaman.ability=When you close a Gate during an Other World Encounter, you may move to any space containing a Clue or a Gate.
investigator.special.the_spy.action=If you do not have any Clues, gain 1 Clue.
investigator.special.the_spy.ability=If an investigator on your space spends a Clue to reroll a die, he may reroll up to 2 dice instead.
investigator.special.the_astronomer.action=Spend 2 Clues to discard 1 Monster on a space containing a Gate.
investigator.special.the_astronomer.ability=Once per round, you may spend 1 Sanity in place of spending 1 Clue.
investigator.special.the_entertainer.action=Perform an action you have already performed this round.
investigator.special.the_entertainer.ability=If you would spend or lose Sanity as part of a Spell effect, you may spend or lose 1 fewer Sanity as part of that effect.
investigator.special.the_soldier.action=You and 1 Monster on your space each lose 1 Health.
investigator.special.the_soldier.ability=You cannot become Delayed or gain a Detained Condition unless you choose to.
investigator.special.the_sailor.action=Move 1 space along a Ship path, then perform 1 additional action.
investigator.special.the_sailor.ability=If you are on a Sea space, investigators on your space roll 1 additional die when resolving tests.
investigator.special.the_politician.action=Another investigator of your choice may immediately perform 1 additional action.
investigator.special.the_politician.ability=When you perform an Acquire Assets action, you may allow other investigators to gain any cards you purchase.
investigator.special.the_psychic.action=You may trade any number of Clues with an investigator on any space.
investigator.special.the_psychic.ability=Once per round, when another investigator gains a non-Common Condition, you may look at the back of that card and gain 1 Clue.
investigator.special.the_ex_convict.action=You may discard 1 Item or Trinket Asset to gain 1 Item or Trinket of your choice from the reserve with value up to +1 of the discarded Asset.
investigator.special.the_ex_convict.ability=Whenever you roll a 1 during a test, you may reroll that die.
investigator.special.the_bounty_hunter.action=Test Influence. If you pass, you may spend up to 2 Focus to gain 1 Clue for each Focus spent.
investigator.special.the_bounty_hunter.ability=When you defeat a Monster during a Combat Encounter, gain 1 Focus.

