tutorial.intro.welcome=Welcome to the Ancient Terror tutorial.
tutorial.intro.preventAncientOne=You must stop the Ancient One from destroying our world.
tutorial.intro.openAncientOneInfo=Click here to view information about the Outer God we are facing.
tutorial.ancientOne.azathothIntro=Azathoth, the Daemon Sultan. If he awakens, Earth will be destroyed.
tutorial.ancientOne.solveMysteries=To stop him, you must solve 3 Mysteries. In this tutorial, you will solve only one.
tutorial.ancientOne.viewMystery=Let's see which Mystery you need to solve.
tutorial.mystery.tunguskaObjective=Travel to Tunguska and spend 2 Clues to search for signs of the impact.
tutorial.mystery.needClues=Right now, you don't have any Clues, so you need to obtain them first.
tutorial.investigator.checkSpecial=First, check your investigator's special action.
tutorial.investigator.spyGainClue=As an action, the Spy can gain 1 Clue if she has none.
tutorial.actionPhase.start=The Action Phase starts now, and you can perform 2 actions.
tutorial.actionPhase.firstAction=Perform your first action: gain 1 Clue.
tutorial.actionPhase.needSecondClue=To solve the Mystery, you need two Clues. Where can you find the second one?
tutorial.actionPhase.secondClueLocation=Here - in the Pyramids.
tutorial.actionPhase.secondActionTravel=Let's use your second action to get closer!
tutorial.actionPhase.travelIstanbul=Travel to Istanbul.
tutorial.actionPhase.noActionsLeft=You've used two actions, so you have no actions remaining.
tutorial.actionPhase.encounterIncoming=The Action Phase is over. The Encounter Phase begins.
tutorial.encounterPhase.fightMonsters=In this phase, you must fight with all the Monsters on your space.
tutorial.encounterPhase.prepareManiac=Prepare to fight the Maniac!
tutorial.encounterPhase.goodJob=Great job! Since there are no enemies left, you can choose another encounter.
tutorial.encounterPhase.finished=The Encounter Phase is over. Time for the Mythos Phase.
tutorial.mythosPhase.survivedGateOpened=You survived the Mythos Phase, but one Gate opened.
tutorial.mythosPhase.newRound=New round starts with Action Phase, and you can again take 2 actions.
tutorial.actionPhase2.travelPyramids=Travel farther to the Pyramids. Your second Clue is there.
tutorial.actionPhase2.executeFocus=You're here. Now focus. Perform the Focus action.
tutorial.actionPhase2.focusToken=You gained a Focus token. It can be used to reroll one die.
tutorial.encounterPhase2.researchClue=Time for Research. If you succeed, you'll gain this Clue.
tutorial.encounterPhase2.extraClues=Now you have even more Clues than you need. Let's see what Mythos Phase brings.
tutorial.actionPhase3.finishMystery=Time to travel to Tunguska and complete this Mystery. You're ready.
tutorial.actionPhase3.clickReserve=This is taking too long. Click Reserve - maybe you'll find something useful for your journey.
tutorial.actionPhase3.obtainCharterFlight=Great! You can obtain a Charter Flight. It will take you there immediately.
tutorial.actionPhase3.buyCharterFlight=Choose 'Acquire Assets' as your second action and buy Charter Flight.
tutorial.actionPhase3.tunguskaArrival=Tunguska. You can clearly see the large impact crater.
tutorial.encounterPhase3.useObservation=Use your Observation skill to find out what happened here.
tutorial.encounterPhase3.discoveredMeteorite=You did it! You discovered the meteorite and you advanced the Mystery.
tutorial.encounterPhase3.mysteryResolvesNextMythos=This Mystery will be solved at the end of the next Mythos Phase.
tutorial.outro.congratulations=Congratulations! You solved one Mystery, unlocked a new card, and completed the tutorial.
tutorial.outro.readyQuestion=Are you ready to defeat the Ancient One?
tutorial.mysteryEncounter.veryUnsuccessfulRoll=That was a very unsuccessful roll!
tutorial.mysteryEncounter.checkInvestigatorPassive=Check your investigator one more time to discover the passive ability.
tutorial.mysteryEncounter.sacrificeClueReroll=You must sacrifice one Clue. Then you can reroll two dice.
tutorial.research.noSuccessUseFocus=You didn't roll any success. Use your Focus to reroll one die.
tutorial.disabled.notAvailable=Not available in tutorial.
