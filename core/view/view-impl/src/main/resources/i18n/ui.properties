rumor.card.fracturedReality.title=Fractured Reality
rumor.card.fracturedReality.flavor=The strange phenomenon is an echo\nof the catastrophic destruction of Mu.\nThe repercussions of the serpent people's\noverreaching ambition still take their toll.
rumor.card.fracturedReality.objective=[#GOOD]On a Rumor location, close an ancient portal created by a long-dead wizard of Mu.[]
rumor.card.fracturedReality.failure=[#BAD]Doom advances for each spawned Gate.[]
rumor.card.fracturedReality.reckoning=[#BAD]Countdown.[]
rumor.card.growingMadness.title=Growing Madness
rumor.card.growingMadness.flavor=You dream of a life as an insane wizard\nthousands of years ago in Atlantis.\nYou also dream of that same wizard\nstill alive today on an uncharted island.
rumor.card.growingMadness.objective=[#GOOD]On a Rumor location, find the uncharted isle.[]
rumor.card.growingMadness.failure=[#BAD]Each investigator loses three Sanity.[]
rumor.card.growingMadness.reckoning=[#BAD]Lead investigator gains a Madness Condition. Countdown for each Madness Condition he has.[]
rumor.card.lostKnowledge.title=Lost Knowledge
rumor.card.lostKnowledge.flavor=Your contact in the capital is hesitant\nto speak about those called "The Watches".\nHe says they work for a number of different governments,\nbut answer to some other authority.
rumor.card.lostKnowledge.objective=[#GOOD]Defeat the Tick Tock Men.[]
rumor.card.lostKnowledge.failure=[#BAD]-All Clues on the game board are discarded.[]\n[#BAD]-Each investigator discards all Clues.[]
rumor.card.lostKnowledge.reckoning=[#BAD]Countdown.[]
rumor.card.starsAligned.title=Stars Aligned
rumor.card.starsAligned.flavor=A dozen unpleasant-looking strangers have settled into Panama\nwith a large collection of astronomical reference books.\nThere is something unique about this place and time\nthat allows them to rip apart the fabric of reality.
rumor.card.starsAligned.objective=[#GOOD]On a Rumor location, find and remove these strangers.[]
rumor.card.starsAligned.reckoning=[#BAD]Omen advances.[]
rumor.card.windWalker.title=The Wind-Walker
rumor.card.windWalker.flavor=The weather grows worse. Snow and ice cover cities\nthat have never seen such weather before in their history.
rumor.card.windWalker.objective=[#GOOD]Defeat The Wind-Walker.[]
rumor.card.windWalker.failure=[#BAD]-Each investigator becomes Delayed.\n-Each investigator loses 6 Health.[]
rumor.card.windWalker.reckoning=[#BAD]Countdown.[]

