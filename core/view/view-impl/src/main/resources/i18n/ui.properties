# Yig
ancientOne.yig.name=Yig
ancientOne.yig.alt=The Father of Serpents
ancientOne.yig.setup=Set aside 6 Cultists and 1 Serpent People.\nPrepare the K'n-yan special encounters.
ancientOne.yig.special=Cultists: Will (0), Horror 1; Strength (-1), Damage 2; Toughness 1. Losing Health to their Strength test causes Poisoned.
ancientOne.yig.selection.special=When an investigator loses Health to a Cultist's Strength test,\nthat investigator becomes Poisoned.
ancientOne.yig.reckoning=Spawn a Cultist at the active\nexpedition. Then advance Doom by 1\nif that space has 2+ Monsters.
ancientOne.yig.midnight=Yig awakens. Poisoned\ninvestigators gain Cursed.
ancientOne.yig.win=Solve 3 Mysteries, then face Yig.
ancientOne.yig.flavor=Beneath forgotten temples coils\nthe Father of Serpents. All snakes\nare his children, and none are slain\nunseen. Upon those who harm them,\nhe visits his ancient curse.
ancientOne.yig.awaken.alt=Serpent's Nest
ancientOne.yig.awaken.flavor=The temple stones split beneath\nhis rising coils. Across the world,\nserpents answer their father's call.\nYig has come to claim the blood\nof those who slew his children.\nHis vengeance will spare no one.
ancientOne.yig.awaken.special=Whenever Doom would retreat,\nyou may discard one Cursed\nCondition instead.
ancientOne.yig.awaken.reckoning=Spawn one Cultist at a random space.
ancientOne.yig.awaken.win=Solve three Mysteries,\nthen defeat Yig to win.
ancientOne.features.yigEncounters=72 research encounters and eight K'n-yan special encounters
mystery.yig.CROWN_OF_THE_SERPENT.name=Crown of the Serpent
mystery.yig.CROWN_OF_THE_SERPENT.flavor=The golden serpent crown grants its wearer a voice that others cannot disobey. Those drawn into its service lose their loyalties, then their names, until only devotion remains. Beneath the promise of dominion, Yig's will is tightening its coils around master and servant alike.
mystery.yig.CROWN_OF_THE_SERPENT.text=When gaining an Artifact, you may take Serpent Crown instead. End of Mythos: its owner may test Will -1. Pass: you may spend CLUE_COST and discard 2 Ally Assets → solve this Mystery.
mystery.yig.DESCENDANTS_OF_YIG.name=Descendants of Yig
mystery.yig.DESCENDANTS_OF_YIG.flavor=In remote settlements, families conceal children with cold skin and unblinking eyes. The disappearances began when these children came of age, and now whole households stand deserted. Yig's half-human descendants are gathering, leaving shed skins along the paths to their meeting places.
mystery.yig.DESCENDANTS_OF_YIG.text=Defeat the Children of Yig Epic Monster → solve this Mystery at the end of Mythos.
mystery.yig.KN_YAN_UNEARTHED.name=K'n-yan Unearthed
mystery.yig.KN_YAN_UNEARTHED.flavor=A passage beneath the earth leads into the blue-lit caverns of K'n-yan. Its deathless inhabitants remember ages that human histories have forgotten, and Yig's image watches from their ancient temples. They welcome visitors with unsettling courtesy, but few who descend are ever seen above ground again.
mystery.yig.KN_YAN_UNEARTHED.text=Encounter at a Pin: you may explore K'n-yan. Successful encounter → advance this Mystery.
mystery.yig.MIGRATION_OF_SERPENTS.name=Migration of Serpents
mystery.yig.MIGRATION_OF_SERPENTS.flavor=Snakes abandon their burrows in numbers no season can explain. They cross roads, rivers and crowded streets, all following the same unseen summons. Their trails converge on places long associated with Yig, where even the smallest serpents lie still as if awaiting an order.
mystery.yig.MIGRATION_OF_SERPENTS.text=After a Research Encounter, you may spend 1 Clue gained from it → advance this Mystery.
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.name=Rise of the Serpent People
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.flavor=Behind sealed doors, the serpent people have reopened laboratories abandoned before human civilization began. Missing persons reappear changed, carrying strange scars and memories that cannot be their own. The old experiments have resumed, and their creators are learning how easily they can pass among us.
mystery.yig.RISE_OF_THE_SERPENT_PEOPLE.text=Encounter at a Pin: you may test Observation -1. Pass: you may spend 2 Clues → remove this Pin and advance this Mystery. Fail: a Cultist ambushes you.
mystery.yig.THE_WINGED_SERPENT.name=The Winged Serpent
mystery.yig.THE_WINGED_SERPENT.flavor=A vast winged serpent circles above Tokyo Bay, its shadow passing over ships and crowded quays. Each descent leaves shattered masts and water red with blood. From hidden shrines, Yig's followers watch its flight and prepare offerings for the creature's next return.
mystery.yig.THE_WINGED_SERPENT.text=Defeat the Winged Serpent Epic Monster → solve this Mystery at the end of Mythos.
mystery.yig.SERPENTS_NEST.name=Serpent's Nest
mystery.yig.SERPENTS_NEST.flavor=The ruins stir with countless serpents as the Father of Serpents emerges from the dark. Yig's worshipers fall silent before him; even they shrink from the wrath they have summoned. The trails, hidden temples and vanished lives have led here, to the heart of his nest.
mystery.yig.SERPENTS_NEST.text=Defeat the Yig Epic Monster → solve this Mystery.

ancientOne.awakened=Awakened
ancientOne.yig.awakening=Yig awakens!
ancientOne.yig.reckoning.cultist=Reckoning: A Cultist spawns at the active expedition.
ancientOne.yig.reckoning.cultistRandom=Reckoning: A Cultist spawns at a random space.
ancientOne.yig.reckoning.doom=The active expedition has 2 or more Monsters. Doom advances by 1.
ancientOne.yig.endGame=The last bells fall silent. Serpents pour through the streets, and Yig coils around the ruins of humanity.\n\nHis children have inherited the earth. Beneath a sky without dawn, the Father of Serpents closes his eyes.\n\nHis vengeance is complete.
ancientOne.yig.ending.subtitle=The age of serpents
ancientOne.yig.ending.title=Yig Wins!
ancientOne.yig.ending.defeat=Investigators lose the game.
ancientOne.yig.ending.continue=Continue
