mystery.azathoth.seed.name=Seed of the Daemon Sultan
mystery.azathoth.seed.flavor=A green comet has torn through the skies above Tunguska, leaving a forest of scorched, fallen trees. Beneath the crater, the stone still moves, burrowing deeper with each passing night. Something inside it is answering a call from far beyond the stars.
mystery.azathoth.seed.text=As an encounter, an investigator on Tunguska may attempt to search for signs of the impact in the dead forest (Test Observation). If he passes, he discovers the strange green meteorite; he may spend 2 Clues to advance the Active Mystery.
mystery.azathoth.omen.name=Omen of Devastation
mystery.azathoth.omen.flavor=The Nemesis Moon hangs where no moon should be, visible from every corner of the world. Astronomers cannot explain its orbit, and each night it seems a little nearer. In the streets below, strangers whisper the same warning in languages they have never learned.
mystery.azathoth.omen.text=When an investigator closes a Gate, he may spend 1 Clue to advance the Active Mystery.
mystery.azathoth.occult.name=Occult Research
mystery.azathoth.occult.flavor=Ordinary people are waking with missing memories and pages of strange calculations beside their beds. The shan have slipped into human minds, turning their hosts into unwitting servants. Across distant cities, their separate rituals are beginning to form a single invocation of Azathoth.
mystery.azathoth.occult.text=After an investigator resolves a Research Encounter, he may spend 1 Clue he gained from that encounter to advance the Active Mystery.
mystery.azathoth.trueName.name=The True Name
mystery.azathoth.trueName.flavor=Forgotten books preserve scattered syllables of Azathoth's true name. Those who compare the fragments hear a faint piping, even in perfect silence. The texts promise power to anyone who speaks the name three times, but their margins are crowded with warnings in trembling hands.
mystery.azathoth.trueName.text=As an encounter, an investigator on a Pin may attempt to find information about Azathoth's true name; he may spend 2 Clues to remove that Pin and advance the Active Mystery.
mystery.azathoth.greenFlame.name=The Green Flame
mystery.azathoth.greenFlame.flavor=The cult's chanting ends as green fire erupts from a fissure in the earth. It crawls across stone without consuming it, gathering into a shape that bends toward the worshipers. Their cries of triumph falter: the thing they summoned has begun to move beyond the circle.
mystery.azathoth.greenFlame.text=At the end of the Mythos Phase, if the Tulzscha Epic Monster has been defeated, solve this Mystery.
mystery.azathoth.voice.name=Voice of Azathoth
mystery.azathoth.voice.flavor=Requiem per Shuggay survives in a handful of damaged scores. Musicians call the opera impossible to perform, yet its unfinished melodies linger in their dreams. The composer died condemned for heresy; the notes left in the margins suggest the final movement was meant for an audience beyond this world.
mystery.azathoth.voice.text=When an investigator would gain an Artifact, he may gain the 'Requiem per Shuggay' Artifact instead. At the end of the Mythos Phase, an investigator may spend COMPLEXITY Clues and discard the 'Requiem per Shuggay' Artifact to solve this Mystery.
mystery.cthulhu.queen.name=Queen of the Deep Ones
mystery.cthulhu.queen.flavor=The waters above Y'ha-nthlei churn as Mother Hydra rises from the drowned city. Along the coast, her children gather beneath the waves, waiting for her command. An ancient blade may offer a chance against her, if its hiding place can be found before the tide brings her army ashore.
mystery.cthulhu.queen.text=When an investigator would gain an Artifact, he may gain the 'Sword of Y'ha-Talla' Artifact instead. At the end of the Mythos Phase, if the Hydra Epic Monster has been defeated, solve this Mystery.
mystery.cthulhu.threateningSeas.name=Threatening Seas
mystery.cthulhu.threateningSeas.flavor=Storms gather above submerged cities whose names appear only in forbidden accounts. Ships vanish near Y'ha-nthlei, while sailors speak of voices rising through the hull at night. Beneath the circling waters, the Deep Ones are chanting to disturb their master's sleep.
mystery.cthulhu.threateningSeas.text=As an encounter, an investigator on a space with a vortex may attempt to prolong Cthulhu's slumber (Test Lore-1). If he passes, he may spend 1 Clue and discard 1 Spell to close the vortex and advance the Active Mystery.
mystery.cthulhu.deepOnesAttack.name=The Deep Ones Attack!
mystery.cthulhu.deepOnesAttack.flavor=Fishing villages have endured weeks of violent storms. Now the survivors find webbed tracks among the wreckage and hear doors splintering after dark. The sea has carried an army to their shores, and the creatures advancing through the rain know exactly which houses to enter.
mystery.cthulhu.deepOnesAttack.text=As an encounter, an investigator on a space with a vortex may attempt to fend off the deep one invasion. If he defeats ambushing Deep One, he may spend 1 Clue to close the vortex and advance the Active Mystery.
mystery.cthulhu.starsRight.name=The Stars Are Right!
mystery.cthulhu.starsRight.flavor=Across the world, sleepers share visions of vast stone doors opening beneath the sea. Some abandon their homes and travel toward the coast; others carve unfamiliar constellations into their walls. Cthulhu's dreams are reaching farther, and his worshipers believe the appointed hour is near.
mystery.cthulhu.starsRight.text=After an investigator resolves a Research Encounter, he may spend 1 Clue he gained from that encounter to advance the Active Mystery.
mystery.cthulhu.watchingStars.name=Watching The Stars
mystery.cthulhu.watchingStars.flavor=From the drowned city of Yhe, Cthylla rises beneath a sky crowded with unfamiliar stars. The daughter of Cthulhu carries a terrible promise: should her father's body perish, she can give him life again. His defeat will mean little while she remains beyond reach.
mystery.cthulhu.watchingStars.text=At the end of the Mythos Phase, if the Cthylla Epic Monster has been defeated, solve this Mystery.
mystery.cthulhu.rlyehRisen.name=R'lyeh Risen
mystery.cthulhu.rlyehRisen.flavor=An island has surfaced where the charts show only open ocean. Its wet towers lean at impossible angles, and the streets seem to change direction when no one is looking. After ages beneath the water, R'lyeh stands beneath the sun again, its deepest doors still sealed.
mystery.cthulhu.rlyehRisen.text=As an encounter, an investigator on a Pin may explore the island city of R'lyeh. Successful encounter advances the Active Mystery.
mystery.cthulhu.risenSea.name=Risen From the Sea
mystery.cthulhu.risenSea.flavor=The elder sign is broken, and the doors of R'lyeh have opened. Cthulhu rises through the surf as the dreams of the living collapse into terror. Even far inland, people fall silent and turn toward the sea, listening to something too vast to hear.
mystery.cthulhu.risenSea.text=When the Cthulhu Epic Monster has been defeated, solve this Mystery.
mystery.shub.blasphemy.name=Blasphemy of the Black Goat
mystery.shub.blasphemy.flavor=The Black Litanies have brought Yeb out of the Black Fire. Wherever it passes, fields wither and familiar paths vanish beneath foul growth. Its worshipers follow at a distance, preparing the emptied land for the arrival of Shub-Niggurath.
mystery.shub.blasphemy.text=At the end of the Mythos Phase, if the Yeb Epic Monster has been defeated, solve this Mystery.
mystery.shub.hourLens.name=Hour of the Moon Lens
mystery.shub.hourLens.flavor=Above the roofs of Goatswood, peculiar mirrors gather moonlight into a single lens. On clear nights, the villagers leave their homes without speaking and enter the woods. Those who return keep their curtains drawn, and heavy, uneven footsteps sound behind their doors.
mystery.shub.hourLens.text=As an encounter, an investigator on London may watch a ritual that transforms the worshipers of Shub-Niggurath into goat spawn. If he defeats ambushing Goat Spawn, he may spend 2 Clues to advance the Active Mystery.
mystery.shub.spawn.name=Spawn of the Black Goat
mystery.shub.spawn.flavor=Nug has begun clearing a path for the Black Goat. Settlements in its wake stand empty, their walls split by roots that grew in a single night. Of Shub-Niggurath's twin blasphemies, this one has chosen to prepare the world by tearing apart everything that might resist her.
mystery.shub.spawn.text=At the end of the Mythos Phase, if the Nug Epic Monster has been defeated, solve this Mystery.
mystery.shub.nature.name=Nature of the All-Mother
mystery.shub.nature.flavor=Animals turn on their keepers, and orchards bear fruit that pulses beneath the skin. The corruption follows the worshipers of Shub-Niggurath from place to place. Careful study may reveal how her influence spreads, though every living specimen seems eager to escape its cage.
mystery.shub.nature.text=After an investigator resolves a Research Encounter, he may spend 1 Clue he gained from that encounter to advance the Active Mystery.
mystery.shub.hunting.name=Hunting the Thousand
mystery.shub.hunting.flavor=Reports of strange beasts no longer come from isolated places. The Thousand Young are spreading through forests, farmland and the outskirts of cities. Hunters return with conflicting descriptions, but every trail leads to the same conclusion: the creatures are multiplying faster than anyone can count them.
mystery.shub.hunting.text=When a non Epic-Monster is defeated, the active investigator may spend 2 Clues to advance the Active Mystery based on monster's toughness.
mystery.shub.rituals.name=Rituals in the Wild
mystery.shub.rituals.flavor=Bonfires burn in clearings far from any road. Around them, the Cult of the Black Goat chants until human voices give way to animal cries. Something answers from the darkness beyond the firelight, and each ceremony draws the unseen listeners closer.
mystery.shub.rituals.text=As an encounter, an investigator on a Pin may attempt to determine the ritual's purpose (Test Observation). If he passes he may spend 2 Clues to advance the Active Mystery.
mystery.shub.battleWoods.name=Battle in the Woods
mystery.shub.battleWoods.flavor=The forest bends beneath an immense cloud of flesh and writhing limbs. Hoofprints fill with black water where Shub-Niggurath passes, and the trees shudder as her young emerge between their roots. The mother of monstrosities has taken form; there is no longer any shelter in the woods.
mystery.shub.battleWoods.text=When the Shub-Niggurath Epic Monster has been defeated, solve this Mystery.
mystery.yog.spawn.name=Spawn of Yog-Sothoth
mystery.yog.spawn.flavor=Lavinia Whateley's child has outgrown every explanation the neighbors offered. Now something enormous moves unseen across the hills, leaving crushed fences and emptied barns behind it. At night, its cries carry a name that the oldest books of Dunwich dare not print.
mystery.yog.spawn.text=At the end of the Mythos Phase, if the Dunwich Horror Epic Monster has been defeated, solve this Mystery.
mystery.yog.whereBrokeThrough.name=Where the Old Ones Broke Through
mystery.yog.whereBrokeThrough.flavor=Doorways open onto places that cannot exist, and familiar rooms stretch farther than their walls allow. Yog-Sothoth is pressing against the boundaries of the world. Each breach leaves the surrounding air humming, as though reality itself were a pane of glass about to shatter.
mystery.yog.whereBrokeThrough.text=When an investigator closes a Gate he may discard two Spells to seal the rift and advance the Active Mystery.
mystery.yog.beyondOne.name=The Beyond One
mystery.yog.beyondOne.flavor=To Yog-Sothoth, yesterday and tomorrow lie as close as neighboring rooms. Those who seek its knowledge glimpse lost cities, unborn stars and moments from their own deaths. The revelations fit together with dreadful precision, but each answer makes it harder to remember the way home.
mystery.yog.beyondOne.text=After an investigator resolves a Research Encounter, he may spend 1 Clue he gained from that encounter to advance the Active Mystery.
mystery.yog.stoneCircles.name=The Stone Circles
mystery.yog.stoneCircles.flavor=The ancient stones cast shadows that do not follow the sun. At these forgotten sites, Yog-Sothoth's worshipers gather to repeat words older than the monuments themselves. As their voices rise, the empty space within each circle begins to show a different sky.
mystery.yog.stoneCircles.text=As an encounter, an investigator on a Pin may attempt to disrupt the ritual (Test Lore-1). If he passes, he may spend 2 Clues to advance the Active Mystery. If he fails, a Cultist Monster ambushes him!
mystery.yog.void.name=Void Between Worlds
mystery.yog.void.flavor=Old accounts describe a void between dimensions where Yog-Sothoth was once confined. Travelers who approach its threshold see no stars, no horizon and no sign of distance. Yet something waits within that absence, and the way back may not remain where they left it.
mystery.yog.void.text=As an encounter, an investigator on a Gate may travel to the void between worlds. Successful encounter advances the Active Mystery.
mystery.yog.arcane.name=Arcane Understanding
mystery.yog.arcane.flavor=Spells once mastered with effort now answer almost before their words are spoken. This ease conceals a growing intrusion: stray thoughts arrive in unfamiliar voices, offering greater wonders. Yog-Sothoth's presence runs through the magic, drawing those who use it closer to its will.
mystery.yog.arcane.text=When an investigator passes a Lore test while resolving a Spell effect, he may spend one Clue and discard that Spell to advance the Active Mystery.
mystery.yog.keyGate.name=The Key and the Gate
mystery.yog.keyGate.flavor=The boundaries between worlds are coming apart. Beyond every open gate, impossible lights gather into a presence too vast for any single shape. Yog-Sothoth is both the passage and what waits beyond it; to confront the horror, someone must cross the threshold.
mystery.yog.keyGate.text=As an encounter, an investigator on a Gate may confront Yog-Sothoth. Successful encounter advances the Active Mystery.

