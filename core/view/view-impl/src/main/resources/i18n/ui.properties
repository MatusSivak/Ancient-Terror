mystery.current=Current Mystery
mystery.azathoth.seed.name=Seed of the Daemon Sultan
mystery.azathoth.seed.flavor=A strange green comet has fallen from the sky.\nEven after the impact,\nthe meteorite continues to slowly burrow itself deeper into the earth.
mystery.azathoth.seed.text=As an encounter, an investigator on Tunguska\nmay attempt to search for signs of the impact\nin the dead forest (Test Observation).\nIf he passes, he discovers the strange green meteorite;\nhe may spend 2 Clues to advance the Active Mystery.
mystery.azathoth.omen.name=Omen of Devastation
mystery.azathoth.omen.flavor=The Nemesis Moon appears in the night sky,\nvisible to all and heralding an imminent doom.
mystery.azathoth.omen.text=When an investigator closes a Gate\nrepresenting current Omen,\nhe may spend 1 Clue to advance the Active Mystery.
mystery.azathoth.occult.name=Occult Research
mystery.azathoth.occult.flavor=The shan are controlling innocent victims everywhere,\nusing them to call forth Azathoth.
mystery.azathoth.occult.text=After an investigator resolves a Research Encounter,\nhe may spend 1 Clue he gained from that encounter\nto advance the Active Mystery.
mystery.azathoth.trueName.name=The True Name
mystery.azathoth.trueName.flavor=Fragments of Azathoth's true name exist in long forgotten tomes.\nIt is said that if a person speaks his name aloud three times,\nthe blasphemous sound will grant the speaker great power.
mystery.azathoth.trueName.text=As an encounter, an investigator on a Pin may attempt to find information about Azathoth's true name;\nhe may spend 2 Clues to advance the Active Mystery.
mystery.azathoth.greenFlame.name=The Green Flame
mystery.azathoth.greenFlame.flavor=In response to the cult's invocation,\na jet of green flame emerged from the fissure,\nracing across the ceiling and walls as if a living thing.
mystery.azathoth.greenFlame.text=At the end of the Mythos Phase, if the Tulzscha Epic Monster has been defeated, solve this Mystery.
mystery.azathoth.voice.name=Voice of Azathoth
mystery.azathoth.voice.flavor=Most musicians describe this 18th century Italian opera as unplayable.\nIt comes as no surprise that the composer was executed for heresy.
mystery.azathoth.voice.text=When an investigator would gain an Artifact, he may gain\nthe 'Requiem per Shuggay' Artifact instead.\nAt the end of the Mythos Phase,\nan investigator may spend COMPLEXITY Clues\nand discard the 'Requiem per Shuggay' Artifact\nto solve this Mystery.
mystery.cthulhu.queen.name=Queen of the Deep Ones
mystery.cthulhu.queen.flavor=Mother Hydra rises from her home in Y'ha-nthlei\nto oversee the teeming masses of her children.
mystery.cthulhu.queen.text=When an investigator would gain an Artifact, he may gain\nthe 'Sword of Y'ha-Talla' Artifact instead.\nAt the end of the Mythos Phase,\nif the Hydra Epic Monster has been defeated,\nsolve this Mystery.
mystery.cthulhu.threateningSeas.name=Threatening Seas
mystery.cthulhu.threateningSeas.flavor=All across the world, storms have formed\nover the many submerged cities that deep ones call home,\nsuch as Y'ha-nthlei and Ahu-Y'hloa.
mystery.cthulhu.threateningSeas.text=As an encounter, an investigator on a space with a vortex\nmay attempt to prolong Cthulhu's slumber (Test Lore-1).\nIf he passes, he may spend 1 Clue and discard 1 Spell\nto close the vortex and advance the Active Mystery.
mystery.cthulhu.deepOnesAttack.name=The Deep Ones Attack!
mystery.cthulhu.deepOnesAttack.flavor=Terrible storms have battered fishing villages across the globe,\nbut it's merely the prelude to an invading army of deep ones!
mystery.cthulhu.deepOnesAttack.text=As an encounter, an investigator on a space with a vortex\nmay attempt to fend off the deep one invasion.\nIf he defeats ambushing Deep One, he may spend 1 Clue\nto close the vortex and advance the Active Mystery.
mystery.cthulhu.starsRight.name=The Stars Are Right!
mystery.cthulhu.starsRight.flavor=All around the world, Cthulhu's worshipers and\nthose sensitive to his dreams have been plagued by madness.\nThey rush to the sea to witness the Ancient One's return.
mystery.cthulhu.starsRight.text=After an investigator resolves a Research Encounter,\nhe may spend 1 Clue he gained from that encounter\nto advance the Active Mystery.
mystery.cthulhu.watchingStars.name=Watching The Stars
mystery.cthulhu.watchingStars.flavor=From the sunken city of Yhe, Cthylla rises to fulfill her destiny.\nDaughter of Cthulhu, she will give birth to the reincarnation\nof her father should his body ever be destroyed.
mystery.cthulhu.watchingStars.text=At the end of the Mythos Phase, if the Cthylla Epic Monster has been defeated, solve this Mystery.
mystery.cthulhu.rlyehRisen.name=R'lyeh Risen
mystery.cthulhu.rlyehRisen.flavor=Eons ago, the city of R'lyeh was plunged to the bottom of the ocean\nby some forgotten disaster. It has remained trapped there,\nwaiting for the right time to resurface.\nNow, that moment has finally arrived.
mystery.cthulhu.rlyehRisen.text=As an encounter, an investigator on a Pin\nmay explore the island city of R'lyeh.\nSuccessful encounter advances the Active Mystery.
mystery.cthulhu.risenSea.name=Risen From the Sea
mystery.cthulhu.risenSea.flavor=At last the time has come,\nthe deep ones have broken the elder sign\nthat kept their master asleep.\nCthulhu rises again,\nand madness fills the dreams of every living thing.
mystery.cthulhu.risenSea.text=When the Cthulhu Epic Monster has been defeated,\nsolve this Mystery.
mystery.shub.blasphemy.name=Blasphemy of the Black Goat
mystery.shub.blasphemy.flavor=The Black Litanies have been intoned\nand Yeb has been called forth from the Black Fire\nto purge the earth in preparation for Shub-Niggurath's arrival.
mystery.shub.blasphemy.text=At the end of the Mythos Phase,\nif the Yeb Epic Monster has been defeated,\nsolve this Mystery.
mystery.shub.hourLens.name=Hour of the Moon Lens
mystery.shub.hourLens.flavor=In the small village of Goatswood,\na series of peculiar mirrors are arranged on top of a pole\nto focus moonlight through a lens.\nIt is said that the Cult of the Black Goat\nuses this lens during their dark rites.
mystery.shub.hourLens.text=As an encounter, an investigator on London\nmay watch a ritual that transforms the worshipers\nof Shub-Niggurath into goat spawn.\nIf he defeats ambushing Goat Spawn, he may spend 2 Clues\nto advance the Active Mystery.
mystery.shub.spawn.name=Spawn of the Black Goat
mystery.shub.spawn.flavor=Shub-Niggurath's twin blasphemies\nwill prepare the world for the Black Goat,\ndestroying any potential challenge to their mother's reign.\nOne of the pair, Nug, has begun its dreadful task.
mystery.shub.spawn.text=At the end of the Mythos Phase,\nif the Nug Epic Monster has been defeated,\nsolve this Mystery.
mystery.shub.nature.name=Nature of the All-Mother
mystery.shub.nature.flavor=Shub-Niggurath naturally corrupts all life that encounters her.\nEverywhere her worshipers are found,\nall living things grow more vicious and feral.
mystery.shub.nature.text=After an investigator resolves a Research Encounter,\nhe may spend 1 Clue he gained from that encounter\nto advance the Active Mystery.
mystery.shub.hunting.name=Hunting the Thousand
mystery.shub.hunting.flavor=Shub-Niggurath's spawn, the Thousand Young,\ninfest the planet in greater and greater numbers,\nthreatening to overrun humanity.
mystery.shub.hunting.text=When a non Epic-Monster is defeated,\nthe active investigator may spend 2 Clues\nto advance the Active Mystery\nbased on monster's toughness.
mystery.shub.rituals.name=Rituals in the Wild
mystery.shub.rituals.flavor=Bonfires roar in the wildest corners of the planet\nas the Cult of the Black Goat performs their bestial rituals.\nThe cultists howl to Shub-Niggurath\nto let loose her children upon the Earth.
mystery.shub.rituals.text=As an encounter, an investigator on a Pin\nmay attempt to determine\nthe ritual's purpose (Test Observation).\nIf he passes he may spend 2 Clues\nto advance the Active Mystery.
mystery.shub.battleWoods.name=Battle in the Woods
mystery.shub.battleWoods.flavor=The feral mother of all monstrosities has manifested!\nShe is an enormous cloud\nfrom which dozens of tentacles extend and retract.\nWherever she goes, she leaves behind large hoof prints.\nTo behold her true, terrifying form\nis to come face to face with true, primal horror.
mystery.shub.battleWoods.text=When the Shub-Niggurath Epic Monster\nhas been defeated, solve this Mystery.
mystery.yog.spawn.name=Spawn of Yog-Sothoth
mystery.yog.spawn.flavor=Lavinia Whateley has given birth to something horrible,\nand now the creature calls for its father...
mystery.yog.spawn.text=At the end of the Mythos Phase,\nif the Dunwich Horror Epic Monster has been defeated,\nsolve this Mystery.
mystery.yog.whereBrokeThrough.name=Where the Old Ones Broke Through
mystery.yog.whereBrokeThrough.flavor=Yog-Sothoth struggles to free itself\nfrom the space between dimensions,\ntearing holes in our reality in the process.
mystery.yog.whereBrokeThrough.text=When an investigator closes a Gate\nhe may discard two Spells\nto seal the rift and advance the Active Mystery.
mystery.yog.beyondOne.name=The Beyond One
mystery.yog.beyondOne.flavor=Yog-Sothoth exists in all places at all times.\nTo any soul foolish enough to seek it,\nthe Ancient One can unlock limitless knowledge and power,\nbut it always comes at a price.
mystery.yog.beyondOne.text=After an investigator resolves a Research Encounter,\nhe may spend 1 Clue he gained from that encounter\nto advance the Active Mystery.
mystery.yog.stoneCircles.name=The Stone Circles
mystery.yog.stoneCircles.flavor=Across the globe, Yog-Sothoth's worshipers\ngather at ancient places of power,\neach marked by a circle of massive stones,\nplaced by unknown forces thousands of years ago.
mystery.yog.stoneCircles.text=As an encounter, an investigator on a Pin\nmay attempt to disrupt the ritual (Test Lore-1).\nIf he passes, he may spend 2 Clues\nto advance the Active Mystery.\nIf he fails, a Cultist Monster ambushes him!
mystery.yog.void.name=Void Between Worlds
mystery.yog.void.flavor=It is said that long ago,\nYog-Sothoth was imprisoned in a place utterly without existence,\na strange void that occupies the space between dimensions.
mystery.yog.void.text=As an encounter, an investigator on a Gate\nmay travel to the void between worlds.\nSuccessful encounter advances the Active Mystery.
mystery.yog.arcane.name=Arcane Understanding
mystery.yog.arcane.flavor=Humanity must not tamper with arcane energies.\nYog-Sothoth is the very essence of magic,\nand a person under the influence of sorcery\nwill inescapably become the Ancient One's puppet.
mystery.yog.arcane.text=When an investigator passes a Lore test\nwhile resolving a Spell effect,\nhe may spend one Clue and discard that Spell\nto advance the Active Mystery.
mystery.yog.keyGate.name=The Key and the Gate
mystery.yog.keyGate.flavor=The ancient horror tears apart the walls between worlds\npouring itself through the cracks in reality.
mystery.yog.keyGate.text=As an encounter, an investigator on a Gate\nmay confront Yog-Sothoth.\nSuccessful encounter advances the Active Mystery.

