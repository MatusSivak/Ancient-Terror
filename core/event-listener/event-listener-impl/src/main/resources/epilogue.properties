OCCULT_RESEARCH=Much to your unease, your victory appears piecemeal in a series of seemingly unrelated newspaper articles and radio announcements around the world. \
  Rich and poor alike arrested and charged with sedition. Harsh penalties. Dissections of the brain. \
  A mysterious government action in the Severn River Valley and the dynamiting of an ancient pyramidal ruin there. \
  Joining the dots is all too easy for those who have eyes to see. Few know of your involvement, and you would prefer to keep it that way. \
  Can you be sure that every cultist was apprehended? Can you swear that every ancient, ingenious, cruel descendant of hideous Shaggai is dead? \
  Can you truly believe that nothing now hides in humanity's shadow, awaiting its next chance to call down cosmic terror for the glory of an idiot god? \
  In the end, you are only certain of one thing: the need to watch your back...

THE_TRUE_NAME=Dawn comes. A dawn you never thought to see. The tremors that once shook the earth have faded. \
  The expectant hush is broken by the cautious chirp of a lone bird, as if astonished to find the world intact. \
  You spoke a name. Didn't you? A name that gave you power to calm the restless earth... to avert the blind eyes of the Daemon Sultan... to prevent the hatching of a monstrous egg. \
  Such power. If only you could remember. If only you could think. If only the damnable sound would stop. \
  The sound that will echo in your head for the maddened remainder of your life. The thin, tuneless piping of an unseen flute.

OMEN_OF_DEVASTATION=It's the talk of the town. The sudden appearance and disappearance of an ominous second moon. Radio stars wax philosophical. \
  Perplexed scholars describe it as a mass hallucination. Zealots and madmen call it a warning to a decadent world, predicting the imminent crash of the stock market, worldwide misery, a new and terrible war. \
  When friends and acquaintances demand your opinion, you can only smile and shrug. Should you tell them of mystical anchors that had fastened upon Earth? \
  Of a sky like a torn veil through which peered blind and unfathomable eyes? \
  Of desperate struggles on incomprehensible alien worlds to free your unsuspecting planet from that grip? Should you speak to them of Azathoth? \
  They would not call you hero. You know all too well what they would say. Your reward for hardship and anguish is simple survival. \
  After all you have seen of this universe and its terrors, you know that there is little point in asking for more.

THE_GREEN_FLAME=Days after the cold green fires flicker out, you find yourself returning to the ashes, searching for some indication that you have indeed saved the world. \
  Were those horrifying shapes you saw in the flame real, or the morbid fancies of an overtaxed mind? Can a flame truly live? \
  Was it a genuine emissary from the Outer Gods' court, or a mere parlour trick to impress the credulous? \
  Perhaps this vast conspiracy was an imaginary pattern born from feverish obsession. Perhaps the eldritch forces and alien vistas were the fruit of dreams and manias. \
  Perhaps you are in fact an inmate of some benighted asylum, fashioning grandiose tales of adventure and terror to amuse your disturbed brain. \
  Or is it worse than that? Have you murdered the innocent, thinking them monsters? Have you concocted this fantasy of sentient fire to justify your deeds? \
  Fire. Yes. That's the answer. The heat of an honest flame. The agony as it sears your skin. It's the only way you can be sure. \
  You know where they keep the kerosene. You just have to find a match.

SEED_OF_THE_DAEMON_SULTAN=You hold your breath as the green glow in the crater fades. \
  Has it worked? Did you correctly recite the incantation, and apply all the necessary chemical and electromagnetic influences? \
  Have you truly succeeded in sterilising the seed of a dark god? \
  You linger in the area for days, worrying, fearing, doubting. The cold wilderness of Tunguska seems as inhospitable as the surface of some far-flung world. \
  One moonless night, you glimpse movement in the crater. Heart in your throat, you flatten yourself to the ground and peer over the lip. \
  Faint starlight picks out crawling shapes bigger than men and the glint of metallic tools. An occasional hum and buzz drifts up from below. \
  The creatures appear to be chipping away at the inert meteorite like miners seeking silver. Are they dismantling it... or reviving it? \
  There is a whir and a thud as if something huge has landed behind you. Then a threatening buzzing noise. As you turn to face the looming shadow, you realise that you will never know.

VOICE_OF_AZATHOTH=The performers are few, the musical accompaniment sparse, the only audience the uncaring void. Hesitantly and clumsily, you invert the Massa di Requiem per Shuggay. \
  Your voice trembles as you read each backward line and reversed verse. The hideous history of Shaggai's insectile children winds back from finale to overture. \
  Their secretive manipulations of humanity. The arrival of their pyramidal temples upon Earth. The aeons of wandering exile that preceded it, teleporting from world to unhappy world. \
  Their revels beneath twin emerald suns, worshipping Azathoth, until the hammer-blow fell from space. \
  Though the shan's myriad blasphemies taste foul on your tongue, your voice grows stronger. Revoking their invocation. Undoing what they desire. \
  After the last, first word is uttered, and the final, opening note struck, silence rushes in to fill the void left by your voice. Silence impenetrable. \
  They find you huddled in the corner. Their questions go unanswered until someone thinks to fetch paper and pen.

THREATENING_SEAS=Rain lashes your exposed face as you scream the final words into the maelstrom. Lightning sears your eyes. The crack of thunder leaves you deafened and dazed. \
  By the time you collect your wits, the sky is clearing. The towering waves collapse into foam. Shafts of sunlight break through the clouds. \
  Only when the last wisp of cloud vanishes into the blue, and the noon sun glimmers on the peaceful swells, do you allow yourself to believe that the spell has worked. \
  He sleeps on, till the stars come right again. You can only hope that fatal night lies far in the future, after all memory of his worship has died and no degenerate cultist remains to break the seal of his tomb. \
  Yet you know in your heart that while the master of R'lyeh endures, his cult will never die. For that is not dead which can eternal lie. The great dreamer dreams on... Cthulhu ftaghn... Cthulhu ftaghn...

THE_STARS_ARE_RIGHT=The expose makes world headlines. Many scorn your findings as fantasy, but enough listen to act with haste. \
  Arrests, impoundments, drownings-the pattern is there for those who look. \
  They cannot stay wholly in the shadows now. The Cthulhu cult is known and proscribed. Few know or believe the full truth of its designs, but the murderous propensities of its followers are too well-documented now to ignore. \
  As artists and madmen relax into undisturbed slumber, free of abyssal dreams, you permit yourself to feel relief. \
  Your report and the flurry of activity that followed must have thrown a wrench into the cultists' plans. Their chance has passed. \
  The stars have moved on. They were not there to thrust open the doors of Cthulhu's tomb when it rose from the sea, or to welcome him back to the light of day. \
  But make no mistake: someday the stars shall be right again. Someday his call shall come once more. In the meantime, you would do well to remember that, despite your wishes, the report mentioned you by name...

RLYEH_RISEN=Some denounce your claims as sensational fiction and your photographs as faked, but the basic fact that a new island has risen in the South Pacific cannot be dismissed. \
  Navies of a dozen countries dispatch vessels to investigate. Heedless of your warnings, they intend to land search parties to explore. \
  Your fears of what they might disturb turn to terror when the papers report exchanges of fire at those coordinates and ships lost with all hands. \
  What passes there is classified 'top secret' by every military involved. The island is declared a hoax and figment, and no wonder, for no intrepid sailor who sets out to find it ever succeeds. \
  Try as you might, your efforts to discover what happened are met by a wall of silence. \
  At least, you tell yourself, the world has not ended yet. But as Japan boasts of 'co-prosperity treaties' while certain United States admirals take new and reclusive wives, \
  you cannot help wondering what those warships saw there, and what they might have brought back.

QUEEN_OF_THE_DEEP_ONES=The government agent keeps his composure until you draw back the tarpaulin. The stench of dead fish is suddenly overpowering. \
  He lets out a hoarse cry and reaches for his revolver. The bulging eyes of the carcass stare accusingly at you, black blood still oozing from its gills. \
  He turns as pale as the thing's underbelly when you tell him how many others there are. \
  The operation is underway within days. The papers talk of mass shoot-outs with 'bootleg gangs' on the docks and on the high seas. \
  Navy warships engaged in 'routine manoeuvres'. Submarines 'test-firing' torpedoes. \
  The general public shrug and go on with their lives. Only in the highest echelons of power, where stone-faced men of every nationality meet for secret talks, \
  is there an awareness that the war exists at all, much less that it might be the last. \
  Months pass before the faceless men exchange curt nods and perhaps a cigar or two to commemorate the victory. \
  Many more go by before disturbing reports filter in from distant shores and you wonder if you should have kept your mouth closed...

WATCHING_THE_STARS=The screams are like nothing on Earth. The sea boils as the thrashing gargantuan horror slips slowly beneath the waves. \
  Wounded, but not dead. Driven off, but not destroyed. Twin rows of slitted red eyes glare at you from beneath the surface before vanishing in pea-green soup. \
  Pray that her recuperation outlasts your meagre mortal life. Pray that she does not pass your description and deeds to her entombed father and future son. \
  He cannot risk emerging to walk the Earth without the safeguard of his daughter's womb, but his worshippers are not so cautious nor restrained by circumstance. \
  Keep your wits about you. Trust no stranger or ship. Above all, seek out refuge as far inland as you can. \
  It may not hinder the cult from finding you, but at least you stand a better chance of forgetting the promise of vengeance in those cruel eyes...

THE_DEEP_ONES_ATTACK=After a week of furtive, ferocious fighting, the attacks cease as suddenly as they began. Yet you know that the Deep Ones are far from gone. \
  Down there in the abyss lurk more of the squamous monstrosities than all the men, women and children on land. Did the opposition they faced encourage them to retreat? \
  Or was this no true uprising, but merely a test or foray? Perhaps invasion was never the purpose, and blood sacrifice was all they craved. \
  Perhaps all this death and horror was but a means to some nameless end. You wish you could keep such doubts away. \
  You wish you didn't dream every night of swimming out to sea.

RISEN_FROM_THE_SEA=It is reforming. Even as you watch the green mist bubbles and congeals into blubbery flesh. \
  You throw down your weapons in despair. Even ramming the creature with a ship could not discomfort it for more than a few heartbeats. \
  The waves froth and churn. Great Cthulhu pauses. Tremors shake the Cyclopean towers as the tide rushes back over the slimy rock. Can it be? Are they sinking? \
  The howl of frustration shreds your mind. You pitch over the side of the heaving boat. The black water sucks you down in R'lyeh's wake as the dark city descends once more into the abyss. \
  Perhaps your defiance delayed the mighty dreamer a moment too long. Perhaps whatever noxious sorcery buoyed his home and prison to the surface dissipated too soon. \
  Perhaps you served as an unwitting diversion while rival powers intervened. You will never know the truth of the matter. Merely hope that your bones are left undisturbed among the seaweed. \
  For in that last instant before the waves closed over your head, the hateful eyes of Great Cthulhu fixed upon you as if to contemplate the proper punishment for an irritating insect.

SPAWN_OF_THE_BLACK_GOAT=The firestorm rages out of control. Ghouls lope about aimless and frantic as the flames wash over them. \
  From your vantage point atop the ancient temple, the whole of the Amazon Basin appears to be burning. \
  Smoke stings your eyes and claws at your throat despite the wad of cloth you keep pressed to your face. \
  Was this what the entity intended? Was this the purpose of Nug's Torch? Did it plan to choke the continent and perhaps the planet in haze and pall, spreading a gloom in which farms and crops must fail? \
  Or is this hell a consequence of interrupting its work? Surely it only meant to return the world to wilderness, not burn everything to ash... \
  A snarl at your back makes you turn. The surviving ghouls have climbed the ruins while you were distracted by the awful sight. \
  There is nowhere to run, nowhere to turn. You raise your weapon as the creatures creep up on all sides. \
  Perhaps an explorer might one day stumble upon your remains and wonder what happened here. \
  Judging by the famished doglike faces, though, you doubt there will be much to find...

RITUALS_IN_THE_WILD=The things you saw in the woods haunt you. Wild couplings. Unnatural births. Bare-handed slaughter and worse. \
  You stumble out dazed and shaken, unwilling to speak of your experiences. Those who know you sense a change. One does not witness such things and escape unscathed. \
  At least you put a stop to the rituals. At least you quenched the bonfires. But sometimes you think the spark merely passed from one receptacle to another. \
  Sometimes, when the wind whispers or a wolf howls in the distance, you feel a stirring shameful to acknowledge and impossible to deny. \
  Years pass, but you live alone. Few friends and estranged family. Your predilections are known only to the strangers you meet on certain nights, away from prying eyes, but whispered about nonetheless. \
  Until the day when you discover the cold ashes of a campfire in a clearing. You stare at it for a while before gathering firewood. \
  When the blaze is going good and hot, you step back and shuck off your clothes. The pent-up tension of years dissolves into the bliss of surrender as you begin to dance.

NATURE_OF_THE_ALL_MOTHER=Goddess. Cult. Regression to the animal. Those were the words the newspaper reports used. How glib the words once seemed. \
  You wish you could turn back the clock before you learned any of it. Once she was a mere name in forbidden texts. \
  A sinister fertility deity to shelve with Cthulhu, Hastur, Atlach-Nacha and other esoteric beliefs. An imprecation to scream in moments of terror or ecstasy. \
  You see her stamp now everywhere you turn. In the dissections and theories of zoologists. In the pages of Charles Darwin. In the blind cunning of evolution, red in tooth and claw. \
  She is as far beyond Cthulhu and his ilk as they outclass mankind. A malignant property of the multiverse for which Azathoth is the engine and Yog-Sothoth the weave and warp. \
  To live is to embrace her, carrying her mark in every cell. There is only one way to escape her jaws. One day soon you might take it.

HUNTING_THE_THOUSAND=This one is the last. You know it by the mark of the cloven hoof seared into its hide. The others were branded in other ways, but each time you have made sure. \
  The last of the foul things to infest Earth. The last of her misbegotten brood. Breath rasps in your throat. Blood drips from your wounds. \
  Your clothes hang torn and tattered. It is over. The hunt is done. You can rest. Why do you feel so deflated? Why do you miss the thrill of the chase and the exhilaration of the kill? \
  Perhaps you should do it again sometime. If you can find suitably formidable prey. Hunting mere animals would seem insipid after this experience. You eye your companions. Perhaps there are other possibilities.

HOUR_OF_THE_MOON_LENS=What was it you saw in the moonlight? What was it that came out of the hill? \
  That bare bald mound behind the village... the way the earth split open with a sigh... the beam from the lens that penetrated the damp gloom... \
  You know you glimpsed something moving there just before you smashed the mirrors. You wish you had seen less. \
  They tried to stop you, of course. The favoured ones. The changed. Horns and hooves, claws and tails, beauty and horror unendurable. \
  Men and women went joyous into that warm darkness and came back made anew. \
  They jeered even as they wept and wailed, for did they not claim to be immortal now? Did they not have all the time in the world to rebuild? \
  As for you-scratched by brambles and short of breath, hunted through these bleak and trackless woods by voices that howl and laugh-you do not have much time left.

BLASPHEMY_OF_THE_BLACK_GOAT=It writhes as it dissolves, spewing forth black blood. The oily substance slicks the ice and spreads over cold waves. \
  A few of the unfortunates it snatched up in its tendrils fall screaming to a quick death. The others vanish with it. \
  Here and there among the smouldering villages lie the buckled hulls of ships, tossed miles inland as if they weighed no more than toys. \
  More troubling than the scale of destruction is its apparent purposelessness. \
  What did the entity hope to achieve by terrorising a few rude fishing villages on this lonely stretch of coast? \
  What was the 'Furnace of Yeb' it was prophesised to employ in clearing off the Earth, and why did it not resort to it in battle? \
  There is no use wondering. All you crave now is a shower to wash off this filthy blood. The blood that soaks your clothing and seems to have seeped into every pore. \
  Yes, it is about time you cast off these absurd rags, and put aside the trappings of civilisation for a night. \
  Tonight you shall run naked under the laughing stars. Surely that will cool this heat that pulses in your arteries, this burning appetite...

BATTLE_IN_THE_WOODS=Squeals and slobbering bellows ring out through the trees. The lightning-riven cloud that hides the horror's true shape contracts into a howling vortex. \
  Leaves and twigs pour past you to vanish into the tornado. The tree groans as its roots begin to rip from the soil. Just as you feel your grip on the branch slipping, the vortex detonates. \
  They find you under the fallen trunk. That you survived at all is incredible, for the forest for miles around looks as if it has been chewed away. \
  Pain and paralysis are your rewards for the defence of humanity. You cherish them. Things could be so much worse. \
  What was summoned was not the whole entity, any more than a finger thrust into an anthill can be considered the whole man. \
  Was it even aware of you until you stung its exploratory gropings and compelled it to retreat? \
  Every obscene appendage, every drooling orifice is seared into your brain. She is gone, but she is everywhere. \
  She lurks inside you still. Your animal fury was that of a frightened child biting its mother. You stay indoors in your wheelchair. You shun nature. You never eat meat again.

THE_BEYOND_ONE=The warp and weave. The potential and the actual. The grease between cosmic wheels. No wonder so many worship the Watcher or entreat it for favours. \
  Though the universities of the world have been alerted, and appropriate steps taken, it will take more than the exposure and censure of warlocks and witches to rid the globe of magic's taint. \
  Everywhere, everywhen, the Lurker at the Threshold waits just out of sight. Forced to serve as portal and key for the convenience of cosmic wanderers. \
  An ocean to sail the stars on, resentful but obedient. At least so the wizards claim. \
  There is no servant more useful than one who thinks himself the master. \
  They have long memories, those magicians. Are you sure that when you pass on, your wishes will be heeded? Are you sure your relatives will see you buried at sea or dissolved in acid as you so gruesomely insist? \
  Long memories, and vengeful natures, and tricks to raise the dead...

THE_STONE_CIRCLES=Though the circles have stood for millennia, it takes mere days to tear down the stones and dynamite those that cannot be shifted. \
  The work is carried out with grim determination by the local folk. \
  A few object, but fall silent when you show them evidence of the disaster that nearly took place under their noses. \
  Those lunatics had come so close to calling the things out of the air. So close to opening the way for their return. \
  The Old Ones who walk unseen, partitioned by the thinnest of curtains. The ancient rulers of this unhappy world who still lament its loss. \
  How many other stone circles still lurk undiscovered or forgotten in the dark corners of the Earth? \
  How long before reckless fools once again attempt to cajole Yog-Sothoth into tearing apart that veil? \
  No, your work has not ended. Your search has just begun. \
  After all, they only need succeed once.

VOID_BETWEEN_WORLDS=Standing in the bright sunlight, smelling the mundane whiff of exhaust fumes, you can barely comprehend that you survived your journey to the Outside. \
  That prison between the walls of the world is no place for mortal souls. Touching every point in space and time. \
  Holding fast for eternity. And every iota of that endless void overflowing with the bubbling congeries of its anguished occupant, like an amoeba squashed between two slides. \
  Though you closed the door behind you, life can never be quite the same for one who has visited that cosmic backstage. \
  As years pass, acquaintances remark on your hunched posture, your furtive glances over your shoulder, your preference for crowds. \
  It is no human stalker or wrathful cultist that makes you shrink within your heavy coat. \
  It is the knowledge that no matter where in the universe you might venture, the prickle at the back of your neck will never go away. \
  The certainty that every sparrow's fall is indeed noted and tallied. \
  The memory of countless iridescent eyes.

SPAWN_OF_YOG_SOTHOTH="FATHER!" The bellow shakes the hill. "SAVE ME! FATHER! YOG-SOTHOTH!". \
  With a groan and a writhing of purple snakes, the bloated creature melts into a puddle of dissolving goo. \
  No trace of the Dunwich Horror remains but a bare poisoned patch of ground on which nothing ever grows again. \
  The witnesses need no cautioning to stay silent. After all, what did they see? Nothing. \
  A nothing that flattened hovels and uprooted trees and left puckered marks in its path. \
  Who will credit the existence of such a phantasm? Much less the existence of an entire unseen race to which this pitiful creature was a mere crossbred cousin? \
  They know better. You know better. That way lies the asylum. Small comfort that it was no delusion, that you made the thing visible long enough to dispatch it. \
  How much better not to have seen its shape. To have remained unenlightened. \
  That face... good God... \
  That enormous, slobbering, half-human face on top...

WHERE_THE_OLD_ONES_BROKE_THROUGH=Recovering from the ordeal takes days. \
  Over and over you find yourself mumbling the gibberish syllables that knitted reality's fabric against the thing's scrabble to free itself. \
  What you sealed was nothing more than a crack in the cell through which a rat might squeeze. \
  What might have escaped, dreadful and world-damning though it would be, would no more constitute Yog-Sothoth in its entirety than runoff from the latrine. \
  Still, it might have been an infinitesimal step toward freedom. The first chip of the sharpened spoon. Now it must languish and wait and plot once more. \
  There is no hurry. It has eternity on its side. All the same, you pity that impossible, inhuman prisoner to whom gods and monsters are as toys. \
  Now and then you find yourself thinking on its suffering and pondering the unfairness of its plight. \
  But if you were to listen with senses beyond the merely mortal, you might catch the faint sound of patient chipping, \
  and wonder if the next crack has already appeared, in the wall of your sympathy.

ARCANE_UNDERSTANDING=You have tasted infinity. The heady wine of wizardry. The limitless yet entrammelled power that tempts so many to destruction. \
  You have imbibed the Beyond One's essence. The vitals of Yog-Sothoth. What is magic but a request that the Watcher intervene in cosmic affairs? \
  Such draughts are not meant for mortals. Prohibition, the Temperance League-you understand them all too well. \
  You who have tasted other stars and other times must now be content with this grey planet and its drab inhabitants. \
  You are determined. You are resolute. You commit yourself to self-denial. But oh, to sample that power just one more time. To let the Lurker in. \
  Just one more taste. Just one more drop. Is that too much to ask?

THE_KEY_AND_THE_GATE=The seething cacophony that was once reality quietens. Space and time bifurcate once more, distinct directions on a cosmic compass rather than an incoherent morass. \
  You are yourself. Yog-Sothoth is other. The Key locks the Gate. The prisoner retreats into his cell. \
  Malice? Evil? Does the sea savour the struggles of the drowning? Say rather that a force of nature has relented. A tide has come and gone. \
  Did it listen? Did it agree to spare this little world it so nearly washed over? \
  Did it intend to devour this meal snatched through the bars of its cage, or was it simply called up uncaring as a thirsty man might summon a flood? \
  Knowledge remains. Flotsam upon the beach. Past, present, future... you wish you had not perceived so much. The date and manner of your death, for instance. \
  The fate of the human race and proof of its irrelevance. Most of all, of course, you would have preferred not to know what your children are destined to look like, \
  or why that patch of skin is purpling like a bruise, or why each yellow blister bears a single staring dot.
