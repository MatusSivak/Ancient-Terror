# Keep English glyph keywords (Clue, Health, Will, etc.) in rules; translate surrounding prose.
# Pôvodný príbeh; mechaniky overené podľa https://eldritchhorror.fandom.com/wiki/Yig dňa 2026-10-24.
# Úvodné pokyny neprezrádzajú výsledky testu; po teste sa zobrazí iba vyriešená vetva.
# Príbeh a pravidlá sú oddelené. Prázdne info výsledku znamená žiadny ďalší mechanický efekt.
1.city.flavor=V zatvorenej kancelárii dovozcu nájdeš účtovnú knihu zošitú hadou kožou. Niekto z nej vytrhol cieľové miesta a útržky poskrýval medzi stovku obyčajných faktúr.
1.city.pass.flavor=Pod podložkou na stole nájdeš chýbajúce záznamy. Každá zásielka putuje rovnakou cestou do vnútrozemia a každý príjemca sa namiesto mena podpisuje kosákom mesiaca.
1.city.fail.flavor=Posledná strana zaznamenáva tvoj vlastný príchod, zapísaný týždne vopred. Otrasený strácaš stopu; ďalšia zásielka už smeruje do divočiny.
1.city.info=
1.city.pass.info=[#GOOD]Získaj túto Clue.[]
1.city.fail.info=[#BAD]Strať 1 Sanity a presuň túto Clue na najbližšie miesto expedície.[]

2.city.flavor=Muž na druhej strane kaviarne nepohne perami, a predsa ti jeho hlas napĺňa hlavu. S dokonalou presnosťou opisuje tvoje detstvo a potom ho začne meniť. Zúfalo sa držíš toho, o čom vieš, že je tvoje.
2.city.pass.flavor=Votrelca vytlačíš von. Na okamih spojenie prúdi oboma smermi a odhalí ti dlaždicami obložené tunely pod mestom a dvere označené stočeným hadom.
2.city.fail.flavor=Hlas zmĺkne, no jeho spomienky zostanú. Teraz si pamätáš aj druhú rodinu, ktorá čaká v dome, ktorého okná nikdy neuzreli denné svetlo.
2.city.info=
2.city.pass.info=[#GOOD]Získaj túto Clue.[]
2.city.fail.info=[#BAD]Získaj Halucinácie.[]

3.city.flavor=Zberateľ odomkne vitrínu s relikviami zo zničenej svätyne. Zamat pod nimi je posiaty jemnými šupinami. Kým on ide po lampu, prezeráš úzke medzery medzi policami.
3.city.pass.flavor=Hada zbadáš skôr, ako zaútočí. Pod jeho závitmi leží čerstvý prepravný štítok, ktorý spája údajne prastarú zbierku s adresou v meste.
3.city.fail.flavor=Zamat sa ti pod rukou pohne. Dve ostré bodnutia okamžite opuchnú a zberateľ zabuchne dvere skôr, ako stihneš zavolať o pomoc.
3.city.info=
3.city.pass.info=[#GOOD]Získaj túto Clue.[]
3.city.fail.info=[#BAD]Strať 1 Health a získaj Otravu.[]

4.city.flavor=Tvoj informátor na miesto stretnutia nikdy nedorazí. Namiesto neho z uličky vykročí postava v jeho kabáte, v jednej ruke zakrivenú čepeľ a v druhej napchatú brašnu.
4.city.pass.flavor=Keď útočníka premôžeš, získaš brašnu. Vnútri sú zašifrované adresy a fotografia tvojho informátora stojaceho pri hadom oltári.
4.city.fail.flavor=Postava vykĺzne cez bránu do dvora skôr, ako sa zmocníš brašne. Kým sa dostaneš na ulicu za ňou, všetky vchody sú už zatvorené.
4.city.info=[#BAD]Prepadne ťa Kultista.[]
4.city.pass.info=[#GOOD]Získaj túto Clue.[]
4.city.fail.info=

5.city.flavor=Železničný nosič odmieta hovoriť o debnách, ktoré syčali v nákladnej hale. Vedľa neho čaká zbalený kufor. Máš jediný rozhovor na to, aby si ho presvedčil, že mlčanie ho neochráni.
5.city.pass.flavor=Rozloží nákladný list, ktorý sa bál zničiť. Debny naložili pod falošnými menami, no on si pamätá, kto platil a ktoré nástupište použili.
5.city.fail.flavor=Povie ti číslo nástupišťa a ponáhľa sa preč. Je nesprávne. Nákladný vlak s tvojou stopou už odišiel k odľahlým vykopávkam.
5.city.info=
5.city.pass.info=[#GOOD]Získaj túto Clue.[]
5.city.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]

6.city.flavor=Za zabednenou kaplnkou ťa strážca učí ochrannú formulu vyslovovanú medzi nádychmi. Každá relikvia, ktorú nesieš, vyvoláva zo stien druhý, nesúzvučný hlas. Musíš udržať správny rytmus napriek odpovedajúcemu šepotu.
6.city.pass.flavor=Posledná slabika sa rozplynie v tichu. Prvý raz po dňoch kopíruje tvoj tieň presne tvoje pohyby a strážca sa ukloní, keď ochrana nadobudne moc.
6.city.fail.flavor=Odpovieš nesprávnemu hlasu. Slová ti zovrú hrdlo, až sa zlomíš v páse, a z rán, ktoré nevidíš, sa šíri horký jed.
6.city.info=
6.city.pass.info=[#GOOD]Získaj Požehnanie.[]
6.city.fail.info=[#BAD]Strať 2 Health a získaj Otravu.[]

7.city.flavor=Pod domom určeným na zbúranie prehovára hlas spoza zapečateného poklopu v podlahe. Vie, ako Yig označuje svoje obete, a ponúka, že sa o to poznanie podelí. Na oplátku žiada sľub bez stanoveného konca.
7.city.pass.flavor=Na tvoj sľub odpovie pomalé škrabanie pod poklopom. Vysunie sa nákres, ktorý ukazuje skryté pôsobenie Yigovho znamenia a spôsob, ako jeho zovretie uvoľniť.
7.city.fail.flavor=Žiadna dohoda nie je spečatená. Hlas sa stiahne pod podlahu a odnesie si svoje odpovede; odchádzaš skôr, ako nájde ďalší dôvod privolať ťa späť.
7.city.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
7.city.fail.info=
7.city.info=Môžeš [#BAD]získať Temný pakt[], aby si [#GOOD]získal túto Clue a jeden vyšetrovateľ mohol odhodiť Prekliatie.[]

8.city.flavor=V trezore zabudnutého spolku obopína zbraň sklenený had. Okolo vitríny sa vinú písmená v špirále bez viditeľného začiatku. Porovnávaš ich s útržkami rituálneho jazyka, ktoré si pamätáš.
8.city.pass.flavor=Nápis je pokynom pre strážcu. Vyslovíš uvoľňujúcu formulu a sklo sa rozvinie, odhalí zbraň i záznam o vojnách, pre ktoré ju vytvorili.
8.city.fail.flavor=Písmená sa ti preskupujú v myšlienkach. Na jazyku cítiš jed, keď sklenený had dvíha hlavu, hoci vitrína je nehybná zakaždým, keď sa na ňu pozrieš priamo.
8.city.info=
8.city.pass.info=[#GOOD]Získaj túto Clue a artefakt typu Zbraň.[]
8.city.fail.info=[#BAD]Strať 2 Sanity a získaj Otravu.[]

9.city.flavor=Opustené divadlo je osvetlené spod javiska. Zostúpiš do miestnosti plnej odhodených masiek, kde sa k tebe otočí posledný účastník tajného zasvätenia. Niečo pod jeho golierom sa stále mení.
9.city.pass.flavor=Zasvätenec padne a jeho pokyny sa rozsypú po podlahe. Ich čítanie dáva rituálu zrozumiteľnú podobu; hrôza sa mení na niečo, čo môžeš skúmať a čomu môžeš vzdorovať.
9.city.fail.flavor=Zasvätenec ustúpi za kulisy a zatarasí dvere do pivnice. Počuješ, ako na druhej strane zbiera papiere, a potom kroky miznúce pod javiskom.
9.city.info=[#BAD]Prepadne ťa Kultista.[]
9.city.pass.info=[#GOOD]Získaj túto Clue a zlepši Will.[]
9.city.fail.info=

10.city.flavor=Izbu mŕtveho kuriéra už niekto prehľadal, no vzor dierok od špendlíkov na stene naznačuje, že správa tu stále zostala. Prehrabávaš sa troskami, zatiaľ čo nad stolom sa prehýba popraskaný strop.
10.city.pass.flavor=Dierky lícujú s plánom ulíc ukrytým pod kobercom. Spolu odhaľujú miesto stretnutí aj cestu, ktorou k nemu prichádzajú poslovia kultu.
10.city.fail.flavor=Odtiahneš stôl a strhneš s ním časť stropu. Trám ti priškrtí nohu; vyslobodíš sa skôr, ako sa zrúti zvyšok izby.
10.city.info=
10.city.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
10.city.fail.info=[#BAD]Strať 1 Health a získaj Zranenú nohu.[]

11.city.flavor=Ukradnutý rukopis vymenúva znamenia Yigovho návratu atramentom, ktorý nechce zaschnúť. Pokúšaš sa prečítať záverečné vzývanie, zatiaľ čo sa ti pod prstami objavujú čerstvé ťahy.
11.city.pass.flavor=Poslednú vetu rozpoznáš ako varovanie, nie pozvanie. Jej dva skryté významy prezradia, kde sa kult zíde a čo chce prebudiť.
11.city.fail.flavor=Tvoje čítanie vzývanie dokoná. Čosi nesmierne si ťa cez stránku všimne a ponúkne ti strašnú voľbu: niesť jeho znamenie sám, alebo nechať jeho volanie šíriť sa ďalej.
11.city.option.1.flavor=Znamenie prijmeš. Vlhké písmená sa ti vpijú do kože a odpovedajúci zbor za stenami miestnosti stíchne.
11.city.option.1.info=
11.city.option.2.flavor=Nikto nový znamenie neprijme a vzývanie unikne otvoreným oknom. Naprieč mestom preberajú jeho posledné slová neviditeľné hlasy.
11.city.option.2.info=[#BAD]Skaza postúpi o 1.[]
11.city.info=
11.city.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
11.city.fail.info=[#BAD]Skaza postúpi o 1, pokiaľ nezískaš Prekliatie.[]

12.city.flavor=Na dlažbe za preplneným trhom ostali čerstvé šupiny. Sleduješ ich popri zatvárajúcich sa stánkoch s očami na zemi, zatiaľ čo nad tvojou hlavou cvakajú zatvárané okenice.
12.city.pass.flavor=Všimneš si druhú stopu, ktorá križuje prvú: prach z výraznej zelenej pečate. Vedie k zásielkovému obchodu, ktorého register odoslaných balíkov menuje chovateľa hadov.
12.city.fail.flavor=Pohltený dlažbou si nevšimneš prútený kôš spúšťaný z okna. Jeho veko sa otvorí vedľa tvojho ramena a čosi studené ťa uhryzne do krku.
12.city.info=
12.city.pass.info=[#GOOD]Získaj túto Clue.[]
12.city.fail.info=[#BAD]Získaj Otravu.[]

13.city.flavor=Električka prehrkoce okolo tvojej zastávky bez spomalenia. Všetci cestujúci sa v tom istom okamihu otočia k tebe a ich oči odrážajú svetlo lámp ako vyleštené šupiny. Prinútiš sa pozorovať namiesto úteku.
13.city.pass.flavor=Tváre sa vrátia k obyčajným výrazom. Videl si dosť: každý cestujúci nosí rovnaký malý kosák mesiaca, ukrytý pod manžetou alebo golierom.
13.city.fail.flavor=Na ďalšej zastávke vystúpiš a potkneš sa, istý si, že cestujúci ťa nasledujú. Po zvyšok noci sa ti zdá, že sa každá okoloidúca tvár otočí skôr, ako sa na ňu pozrieš.
13.city.info=
13.city.pass.info=[#GOOD]Získaj túto Clue.[]
13.city.fail.info=[#BAD]Strať 2 Sanity a získaj Paranoju.[]

14.city.flavor=Utekajúci informátor hodí balíček cez dieru v podlahe schátraného činžiaku. Pod ňou visí nad tmou rozbité schodisko. Skúmaš zvyšné podpery a hľadáš cestu dole.
14.city.pass.flavor=Spustíš sa popri pevnej stene a balíček získaš. Jeho vosková pečať nesie Yigov kosák mesiaca a papiere vnútri zaznamenávajú platby niekoľkým váženým domácnostiam.
14.city.fail.flavor=Keď presunieš váhu, jedna podpera povolí. Nešťastne dopadneš na schod pod sebou a musíš sa plaziť späť hore; balíček zostane niekde v tme.
14.city.info=
14.city.pass.info=[#GOOD]Získaj túto Clue.[]
14.city.fail.info=[#BAD]Získaj Zranenú nohu.[]

15.city.flavor=Úradník ťa zavedie do komnaty, kde každé vyslovené slovo opakuje mosadzný had. Spoznáš spôsob, ako obrátiť kúzlo proti jeho pánovi, no stálo by ťa to časť ťažko nadobudnutých schopností.
15.city.pass.flavor=Vložíš do kúzla kus svojej zručnosti. Had vysloví frázu, ktorá dokáže zrušiť Yigovo znamenie, a potom mu praskne čeľusť.
15.city.fail.flavor=Mosadzný had pokračuje v hlásení. Skôr než stihneš odísť, úradník sa vráti s dvojicou strážnikov a so zatykačom, na ktorom už stojí tvoje meno.
15.city.pass.info=[#GOOD]Jeden vyšetrovateľ môže odhodiť Prekliatie.[]
15.city.fail.info=[#BAD]Získaj Zadržanie.[]
15.city.info=Môžeš [#BAD]minúť 1 žetón zlepšenia[], aby [#GOOD]jeden vyšetrovateľ mohol odhodiť Prekliatie.[] Inak [#BAD]získaj Zadržanie.[]

16.city.flavor=Tvoj spoločník ťa pozve do elegantného mestského domu a zopakuje dôvernosť, ktorú si nezveril nikomu inému. Potom sa známa tvár zloží dozadu a odhalí tvora, ktorý cestoval po tvojom boku.
16.city.pass.flavor=Prinútiš podvodníka vzdať sa. Medzi jeho vytáčkami zachytíš meno domácnosti, ktorá mu poskytla prestrojenie.
16.city.fail.flavor=Tvor vyslovuje tvoje skryté obavy ako zaväzujúce slová. Každé tajomstvo uťahuje neviditeľný uzol, ktorý okolo teba spriadol.
16.city.pass.flavor.2=Držíš sa spomienky na svojho skutočného spoločníka. Ukradnuté dôvernosti podvodníka nedokážu jeho šepkanej kliatbe poskytnúť oporu.
16.city.pass.info.2=
16.city.fail.flavor.2=Podvodník unikne skôr, ako ho prinútiš odpovedať. Jeho odhodená ľudská tvár ti leží pri nohách a nič nevysvetľuje.
16.city.fail.info.2=
16.city.info=[#BAD]Odhoď 1 vybavenie Spojenec. Potom ťa prepadnú Hadí ľudia.[]
16.city.pass.info=[#GOOD]Získaj túto Clue.[]
16.city.fail.info=[#BAD]Získaj Prekliatie.[]

17.city.flavor=Kníhkupec rozbalí zväzok, ktorý premohol každého prekladateľa, akého najal. Písmená sa posúvajú pri každom otočení stránky. Hľadáš gramatiku skrytú pod ich pohybom.
17.city.pass.flavor=Písmo opisuje vlastný spôsob čítania. Keď pochopíš prvý riadok, zvyšok zapadne na miesto a kníhkupec sa znepokojujúceho zväzku rád vzdá.
17.city.fail.flavor=Pomýliš si príkaz s nadpisom a prečítaš ho nahlas. Písmená sa prestanú hýbať, no na obálke sa objaví nový riadok: tvoje meno, napísané ako venovanie.
17.city.info=
17.city.pass.info=[#GOOD]Získaj artefakt typu Kniha.[]
17.city.fail.info=[#BAD]Získaj Prekliatie.[]

18.city.flavor=Svedkove poznámky opisujú skrytú hadiu kolóniu do najmenších podrobností. Strčíš si ich do vrecka, kým on zamyká vypočúvaciu miestnosť. Jeho úsmev sa rozširuje ďalej, než by to ľudská čeľusť dokázala.
18.city.pass.flavor=Nedovolíš tvorovým tesákom zahryznúť sa. Keď boj skončí, poznámky sú stále v bezpečí a jeho jedu si unikol.
18.city.pass.info=
18.city.fail.flavor=Rana páli viac než len bolesťou. Poznámky stále máš, no tvorov jed ti prenikol do krvi.
18.city.info=[#GOOD]Získaj túto Clue.[] Potom [#BAD]ťa prepadnú Hadí ľudia.[]
18.city.fail.info=[#BAD]Získaj Otravu.[]

19.city.flavor=V mestskom archíve je niekoľko nedávnych úmrtí zaevidovaných pod tou istou zastaranou adresou. Vkradneš sa do zamknutej registratúry preskúmať originály, zatiaľ čo za dverami sa ozývajú kroky.
19.city.pass.flavor=Všetky originály nesú podpis lekára, ktorý zomrel pred desaťročiami. Opíšeš si jeho adresu a mená ľudí, ktorí sa zaňho zaručili.
19.city.fail.flavor=Kroky sa zastavia pred dverami. Sotva vrátiš zložku na miesto, dvere sa otvoria a strážnik ťa požiada o vysvetlenie rozbitého zámku.
19.city.info=
19.city.pass.info=[#GOOD]Získaj túto Clue.[]
19.city.fail.info=[#BAD]Získaj Zadržanie.[]

20.city.flavor=Lekár ponúka liečbu hadieho jedu, no pečate na jeho fľaštičkách s liekmi zodpovedajú starému zaväzujúcemu obradu. Kým ich spoznáš, je preč. Prehľadávaš jeho ordináciu a hľadáš stopu po jeho skutočnej práci.
20.city.pass.flavor=Za falošnou zásuvkou nájdeš termíny zapísané inou rukou. Pacienti sú zoradení podľa štádií premeny a ďalšie miesto stretnutia je jasne vyznačené.
20.city.fail.flavor=Každá zásuvka obsahuje rovnaké neškodné záznamy. Nech tu lekár robil čokoľvek, ukryl to príliš dobre, aby si to dokázal.
20.city.info=Ak máš Otravu, [#BAD]získaj Prekliatie.[]
20.city.pass.info=[#GOOD]Získaj túto Clue.[]
20.city.fail.info=

21.city.flavor=Zamknutý fotografický ateliér ukrýva portréty tej istej rodiny z troch storočí. Dátumy nemôžu byť správne. Skúmaš tváre a nútiš sa pozrieť znova vždy, keď sa ti spoznávanie začne vytrácať.
21.city.pass.flavor=V každej generácii sa objavuje jazva, vždy na tej istej tvári pod iným menom. Fotografie dokumentujú dlhú púť jediného tvora ľudskými životmi.
21.city.fail.flavor=Na najstaršej fotografii spoznáš sám seba. Odvtedy sa dátumy, tváre a tvoje vlastné spomienky prestanú zhodovať; aj miestnosť akoby patrila do života niekoho iného.
21.city.info=Môžeš [#BAD]minúť 2 Sanity[] a prehodiť až 2 kocky.
21.city.pass.info=[#GOOD]Získaj túto Clue.[]
21.city.fail.info=[#BAD]Získaj Amnéziu, Halucinácie a Paranoju.[]

22.city.flavor=Za súkromnou klinikou nájdeš miestnosť plnú spáčov, ktorí mrmlú to isté meno. Ich strážca sa odvráti od postele a jeho ľudské črty sa rozplývajú, keď siaha po kľúči na krku.
22.city.pass.flavor=Premôžeš strážcu a prinútiš ho vysvetliť znamenia spáčov. Jeho odpovede odhalia účel kliniky a obrad, ktorý dokáže uvoľniť Yigovu kliatbu.
22.city.fail.flavor=Strážca ťa zatlačí späť cez kliniku a oddelenie zapečatí. Mrmlanie spáčov ťa sprevádza až na ulicu, príliš slabé na to, aby si rozoznal jediné slovo.
22.city.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
22.city.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
22.city.fail.info=

23.city.flavor=Kuriér zviera zapečatenú správu, zatiaľ čo mu rituálna rana vysáva silu. Jeho prenasledovateľ už opúšťa mesto. Môžeš vziať časť rany na seba, aby ostal pri vedomí dosť dlho na to, aby prehovoril.
23.city.pass.flavor=Bolesť tebou prešľahne, keď sa kuriér pokojne nadýchne. Zlomí pečať a povie ti, kto prikázal správu doručiť a kam vedú jej pokyny.
23.city.fail.flavor=Kuriér ti už nič viac nepovie. Tvoja posledná stopa cestuje s jeho prenasledovateľom, ktorého trasa smeruje k vzdialenému táboru expedície.
23.city.pass.info=[#GOOD]Získaj túto Clue.[]
23.city.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]
23.city.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]presuň túto Clue na najbližšie miesto expedície.[]

24.city.flavor=V opustenej továrni bliká zelená lampa vo vzore, ktorý poznáš zo stretnutí kultu. Sleduješ ju pomedzi tiché stroje a hľadáš toho, kto signalizuje z lávky.
24.city.pass.flavor=Zbadáš pozorovateľa, ako siaha po páke, a zastavíš sa tesne pred strojom pod ním. Zahnaný do kúta prezradí cieľ signálu a potom utečie na dvor.
24.city.fail.flavor=Lampa bola návnada. Dopravník sa pod tebou trhnutím rozbehne a pritlačí ti nohu k hrdzavej vodiacej lište, kým sa nevyslobodíš.
24.city.info=
24.city.pass.info=[#GOOD]Získaj túto Clue.[]
24.city.fail.info=[#BAD]Strať 2 Health a získaj Zranenú nohu.[]

1.wilderness.flavor=Kamenná doska zatarasuje komoru pod ruinami. Jej vnútorný okraj brázdia staré stopy pazúrov. Zaprieš sa o skalu a snažíš sa ju nadvihnúť dosť vysoko, aby si dosiahol do priestoru za ňou.
1.wilderness.pass.flavor=Doska sa nadvihne práve natoľko, koľko treba. Vnútri zaznamenávajú dve vrstvy rytín hadie osídlenie a neskorší návrat jeho obyvateľov, oddelené celým vekom ticha.
1.wilderness.fail.flavor=Pri vzpieraní ti doska vykĺzne. Jej váha ťa odhodí na kamenné schody a ostrá bolesť ti zovrie chrbát skôr, než to stihneš skúsiť znova.
1.wilderness.info=
1.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
1.wilderness.fail.info=[#BAD]Strať 2 Health a získaj Zranený chrbát.[]

2.wilderness.flavor=Na svätyni pri ceste sú vyryté mená pod hadom s polámanými závitmi. Ktosi zoškrabal sprievodný obrad. Z úlomkov roztrúsených v tráve skladáš znaky, ktoré sa zachovali.
2.wilderness.pass.flavor=Úlomky opisujú, ako možno rozviazať Yigovo znamenie. Druhý nápis menuje ľud, ktorý obrad uchoval aj po tom, čo jeho osada zmizla.
2.wilderness.fail.flavor=Úlomky poskladáš do vzývania namiesto ochrany. Kameň sa zaleje jedom a na rukách, ktorými si sa ho dotkol, ti naskočia pľuzgiere.
2.wilderness.info=
2.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
2.wilderness.fail.info=[#BAD]Strať 2 Health a získaj Otravu.[]

3.wilderness.flavor=V opustenej zememeračskej stanici leží podrobná správa o neďalekých hadích ruinách. Posledný záznam opisuje čiernu sféru ukrytú pod koreňmi. Ideš podľa náčrtu a dávaš pozor na pasce, ktorých sa jej objaviteľ bál.
3.wilderness.pass.flavor=Tenký drôt mizne v spleti koreňov. Prekročíš ho a vyslobodíš sféru z jej lôžka; nech ju otáčaš akokoľvek, do jej stredu nepreniká ani lúč svetla.
3.wilderness.fail.flavor=Rukáv sa ti zachytí o skrytú niť. Zakopaná sféra sa obráti k tebe a čosi v jej temnote si zapamätá tvoju tvár skôr, než stihneš ustúpiť.
3.wilderness.info=[#GOOD]Získaj túto Clue.[]
3.wilderness.pass.info=[#GOOD]Získaj artefakt „Cursed Sphere“.[]
3.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

4.wilderness.flavor=Chodník sa ti pod nohami prelomí a odhalí roklinu lemovanú vytesanými hadmi. Zachytíš sa koreňa a ťaháš sa proti váhe svojej výstroje, aby si sa dostal na rímsu s čerstvými stopami.
4.wilderness.pass.flavor=Vytiahneš sa na rímsu. Vedľa stôp leží nedávno otvorená skrýša s trasou, ktorou putujú tí, čo sa starajú o tieto prastaré rytiny.
4.wilderness.fail.flavor=Koreň sa vytrhne. Narazíš na svah pod sebou a skôr, než sa prestaneš šmýkať, časť výstroje sa ti skotúľa z dosahu.
4.wilderness.info=
4.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
4.wilderness.fail.info=[#BAD]Strať 1 Health a odhoď 2 majetky typu Predmet.[]

5.wilderness.flavor=Zememeračské kolíky ohraničujú čistinu, kde sa tráva vlní proti vetru. V nížine sa tlačia hady a zakrývajú všetko, čo si zememerači označili. Hľadáš priehľad pomedzi nepokojné závity.
5.wilderness.pass.flavor=Zo správneho uhla tvoria kolíky mapu. Ich zakopané strany nesú druhú sadu značiek, ktoré zaznamenávajú, kedy sa hady zhromažďujú a kam potom odchádzajú.
5.wilderness.fail.flavor=Vlniaca sa tráva skrýva každú užitočnú značku. Obídeš čistinu dookola, no z kolíkov nevyčítaš o nič viac než pri príchode.
5.wilderness.info=Na mieste expedície [#BAD]získaj Otravu.[]
5.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
5.wilderness.fail.info=

6.wilderness.flavor=Pútnici sa zhromaždili okolo oltára, ktorý zohrieva oheň pod zemou. Vravia, že jeho videnie sa zjaví len tým, čo vydržia horúčavu. Za oltárom sa po holom kameni vinú tiene.
6.wilderness.pass.flavor=Vydržíš spaľujúci prechod. V chvejúcom sa vzduchu uzrieš tvar Yigovho znamenia a gesto, ktorým možno jeho putá zrušiť.
6.wilderness.fail.flavor=Zostaneš mimo kruhu. Pútnici dokončia obrad, no odtiaľ, kde stojíš, ti stúpajúca horúčava odhalí len beztvaré svetlo.
6.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
6.wilderness.fail.info=
6.wilderness.flavor.2=Prebudený boh odpovedá skrze oltár. Po kameňoch šľahá oheň a neušetrí nikoho, kto stojí nablízku.
6.wilderness.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue a jeden vyšetrovateľ mohol odhodiť Prekliatie.[]
6.wilderness.info.2=[#BAD]Strať 2 Health.[]

7.wilderness.flavor=Opustený tábor obklopuje nízky oltár pokrytý čerstvými škrabancami. Keď sa nad ne skloníš, postava, ktorú si považoval za odhodený spacák, sa za tebou vztýči a syčí cez zaťaté zuby.
7.wilderness.pass.flavor=Po zápase sa dokážeš stále sústrediť na oltár. Škrabance tvoria záznam obetí, z ktorých každá je spätá s miestom ďalej na hadích chodníkoch.
7.wilderness.fail.flavor=Jed ti zakalí zrak a škrabance sa nechcú zastaviť dosť dlho na to, aby si ich prečítal. Význam oltára musíš nechať nerozlúštený.
7.wilderness.info=[#BAD]Prepadne ťa Kultista.[]
7.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
7.wilderness.fail.info=Máš Otravu a nemôžeš získať túto Clue.

8.wilderness.flavor=Zapečatená nádoba bzučí hlasom príliš slabým na to, aby si mu rozumel. Jej strážca tvrdí, že para vnútri ti umožní počuť Yigovo posolstvo, no hadí boh žiada obeť, ak jeho pozvanie zostane bez odpovede.
8.wilderness.pass.flavor=Vdýchneš paru a hlas zaznie bolestivo zreteľne. Medzi jeho príkazmi počuješ mená a miesta stretnutí tých, čo už hadiemu bohu slúžia.
8.wilderness.fail.flavor=Nádoba stmavne skôr, než k tebe posolstvo dorazí. Táborom prejde syčanie a hľadá spoločníkov, ktorých hlasy počulo vedľa toho tvojho.
8.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
8.wilderness.fail.info=[#BAD]Odhoď túto Clue a 1 vybavenie Spojenec.[]
8.wilderness.info=Môžeš [#BAD]získať Otravu[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]odhoď túto Clue a 1 vybavenie Spojenec.[]

9.wilderness.flavor=Dažďom nasiaknutú čistinu križujú ľudské stopy a hlboká hadia brázda. Obe stopy miznú na tom istom kuse holého kameňa. Prehľadávaš okolitú zem a pátraš po chýbajúcom spojení.
9.wilderness.pass.flavor=Odtlačky pod previsom zachytávajú premenu krok za krokom. Neďaleko zaznamenáva staršia sada tú istú premenu naopak.
9.wilderness.fail.flavor=Kým skúmaš posledné zreteľné odtlačky, dážď ich rozmáča. Odchádzaš bez spoľahlivého spôsobu, ako spojiť stopy s brázdou.
9.wilderness.flavor.2=Na odchode ťa pri prechode cez kameň uštipnú hady, ktoré sa pod ním ukrývali. Na pevnú zem sa dostaneš s čerstvými uhryznutiami, ktoré ti pália na nohách.
9.wilderness.info=
9.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
9.wilderness.fail.info=
9.wilderness.info.2=[#BAD]Strať 2 Health.[]

10.wilderness.flavor=Za dedinou, ktorej obyvatelia si nikdy nevyzliekajú rukavice, stojí kamenný monument. Jeho rytiny sa akoby pohnú v blízkosti otrávenej krvi. Kým tvoji hostitelia chystajú večerný obrad, hľadáš znaky toho, čo uctievajú.
10.wilderness.pass.flavor=V rukavici zabudnutej pri ohni si všimneš zvlečené šupiny. Ich vzor sa zhoduje s monumentom a odhaľuje spojenie, ktoré tvoji hostitelia starostlivo tajili.
10.wilderness.fail.flavor=Dedinčania dokončia prípravy bez jediného nevhodného slova. Čokoľvek ich spája s monumentom, zostáva skryté za ich trpezlivými úsmevmi.
10.wilderness.info=Ak máš Otravu, [#BAD]Skaza postúpi o 1.[]
10.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
10.wilderness.fail.info=

11.wilderness.flavor=Chodník vedie pomedzi rovnaké stojace kamene. Zakaždým, keď sa obzrieš, objaví sa za tebou ďalší. Skúmaš mach a tiene a hľadáš niečo, čo meniaca sa cesta nedokázala napodobniť.
11.wilderness.pass.flavor=Jeden kameň vrhá tieň smerom k slnku. Tá nezrovnalosť ťa dovedie k hranici cesty, ktorá sčasti existuje v inom svete.
11.wilderness.fail.flavor=Zvolíš medzeru medzi kameňmi a vkročíš do oblohy bez zeme. Cesta sa za tebou zavrie a nezanechá ani stopy, ani smer domov.
11.wilderness.info=
11.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
11.wilderness.fail.info=[#BAD]Získaj Stratený v čase a priestore.[]

12.wilderness.flavor=Pod koreňmi stromu s vyrytým Yigovým znakom leží denník expedície. Keď sa ich dotkne tvoj tieň, korene sa zovrú. Hľadáš spôsob, ako sa ku knihe dostať bez toho, aby si vyrušil jej strážcu.
12.wilderness.pass.flavor=Pri kmeni nájdeš otvor, no posledné korene povolia len živej ruke. Ich tŕne sľubujú za denník bolestivú cenu.
12.wilderness.fail.flavor=Strážcu vyrušíš skôr, než sa dostaneš k denníku. Vyrytý had otvorí oko a jeho chladná pozornosť ťa sprevádza preč od stromu.
12.wilderness.option.1.flavor=Pretlačíš ruku cez tŕne a vytrhneš denník. Jeho krvou postriekané stránky uchovávajú správu expedície o skrytej hadej osade.
12.wilderness.option.1.info=[#GOOD]Získaj túto Clue.[]
12.wilderness.option.2.flavor=Korene sa okolo knihy zovrú. Strom tvoj pokus vycítil a znak na jeho kôre ťa sleduje v každom tieni.
12.wilderness.option.2.info=[#BAD]Získaj Prekliatie.[]
12.wilderness.info=
12.wilderness.pass.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]získaj Prekliatie.[]
12.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

13.wilderness.flavor=Ďaleko od cesty začne akýsi hlas vymenúvať veci, ktorých sa desíš. Hovorí zo stromov, potom zvnútra tvojej vlastnej hrude. Upriamiš myseľ na rytmus svojich krokov.
13.wilderness.pass.flavor=Necháš hlas vyčerpať sa bez odpovede. Do lesa sa vrátia obyčajné zvuky a s nimi aj pokoj, o ktorom si myslel, že si ho stratil.
13.wilderness.fail.flavor=Raz odpovieš a hlas sa naučí znieť ako niekto, komu dôveruješ. Do súmraku už nedokážeš počuť priateľské zavolanie bez toho, aby si sa nepýtal, čo sa za ním skrýva.
13.wilderness.info=
13.wilderness.pass.info=[#GOOD]Obnov si 2 Sanity.[]
13.wilderness.fail.info=[#BAD]Získaj Paranoju.[]

14.wilderness.flavor=Rozbitá tabuľka zaznamenáva dohodu spečatenú pod obrazom hada. Vietor na jednej strane zotrel podmienky. Rekonštruuješ ich zo zachovaných fráz a zo vzoru pečate.
14.wilderness.pass.flavor=Chýbajúce riadky sa týkajú ceny za porušenie prísahy. Teraz chápeš, prečo bola opustená osada označená a čo sa jej preživší snažili zatajiť.
14.wilderness.fail.flavor=Doplníš nesprávne slová a zo záznamu urobíš novú prísahu. Pečať sa ti pod prstami zohreje, keď prijíma nedobrovoľného svedka.
14.wilderness.info=
14.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
14.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

15.wilderness.flavor=Do svahu je vyrytý rituálny kruh, jeho posledná ryha ešte nie je dokončená. Keď sa priblížiš, z priekopy sa vztýči prastarý hadí kňaz a zviera nástroj, ktorým chce spojiť línie.
15.wilderness.pass.flavor=Kňaz padne skôr, než stihne kruh dokončiť. Jeho tabuľky vysvetľujú obrad a tlak, ktorý sa hromadil pod svahom, pomaly ustupuje.
15.wilderness.fail.flavor=Kňaza nedokážeš zastaviť. Keď ustupuješ z kruhu, vypľuje ti na odhalenú kožu temnú spŕšku.
15.wilderness.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
15.wilderness.pass.info=[#GOOD]Získaj túto Clue a Skaza ustúpi o 1.[]
15.wilderness.fail.info=[#BAD]Získaj Otravu.[]

16.wilderness.flavor=Pustovníkov prístrešok je prázdny, no čistinu pred ním pokrývajú stránky pritlačené kameňmi. Napriek nehybnému vzduchu sa pohybujú v poradí. Pátraš po vzore, ktorý spája ich symboly.
16.wilderness.pass.flavor=Zachytíš opakujúci sa pohyb a podľa neho stránky usporiadaš. Prezradia, kto pustovníka učil, a obsahujú aj kúzlo odpísané z vlastného zvitku jeho učiteľa.
16.wilderness.fail.flavor=Nasleduješ pohyb, ktorý tam nikdy nebol. Čoskoro sa zdá, že písmo je na každom liste, a prázdny prístrešok sa zaplní postavami, ktoré zmiznú, keď sa otočíš.
16.wilderness.info=
16.wilderness.pass.info=[#GOOD]Získaj túto Clue a kúzlo.[]
16.wilderness.fail.info=[#BAD]Získaj Halucinácie.[]

17.wilderness.flavor=Medzi ruinami kľačí hadí učenec a rozostavuje malé nádoby okolo odkrytého nápisu. Len čo si ťa všimne, zaútočí. Počas zápasu sa snažíš nespustiť jeho dielo z očí.
17.wilderness.pass.flavor=V jasnom okamihu uprostred boja uvidíš, ako nádoby zodpovedajú nápisu. Účel obradu začína dávať zmysel.
17.wilderness.fail.flavor=Zápas si žiada všetku tvoju pozornosť. Keď sa napokon pozrieš k nádobám, ich usporiadanie je rozmetané na nepoznanie.
17.wilderness.fail.info=
17.wilderness.pass.flavor.2=Zapamätáš si aj postupnosť jeho gest. Porovnanie s ruinami odhalí druhý význam skrytý v obrade.
17.wilderness.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
17.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
17.wilderness.pass.info.2=[#GOOD]Získaj 1 Clue navyše.[]

18.wilderness.flavor=Hliadka obkľúči tvoj tábor s opisom, ktorý presne zodpovedá tebe. Pri viacerých zmiznutiach videli niekoho s tvojou tvárou. Snažíš sa presvedčiť strážnikov, aby porovnali podrobnosti.
18.wilderness.pass.flavor=Výpovede svedkov ťa v tú istú hodinu kladú na miesta vzdialené celé míle. Strážnici prijmú tvoje vysvetlenie a opíšu rituálne stopy nájdené na každom mieste činu.
18.wilderness.fail.flavor=S každým slovom znie tvoja výpoveď menej vierohodne. Hliadka ťa odvedie do najbližšieho mesta, kde strážnik začne tvoju výpoveď zapisovať ako priznanie.
18.wilderness.info=
18.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
18.wilderness.fail.info=[#BAD]Presuň sa do najbližšieho Mesta a získaj Zadržanie.[]

19.wilderness.flavor=Posledná strážkyňa zničenej svätyne je ochotná vypočuť si, prečo si prišiel. Už videla cudzincov žiadať Yigove tajomstvá a pozorne si ťa premeriava, kým vysvetľuješ, čomu chceš zabrániť.
19.wilderness.pass.flavor=Otvorí výklenok vo svätyni a vytiahne záznam starých prosieb. Medzi nimi je aj prosba, ktorú hadí boh kedysi prijal, a obrad, ktorým bola prednesená.
19.wilderness.fail.flavor=Strážkyňa svätyňu zavrie. Keď sa odvracia, vysloví krátky rozsudok v jazyku, ktorý nepoznáš, a vytesané hady akoby sledovali jej pohľad.
19.wilderness.info=
19.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
19.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

20.wilderness.flavor=Nezvestná expedícia zanechala v hrdzavom poľnom kufríku neporušenú mapu. Pod ňou obklopujú druhú priehradku čerstvé škrabance. Skôr než sa pokúsiš odhaliť, čo ešte priniesli späť, prezrieš si západku.
20.wilderness.pass.flavor=Zachytíš pohyb za západkou a otvoríš priehradku z druhej strany. Vnútri leží trasa s poznámkami, ktorá na mape navrchu chýba.
20.wilderness.fail.flavor=Za falošným dnom sa uhniezdil had. Udrie cez škáru skôr, než ho zbadáš, a skrytá priehradka zostane nepreskúmaná.
20.wilderness.info=[#GOOD]Získaj túto Clue.[]
20.wilderness.pass.info=[#GOOD]Získaj 1 Clue navyše.[]
20.wilderness.fail.info=[#BAD]Získaj Otravu.[]

21.wilderness.flavor=Medzi ruinami čaká postava v rúchu a pred ňou leží hadia koruna. Slúži súperiacej moci a ponúka relikviu výmenou za tvoje dôkazy a záväzný sľub. Jej hrozby sa týkajú každého, kto s tebou cestoval.
21.wilderness.pass.flavor=Postava prijme tvoj sľub a zničí dôkazy, ktoré si priniesol. Prastarú korunu ti položí na dosah, spokojná, že dohoda teraz zaväzuje vás oboch.
21.wilderness.fail.flavor=K paktu nedôjde. Postava obráti pozornosť k tvojim spoločníkom a ich hlasy sa rozľahnú ruinami, keď nadobúda podobu jej strašná odpoveď.
21.wilderness.pass.info=[#BAD]Odhoď túto Clue[] a [#GOOD]získaj artefakt „Serpent Crown“.[]
21.wilderness.fail.info=[#BAD]Strať 2 Sanity a odhoď 2 vybavenia Spojenec.[]
21.wilderness.info=Môžeš [#BAD]získať Temný pakt a odhodiť túto Clue[], aby si [#GOOD]získal artefakt „Serpent Crown“.[] Inak [#BAD]strať 2 Sanity a odhoď 2 vybavenia Spojenec.[]

22.wilderness.flavor=Zasypaná komora ukrýva dva rady rytín, jeden vytesaný cez druhý o stáročia neskôr. V žliabkoch okolo tvojich nôh sa pohne prach. Hľadáš bezpečné miesto, z ktorého by si nápisy porovnal.
22.wilderness.pass.flavor=Nájdeš čistý kus podlahy a odpíšeš oba rady. Starší text menuje staviteľov; novší zaznamenáva mená, pod ktorými sa vrátili.
22.wilderness.fail.flavor=Prach vybuchne do malých útočiacich hlavičiek. Keď ti jed vnikne do krvi, rytiny zažiaria tým istým vzorom, aký sa objavuje pod tvojou kožou.
22.wilderness.info=
22.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
22.wilderness.fail.info=[#BAD]Získaj Otravu a Prekliatie.[]

23.wilderness.flavor=V ruinách prastarej ošetrovne žiari jediná fiolka. Pozdĺž políc okolo nej nehybne ležia hady, takmer na nerozoznanie od vyrezávaného kovania. Skôr než po nej siahneš, skúmaš ich závity.
23.wilderness.pass.flavor=Zdvihneš fiolku bez toho, aby si zobudil spiacich. Jej štítok opisuje liek proti rozkladu samotného života, uchovaný pod neporušenou pečaťou.
23.wilderness.fail.flavor=Jedno z vyrezávaných kovaní sa ti pohne pod rukávom. Tesáky ti prebodnú zápästie a ucukneš skôr, než sa k fiolke dostaneš.
23.wilderness.info=
23.wilderness.pass.info=[#GOOD]Získaj artefakt „Elixir of Life“.[]
23.wilderness.fail.info=[#BAD]Získaj Otravu.[]

24.wilderness.flavor=Prameň pri chodníku má slabú medenú príchuť. Staré výstrahy naznačujú, že jeho voda reaguje s hadím jedom. Ideš proti prúdu a hľadáš, čo ju zmenilo.
24.wilderness.pass.flavor=Všimneš si, že prúd sa delí okolo čohosi pod hladinou. Keď odstrániš burinu, odhalíš ponorený idol, ktorého otvorené ústa napájajú prameň.
24.wilderness.fail.flavor=Potok zmizne pod spleťou koreňov. Prehľadáš oba brehy, no zdroj zvláštnej chuti vody zostáva mimo tvojho dosahu.
24.wilderness.info=Ak máš Otravu, [#BAD]strať 1 Health a 1 Sanity.[]
24.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
24.wilderness.fail.info=

1.sea.flavor=Stopa vlhkých šľapají končí pri nákladnej debne, ktorá sa posúva s každým zakolísaním lode. Jej sprievodný list uvádza iba keramiku. Prezrieš úväzy aj temné priestory pod susedným nákladom.
1.sea.pass.flavor=Ešte pred otvorením debny si všimneš falošný panel. Za ním leží hadí idol a prepravný príkaz adresovaný chrámu, ktorý nenájdeš na žiadnej mape.
1.sea.fail.flavor=Oprieš sa o debnu a vtom ucítiš, ako ti čosi prepichne rukavicu. Medzi doskami sa späť vkĺzne had, zatiaľ čo sa ti prstami šíri necitlivosť.
1.sea.info=
1.sea.pass.info=[#GOOD]Získaj túto Clue.[]
1.sea.fail.info=[#BAD]Získaj Otravu.[]

2.sea.flavor=Prebudíš sa na palube so stranou súradníc v ruke, napísaných písmom, ktoré sa takmer podobá tvojmu. Hodinky sa ti zastavili. Skúmaš stranu i okolie a hľadáš akýkoľvek náznak toho, kam sa podeli chýbajúce hodiny.
2.sea.pass.flavor=Soľné škvrny prezradia, kde na strane ležal druhý list. Jeho zrkadlový odtlačok uvádza miesto stretnutia na ostrove aj pasažiera, ktorý ho dohodol.
2.sea.fail.flavor=Kým študuješ súradnice, začína sa ti vytrácať aj včerajšok. Strana ukazuje do vnútrozemia k miestu expedície, no už si nepamätáš, kto ťa tam poslal.
2.sea.info=
2.sea.pass.info=[#GOOD]Získaj túto Clue.[]
2.sea.fail.info=[#BAD]Získaj Amnéziu a presuň túto Clue na najbližšie miesto expedície.[]

3.sea.flavor=Čosi drží krok s loďou pod trupom a prehovára k tebe cez dosky tvojej kajuty. Ponúka ti poznanie čerpané z civilizácie staršej než ľudstvo. Aby si ho prijal, musíš otvoriť svoju myseľ a zaviazať sa mu do služby.
3.sea.pass.flavor=Dohoda otvorí úzky priechod medzi tvojimi myšlienkami a prastarou mysľou. Vedie ťa neznámymi disciplínami, až kým ti ich vzorce nezačnú pripadať ako tvoje vlastné.
3.sea.fail.flavor=Priechod medzi vašimi mysľami zostane zatvorený. Do rána hlas pod trupom zmizne a s ním aj sľúbené poznanie.
3.sea.pass.info=[#GOOD]Zlepši dve rôzne vlastnosti podľa vlastného výberu.[]
3.sea.fail.info=
3.sea.info=Môžeš [#BAD]minúť 2 Sanity a získať Temný pakt[], aby si [#GOOD]zlepšil dve rôzne vlastnosti podľa vlastného výberu.[]

4.sea.flavor=Posádka vytiahne na palubu kotvu s vyrytým kalendárom, ktorý nikto nepozná. Jeho dátumy krúžia okolo obrazu spiaceho hada. Porovnávaš symboly so záznamami o krajinách, ktoré pohltilo toto more.
4.sea.pass.flavor=Spoznáš počiatočný bod kalendára. Kotva pochádza z prístavu, ktorý zanikol ešte pred úsvitom ľudských dejín, a jej znaky uchovávajú cestu ku kolónii, ktorá dodnes prežíva.
4.sea.fail.flavor=Považuješ postupnosť za pamätník a necháš ju tak. Pod trupom začnú vyryté dátumy znieť ako odpočítavanie.
4.sea.info=
4.sea.pass.info=[#GOOD]Získaj túto Clue.[]
4.sea.fail.info=[#BAD]Skaza postúpi o 1.[]

5.sea.flavor=Z lodného denníka zmizlo niekoľko strán, všetky o tom istom pasažierovi. Kapitán ti odmieta ukázať zvyšné záznamy. Naliehaš na neho, zatiaľ čo sa pri dverách kajuty zhromažďuje posádka.
5.sea.pass.flavor=Kapitán napokon knihu otvorí. Pasažier sa na túto loď nalodil pod tromi rôznymi menami a zakaždým ho sprevádzala debna z tej istej hadej svätyne.
5.sea.fail.flavor=Kapitán ukončí rozhovor jediným gestom. Jeho muži ťa vlečú na chodbu a ich hrubé zaobchádzanie ti zanechá bolestivé zranenie.
5.sea.info=
5.sea.pass.info=[#GOOD]Získaj túto Clue.[]
5.sea.fail.info=[#BAD]Získaj stav Zranenie.[]

6.sea.flavor=Námorník prizná, že na palubu prepašovali hadí idol, no odmieta prezradiť, ktorý pasažier za tým stojí. Snažíš sa získať jeho dôveru pri jedle, ktorého sa sotva dotkol.
6.sea.pass.flavor=Odsunie tvoju misku a rýchlo prehovorí. To jedlo pripravili pre teba a ten, kto ho objednal, ukrýva idol v zamknutej lodnej truhlici.
6.sea.fail.flavor=Vyhýba sa tvojmu pohľadu. Kým si všimneš horkú usadeninu na dne misky, jazyk ti už začína tŕpnuť.
6.sea.info=
6.sea.pass.info=[#GOOD]Získaj túto Clue.[]
6.sea.fail.info=[#BAD]Získaj Otravu.[]

7.sea.flavor=Hmla zahaľuje provu, až kým sa z nej nevyhupne kývajúci sa lampáš. Námorník, ktorý ho drží, má pod tetovaním hada okolo ramena omotanú mapu. Keď zbadá, že čítaš jej značky, vytasí nôž.
7.sea.pass.flavor=Premôžeš námorníka a rozvinieš mapu. Kurzy zaznačené ceruzkou vedú pomedzi osamelé ostrovy, z ktorých každý nesie ten istý hadí znak.
7.sea.fail.flavor=Námorník aj s mapou zmizne v hmle. Prehľadáš prednú palubu, no nájdeš iba lampáš, ktorý sa kýve nad prázdnym zábradlím.
7.sea.info=[#BAD]Prepadne ťa Kultista.[]
7.sea.pass.info=[#GOOD]Získaj túto Clue.[]
7.sea.fail.info=

8.sea.flavor=Jeden z pasažierov tvrdí, že počuje prastaré predmety volať spod hladiny mora. Prestal jesť a neustále sleduje poklop nákladného priestoru. Pýtaš sa ho, čo počul predtým, než loď opustila prístav.
8.sea.pass.flavor=Opisuje volanie, na ktoré ktosi odpovedal z vnútrozemia. Podrobnosti sa zhodujú s pohybmi Yigových uctievačov a ukazujú ti, kde v pátraní pokračovať.
8.sea.fail.flavor=Po prvej otázke za sebou zavrie dvere kajuty. Keď nabudúce prechádzaš okolo, je zvnútra zakrytá aj kľúčová dierka.
8.sea.flavor.2=Neskôr sa z relikvií, ktoré máš pri sebe, ozve slabý odpovedajúci tón. Začneš uvažovať, čo to načúva a či to už nevie, kde spávaš.
8.sea.info=
8.sea.pass.info=[#GOOD]Získaj túto Clue.[]
8.sea.fail.info=
8.sea.info.2=[#BAD]Strať 1 Sanity a získaj Paranoju.[]

9.sea.flavor=Tabuľky vylovené z vraku schnú vedľa tela zabaleného do plachtoviny. Ako z nich opadáva soľ, znaky sú čoraz zreteľnejšie. Pokúšaš sa určiť jazyk skôr, než sa krehký povrch rozpadne.
9.sea.pass.flavor=Spoznáš záznam vyhnanca zo zmiznutého kontinentu. Posádka ti tabuľky s úľavou zverí, rada, že niekto dokáže jej znepokojivý náklad aspoň pomenovať.
9.sea.fail.flavor=Znaky odmietajú akýkoľvek význam, ktorý by si dokázal udržať. Za tebou začne zabalené telo šepkať preklad, ktorý stíchne zakaždým, keď vstúpi iný námorník.
9.sea.info=
9.sea.pass.info=[#GOOD]Získaj artefakt „Zanthu Tablets“.[]
9.sea.fail.info=[#BAD]Získaj Halucinácie.[]

10.sea.flavor=Vrak uviaznutý na útese ukrýva posledné záznamy expedície na ostrovy zamorené hadmi. Prehľadávaš jeho naklonené kajuty a predieraš sa tesnými škárami, zatiaľ čo v zatopených chodbách sa pohybujú temné tvary.
10.sea.pass.flavor=Kapitánove poznámky nájdeš zapečatené v kryte lampy. Zaznamenávajú posledné pristátie expedície aj výstrahy, ktoré ho nabádali, aby sa obrátil späť.
10.sea.fail.flavor=Pod vodou ťa čosi udrie do ruky. Kým sa vyškriabeš z vraku, zrak ti zaplavia horúčkovité výjavy a nedokážeš rozlíšiť polámané trámy od zvíjajúcich sa hadích tiel.
10.sea.info=Môžeš [#BAD]minúť 2 Health[], aby si hodil znova až 2 kockami.
10.sea.pass.info=[#GOOD]Získaj túto Clue.[]
10.sea.fail.info=[#BAD]Strať 2 Sanity a získaj Otravu.[]

11.sea.flavor=Na zadnej palube sa väzeň vytrhne a rozpráši svoj sprievod. Zviera označenú mapu a hľadí k vzdialenému pobrežiu. Keď mu zastúpiš cestu, so syčaním sa obráti proti tebe.
11.sea.pass.flavor=Zrazíš ho k zemi skôr, než dobehne k zábradliu. Mapa spolu s výpoveďou jeho strážcov odhalí cestu, ktorou kult presúva svojich utečencov.
11.sea.fail.flavor=Preskočí zábradlie s mapou stále zovretou v pästi. Naposledy zazrieš úzku brázdu, ktorá mieri k divočine za pobrežím.
11.sea.info=[#BAD]Prepadne ťa Kultista.[]
11.sea.pass.info=[#GOOD]Získaj túto Clue.[]
11.sea.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]

12.sea.flavor=Tvoj čln sa unáša pomedzi trosky a tvoje papiere sú roztrúsené po vode takej temnej, že cez ňu nedovidíš. Neviditeľný plavec ponúkne, že ti vráti smer aj dôkazy. Hlas v tvojej mysli žiada trvalý sľub.
12.sea.pass.flavor=Zložíš sľub. Vedľa teba sa z vody vynorí suchý balíček a plavec navedie tvoj čln k svetlám okoloidúcej lode.
12.sea.fail.flavor=Plavec sa stiahne a roztrúsené papiere si odnesie do tmy. Unášaš sa bez kurzu, až kým ťa vzdialená loď nenájde dlho po plánovanom príchode.
12.sea.pass.info=[#GOOD]Získaj túto Clue.[]
12.sea.fail.info=[#BAD]Odhoď túto Clue a staneš sa Zdržaným.[]
12.sea.info=Môžeš [#BAD]získať Temný pakt[], aby si [#GOOD]získal túto Clue.[] V opačnom prípade [#BAD]odhoď túto Clue a staneš sa Zdržaným.[]

13.sea.flavor=Pred tvojou kajutou čaká postava s tvárou niekoho, koho si v tomto zápase stratil. Presne vie, ako ťa pozdraviť. Potom jej požičaný výraz skĺzne a spoza masky siahne čosi prastaré.
13.sea.pass.flavor=Porazíš podvodníka a odhalíš znaky, podľa ktorých si vybral svoju požičanú podobu. To poznanie je užitočné, no spomienka na ten dôverne známy pozdrav ťa neopustí.
13.sea.fail.flavor=Podvodník unikne medzi pasažierov. Kdesi na tejto lodi si už vyberá ďalšiu dôveryhodnú tvár, cez ktorú bude pokračovať v Yigovom diele.
13.sea.info=Odhoď z hracej plochy žetón porazeného vyšetrovateľa. [#BAD]Potom ťa prepadnú Hadí ľudia.[]
13.sea.pass.info=[#BAD]Strať 1 Sanity[] a [#GOOD]získaj túto Clue.[]
13.sea.fail.info=[#BAD]Skaza postúpi o 1.[]

14.sea.flavor=V zatopenom podpalubí výskumnej lode ležia dva zapečatené kufre. Skúmaš posúvajúce sa trámy a spletené lanoví a hľadáš cestu, ktorá zostane otvorená, aj keď sa vlny opäť vzdujú.
14.sea.pass.flavor=Prenesieš oba kufre cez otvor. Jeden obsahuje pozorovania expedície, druhý vzorky, vďaka ktorým sa ani jej najneuveriteľnejšie tvrdenia nedajú len tak odbiť.
14.sea.fail.flavor=Vlnobitie ťa vrhne medzi trosky a uzavrie otvor nad tebou. Prebojuješ sa von, dobitý a lapajúci po dychu, a temnota podpalubia ti stále ťaží za očami.
14.sea.info=
14.sea.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
14.sea.fail.info=[#BAD]Strať 2 Health a 2 Sanity.[]

15.sea.flavor=Záchranný zvon vystúpi na hladinu so zapečatenou bronzovou nádobou zachytenou pod ním. Keď posádka otvorí veko, rozvinie sa z nej hadia bytosť, vychrlí zo seba zúrivý príval slov a potom zaútočí.
15.sea.pass.flavor=Udržíš myšlienky dosť pokojné na to, aby si jej slovám rozumel. Vo svojom hneve prezradí meno kráľovstva, z ktorého ju vyhnali.
15.sea.fail.flavor=Počas zápasu ťa jej tesáky zasiahnu. Horúčava, ktorá sa šíri okolo rany, ti prezradí, čo po sebe uhryznutie zanechalo.
15.sea.pass.flavor.2=Keď zápas skončí, jej tesáky ťa nezasiahli. Unikol si jedu tej bytosti.
15.sea.pass.info.2=
15.sea.fail.flavor.2=Slová bytosti sa ti v hlave rozplynú v ohlušujúcom reve. Nezapamätáš si nič z dejín ukrytých v jej výbuchu.
15.sea.fail.info.2=
15.sea.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
15.sea.pass.info=[#GOOD]Získaj túto Clue.[]
15.sea.fail.info=[#BAD]Získaj Otravu.[]

16.sea.flavor=Po polnoci sa nad vodou nesie pieseň. S každým tónom sa zábradlie zdá bližšie a paluba menej skutočná. Vzpieraš sa tomu ťahu a snažíš sa udržať loď vo svojich myšlienkach.
16.sea.pass.flavor=Pieseň stratí nad tebou moc. V tichu, ktoré nasleduje, si všimneš, že jej rytmus opakujú zárezy pod zábradlím, ktoré spájajú volanie s niekým, kto už je na palube.
16.sea.fail.flavor=Vrhneš sa k vode, no posádka ťa v poslednej chvíli zachytí. Pri záchrane ti však chrbát narazí o zábradlie a sotva sa dokážeš vystrieť.
16.sea.info=
16.sea.pass.info=[#GOOD]Získaj túto Clue.[]
16.sea.fail.info=[#BAD]Získaj Zranený chrbát.[]

17.sea.flavor=Rádio zachytí núdzové volanie lode, ktorá sa potopila pred storočím. Pod šumom iný hlas pomalým syčaním udáva smer. Prehľadávaš signál a hľadáš detail, ktorý by prezradil jeho zdroj.
17.sea.pass.flavor=Pod starobylou správou rozoznáš modernú volaciu značku. Vysielanie je len maska, za ktorou sa skrývajú rozkazy pre loď vezúcu zásoby Yigovým nasledovníkom.
17.sea.fail.flavor=Signál pokračuje, aj keď si zložíš slúchadlá. Jeho pokyny sa stáčajú do vnútrozemia a prízračné hlasy ti nedovolia oddeliť od šumu nijaký užitočný smer.
17.sea.info=
17.sea.pass.info=[#GOOD]Získaj túto Clue.[]
17.sea.fail.info=[#BAD]Získaj Halucinácie a presuň túto Clue na najbližšie miesto expedície.[]

18.sea.flavor=Skrytý mechanizmus pod palubou bije v rytme vzdialených otrasov, ktoré sa šíria trupom. Každý úder vyšle do vody slabé zelené svetlo. Skúmaš jeho pohyblivé súčasti a hľadáš spôsob, ako signál prerušiť.
18.sea.pass.flavor=Nájdeš kolík, ktorý spája oba rytmy, a vytiahneš ho. Zelené svetlo zhasne a hlboko pod loďou odpovedajúce otrasy stratia krok.
18.sea.fail.flavor=Rytmus sa prispôsobí tvojmu pulzu. Cúvaš, no cítiš, ako ťa sleduje celou loďou, akoby ťa čosi tam dole už dokázalo rozlíšiť od ostatných.
18.sea.info=
18.sea.pass.info=[#GOOD]Skaza ustúpi o 1.[]
18.sea.fail.info=[#BAD]Strať 1 Sanity a získaj Paranoju.[]

19.sea.flavor=Pod čiaru ponoru klesá chodba, ktorá v plánoch lode chýba. Na jej vzdialenom konci svietia nad tichým čiernym morom neznáme hviezdy. Skúmaš prah a hľadáš náznak toho, kto ho vytvoril.
19.sea.pass.flavor=Drobné nábožné znaky prezrádzajú, že jeho tvorcovia sa Yiga boja, namiesto toho, aby mu slúžili. Ich skrytá cesta vysvetľuje, ako utečenci preplávali moria bez toho, aby sa objavili v akomkoľvek prístave.
19.sea.fail.flavor=Pri skúmaní rámu zájdeš príliš ďaleko. Chodba za tebou sa zmení na ďalší pás čiernej vody a pod cudzími hviezdami niet po lodi ani pamiatky.
19.sea.info=
19.sea.pass.info=[#GOOD]Získaj túto Clue.[]
19.sea.fail.info=[#BAD]Získaj stav Stratený v čase a priestore.[]

20.sea.flavor=O trup narazí unášaný záchranný čln so zapečateným zápisníkom a bez akejkoľvek viditeľnej posádky. Dosky pod lavicami potichu škrabú. Spustíš sa doň a hľadáš zdroj toho zvuku.
20.sea.pass.flavor=Pod lavicou zbadáš kobru a zápisník zdvihneš z opačnej strany. Jeho záznamy mapujú cestu člna z ostrovnej Yigovej svätyne.
20.sea.fail.flavor=Siahneš pod lavicu skôr, než uvidíš stočený tvar. Kobra prudko zaútočí a bolesť vystrieda plíživá necitlivosť, kým sa šplháš späť na palubu.
20.sea.info=
20.sea.pass.info=[#GOOD]Získaj túto Clue.[]
20.sea.fail.info=[#BAD]Strať 1 Health a získaj Otravu.[]

21.sea.flavor=Úzka trhlina vedie do trezoru vraku. Vnútri sa pohybuje reťaz v rytme, ktorý sa nepodobá vlnám. Opatrne pozoruješ otvor, kým siahneš po dokumentoch za ním.
21.sea.pass.flavor=Reťaz sa posúva okolo obrovského spiaceho hada. Dokumenty vytiahneš druhým otvorom a zistíš z nich, kam mal byť had dopravený, aj meno toho, kto prepravu objednal.
21.sea.fail.flavor=Tvar vedľa reťaze sa ti ovinie okolo hrude. Vytrhneš sa z trhliny, no každý ďalší nádych prináša hlbokú, mučivú bolesť.
21.sea.info=
21.sea.pass.info=[#GOOD]Získaj túto Clue.[]
21.sea.fail.info=[#BAD]Strať 2 Health a získaj Vnútorné zranenie.[]

22.sea.flavor=Zarámované fotografie na lodi ukazujú zakaždým, keď okolo nich prejdeš, inú posádku. Zložíš ich a porovnávaš v pokojnom svetle lampy, hľadajúc detail, ktorý pretrvá každú zmenu.
22.sea.pass.flavor=Každá verzia zachytáva ten istý malý mešec pri kapitánovom kresle. Vnútri, obklopené zvlečenými hadími kožami, leží napísané zaklínadlo, ktoré spôsobuje meniace sa obrazy.
22.sea.fail.flavor=Tváre sa menia, až si nedokážeš spomenúť na posádku, s ktorou si sa nalodil. Aj ďaleko od fotografií sa ti na okraji zorného poľa zjavujú neznámi ľudia.
22.sea.info=
22.sea.pass.info=[#GOOD]Získaj túto Clue.[]
22.sea.fail.info=[#BAD]Strať 2 Sanity a získaj Halucinácie.[]

23.sea.flavor=V podpalubí držia unaveného pútnika s amuletom, ktorého sa posádka odmieta dotknúť. Tvrdí, že dokáže odvrátiť Yigovu pozornosť. Žiadaš kapitána o povolenie s ním hovoriť.
23.sea.pass.flavor=Kapitán povolí. Pútnik ti ukáže, ako amulet vznikol, a ponúkne ti jeho vzor na štúdium alebo jeho ochranu, ak by ťa niekedy postihla Yigova kliatba.
23.sea.fail.flavor=Kapitán odmietne a námorník ťa od poklopu odoženie rúčkou lodného háku. Pútnikovo vysvetlenie zanikne v pokrikovaní rozkazov.
23.sea.option.1.flavor=Necháš pútnika obrátiť amulet k tebe. Jeho povrch sa zakalí, potom vyjasní a ťarcha Yigovej pozornosti konečne opadne.
23.sea.option.1.info=[#GOOD]Odhoď svoj stav Prekliatie.[]
23.sea.option.2.flavor=Odkreslíš vzor amuletu a zapíšeš si pútnikovo rozprávanie o jeho tvorcoch. Spolu ti ponúkajú nový pohľad na nepriateľov hadieho kultu.
23.sea.option.2.info=[#GOOD]Získaj túto Clue.[]
23.sea.info=
23.sea.pass.info=[#GOOD]Získaj túto Clue alebo odhoď svoj stav Prekliatie.[]
