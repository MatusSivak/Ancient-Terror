24.sea.flavor=Kamenní strážcovia ostrova sa pri tvojom príchode rozpuknú a vypustia tvory, ktoré za svojimi šupinami vlečú zvyšky rúch. Bojuješ, aby si sa dostal k nápisu, ktorý tu mali strážiť.
24.sea.pass.flavor=Prebiješ sa k nápisu a porovnáš ho s tvormi okolo seba. V kameni sú zaznamenané ich niekdajšie mená aj príčina ich premeny.
24.sea.fail.flavor=Strážcovia ťa zatlačia do tieňa nápisu. Telom i mysľou ti prebehne zmena; nacvičené pohyby sú odrazu nemotorné a ťažko nadobudnuté vedomosti sa ti vytrácajú z pamäti.
