# Keep English glyph keywords (Clue, Health, Will, etc.) in rules; translate surrounding prose.
# Pôvodný príbeh; mechaniky overené podľa https://eldritchhorror.fandom.com/wiki/Yig dňa 2026-10-24.
# Úvodné pokyny neprezrádzajú výsledky testu; po teste sa zobrazí iba vyriešená vetva.
# Príbeh a pravidlá sú oddelené. Prázdne info výsledku znamená žiadny ďalší mechanický efekt.
1.city.flavor=V zatvorenej kancelárii dovozcu nájdeš účtovnú knihu previazanú pásom hadej kože. Niekto z nej vytrhal údaje o cieľoch zásielok a útržky ukryl medzi stovkami bežných faktúr.
1.city.pass.flavor=Pod podložkou na písacom stole nájdeš chýbajúce záznamy. Všetky zásielky putujú tou istou cestou do vnútrozemia a každý príjemca namiesto podpisu kreslí polmesiac.
1.city.fail.flavor=Na poslednej strane je zaznamenaný tvoj príchod, a to už niekoľko týždňov vopred. Ten objav tebou otrasie natoľko, že stratíš stopu. Ďalšia zásielka už medzitým smeruje do divočiny.
1.city.info=
1.city.pass.info=[#GOOD]Získaj túto Clue.[]
1.city.fail.info=[#BAD]Strať 1 Sanity a presuň túto Clue na najbližšie miesto expedície.[]

2.city.flavor=Muž na opačnom konci kaviarne ani nepohne perami, no v hlave počuješ jeho hlas. Do najmenších podrobností opisuje tvoje detstvo a potom ti začne meniť spomienky. Zúfalo sa snažíš uchovať si to, čo si naozaj prežil.
2.city.pass.flavor=Vytlačíš votrelca zo svojej mysle. Na okamih však nazrieš aj ty do tej jeho: uvidíš tunely pod mestom obložené dlaždicami a dvere označené stočeným hadom.
2.city.fail.flavor=Hlas zmĺkne, no cudzie spomienky ti zostanú v hlave. Zrazu si pamätáš aj na druhú rodinu, ktorá na teba čaká v dome, do ktorého okien nikdy nepreniklo denné svetlo.
2.city.info=
2.city.pass.info=[#GOOD]Získaj túto Clue.[]
2.city.fail.info=[#BAD]Získaj Halucinácie.[]

3.city.flavor=Zberateľ odomkne vitrínu s relikviami zo zničenej svätyne. Zamat, na ktorom ležia, je posiaty drobnými šupinami. Kým ide po lampu, prezeráš si úzke medzery medzi policami.
3.city.pass.flavor=Hada zbadáš skôr, než zaútočí. Pod jeho stočeným telom leží nový prepravný štítok. Adresa na ňom dokazuje, že údajne prastará zbierka sem prišla odniekiaľ z mesta.
3.city.fail.flavor=Zamat sa ti pod rukou pohne. Pocítiš dve ostré bodnutia a ruka ti začne opúchať. Zberateľ zabuchne dvere skôr, než stihneš zavolať o pomoc.
3.city.info=
3.city.pass.info=[#GOOD]Získaj túto Clue.[]
3.city.fail.info=[#BAD]Strať 1 Health a získaj Otravu.[]

4.city.flavor=Tvoj informátor na dohodnuté stretnutie nepríde. Namiesto neho z uličky vykročí postava v jeho kabáte. V jednej ruke drží zakrivenú čepeľ, v druhej napchatú brašnu.
4.city.pass.flavor=Keď útočníka premôžeš, získaš brašnu. Vnútri sú zašifrované adresy a fotografia tvojho informátora stojaceho pri hadom oltári.
4.city.fail.flavor=Útočník prekĺzne bránou do dvora skôr, než mu stihneš vziať brašnu. Keď sa za ním dostaneš na druhú ulicu, všetky vchody sú už zatvorené.
4.city.info=[#BAD]Prepadne ťa Kultista.[]
4.city.pass.info=[#GOOD]Získaj túto Clue.[]
4.city.fail.info=

5.city.flavor=Železničný nosič odmieta hovoriť o debnách, z ktorých sa v nákladnej hale ozývalo syčanie. Vedľa neho stojí zbalený kufor. Než odíde, musíš ho presvedčiť, že mlčanie ho neochráni.
5.city.pass.flavor=Rozloží nákladný list, ktorý sa bál zničiť. Odosielatelia uviedli falošné mená, no nosič si pamätá, kto za prepravu zaplatil a z ktorého nástupišťa debny odviezli.
5.city.fail.flavor=Povie ti číslo nástupišťa a náhlivo odíde. Keď tam dorazíš, zistíš, že ťa oklamal. Vlak s nákladom, po ktorom pátraš, už odišiel k odľahlým vykopávkam.
5.city.info=
5.city.pass.info=[#GOOD]Získaj túto Clue.[]
5.city.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]

6.city.flavor=Za kaplnkou so zabednenými oknami ťa jej strážca učí ochranné zaklínadlo. Slová treba vyslovovať v rytme dychu, no každá relikvia, ktorú máš pri sebe, prebúdza v stenách ďalší rušivý hlas. Snažíš sa zachovať správny rytmus a nevšímať si šepot.
6.city.pass.flavor=Posledná slabika doznie a nastane ticho. Prvý raz po niekoľkých dňoch sa tvoj tieň pohybuje presne tak ako ty. Strážca sa ukloní: ochranné zaklínadlo začalo účinkovať.
6.city.fail.flavor=Necháš sa pomýliť cudzím hlasom. Slová ti zovrú hrdlo a od bolesti sa zohneš. Telom sa ti šíri jed z rán, ktoré nedokážeš nájsť.
6.city.info=
6.city.pass.info=[#GOOD]Získaj Požehnanie.[]
6.city.fail.info=[#BAD]Strať 2 Health a získaj Otravu.[]

7.city.flavor=V pivnici domu určeného na zbúranie sa spod zapečateného poklopu ozve hlas. Vie, ako Yig označuje svoje obete, a ponúka ti toto poznanie. Na oplátku žiada, aby si sa mu navždy zaviazal.
7.city.pass.flavor=Keď vyslovíš sľub, spod poklopu sa ozve pomalé škrabanie. Škárou sa vysunie nákres. Vysvetľuje, ako pôsobí Yigovo znamenie a ako sa dá oslabiť jeho moc.
7.city.fail.flavor=Dohodu neuzavriete. Hlas pod podlahou zmĺkne a jeho tajomstvá zostanú neodhalené. Odchádzaš skôr, než si nájde ďalší dôvod privolať ťa späť.
7.city.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
7.city.fail.info=
7.city.info=Môžeš [#BAD]získať Temný pakt[], aby si [#GOOD]získal túto Clue a jeden vyšetrovateľ mohol odhodiť Prekliatie.[]

8.city.flavor=V trezore zabudnutého spolku objavíš zbraň ovinutú skleneným hadom. Po jej vitríne sa špirálovito vinie nápis, ktorého začiatok nevieš nájsť. Snažíš sa v ňom rozpoznať útržky obradného jazyka, ktoré si pamätáš.
8.city.pass.flavor=Nápis obsahuje príkaz pre strážcu. Vyslovíš zaklínadlo a sklenený had sa odvinie zo zbrane. Pod ním objavíš aj záznam o vojnách, pre ktoré ju vytvorili.
8.city.fail.flavor=Písmená sa ti v mysli stále preskupujú. Na jazyku cítiš chuť jedu a kútikom oka vidíš, ako sklenený had dvíha hlavu. Zakaždým, keď sa naň pozrieš priamo, je však nehybný.
8.city.info=
8.city.pass.info=[#GOOD]Získaj túto Clue a artefakt typu Zbraň.[]
8.city.fail.info=[#BAD]Strať 2 Sanity a získaj Otravu.[]

9.city.flavor=Spod javiska opusteného divadla presvitá svetlo. Zostúpiš do miestnosti plnej odhodených masiek. Posledný účastník tajného zasväcovacieho obradu sa otočí k tebe a čosi pod jeho golierom ustavične mení tvar.
9.city.pass.flavor=Zasvätenec padne a listy s pokynmi sa rozsypú po podlahe. Keď si ich prečítaš, začneš chápať zmysel obradu. Z nepochopiteľnej hrôzy sa stane niečo, čo dokážeš skúmať a čomu môžeš vzdorovať.
9.city.fail.flavor=Zasvätenec ustúpi za kulisy a zatarasí dvere do pivnice. Počuješ, ako na druhej strane zbiera papiere, a potom kroky miznúce pod javiskom.
9.city.info=[#BAD]Prepadne ťa Kultista.[]
9.city.pass.info=[#GOOD]Získaj túto Clue a zlepši Will.[]
9.city.fail.info=

10.city.flavor=Izbu mŕtveho kuriéra už niekto prehľadal. Rozmiestnenie dierok po špendlíkoch na stene však naznačuje, že v nej zostala skrytá správa. Prehrabávaš sa troskami, zatiaľ čo sa nad stolom prehýba popraskaný strop.
10.city.pass.flavor=Pod kobercom nájdeš plán ulíc. Keď ho priložíš k dierkam na stene, odhalíš miesto tajných stretnutí aj cestu, ktorou tam prichádzajú poslovia kultu.
10.city.fail.flavor=Pri odťahovaní stola na seba strhneš časť stropu. Trám ti privalí nohu. Vyslobodíš sa len tesne predtým, než sa zrúti zvyšok miestnosti.
10.city.info=
10.city.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
10.city.fail.info=[#BAD]Strať 1 Health a získaj Zranenú nohu.[]

11.city.flavor=Ukradnutý rukopis opisuje znamenia Yigovho návratu. Atrament na stránkach je stále mokrý. Pokúšaš sa prečítať záverečné vzývanie, no pod prstami ti pribúdajú ďalšie slová.
11.city.pass.flavor=Pochopíš, že posledná veta je varovaním, nie výzvou na príchod. Rozlúštiš jej dva skryté významy a zistíš, kde sa kult zíde a čo chce prebudiť.
11.city.fail.flavor=Čítaním nahlas nechtiac dokončíš vzývanie. Cez stránku na teba upriami pozornosť čosi nesmierne. Máš strašnú voľbu: prijať jeho znamenie alebo nechať jeho volanie šíriť sa ďalej.
11.city.option.1.flavor=Prijmeš znamenie. Mokrý atrament sa ti vpije do kože a hlasy, ktoré spoza stien odpovedali na vzývanie, stíchnu.
11.city.option.1.info=
11.city.option.2.flavor=Znamenie nezíska nového nositeľa. Slová vzývania uniknú otvoreným oknom a neviditeľné hlasy ich začnú opakovať po celom meste.
11.city.option.2.info=[#BAD]Skaza postúpi o 1.[]
11.city.info=
11.city.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
11.city.fail.info=[#BAD]Skaza postúpi o 1, pokiaľ nezískaš Prekliatie.[]

12.city.flavor=Na dlažbe za preplneným trhom nájdeš čerstvo zvlečené hadie šupiny. So zrakom upretým na zem sleduješ stopu pomedzi zatvárajúce sa stánky. Nad hlavou ti pritom búchajú okenice.
12.city.pass.flavor=Prvú stopu križuje ďalšia: úlomky nápadnej zelenej pečate. Vedú k zásielkovému obchodu. V knihe odoslaných balíkov nájdeš meno chovateľa hadov.
12.city.fail.flavor=Tak sústredene skúmaš dlažbu, že si nevšimneš prútený kôš spúšťaný z okna. Veko sa otvorí tesne pri tvojom pleci a čosi studené ťa uhryzne do krku.
12.city.info=
12.city.pass.info=[#GOOD]Získaj túto Clue.[]
12.city.fail.info=[#BAD]Získaj Otravu.[]

13.city.flavor=Električka, ktorou cestuješ, prejde okolo tvojej zastávky bez spomalenia. Všetci cestujúci sa naraz otočia k tebe. Ich oči odrážajú svetlo lámp ako vyleštené šupiny. Premôžeš nutkanie utiecť a ďalej ich pozoruješ.
13.city.pass.flavor=Tváre cestujúcich opäť nadobudnú bežný výraz. Videl si však dosť: každý z nich má pod manžetou alebo golierom ukryté rovnaké malé znamenie polmesiaca.
13.city.fail.flavor=Na ďalšej zastávke sa vypotácaš von v presvedčení, že cestujúci idú za tebou. Po zvyšok noci máš pocit, že každý okoloidúci k tebe otočí tvár ešte skôr, než sa naňho pozrieš.
13.city.info=
13.city.pass.info=[#GOOD]Získaj túto Clue.[]
13.city.fail.info=[#BAD]Strať 2 Sanity a získaj Paranoju.[]

14.city.flavor=Utekajúci informátor hodí balíček do diery v podlahe schátraného činžiaku. Pod ňou sa nad tmavou priepasťou držia zvyšky schodiska. Skúmaš jeho podpery a hľadáš bezpečnú cestu nadol.
14.city.pass.flavor=Spustíš sa popri pevnej stene a zdvihneš balíček. Na voskovej pečati je Yigov polmesiac. Papiere vnútri zaznamenávajú platby niekoľkým váženým rodinám.
14.city.fail.flavor=Keď prenesieš váhu na schodisko, jedna z podpier povolí. Zle dopadneš na schod pod sebou a hore sa už dokážeš len vyplaziť. Balíček zostane kdesi v tme.
14.city.info=
14.city.pass.info=[#GOOD]Získaj túto Clue.[]
14.city.fail.info=[#BAD]Získaj Zranenú nohu.[]

15.city.flavor=Úradník ťa zavedie do komnaty, kde mosadzný had opakuje každé vyslovené slovo. Uvedomíš si, ako obrátiť kúzlo proti jeho pánovi. Musel by si mu však obetovať časť svojich ťažko nadobudnutých schopností.
15.city.pass.flavor=Obetuješ kúzlu časť svojich schopností. Had vysloví zaklínadlo, ktoré dokáže zrušiť Yigovo znamenie. Potom mu praskne čeľusť.
15.city.fail.flavor=Mosadzný had pokračuje v hlásení. Skôr než stihneš odísť, úradník sa vráti s dvojicou strážnikov a so zatykačom, na ktorom už stojí tvoje meno.
15.city.pass.info=[#GOOD]Jeden vyšetrovateľ môže odhodiť Prekliatie.[]
15.city.fail.info=[#BAD]Získaj Zadržanie.[]
15.city.info=Môžeš [#BAD]minúť 1 žetón zlepšenia[], aby [#GOOD]jeden vyšetrovateľ mohol odhodiť Prekliatie.[] Inak [#BAD]získaj Zadržanie.[]

16.city.flavor=Tvoj spoločník ťa pozve do honosného mestského domu. Pripomenie ti tajomstvo, ktoré si nezveril nikomu inému. Vtom sa jeho známa tvár odchlípi ako maska a odhalí tvora, ktorý celý čas cestoval po tvojom boku.
16.city.pass.flavor=Prinútiš podvodníka vzdať sa. Hoci sa vykrúca, prezradí meno rodiny, ktorá mu pomohla získať ľudskú podobu.
16.city.fail.flavor=Tvor vyriekne tvoje najtajnejšie obavy ako slová kliatby. S každým odhaleným tajomstvom sa neviditeľné putá okolo teba sťahujú pevnejšie.
16.city.pass.flavor.2=Držíš sa spomienok na svojho skutočného spoločníka. Podvodník síce pozná vaše tajomstvá, ale jeho šepkaná kliatba nad tebou nezíska moc.
16.city.pass.info.2=
16.city.fail.flavor.2=Podvodník unikne skôr, než ho prinútiš hovoriť. Pri nohách ti zostane jeho odhodená ľudská tvár a s ňou samé nezodpovedané otázky.
16.city.fail.info.2=
16.city.info=[#BAD]Odhoď 1 vybavenie Spojenec. Potom ťa prepadnú Hadí ľudia.[]
16.city.pass.info=[#GOOD]Získaj túto Clue.[]
16.city.fail.info=[#BAD]Získaj Prekliatie.[]

17.city.flavor=Kníhkupec rozbalí knihu, s ktorou si neporadil žiadny z najatých prekladateľov. Písmená sa pri každom otočení stránky preskupia. Snažíš sa odhaliť jazykové pravidlá skryté za týmto pohybom.
17.city.pass.flavor=Zistíš, že samotný text je návodom, ako ho čítať. Keď pochopíš prvý riadok, začne dávať zmysel aj zvyšok. Kníhkupec sa zlovestnej knihy s úľavou zbaví a prenechá ti ju.
17.city.fail.flavor=Pomýliš si príkaz s nadpisom a prečítaš ho nahlas. Písmená sa prestanú hýbať, no na obálke sa objaví nový riadok: tvoje meno, napísané ako venovanie.
17.city.info=
17.city.pass.info=[#GOOD]Získaj artefakt typu Kniha.[]
17.city.fail.info=[#BAD]Získaj Prekliatie.[]

18.city.flavor=Svedkove poznámky do najmenších podrobností opisujú skryté sídlo hadích ľudí. Vložíš si ich do vrecka, zatiaľ čo svedok zamyká dvere vypočúvacej miestnosti. Ústa sa mu roztiahnu do neprirodzene širokého úsmevu.
18.city.pass.flavor=Počas zápasu sa dokážeš vyhnúť tvorovým jedovým zubom. Keď sa boj skončí, poznámky máš stále pri sebe a jed ti do krvi neprenikol.
18.city.pass.info=
18.city.fail.flavor=Uhryznutie neznesiteľne páli. Poznámky síce zostali v bezpečí, no tvorov jed ti už prúdi v krvi.
18.city.info=[#GOOD]Získaj túto Clue.[] Potom [#BAD]ťa prepadnú Hadí ľudia.[]
18.city.fail.info=[#BAD]Získaj Otravu.[]

19.city.flavor=V mestskom archíve nájdeš niekoľko nedávnych úmrtí zaznamenaných na tej istej, dávno neplatnej adrese. Vnikneš do zamknutej registratúry, aby si preskúmal pôvodné dokumenty. Za dverami sa ozývajú kroky.
19.city.pass.flavor=Všetky originály nesú podpis lekára, ktorý zomrel pred desaťročiami. Opíšeš si jeho adresu a mená ľudí, ktorí sa zaňho zaručili.
19.city.fail.flavor=Kroky sa zastavia pred dverami. Sotva vrátiš zložku na miesto, vstúpi strážnik a žiada vysvetlenie, prečo je zámok vylomený.
19.city.info=
19.city.pass.info=[#GOOD]Získaj túto Clue.[]
19.city.fail.info=[#BAD]Získaj Zadržanie.[]

20.city.flavor=Lekár ponúka liečbu otravy hadím jedom, no na fľaštičkách s liekmi má pečate starého zotročujúceho obradu. Kým si uvedomíš ich význam, lekár zmizne. Prehľadávaš ordináciu a hľadáš dôkazy o tom, čomu sa v skutočnosti venuje.
20.city.pass.flavor=Za falošným čelom zásuvky nájdeš rozpis návštev písaný iným rukopisom. Pacienti sú rozdelení podľa štádia premeny. Miesto ďalšieho stretnutia je jasne vyznačené.
20.city.fail.flavor=V každej zásuvke nájdeš len bežné lekárske záznamy. Nech sa tu dialo čokoľvek, lekár zahladil stopy tak dôkladne, že mu nič nedokážeš.
20.city.info=Ak máš Otravu, [#BAD]získaj Prekliatie.[]
20.city.pass.info=[#GOOD]Získaj túto Clue.[]
20.city.fail.info=

21.city.flavor=V zamknutom fotografickom ateliéri objavíš portréty tej istej rodiny z obdobia troch storočí. Dátumy predsa nemôžu byť správne. Skúmaš tváre a nútiš sa pozerať znova, aj keď sa ti z pamäti vytráca, koho ti pripomínajú.
21.city.pass.flavor=Na portrétoch každej generácie nájdeš tú istú tvár s rovnakou jazvou, zakaždým pod iným menom. Fotografie odhaľujú tvora, ktorý celé stáročia žije medzi ľuďmi pod rôznymi identitami.
21.city.fail.flavor=Na najstaršej fotografii spoznáš sám seba. Od tej chvíle dátumy ani tváre nezodpovedajú tvojim spomienkam. Dokonca aj miestnosť okolo teba akoby patrila do cudzieho života.
21.city.info=Môžeš [#BAD]minúť 2 Sanity[] a prehodiť až 2 kocky.
21.city.pass.info=[#GOOD]Získaj túto Clue.[]
21.city.fail.info=[#BAD]Získaj Amnéziu, Halucinácie a Paranoju.[]

22.city.flavor=V zadnej časti súkromnej kliniky nájdeš miestnosť plnú spiacich ľudí. Všetci mrmlú to isté meno. Ich strážca sa odvráti od postele a siahne po kľúči na krku. Ľudské črty sa mu pritom začnú rozplývať.
22.city.pass.flavor=Premôžeš strážcu a prinútiš ho vysvetliť znamenia na telách spiacich. Prezradí ti skutočný účel kliniky aj obrad, ktorým sa dá zlomiť Yigova kliatba.
22.city.fail.flavor=Strážca ťa vytlačí z kliniky a uzavrie oddelenie. Mrmlanie spiacich počuješ až na ulicu, no už nerozoznáš ani jediné slovo.
22.city.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
22.city.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
22.city.fail.info=

23.city.flavor=Kuriér zviera zapečatenú správu, no rana spôsobená pri obrade ho pomaly oberá o sily. Jeho prenasledovateľ už opúšťa mesto. Môžeš na seba preniesť časť kuriérovho zranenia a udržať ho pri vedomí, aby ti ešte stihol niečo povedať.
23.city.pass.flavor=Telom ti prešľahne bolesť a kuriérovi sa uľaví. Zlomí pečať a povie ti, kto ho so správou vyslal a kam má podľa nej ísť.
23.city.fail.flavor=Kuriér ti už nič nepovie. Poslednou nádejou je jeho prenasledovateľ, ktorý smeruje k vzdialenému táboru expedície.
23.city.pass.info=[#GOOD]Získaj túto Clue.[]
23.city.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]
23.city.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]presuň túto Clue na najbližšie miesto expedície.[]

24.city.flavor=V opustenej továrni bliká zelená lampa v rytme, ktorý poznáš zo stretnutí kultu. Kráčaš pomedzi stíchnuté stroje a hľadáš človeka, ktorý dáva z lávky svetelné signály.
24.city.pass.flavor=Zbadáš muža na lávke, ako siaha po páke, a včas zastaneš pred strojom pod ním. Keď ho zaženieš do kúta, prezradí ti, komu signalizoval, a potom utečie na dvor.
24.city.fail.flavor=Lampa bola návnada. Dopravník sa pod tebou prudko rozbehne a pritlačí ti nohu k hrdzavej vodiacej lište. S námahou sa vytrhneš z jeho zovretia.
24.city.info=
24.city.pass.info=[#GOOD]Získaj túto Clue.[]
24.city.fail.info=[#BAD]Strať 2 Health a získaj Zranenú nohu.[]

1.wilderness.flavor=Vchod do komory pod ruinami blokuje kamenná doska. Na jej vnútornom okraji vidíš staré ryhy po pazúroch. Zaprieš sa a snažíš sa dosku nadvihnúť natoľko, aby si dosiahol dovnútra.
1.wilderness.pass.flavor=Podarí sa ti dosku dostatočne nadvihnúť. V komore objavíš dve vrstvy rytín: staršie zachytávajú sídlo hadích ľudí, novšie ich návrat po dlhých vekoch neprítomnosti.
1.wilderness.fail.flavor=Pri zdvíhaní sa ti doska vyšmykne a zrazí ťa na kamenné schody. Chrbtom ti prejde ostrá bolesť, ktorá ti znemožní ďalší pokus.
1.wilderness.info=
1.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
1.wilderness.fail.info=[#BAD]Strať 2 Health a získaj Zranený chrbát.[]

2.wilderness.flavor=Na svätyni pri ceste sú pod poškodeným reliéfom stočeného hada vyryté mená. Nápis s obradnými pokynmi niekto odsekal. Z úlomkov roztrúsených v tráve sa snažíš poskladať zachované znaky.
2.wilderness.pass.flavor=Z úlomkov zistíš, ako sa zbaviť Yigovho znamenia. Druhý nápis hovorí o ľude, ktorý zachoval tento obrad aj po zániku svojej osady.
2.wilderness.fail.flavor=Úlomky poskladáš nesprávne: namiesto ochranného zaklínadla vytvoríš vzývanie. Kameň sa pokryje jedom a na rukách ti v miestach dotyku naskočia pľuzgiere.
2.wilderness.info=
2.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
2.wilderness.fail.info=[#BAD]Strať 2 Health a získaj Otravu.[]

3.wilderness.flavor=V opustenej zememeračskej stanici nájdeš podrobnú správu o neďalekých ruinách hadích ľudí. Posledný záznam opisuje čiernu guľu ukrytú pod koreňmi. Vydáš sa podľa náčrtu a dávaš pozor na pasce, pred ktorými varoval jej objaviteľ.
3.wilderness.pass.flavor=Všimneš si tenký drôt miznúci v spleti koreňov. Prekročíš ho a vytiahneš guľu z jej úkrytu. Nech ju otáčaš akokoľvek, do jej stredu neprenikne ani lúč svetla.
3.wilderness.fail.flavor=Rukávom zachytíš skrytú niť. Guľa pod koreňmi sa otočí k tebe a čosi v jej temnote si vtisne tvoju tvár do pamäti skôr, než stihneš ustúpiť.
3.wilderness.info=[#GOOD]Získaj túto Clue.[]
3.wilderness.pass.info=[#GOOD]Získaj artefakt „Cursed Sphere“.[]
3.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

4.wilderness.flavor=Chodník sa ti prepadne pod nohami a otvorí sa pod tebou roklina, ktorej steny zdobia vytesané hady. Zachytíš sa koreňa. Výstroj ťa ťahá nadol, no snažíš sa vytiahnuť na rímsu s čerstvými stopami.
4.wilderness.pass.flavor=Vytiahneš sa na rímsu. Vedľa stôp objavíš nedávno otvorenú skrýšu. Ukrýva opis cesty, ktorou sem prichádzajú ľudia starajúci sa o prastaré rytiny.
4.wilderness.fail.flavor=Koreň sa vytrhne a ty dopadneš na svah pod sebou. Kým sa prestaneš šmýkať, časť vybavenia sa ti skotúľa z dosahu.
4.wilderness.info=
4.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
4.wilderness.fail.info=[#BAD]Strať 1 Health a odhoď 2 majetky typu Predmet.[]

5.wilderness.flavor=Zememeračské kolíky lemujú čistinu, na ktorej sa tráva vlní proti smeru vetra. V priehlbine sa hemžia hady a zakrývajú to, čo zememerači vyznačili. Hľadáš miesto, odkiaľ by si pomedzi ich telá dovidel na značky.
5.wilderness.pass.flavor=Pri pohľade zo správneho uhla v kolíkoch rozpoznáš mapu. Na ich zakopaných častiach nájdeš ďalšie značky. Udávajú, kedy sa tu hady zhromažďujú a kam potom odchádzajú.
5.wilderness.fail.flavor=Vlniaca sa tráva zakrýva všetky dôležité značky. Obídeš celú čistinu, no rozmiestnenie kolíkov ti stále nedáva zmysel.
5.wilderness.info=Na mieste expedície [#BAD]získaj Otravu.[]
5.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
5.wilderness.fail.info=

6.wilderness.flavor=Okolo oltára rozpáleného podzemným ohňom sa zhromaždili pútnici. Vraj sa pri ňom zjaví videnie každému, kto vydrží žiar. Za oltárom sa po holom kameni plazia tiene.
6.wilderness.pass.flavor=Vstúpiš k oltáru a vydržíš spaľujúcu horúčavu. V chvejúcom sa vzduchu uzrieš Yigovo znamenie aj gesto, ktorým možno zlomiť jeho moc.
6.wilderness.fail.flavor=Zostaneš mimo kruhu. Pútnici dokončia obrad, no z miesta, kde stojíš, vidíš v horúcom vzduchu iba rozmazané svetlo.
6.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
6.wilderness.fail.info=
6.wilderness.flavor.2=Prebudený boh odpovedá skrze oltár. Po kameňoch šľahá oheň a neušetrí nikoho, kto stojí nablízku.
6.wilderness.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue a jeden vyšetrovateľ mohol odhodiť Prekliatie.[]
6.wilderness.info.2=[#BAD]Strať 2 Health.[]

7.wilderness.flavor=Uprostred opusteného tábora stojí nízky oltár pokrytý čerstvými škrabancami. Skloníš sa k nim. Vtom sa za tebou zdvihne postava, ktorú si považoval za odhodený spacák, a cez zaťaté zuby zasyčí.
7.wilderness.pass.flavor=Aj po zápase sa dokážeš sústrediť na oltár. Škrabance zaznamenávajú obete prinášané na rôznych miestach pozdĺž hadích chodníkov.
7.wilderness.fail.flavor=Jed ti zahmlieva zrak a škrabance sa ti pred očami rozplývajú. Nedokážeš ich prečítať, a tak tajomstvo oltára zostane neodhalené.
7.wilderness.info=[#BAD]Prepadne ťa Kultista.[]
7.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
7.wilderness.fail.info=Máš Otravu a nemôžeš získať túto Clue.

8.wilderness.flavor=Zo zapečatenej nádoby sa ozýva tichý hlas, ktorému nerozumieš. Strážca tvrdí, že ak vdýchneš výpary z jej vnútra, začuješ Yigovo posolstvo. Ak však pozvanie odmietneš, hadí boh si vyžiada obeť.
8.wilderness.pass.flavor=Vdýchneš výpary a hlas zaznie až bolestivo jasne. Spomedzi príkazov rozoznáš mená Yigových služobníkov aj miesta ich stretnutí.
8.wilderness.fail.flavor=Nádoba stmavne skôr, než posolstvu porozumieš. Táborom sa rozľahne syčanie a pátra po tvojich spoločníkoch, ktorých hlasy predtým začulo.
8.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
8.wilderness.fail.info=[#BAD]Odhoď túto Clue a 1 vybavenie Spojenec.[]
8.wilderness.info=Môžeš [#BAD]získať Otravu[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]odhoď túto Clue a 1 vybavenie Spojenec.[]

9.wilderness.flavor=Dažďom premočenú čistinu križujú ľudské stopy a hlboká brázda po hadom tele. Obe končia pri tom istom odkrytom balvane. Skúmaš okolitú zem a snažíš sa zistiť, ako spolu súvisia.
9.wilderness.pass.flavor=Stopy pod skalným previsom zachytávajú postupnú premenu človeka na hada. O niečo ďalej nájdeš staršie stopy, ktoré svedčia o opačnej premene.
9.wilderness.fail.flavor=Dážď rozmyje posledné zreteľné odtlačky skôr, než ich stihneš preskúmať. Odchádzaš bez istoty, ako ľudské stopy súvisia s brázdou po hadom tele.
9.wilderness.flavor.2=Pri odchode prekročíš balvan a spod neho na teba vyrazia ukryté hady. Dostaneš sa z ich dosahu, no na nohách ťa pália čerstvé uhryznutia.
9.wilderness.info=
9.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
9.wilderness.fail.info=
9.wilderness.info.2=[#BAD]Strať 2 Health.[]

10.wilderness.flavor=Za dedinou, ktorej obyvatelia si nikdy neskladajú rukavice, stojí kamenný pamätník. Jeho rytiny sa v blízkosti otrávenej krvi akoby hýbu. Kým tvoji hostitelia pripravujú večerný obrad, pátraš po tom, koho uctievajú.
10.wilderness.pass.flavor=V rukavici zabudnutej pri ohni si všimneš zvlečené šupiny. Vzor na nich sa zhoduje s rytinami na pamätníku. Konečne chápeš spojenie, ktoré pred tebou hostitelia tajili.
10.wilderness.fail.flavor=Dedinčania dokončia prípravy a ani slovom neprezradia nič podozrivé. Za zdvorilými úsmevmi ďalej skrývajú, čo ich spája s pamätníkom.
10.wilderness.info=Ak máš Otravu, [#BAD]Skaza postúpi o 1.[]
10.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
10.wilderness.fail.info=

11.wilderness.flavor=Chodník vedie pomedzi rovnaké kamenné stĺpy. Zakaždým, keď sa obzrieš, pribudne za tebou ďalší. Skúmaš mach aj tiene a hľadáš rozdiel, ktorý by ti pomohol zorientovať sa na meniacej sa ceste.
11.wilderness.pass.flavor=Jeden kameň vrhá tieň smerom k slnku. Vďaka tejto nezrovnalosti objavíš hranicu medzi svetmi: časť chodníka totiž vedie iným svetom.
11.wilderness.fail.flavor=Vykročíš medzerou medzi kameňmi a zrazu sa ocitneš pod holou oblohou bez pôdy pod nohami. Chodník za tebou zmizne. Nezostane ani stopa, podľa ktorej by si našiel cestu domov.
11.wilderness.info=
11.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
11.wilderness.fail.info=[#BAD]Získaj Stratený v čase a priestore.[]

12.wilderness.flavor=Pod koreňmi stromu s vyrytým Yigovým znakom leží denník expedície. Keď sa ich dotkne tvoj tieň, korene sa zovrú. Hľadáš spôsob, ako sa ku knihe dostať bez toho, aby si vyrušil jej strážcu.
12.wilderness.pass.flavor=Pri kmeni nájdeš otvor, no posledné korene dokážeš odtiahnuť iba holou rukou. Ich ostré tŕne nenechávajú pochybnosti: za denník zaplatíš krvou.
12.wilderness.fail.flavor=Strážcu vyrušíš skôr, než dosiahneš na denník. Had vyrytý do kôry otvorí oko. Jeho mrazivý pohľad cítiš na chrbte aj pri odchode od stromu.
12.wilderness.option.1.flavor=Pretlačíš ruku pomedzi tŕne a vytrhneš denník. Na krvou postriekaných stránkach nájdeš správu expedície o skrytom sídle hadích ľudí.
12.wilderness.option.1.info=[#GOOD]Získaj túto Clue.[]
12.wilderness.option.2.flavor=Korene sa okolo knihy zovrú. Strom vycítil tvoj pokus a znamenie z jeho kôry teraz vídaš v každom tieni.
12.wilderness.option.2.info=[#BAD]Získaj Prekliatie.[]
12.wilderness.info=
12.wilderness.pass.info=Môžeš [#BAD]minúť 2 Health[], aby si [#GOOD]získal túto Clue.[] Inak [#BAD]získaj Prekliatie.[]
12.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

13.wilderness.flavor=Ďaleko od cesty začuješ hlas, ktorý vymenúva všetko, čoho sa desíš. Najprv sa ozýva spomedzi stromov, potom z tvojej vlastnej hrude. Snažíš sa sústrediť iba na rytmus svojich krokov.
13.wilderness.pass.flavor=Neodpovieš a hlas napokon zmĺkne. Do lesa sa vrátia bežné zvuky a ty znovu pocítiš pokoj, ktorý si už považoval za stratený.
13.wilderness.fail.flavor=Stačí jediná odpoveď a hlas začne znieť ako niekto, komu dôveruješ. Keď sa zotmie, už aj za priateľským zavolaním hľadáš skrytú hrozbu.
13.wilderness.info=
13.wilderness.pass.info=[#GOOD]Obnov si 2 Sanity.[]
13.wilderness.fail.info=[#BAD]Získaj Paranoju.[]

14.wilderness.flavor=Na rozbitej tabuľke je pod vyobrazením hada zaznamenaná dávna dohoda. Vietor z nej zotrel časť podmienok. Snažíš sa ich doplniť podľa zachovaných viet a znakov na pečati.
14.wilderness.pass.flavor=Chýbajúce riadky opisujú trest za porušenie prísahy. Pochopíš, prečo na opustenej osade spočíva znamenie a čo sa tí, ktorí prežili, snažili zatajiť.
14.wilderness.fail.flavor=Doplníš nesprávne slová a nechtiac zložíš novú prísahu. Pečať sa ti pod prstami zahreje. Prijala ťa za svedka bez ohľadu na tvoju vôľu.
14.wilderness.info=
14.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
14.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

15.wilderness.flavor=Vo svahu je vyrytý nedokončený rituálny kruh. Keď sa priblížiš, z priekopy sa vztýči prastarý hadí kňaz. Zviera nástroj, ktorým sa chystá dokončiť poslednú ryhu a uzavrieť kruh.
15.wilderness.pass.flavor=Kňaz padne skôr, než kruh dokončí. Z jeho tabuliek zistíš zmysel obradu. Hrozivý tlak, ktorý narastal pod zemou, pomaly ustupuje.
15.wilderness.fail.flavor=Kňaza nedokážeš zastaviť. Keď ustupuješ z kruhu, zasiahne ti odhalenú kožu spŕškou tmavého jedu.
15.wilderness.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
15.wilderness.pass.info=[#GOOD]Získaj túto Clue a Skaza ustúpi o 1.[]
15.wilderness.fail.info=[#BAD]Získaj Otravu.[]

16.wilderness.flavor=Pustovníkov prístrešok je prázdny, no po čistine pred ním sú rozložené stránky zaťažené kameňmi. Hoci nefúka vietor, jedna za druhou sa zachvejú. Sleduješ ich poradie a snažíš sa pochopiť súvislosť medzi nakreslenými symbolmi.
16.wilderness.pass.flavor=Všimneš si, že pohyb sa opakuje, a podľa neho zoradíš stránky. Dozvieš sa, kto pustovníka učil, a nájdeš aj kúzlo odpísané zo zvitku jeho učiteľa.
16.wilderness.fail.flavor=Riadíš sa pohybom, ktorý si si iba predstavoval. Čoskoro vidíš písmo aj na každom liste stromu. V prázdnom prístrešku sa mihajú postavy, ktoré zmiznú, len čo sa k nim otočíš.
16.wilderness.info=
16.wilderness.pass.info=[#GOOD]Získaj túto Clue a kúzlo.[]
16.wilderness.fail.info=[#BAD]Získaj Halucinácie.[]

17.wilderness.flavor=Medzi ruinami kľačí hadí učenec a rozkladá malé nádoby okolo odkrytého nápisu. Len čo si ťa všimne, zaútočí. Počas zápasu sa snažíš sledovať aj jeho rozrobený obrad.
17.wilderness.pass.flavor=Uprostred boja sa ti podarí sústrediť na nádoby a pochopíš, ako ich rozmiestnenie súvisí s nápisom. Začne ti dochádzať, na čo mal obrad slúžiť.
17.wilderness.fail.flavor=Boj si vyžiada všetku tvoju pozornosť. Keď sa napokon pozrieš na nádoby, sú rozhádzané a ich pôvodné rozmiestnenie už nedokážeš určiť.
17.wilderness.fail.info=
17.wilderness.pass.flavor.2=Zapamätáš si aj poradie učencových gest. Keď ich porovnáš s vyobrazeniami v ruinách, odhalíš ďalší skrytý význam obradu.
17.wilderness.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
17.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
17.wilderness.pass.info.2=[#GOOD]Získaj 1 Clue navyše.[]

18.wilderness.flavor=Tvoj tábor obkľúči hliadka. Opis hľadaného človeka presne zodpovedá tebe: pri viacerých zmiznutiach vraj videli niekoho s tvojou tvárou. Snažíš sa strážnikov presvedčiť, aby si porovnali podrobnosti výpovedí.
18.wilderness.pass.flavor=Podľa svedkov si bol v tú istú hodinu na miestach vzdialených celé míle. Strážnici uznajú tvoje vysvetlenie a opíšu ti stopy po obradoch, ktoré našli na jednotlivých miestach zmiznutí.
18.wilderness.fail.flavor=S každým slovom pôsobí tvoja výpoveď menej dôveryhodne. Hliadka ťa odvedie do najbližšieho mesta. Tam strážnik začne zapisovať tvoje slová ako priznanie.
18.wilderness.info=
18.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
18.wilderness.fail.info=[#BAD]Presuň sa do najbližšieho Mesta a získaj Zadržanie.[]

19.wilderness.flavor=Posledná strážkyňa zničenej svätyne súhlasí, že si vypočuje dôvod tvojho príchodu. Nie si prvý cudzinec, ktorý od nej žiada Yigove tajomstvá. Pozorne si ťa premeriava, kým vysvetľuješ, čomu chceš zabrániť.
19.wilderness.pass.flavor=Otvorí výklenok vo svätyni a vytiahne záznam dávnych prosieb. Nájdeš medzi nimi jednu, ktorú hadí boh vypočul, aj opis obradu, ktorý ju sprevádzal.
19.wilderness.fail.flavor=Strážkyňa svätyňu zavrie. Pri odchode nad tebou vyriekne krátky rozsudok v neznámom jazyku. Vytesané hady sa akoby otočia tam, kam sa pozerá.
19.wilderness.info=
19.wilderness.pass.info=[#GOOD]Získaj túto Clue a jeden vyšetrovateľ môže odhodiť Prekliatie.[]
19.wilderness.fail.info=[#BAD]Získaj Prekliatie.[]

20.wilderness.flavor=Po nezvestnej expedícii zostal hrdzavý kufrík s neporušenou mapou. Pod mapou objavíš ďalšiu priehradku lemovanú čerstvými škrabancami. Skôr než ju otvoríš, pozorne preskúmaš západku.
20.wilderness.pass.flavor=Za západkou zbadáš pohyb, a tak priehradku otvoríš z opačnej strany. Nájdeš v nej náčrt trasy s poznámkami, ktorá na pôvodnej mape nebola zakreslená.
20.wilderness.fail.flavor=Pod falošným dnom sa uhniezdil had. Uhryzne ťa cez škáru skôr, než ho zbadáš. Skrytú priehradku už nestihneš preskúmať.
20.wilderness.info=[#GOOD]Získaj túto Clue.[]
20.wilderness.pass.info=[#GOOD]Získaj 1 Clue navyše.[]
20.wilderness.fail.info=[#BAD]Získaj Otravu.[]

21.wilderness.flavor=Medzi ruinami čaká postava v rúchu. Pred ňou leží hadia koruna. Postava slúži Yigovmu protivníkovi a ponúka ti relikviu výmenou za dôkazy a záväzný sľub. Ak odmietneš, vyhráža sa všetkým tvojim spoločníkom.
21.wilderness.pass.flavor=Postava prijme tvoj sľub a zničí prinesené dôkazy. Položí pred teba prastarú korunu. Dohoda vás teraz zaväzuje oboch a s tým je spokojná.
21.wilderness.fail.flavor=Pakt neuzavriete. Postava obráti pozornosť k tvojim spoločníkom a splní svoju hrozbu. Ruinami sa rozľahnú ich výkriky.
21.wilderness.pass.info=[#BAD]Odhoď túto Clue[] a [#GOOD]získaj artefakt „Serpent Crown“.[]
21.wilderness.fail.info=[#BAD]Strať 2 Sanity a odhoď 2 vybavenia Spojenec.[]
21.wilderness.info=Môžeš [#BAD]získať Temný pakt a odhodiť túto Clue[], aby si [#GOOD]získal artefakt „Serpent Crown“.[] Inak [#BAD]strať 2 Sanity a odhoď 2 vybavenia Spojenec.[]

22.wilderness.flavor=V zasypanej komore nájdeš dve vrstvy rytín. Novšie niekto vytesal cez staršie až o stáročia neskôr. V žliabkoch pri nohách sa ti pohne prach. Hľadáš bezpečné miesto, z ktorého by si mohol nápisy porovnať.
22.wilderness.pass.flavor=Z bezpečného miesta si odpíšeš oba nápisy. Starší uvádza mená staviteľov komory. Novší zaznamenáva mená, pod ktorými sa po stáročiach vrátili.
22.wilderness.fail.flavor=Z prachu náhle vyrazia drobné hadie hlavy a zahryznú sa do teba. Keď ti jed prenikne do krvi, rytiny sa rozžiaria. Pod kožou sa ti objavia tie isté znaky.
22.wilderness.info=
22.wilderness.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
22.wilderness.fail.info=[#BAD]Získaj Otravu a Prekliatie.[]

23.wilderness.flavor=V ruinách prastarej ošetrovne žiari jediná fľaštička. Na okolitých policiach nehybne ležia hady, takmer nerozoznateľné od ozdobného kovania. Skôr než po fľaštičke siahneš, pozorne si prezrieš ich stočené telá.
23.wilderness.pass.flavor=Zdvihneš fľaštičku bez toho, aby si vyrušil spiace hady. Podľa štítku obsahuje elixír, ktorý dokáže zastaviť chradnutie a vrátiť životnú silu. Jeho účinky uchováva neporušená pečať.
23.wilderness.fail.flavor=To, čo si považoval za ozdobné kovanie, sa ti zrazu vsunie pod rukáv. Zuby ti prebodnú zápästie. Ucukneš skôr, než dosiahneš na fľaštičku.
23.wilderness.info=
23.wilderness.pass.info=[#GOOD]Získaj artefakt „Elixir of Life“.[]
23.wilderness.fail.info=[#BAD]Získaj Otravu.[]

24.wilderness.flavor=Voda z prameňa pri chodníku má slabú medenú príchuť. Dávne výstrahy naznačujú, že v spojení s hadím jedom môže byť nebezpečná. Vydáš sa proti prúdu, aby si zistil, čo vodu zmenilo.
24.wilderness.pass.flavor=Všimneš si, že prúd obteká čosi pod hladinou. Odhrnieš vodné rastliny a objavíš ponorenú modlu. Pramenitá voda vyteká priamo z jej otvorených úst.
24.wilderness.fail.flavor=Potok mizne pod spleťou koreňov. Prehľadáš oba brehy, no nedostaneš sa k miestu, odkiaľ pochádza zvláštna chuť vody.
24.wilderness.info=Ak máš Otravu, [#BAD]strať 1 Health a 1 Sanity.[]
24.wilderness.pass.info=[#GOOD]Získaj túto Clue.[]
24.wilderness.fail.info=

1.sea.flavor=Mokré šľapaje vedú k nákladnej debne, ktorá sa posúva pri každom zakolísaní lode. Podľa prepravného listu obsahuje iba keramiku. Skúmaš upevňovacie laná aj tmavé medzery pod okolitým nákladom.
1.sea.pass.flavor=Ešte pred otvorením debny si všimneš falošnú stenu. Za ňou nájdeš hadiu modlu a prepravné pokyny s adresou chrámu, ktorý nie je na žiadnej mape.
1.sea.fail.flavor=Oprieš sa o debnu a čosi ti prepichne rukavicu. Had sa vtiahne späť do škáry medzi doskami. Prsty ti pomaly znecitlivejú.
1.sea.info=
1.sea.pass.info=[#GOOD]Získaj túto Clue.[]
1.sea.fail.info=[#BAD]Získaj Otravu.[]

2.sea.flavor=Prebudíš sa na palube s listom papiera v ruke. Sú na ňom súradnice zapísané rukopisom, ktorý sa takmer podobá tvojmu. Hodinky ti stoja. Skúmaš papier aj okolie a snažíš sa zistiť, čo sa dialo v hodinách, na ktoré si nespomínaš.
2.sea.pass.flavor=Podľa škvŕn od soli zistíš, kde bol na papieri priložený ďalší list. Zostal po ňom zrkadlový odtlačok textu. Vyčítaš z neho miesto stretnutia na ostrove aj meno pasažiera, ktorý ho dohodol.
2.sea.fail.flavor=Pri skúmaní súradníc sa ti z pamäti začne vytrácať aj včerajší deň. Zápis ťa vedie do vnútrozemia k táboru expedície, no už si nepamätáš, kto ťa tam poslal.
2.sea.info=
2.sea.pass.info=[#GOOD]Získaj túto Clue.[]
2.sea.fail.info=[#BAD]Získaj Amnéziu a presuň túto Clue na najbližšie miesto expedície.[]

3.sea.flavor=Pod trupom sa plaví čosi, čo drží krok s loďou a prihovára sa ti cez dosky kajuty. Ponúka ti poznanie civilizácie staršej než ľudstvo. Ak ho chceš prijať, musíš tej bytosti otvoriť myseľ a zaviazať sa jej do služby.
3.sea.pass.flavor=Uzavretím dohody sa tvoja myseľ spojí s prastarou bytosťou. Odovzdáva ti neznáme vedomosti a zručnosti, až máš pocit, akoby si ich ovládal odjakživa.
3.sea.fail.flavor=Spojenie medzi vašimi mysľami nevznikne. Do rána hlas pod trupom utíchne a s ním sa vytratí aj nádej na sľúbené poznanie.
3.sea.pass.info=[#GOOD]Zlepši dve rôzne vlastnosti podľa vlastného výberu.[]
3.sea.fail.info=
3.sea.info=Môžeš [#BAD]minúť 2 Sanity a získať Temný pakt[], aby si [#GOOD]zlepšil dve rôzne vlastnosti podľa vlastného výberu.[]

4.sea.flavor=Posádka vytiahne na palubu kotvu s vyrytým neznámym kalendárom. Okolo spiaceho hada sú v kruhu zaznamenané dátumy. Porovnávaš znaky so správami o krajinách, ktoré kedysi pohltilo toto more.
4.sea.pass.flavor=Určíš, od ktorého okamihu kalendár počíta čas. Kotva pochádza z prístavu, ktorý zanikol ešte pred úsvitom ľudských dejín. Jej značky ukazujú cestu k osade, ktorá prežila dodnes.
4.sea.fail.flavor=Dátumy považuješ iba za pripomienku dávnych udalostí a ďalej ich neskúmaš. Spod trupu sa však začne ozývať zvuk, akoby ich ktosi odrátaval jeden po druhom.
4.sea.info=
4.sea.pass.info=[#GOOD]Získaj túto Clue.[]
4.sea.fail.info=[#BAD]Skaza postúpi o 1.[]

5.sea.flavor=Z lodného denníka zmizlo niekoľko strán, všetky o tom istom pasažierovi. Kapitán ti odmieta ukázať zvyšné záznamy. Naliehaš na neho, zatiaľ čo sa pri dverách kajuty zhromažďuje posádka.
5.sea.pass.flavor=Kapitán napokon knihu otvorí. Pasažier sa na túto loď nalodil pod tromi rôznymi menami a zakaždým ho sprevádzala debna z tej istej hadej svätyne.
5.sea.fail.flavor=Kapitán ukončí rozhovor jediným gestom. Námorníci ťa vyvlečú na chodbu a surovo s tebou zaobchádzajú. Keď ťa pustia, zostane ti bolestivé zranenie.
5.sea.info=
5.sea.pass.info=[#GOOD]Získaj túto Clue.[]
5.sea.fail.info=[#BAD]Získaj stav Zranenie.[]

6.sea.flavor=Námorník prizná, že na palubu ktosi prepašoval hadiu modlu. Meno zodpovedného pasažiera však prezradiť nechce. Pri spoločnom jedle sa snažíš získať jeho dôveru. Svojho pokrmu sa takmer nedotkol.
6.sea.pass.flavor=Odsunie tvoju misku a rýchlo prehovorí. Jedlo bolo nachystané práve pre teba. Ten, kto ho dal pripraviť, ukrýva modlu v zamknutej lodnej truhlici.
6.sea.fail.flavor=Vyhýba sa tvojmu pohľadu. Kým si všimneš horkú usadeninu na dne misky, jazyk ti už začína tŕpnuť.
6.sea.info=
6.sea.pass.info=[#GOOD]Získaj túto Clue.[]
6.sea.fail.info=[#BAD]Získaj Otravu.[]

7.sea.flavor=Z hmly zahaľujúcej provu sa vynorí rozkývaný lampáš. Nesie ho námorník s hadom vytetovaným na ramene. Okolo predlaktia má ovinutú mapu. Keď si všimne, že skúmaš jej značky, vytasí nôž.
7.sea.pass.flavor=Premôžeš námorníka a rozvinieš mapu. Trasy zakreslené ceruzkou spájajú osamelé ostrovy. Každý z nich je označený rovnakým hadím symbolom.
7.sea.fail.flavor=Námorník aj s mapou zmizne v hmle. Prehľadáš prednú palubu, no zostal tam len lampáš kývajúci sa nad zábradlím.
7.sea.info=[#BAD]Prepadne ťa Kultista.[]
7.sea.pass.info=[#GOOD]Získaj túto Clue.[]
7.sea.fail.info=

8.sea.flavor=Jeden z pasažierov tvrdí, že počuje volanie prastarých predmetov z morského dna. Prestal jesť a neustále hľadí na poklop nákladného priestoru. Pýtaš sa ho, čo začul ešte pred vyplávaním z prístavu.
8.sea.pass.flavor=Opíše ti volanie, na ktoré ktosi odpovedal z vnútrozemia. Podrobnosti zodpovedajú tomu, čo vieš o cestách Yigových uctievačov. Konečne máš miesto, kde môžeš pokračovať v pátraní.
8.sea.fail.flavor=Po prvej otázke za sebou zavrie dvere kajuty. Keď nabudúce prechádzaš okolo, je zvnútra zakrytá aj kľúčová dierka.
8.sea.flavor.2=Neskôr sa z tvojich relikvií ozve tichý tón, akoby odpovedali na vzdialené volanie. Začneš uvažovať, kto ich počúva a či už nepozná aj miesto, kde spávaš.
8.sea.info=
8.sea.pass.info=[#GOOD]Získaj túto Clue.[]
8.sea.fail.info=
8.sea.info.2=[#BAD]Strať 1 Sanity a získaj Paranoju.[]

9.sea.flavor=Vedľa tela zabaleného do plachtoviny schnú tabuľky vylovené z vraku. Ako z nich opadáva soľ, vyryté znaky sú čoraz zreteľnejšie. Snažíš sa rozpoznať jazyk skôr, než sa ich krehký povrch rozpadne.
9.sea.pass.flavor=Rozpoznáš zápisky vyhnanca zo zaniknutého kontinentu. Posádka ti tabuľky s úľavou prenechá. Námorníci sú radi, že aspoň niekto vie, čo je ich zlovestný náklad zač.
9.sea.fail.flavor=Len čo sa ti podarí znakom prisúdiť význam, opäť ti prestanú dávať zmysel. Zabalené telo za tebou začne šepkať preklad. Vždy, keď vstúpi niekto z posádky, však zmĺkne.
9.sea.info=
9.sea.pass.info=[#GOOD]Získaj artefakt „Zanthu Tablets“.[]
9.sea.fail.info=[#BAD]Získaj Halucinácie.[]

10.sea.flavor=Vo vraku uviaznutom na útese zostali posledné záznamy expedície na ostrovy zamorené hadmi. Prehľadávaš naklonené kajuty a pretláčaš sa úzkymi otvormi. V zatopených chodbách sa pohybujú tmavé tiene.
10.sea.pass.flavor=V kryte lampy nájdeš zapečatené kapitánove poznámky. Dozvieš sa z nich, kde expedícia naposledy pristála aj aké znamenia kapitána varovali, aby sa obrátil späť.
10.sea.fail.flavor=Pod vodou ťa čosi uhryzne do ruky. Kým sa vyškriabeš z vraku, pred očami sa ti roztancujú horúčkovité výjavy. Polámané trámy už nedokážeš rozoznať od zvíjajúcich sa hadov.
10.sea.info=Môžeš [#BAD]minúť 2 Health[], aby si hodil znova až 2 kockami.
10.sea.pass.info=[#GOOD]Získaj túto Clue.[]
10.sea.fail.info=[#BAD]Strať 2 Sanity a získaj Otravu.[]

11.sea.flavor=Na zadnej palube sa väzeň vytrhne strážcom a rozoženie ich. V pästi zviera mapu so zakreslenou trasou a hľadí k vzdialenému pobrežiu. Keď mu zastúpiš cestu, so syčaním na teba zaútočí.
11.sea.pass.flavor=Zrazíš väzňa k zemi skôr, než dobehne k zábradliu. Z mapy a výpovedí strážcov zistíš, kadiaľ kult prevádza svojich členov na úteku.
11.sea.fail.flavor=Preskočí zábradlie a mapu nepustí z ruky. Naposledy zazrieš úzku brázdu na hladine. Mieri k pobrežiu, za ktorým sa rozprestiera divočina.
11.sea.info=[#BAD]Prepadne ťa Kultista.[]
11.sea.pass.info=[#GOOD]Získaj túto Clue.[]
11.sea.fail.info=[#BAD]Presuň túto Clue na najbližšie miesto expedície.[]

12.sea.flavor=Tvoj čln sa unáša medzi troskami a po tmavej hladine plávajú tvoje dokumenty. Neviditeľný plavec ti ponúkne, že ich pozbiera a ukáže ti cestu do bezpečia. Hlas v tvojej mysli však žiada sľub, ktorý ťa zaviaže navždy.
12.sea.pass.flavor=Zložíš sľub. Vedľa teba sa z vody vynorí suchý balíček a plavec navedie tvoj čln k svetlám okoloidúcej lode.
12.sea.fail.flavor=Plavec sa ponorí do tmy a vezme so sebou aj tvoje dokumenty. Bezcieľne sa unášaš po mori. Keď ťa napokon nájde okoloidúca loď, do cieľa si mal doraziť už dávno.
12.sea.pass.info=[#GOOD]Získaj túto Clue.[]
12.sea.fail.info=[#BAD]Odhoď túto Clue a staneš sa Zdržaným.[]
12.sea.info=Môžeš [#BAD]získať Temný pakt[], aby si [#GOOD]získal túto Clue.[] V opačnom prípade [#BAD]odhoď túto Clue a staneš sa Zdržaným.[]

13.sea.flavor=Pred kajutou na teba čaká postava s tvárou človeka, ktorého si v tomto boji stratil. Pozdraví ťa presne tak, ako si pamätáš. Potom jej tvár na okamih prestane poslúchať a spod prestrojenia sa natiahne čosi prastaré.
13.sea.pass.flavor=Porazíš podvodníka a objavíš dôkazy, ktoré prezradia, prečo si vybral práve túto podobu. Je to užitočné zistenie, no spomienka na dôverne známy pozdrav ťa bude prenasledovať.
13.sea.fail.flavor=Podvodník unikne medzi pasažierov. Kdesi na lodi si už vyberá ďalšiu tvár, ktorej ľudia dôverujú, aby pod ňou mohol ďalej slúžiť Yigovi.
13.sea.info=Odhoď z hracej plochy žetón porazeného vyšetrovateľa. [#BAD]Potom ťa prepadnú Hadí ľudia.[]
13.sea.pass.info=[#BAD]Strať 1 Sanity[] a [#GOOD]získaj túto Clue.[]
13.sea.fail.info=[#BAD]Skaza postúpi o 1.[]

14.sea.flavor=V zatopenom podpalubí výskumnej lode ležia dva zapečatené kufre. Skúmaš uvoľnené trámy a spleť lán. Hľadáš cestu, ktorá zostane priechodná aj po náraze ďalšej vlny.
14.sea.pass.flavor=Dostaneš oba kufre cez otvor. V jednom sú záznamy pozorovaní expedície. Druhý obsahuje vzorky, ktoré podopierajú aj jej najneuveriteľnejšie tvrdenia.
14.sea.fail.flavor=Vlna ťa vrhne medzi trosky a zatarasí otvor nad tebou. Napokon sa prebojuješ von, dobitý a lapajúci po dychu. Aj na svetle máš pocit, že ťa stále obklopuje temnota podpalubia.
14.sea.info=
14.sea.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
14.sea.fail.info=[#BAD]Strať 2 Health a 2 Sanity.[]

15.sea.flavor=Z vody sa vynorí potápačský zvon so zapečatenou bronzovou nádobou zachytenou na spodku. Keď posádka otvorí veko nádoby, vysunie sa z nej hadia bytosť. Vychrlí zo seba príval zúrivých slov a zaútočí.
15.sea.pass.flavor=Zachováš si dosť rozvahy, aby si porozumel jej slovám. V návale hnevu prezradí meno kráľovstva, z ktorého ju vyhnali.
15.sea.fail.flavor=Počas zápasu ti jej zuby preniknú do kože. Od rany sa šíri pálčivá horúčava. Je jasné, že ti do krvi vnikol jed.
15.sea.pass.flavor.2=Počas celého zápasu sa ti podarilo vyhnúť jej jedovým zubom. Jed bytosti ti do krvi neprenikol.
15.sea.pass.info.2=
15.sea.fail.flavor.2=Slová bytosti ti v hlave splynú do ohlušujúceho revu. Z príbehu, ktorý v hneve vychrlila, si nezapamätáš nič.
15.sea.fail.info.2=
15.sea.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
15.sea.pass.info=[#GOOD]Získaj túto Clue.[]
15.sea.fail.info=[#BAD]Získaj Otravu.[]

16.sea.flavor=Po polnoci sa nad vodou rozoznie pieseň. Každý tón ťa láka bližšie k zábradliu a paluba pod nohami ti pripadá čoraz menej skutočná. Vzdoruješ vábeniu a snažíš sa sústrediť na loď okolo seba.
16.sea.pass.flavor=Pieseň nad tebou stratí moc. V nastalom tichu objavíš pod zábradlím zárezy, ktorých rozmiestnenie zodpovedá jej rytmu. S volaním teda súvisí niekto priamo na palube.
16.sea.fail.flavor=Vrhneš sa k vode, no posádka ťa v poslednej chvíli zachytí. Pri záchrane chrbtom prudko narazíš do zábradlia. Od bolesti sa takmer nedokážeš vystrieť.
16.sea.info=
16.sea.pass.info=[#GOOD]Získaj túto Clue.[]
16.sea.fail.info=[#BAD]Získaj Zranený chrbát.[]

17.sea.flavor=Rádio zachytí núdzové volanie lode, ktorá sa potopila pred storočím. V šume rozoznáš aj druhý hlas, ktorý pomalým syčaním udáva smer. Pozorne počúvaš a hľadáš podrobnosť, ktorá by prezradila pôvod vysielania.
17.sea.pass.flavor=V pozadí starej núdzovej správy rozoznáš súčasnú volaciu značku. Za zdanlivo prízračným vysielaním sa skrývajú rozkazy pre loď, ktorá vezie zásoby Yigovým nasledovníkom.
17.sea.fail.flavor=Hlasy počuješ aj po zložení slúchadiel. Ich pokyny ťa vedú do vnútrozemia, no prízračný šepot sa mieša so šumom. Nedokážeš z neho zistiť žiadny presný smer.
17.sea.info=
17.sea.pass.info=[#GOOD]Získaj túto Clue.[]
17.sea.fail.info=[#BAD]Získaj Halucinácie a presuň túto Clue na najbližšie miesto expedície.[]

18.sea.flavor=Pod palubou objavíš skrytý mechanizmus. Jeho údery sa zhodujú so vzdialenými otrasmi, ktoré cítiš v trupe lode. Pri každom údere vyšle do vody slabý zelený záblesk. Skúmaš pohyblivé súčasti a hľadáš spôsob, ako vysielanie prerušiť.
18.sea.pass.flavor=Nájdeš spojovací kolík a vytiahneš ho z mechanizmu. Zelené svetlo zhasne. Otrasy prichádzajúce z hlbín stratia pravidelný rytmus, akoby tam čosi márne čakalo na ďalší signál.
18.sea.fail.flavor=Mechanizmus začne udierať v rytme tvojho pulzu. Ustupuješ, no otrasy ťa sprevádzajú po celej lodi. Akoby ťa čosi v hlbinách už dokázalo rozoznať medzi ostatnými.
18.sea.info=
18.sea.pass.info=[#GOOD]Skaza ustúpi o 1.[]
18.sea.fail.info=[#BAD]Strať 1 Sanity a získaj Paranoju.[]

19.sea.flavor=Pod čiaru ponoru vedie chodba, ktorú nenájdeš v plánoch lode. Na jej konci vidíš pokojné čierne more pod neznámymi hviezdami. Skúmaš prah priechodu a pátraš po stopách jeho tvorcov.
19.sea.pass.flavor=Drobné ochranné symboly prezradia, že tvorcovia priechodu sa Yiga báli a snažili sa pred ním ukryť. Objavená cesta vysvetľuje, ako utečenci prekonávali moria bez toho, aby vstúpili do jediného prístavu.
19.sea.fail.flavor=Pri skúmaní priechodu zájdeš príliš ďaleko. Chodba za tebou zmizne a zostane tam iba čierna voda. Pod cudzími hviezdami niet po tvojej lodi ani stopy.
19.sea.info=
19.sea.pass.info=[#GOOD]Získaj túto Clue.[]
19.sea.fail.info=[#BAD]Získaj stav Stratený v čase a priestore.[]

20.sea.flavor=Do trupu narazí unášaný záchranný čln. Na prvý pohľad je prázdny, len na dne leží zapečatený zápisník. Spod lavíc sa ozýva tiché škrabanie. Spustíš sa do člna a hľadáš zdroj zvuku.
20.sea.pass.flavor=Pod lavicou zbadáš kobru, a tak po zápisníku siahneš z opačnej strany. Záznamy opisujú cestu člna od Yigovej svätyne na ostrove.
20.sea.fail.flavor=Siahneš pod lavicu skôr, než si všimneš stočenú kobru. Prudko ťa uhryzne. Kým sa vyškriabeš späť na loď, bolesť začne striedať pomaly sa šíriaca necitlivosť.
20.sea.info=
20.sea.pass.info=[#GOOD]Získaj túto Clue.[]
20.sea.fail.info=[#BAD]Strať 1 Health a získaj Otravu.[]

21.sea.flavor=Úzkou trhlinou vo vraku dovidíš do trezorovej miestnosti. Vnútri sa pohybuje reťaz, no jej rytmus sa nezhoduje s vlnami. Skôr než siahneš po dokumentoch, pozorne preskúmaš otvor.
21.sea.pass.flavor=Reťaz sa posúva okolo obrovského spiaceho hada. Dokumenty vytiahneš druhým otvorom. Prezradia ti, kam ho mali dopraviť aj kto si jeho prepravu objednal.
21.sea.fail.flavor=Had vedľa reťaze sa ti ovinie okolo hrude. Vytrhneš sa z jeho zovretia a dostaneš sa z otvoru von. Pri každom nádychu však cítiš hlbokú, mučivú bolesť.
21.sea.info=
21.sea.pass.info=[#GOOD]Získaj túto Clue.[]
21.sea.fail.info=[#BAD]Strať 2 Health a získaj Vnútorné zranenie.[]

22.sea.flavor=Zakaždým, keď prejdeš okolo zarámovaných fotografií na lodi, je na nich iná posádka. Zvesíš ich a porovnávaš pri svetle lampy. Hľadáš niečo, čo na nich zostáva rovnaké.
22.sea.pass.flavor=Nech sa tváre na fotografiách menia akokoľvek, pri kapitánovom kresle je vždy rovnaký malý mešec. Keď ho nájdeš a otvoríš, medzi zvlečenými hadími kožami objavíš napísané zaklínadlo. Práve ono mení tváre na snímkach.
22.sea.fail.flavor=Tváre sa menia tak dlho, až si prestaneš pamätať, ako vyzerala posádka pri tvojom nalodení. Aj keď od fotografií odídeš, kútikom oka stále vídaš neznámych ľudí.
22.sea.info=
22.sea.pass.info=[#GOOD]Získaj túto Clue.[]
22.sea.fail.info=[#BAD]Strať 2 Sanity a získaj Halucinácie.[]

23.sea.flavor=V podpalubí väznia vyčerpaného pútnika. Má pri sebe amulet, ktorého sa nikto z posádky nechce dotknúť. Tvrdí, že dokáže odvrátiť Yigovu pozornosť. Žiadaš kapitána, aby ti dovolil s ním hovoriť.
23.sea.pass.flavor=Kapitán ustúpi. Pútnik ti vysvetlí, ako amulet vznikol. Ponúkne ti možnosť preskúmať jeho znaky alebo sa s jeho pomocou zbaviť Yigovej kliatby.
23.sea.fail.flavor=Kapitán odmietne. Námorník ťa odoženie od poklopu násadou lodného háku a pútnikove slová zaniknú v pokrikovaných rozkazoch.
23.sea.option.1.flavor=Necháš pútnika obrátiť amulet smerom k tebe. Jeho povrch sa zakalí a potom znova vyjasní. Ťarcha Yigovej pozornosti z teba konečne opadne.
23.sea.option.1.info=[#GOOD]Odhoď svoj stav Prekliatie.[]
23.sea.option.2.flavor=Odkreslíš si znaky amuletu a zapíšeš pútnikovo rozprávanie o jeho tvorcoch. Získaš tak nové poznatky o tých, ktorí vzdorovali hadiemu kultu.
23.sea.option.2.info=[#GOOD]Získaj túto Clue.[]
23.sea.info=
23.sea.pass.info=[#GOOD]Získaj túto Clue alebo odhoď svoj stav Prekliatie.[]
23.sea.fail.info=[#BAD]Strať 1 Health.[]

24.sea.flavor=Keď sa priblížiš, kamenné sochy strážcov ostrova popraskajú. Z ich vnútra vylezú šupinaté tvory, ktoré za sebou vlečú zvyšky rúch. Bojuješ, aby si sa dostal k nápisu, ktorý tu mali strážiť.
24.sea.pass.flavor=Prebiješ sa k nápisu a porovnáš jeho obsah s tvormi okolo seba. V kameni sú vyryté ich niekdajšie mená aj príčina premeny.
24.sea.fail.flavor=Strážcovia ťa zatlačia do tieňa pod nápisom. Telo aj myseľ sa ti začnú meniť. Pohyby, ktoré si ovládal bez rozmýšľania, sú zrazu nemotorné a ťažko nadobudnuté vedomosti miznú z pamäti.
24.sea.info=
24.sea.pass.info=[#GOOD]Získaj túto Clue a 1 Clue navyše.[]
24.sea.fail.info=[#BAD]Odhoď všetky svoje žetóny zlepšenia.[]
