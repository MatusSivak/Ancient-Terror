1.flavor=A London shipping clerk offers access to two sealed accident reports. His copying fee exceeds your ready cash, but he will accept a signed promise of payment.
1.question=[#BAD]Gain a Debt Condition[] to [#GOOD]Gain two Clues[]?

2.flavor=In a London records office, a misfiled cable identifies a place worth investigating. You mark the location before the clerk returns.
2.info=[#GOOD]Spawn one Clue on a space of your choice[]
2.flavor.2=An attendant mistakes your copying for theft and bars the exit with a heavy filing trolley. You try to force your way through before the guards arrive.
#Test Strength
2.fail.flavor=The trolley jams in the doorway. Guards take you into custody while the clerk retrieves the file.
2.fail.info=[#BAD]Gain a Detained Condition[]

3.flavor=A London lanternist projects a sequence of landscapes on a shop wall. You look for ordinary landmarks hidden among their impossible features.
#Test Observation
3.pass.info=[#GOOD]Spawn one Clue on a space of your choice[]
3.fail.flavor=The shifting landscapes swallow every familiar landmark. You leave shaken by the sense that the city outside is equally unstable.
3.fail.info=[#BAD]Lose one Sanity[]

4.flavor=A narrow London courtyard has no door on the street plan, yet someone is calling for help inside. You search the masonry for an entrance.
#Test Observation
4.pass.flavor=You find a concealed latch and release a keeper trapped beside a broken shrine. Her grateful prayer settles over you as a blessing.
4.pass.info=[#GOOD]Gain a Blessed Condition[]
4.fail.flavor=You circle the block until the voice falls silent. The search consumes the time you needed for your next appointment.
4.fail.info=[#BAD]Become Delayed[]

5.flavor=A retired London signal operator records disturbances as patterns of bells. You compare his notebooks for repeated signals that might identify their source.
#Test Observation
5.pass.info=[#GOOD]Spawn two Clues[]
5.fail.flavor=The bells continue sounding after the operator closes his notebooks. You begin seeing signal lamps blink in empty windows.
5.fail.info=[#BAD]Gain a Hallucinations Condition[]

6.flavor=A London pawnbroker saves advertisements for objects no customer remembers owning. You sort through the clippings for a verifiable connection.
#Test Observation-1
6.pass.flavor=One repeated address links several missing owners. You take the relevant clipping as evidence.
6.pass.info=[#GOOD]Gain one Clue[]

7.flavor=At a London engineering demonstration, a speaker identifies two sites where buried instruments have begun moving on their own. You record both locations for investigation.
7.info=[#GOOD]Spawn two Clues[]
7.flavor.2=As the audience rises, you notice a metal case shifting on the balcony rail. You look for its failing support before passing beneath it.
#Test Observation
7.fail.info=[#BAD]Gain an Internal Injury Condition[]

8.flavor=A London archivist offers an overnight session comparing two sets of harbor charts. The work promises leads, but will keep you occupied well past your planned departure.
8.question=[#BAD]Become Delayed[] to [#GOOD]Spawn two Clues[]?

9.flavor=A London bell founder has collected accounts of bells heard where no towers stand. You apply your knowledge of ritual sound to distinguish patterns from rumor.
#Test Lore-1
9.pass.flavor=Two accounts describe the same summoning sequence. You mark their locations for separate investigations.
9.pass.info=[#GOOD]Spawn two Clues[]
9.fail.flavor=You follow a plausible but mistaken interpretation across the city. By the time it collapses, your planned departure has passed.
9.fail.info=[#BAD]Become Delayed[]

10.flavor=A London excavation supervisor has ordered a sealed chamber opened at dawn. You seek a meeting to explain why its warning marks deserve a closer investigation.
#Test Influence
10.pass.flavor=You persuade her to share the survey records. Two related sites can now be investigated before more chambers are disturbed.
10.pass.info=[#GOOD]Spawn two Clues[]
10.fail.flavor=She dismisses your warning and orders the seal broken. Far below the city, something answers sooner than it should.
10.fail.info=[#BAD]Advance Doom[]

11.flavor=A London courier has vanished while carrying letters addressed to places beyond ordinary roads. You inspect the impressions left on his blotting pad.
#Test Observation-1
11.pass.flavor=The impressions reveal how to recover traces of his route at every open passage between worlds. You send the method to each gate site.
11.pass.info=[#GOOD]Spawn one Clue on each space containing a Gate[]
11.fail.flavor=The impressions end with your own address, written over and over. The unexplained familiarity leaves you deeply unsettled.
11.fail.info=[#BAD]Lose one Sanity[]

12.flavor=In a London parcel depot, a ritualist has bound a night porter beneath a swinging counterweight. When you interfere, the ritualist turns on you.
# A Cultist Monster ambushes you!
12.pass.flavor=With the attacker defeated, the porter identifies the depot that sent the bindings. You pass the address on for investigation.
12.pass.info=[#GOOD]Spawn one Clue[]

13.flavor=A London animal handler needs help restraining a venomous snake found in an unmarked crate. You try to hold it securely while she replaces the damaged lid.
#Test Strength-1
13.pass.flavor=With the snake contained, you recover a shipping label as evidence. The handler also identifies a remote habitat worth investigating.
13.pass.info.1=[#GOOD]Gain one Clue[]
13.pass.info.2=[#GOOD]Spawn one Clue on a Wilderness[]
13.fail.flavor=The snake twists free and bites before slipping beneath the crates. A spreading numbness makes the venom's danger clear.
13.fail.info=[#BAD]Gain a Poisoned Condition[]

14.flavor=A London radio experimenter has found a frequency that agitates creatures near sites of strange activity. You examine the ritual notation needed to tune her transmitter.
#Test Lore
14.pass.flavor=You complete the tuning. The pulse strikes creatures gathered at sites already marked by clues, weakening each one it reaches.
14.pass.info=[#GOOD]Each Monster on a Clue loses one Health[]
14.fail.flavor=You reverse a protective mark. The transmitter falls silent, leaving a weight of misfortune that follows you from the room.
14.fail.info=[#BAD]Gain a Cursed Condition[]

15.flavor=A London map seller has joined the city's delivery routes into a pattern that seems to pull distant reports toward its center. You inspect the crossings for a usable route.
#Test Observation
15.pass.flavor=You identify the working crossings and direct available reports toward London, bringing up to two existing leads into the city.
15.pass.info=[#GOOD]Move up to two Clues to London[]
15.fail.flavor=You follow a crossing that is absent from the street outside. The route folds around you, carrying you beyond any familiar time or place.
15.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

16.flavor=At a London passenger office, officials question you about an altered manifest. You watch their papers and exchanged glances for what they already know.
#Test Observation
16.pass.flavor=You notice the address they are concealing and arrange for it to be investigated. Eager to end the interview, they also provide a ship ticket.
16.pass.info.1=[#GOOD]Spawn one Clue[]
16.pass.info.2=[#GOOD]Gain one Ship Ticket[]
16.fail.info.1=[#BAD]Lose one Sanity[]
16.fail.info.2=[#BAD]Gain a Detained Condition[]
1.pass.flavor=You sign the account and receive both reports. Their discrepancies give you two concrete leads, with the clerk's bill still to be settled.
1.pass.flavor.2=The clerk finds an unsettled obligation against your name and refuses further credit. The reports stay in his cabinet.
1.fail.flavor=You decline the fee. The clerk locks the cabinet and turns to the next customer.
2.pass.flavor=You shove the trolley aside and reach the street. The location you marked remains available for investigation.
3.pass.flavor=You recognize how one projection corresponds to a real place. You can send the lead to the location you choose to investigate.
5.pass.flavor=Two sequences correspond to disturbances elsewhere. You circulate their details so both sites can be investigated.
6.fail.flavor=The descriptions are too vague to connect. You return the clippings without finding a usable lead.
7.pass.flavor=You spot the loose bracket and step aside before the case falls. Your notes remain intact.
7.fail.flavor=The bracket gives way above you. The case strikes your ribs, leaving a deep internal pain that does not ease when you stand.
8.pass.flavor=You stay through the night and isolate two unexplained changes. Copies go out to the affected sites as the morning traffic begins.
8.pass.flavor.2=You are already held up by another commitment and cannot take on the overnight session. The archivist puts the charts away.
8.fail.flavor=You keep your departure time. The charts return to storage without being compared.
11.pass.flavor.2=You decipher the method, but there are no open passages through which the courier's route can be traced. No new site emerges.
12.fail.flavor=The attacker keeps you away from the loading floor. The porter's destination disappears into the depot's confusion, leaving no further lead.
14.pass.flavor.2=The tuning succeeds, but no creatures occupy the marked sites. The transmitter's pulse fades without striking a target.
15.pass.flavor.2=You identify the crossings, but no existing leads are available to redirect. The routes remain quiet.
16.fail.flavor=You miss the discrepancies and contradict yourself under questioning. The officials hold you for further inquiry, leaving you frightened and exhausted.
