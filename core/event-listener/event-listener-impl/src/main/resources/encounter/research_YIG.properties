# Original narrative; mechanics checked against https://eldritchhorror.fandom.com/wiki/Yig on 2026-10-24.
# Intro instructions omit test outcomes; only the resolved branch is revealed after a test.
# Flavor and rules stay separate. An empty outcome info means no additional mechanical effect.
1.city.flavor=In a shuttered importer's office, you find a ledger stitched shut with snakeskin. Someone has torn out the destinations and hidden the scraps among a hundred ordinary invoices.
1.city.pass.flavor=Under the desk blotter, you find the missing entries. Every shipment follows the same route inland, and every consignee signs with a crescent instead of a name.
1.city.fail.flavor=The final page shows your own arrival, recorded weeks in advance. Shaken, you lose the trail; the next shipment is already bound for the wilderness.
1.city.info=
1.city.pass.info=[#GOOD]Gain this Clue.[]
1.city.fail.info=[#BAD]Lose 1 Sanity and move this Clue to the nearest expedition space.[]

2.city.flavor=The man across the cafe has not moved his lips, yet his voice fills your head. He describes your childhood with perfect accuracy, then begins to change it. You cling to what you know is yours.
2.city.pass.flavor=You force the intruder out. For an instant the connection runs both ways, revealing tiled tunnels beneath the city and a door marked with a coiled serpent.
2.city.fail.flavor=The voice falls silent, but its memories remain. You remember a second family now, waiting in a house whose windows have never seen daylight.
2.city.info=
2.city.pass.info=[#GOOD]Gain this Clue.[]
2.city.fail.info=[#BAD]Gain Hallucinations.[]

3.city.flavor=A collector unlocks a cabinet of relics recovered from a ruined shrine. Fine scales litter the velvet beneath them. While he fetches a lamp, you examine the narrow gaps between the shelves.
3.city.pass.flavor=You spot the snake before it strikes. Beneath its coils lies a fresh delivery label, linking the supposedly ancient collection to an address in the city.
3.city.fail.flavor=The velvet shifts beneath your hand. Two sharp punctures swell at once, and the collector shuts the door before you can call for help.
3.city.info=
3.city.pass.info=[#GOOD]Gain this Clue.[]
3.city.fail.info=[#BAD]Lose 1 Health and gain Poisoned.[]

4.city.flavor=Your informant never reaches the meeting place. A figure wearing his coat steps from the alley instead, a curved blade in one hand and a bulging satchel in the other.
4.city.pass.flavor=With the attacker overcome, you recover the satchel. Inside are coded addresses and a photograph of your informant standing beside a serpent altar.
4.city.fail.flavor=The figure slips through a courtyard gate before you can secure the satchel. By the time you reach the street beyond, every doorway is closed.
4.city.info=[#BAD]A Cultist ambushes you.[]
4.city.pass.info=[#GOOD]Gain this Clue.[]
4.city.fail.info=

5.city.flavor=A railway porter refuses to discuss the crates that hissed in the freight shed. His packed suitcase waits beside him. You have one conversation to convince him that silence will not keep him safe.
5.city.pass.flavor=He unfolds a waybill he was too frightened to destroy. The crates were loaded under false names, but he remembers who paid and which platform they used.
5.city.fail.flavor=He gives you a platform number and hurries away. It is the wrong one. The freight train carrying your lead has already departed for a remote excavation.
5.city.info=
5.city.pass.info=[#GOOD]Gain this Clue.[]
5.city.fail.info=[#BAD]Move this Clue to the nearest expedition space.[]

6.city.flavor=Behind a boarded chapel, a keeper teaches you a ward spoken between breaths. Each relic you carry draws a second, discordant voice from the walls. You must hold the correct rhythm through the answering whispers.
6.city.pass.flavor=The last syllable settles into silence. For the first time in days, your shadow follows your movements exactly, and the keeper bows as the ward takes hold.
6.city.fail.flavor=You answer the wrong voice. The words seize your throat, leaving you doubled over as a bitter venom spreads from wounds you cannot see.
6.city.info=
6.city.pass.info=[#GOOD]Gain Blessed.[]
6.city.fail.info=[#BAD]Lose 2 Health and gain Poisoned.[]

7.city.flavor=Beneath a condemned house, a voice speaks through a sealed floor hatch. It knows how Yig marks his victims and offers to share that knowledge. In return, it asks for a promise with no stated end.
7.city.pass.flavor=Your promise is answered by a slow scraping beneath the hatch. A diagram slides into view, showing the hidden workings of Yig's mark and a way to loosen its hold.
7.city.fail.flavor=No bargain is sealed. The voice withdraws beneath the floor, taking its answers with it, and you leave before it finds another reason to call you back.
7.city.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
7.city.fail.info=
7.city.info=You may [#BAD]gain Dark Pact[] to [#GOOD]gain this Clue and let one investigator discard Cursed.[]

8.city.flavor=A glass serpent encloses a weapon in the vault of a forgotten society. Letters spiral around the case without a visible beginning. You compare them with the fragments of ritual language you remember.
8.city.pass.flavor=The inscription is an instruction to its guardian. You speak the release, and the glass uncoils, exposing the weapon and the record of the wars for which it was made.
8.city.fail.flavor=The letters rearrange themselves inside your thoughts. You taste venom as the glass serpent lifts its head, though the case remains motionless whenever you look directly at it.
8.city.info=
8.city.pass.info=[#GOOD]Gain this Clue and a Weapon Artifact.[]
8.city.fail.info=[#BAD]Lose 2 Sanity and gain Poisoned.[]

9.city.flavor=The abandoned theater is lit from below the stage. You descend into a room of discarded masks, where the last participant in a secret initiation turns toward you. Something beneath his collar is still changing.
9.city.pass.flavor=The initiate falls, leaving his instructions scattered across the floor. Reading them gives the ritual a comprehensible shape; the horror becomes something you can study and resist.
9.city.fail.flavor=The initiate retreats behind the scenery and bolts the cellar door. You hear the papers being gathered on the other side, then footsteps receding beneath the stage.
9.city.info=[#BAD]A Cultist ambushes you.[]
9.city.pass.info=[#GOOD]Gain this Clue and improve Will.[]
9.city.fail.info=

10.city.flavor=A dead courier's room has been searched, but the pattern of pinholes on the wall suggests a message remains. You pick through the wreckage while a cracked ceiling sags above the desk.
10.city.pass.flavor=The pinholes align with a street plan hidden under the carpet. Together they reveal both a meeting place and the route by which the cult's messengers reach it.
10.city.fail.flavor=You pull the desk aside and bring part of the ceiling down with it. A beam traps your leg; you drag yourself free before the rest of the room collapses.
10.city.info=
10.city.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
10.city.fail.info=[#BAD]Lose 1 Health and gain Leg Injury.[]

11.city.flavor=A stolen manuscript lists the signs of Yig's return in an ink that refuses to dry. You attempt to read the closing invocation while fresh strokes appear beneath your fingertips.
11.city.pass.flavor=You recognize the final phrase as a warning, not an invitation. Its two hidden meanings reveal where the cult will gather and what it intends to awaken.
11.city.fail.flavor=Your reading completes the invocation. Something vast notices you through the page, offering a terrible choice: carry its mark yourself or let its call spread further.
11.city.option.1.flavor=You accept the mark. The wet letters vanish into your skin, and the answering chorus beyond the room falls silent.
11.city.option.1.info=
11.city.option.2.flavor=No new bearer takes the mark, and the invocation escapes through the open window. Across the city, unseen voices take up its final words.
11.city.option.2.info=[#BAD]Advance Doom by 1.[]
11.city.info=
11.city.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
11.city.fail.info=[#BAD]Advance Doom by 1 unless you gain Cursed.[]

12.city.flavor=Fresh scales cling to the cobbles behind a crowded market. You follow them past the closing stalls, watching the ground while shutters click shut above your head.
12.city.pass.flavor=You notice a second trail crossing the first: powder from a distinctive green seal. It leads to a parcel shop whose outgoing register names the keeper of the snakes.
12.city.fail.flavor=Intent on the cobbles, you miss the wicker basket lowered from a window. Its lid opens beside your shoulder, and something cold strikes your neck.
12.city.info=
12.city.pass.info=[#GOOD]Gain this Clue.[]
12.city.fail.info=[#BAD]Gain Poisoned.[]

13.city.flavor=The tram rattles past your stop without slowing. Every passenger turns toward you at the same instant, their eyes reflecting the lamps like polished scales. You force yourself to watch rather than flee.
13.city.pass.flavor=The faces settle back into ordinary expressions. You have seen enough: each passenger bears the same small crescent, concealed beneath a cuff or collar.
13.city.fail.flavor=You stumble off at the next stop, certain the passengers have followed. For the rest of the night, every passing face seems to turn before you look at it.
13.city.info=
13.city.pass.info=[#GOOD]Gain this Clue.[]
13.city.fail.info=[#BAD]Lose 2 Sanity and gain Paranoia.[]

14.city.flavor=A fleeing informant throws a packet through the floor of a derelict tenement. Below it, a broken staircase hangs over darkness. You examine the remaining supports for a route down.
14.city.pass.flavor=You lower yourself along the sound wall and retrieve the packet. Its wax seal bears Yig's crescent, and the papers inside record payments to several respectable households.
14.city.fail.flavor=A support gives way as you shift your weight. You land badly on the stair below and must crawl back up, leaving the packet somewhere in the dark.
14.city.info=
14.city.pass.info=[#GOOD]Gain this Clue.[]
14.city.fail.info=[#BAD]Gain Leg Injury.[]

15.city.flavor=An official leads you to a chamber where every spoken word is repeated by a brass serpent. You recognize a way to turn the enchantment against its master, but doing so will consume part of your hard-won ability.
15.city.pass.flavor=You feed a measure of your skill into the enchantment. The serpent speaks a phrase that can undo Yig's mark, then cracks along its jaw.
15.city.fail.flavor=The brass serpent continues its report. Before you can leave, the official returns with a pair of constables and a warrant already bearing your name.
15.city.pass.info=[#GOOD]Let one investigator discard Cursed.[]
15.city.fail.info=[#BAD]Gain Detained.[]
15.city.info=You may [#BAD]spend 1 improvement token[] to [#GOOD]let one investigator discard Cursed.[] Otherwise, [#BAD]gain Detained.[]

16.city.flavor=Your companion invites you into an elegant townhouse and repeats a confidence you shared with no one else. Then the familiar face folds back, exposing the creature that has been traveling beside you.
16.city.pass.flavor=You force the impostor to yield. Among its evasions, you catch the name of the household that supplied its disguise.
16.city.fail.flavor=The creature speaks your private fears as words of binding. Each secret tightens the unseen knot it has drawn around you.
16.city.pass.flavor.2=You hold onto the memory of your real companion. The impostor's stolen intimacies cannot give its whispered hex a hold.
16.city.pass.info.2=
16.city.fail.flavor.2=The impostor escapes before you can make it answer. Its discarded human face lies at your feet, offering no explanation.
16.city.fail.info.2=
16.city.info=[#BAD]Discard 1 Ally Asset. A Serpent People then ambushes you.[]
16.city.pass.info=[#GOOD]Gain this Clue.[]
16.city.fail.info=[#BAD]Gain Cursed.[]

17.city.flavor=A bookseller unwraps a volume that has defeated every translator he has hired. The letters shift whenever the page is turned. You search for the grammar beneath their movement.
17.city.pass.flavor=The script describes its own method of reading. Once you understand the first line, the rest settles into place, and the bookseller gladly relinquishes the disturbing volume.
17.city.fail.flavor=You mistake a command for a heading and read it aloud. The letters stop moving, but a fresh line appears on the cover: your name, written as a dedication.
17.city.info=
17.city.pass.info=[#GOOD]Gain a Tome Artifact.[]
17.city.fail.info=[#BAD]Gain Cursed.[]

18.city.flavor=The witness's notes describe a hidden serpent colony in exacting detail. You pocket them as he locks the interview room. His smile widens beyond anything a human jaw could manage.
18.city.pass.flavor=You keep the creature's fangs from finding purchase. When the struggle ends, the notes are still secure and you have escaped its venom.
18.city.pass.info=
18.city.fail.flavor=The wound burns with more than pain. You still have the notes, but the creature's venom has entered your blood.
18.city.info=[#GOOD]Gain this Clue.[] Then [#BAD]a Serpent People ambushes you.[]
18.city.fail.info=[#BAD]Gain Poisoned.[]

19.city.flavor=In a municipal archive, several recent deaths have been filed under the same obsolete address. You slip into the locked records office to examine the originals while footsteps echo beyond the door.
19.city.pass.flavor=The originals all bear the signature of a doctor who died decades ago. You copy his address and the names of the people who vouched for him.
19.city.fail.flavor=The footsteps stop outside. You have barely replaced the folder when the door opens and a guard asks you to explain the broken lock.
19.city.info=
19.city.pass.info=[#GOOD]Gain this Clue.[]
19.city.fail.info=[#BAD]Gain Detained.[]

20.city.flavor=A physician offers treatment for serpent venom, but the seals on his medicine bottles match an old binding rite. By the time you recognize them, he has left. You search his consulting rooms for a trace of his real work.
20.city.pass.flavor=Behind a false drawer, you find appointments written in a second hand. The patients are grouped by the stages of a transformation, and the next meeting place is clearly marked.
20.city.fail.flavor=Every drawer contains the same harmless records. Whatever the physician was doing here, he has concealed it too well for you to prove.
20.city.info=If you are Poisoned, [#BAD]gain Cursed.[]
20.city.pass.info=[#GOOD]Gain this Clue.[]
20.city.fail.info=

21.city.flavor=A locked photographic studio contains portraits of the same family spanning three centuries. The dates cannot be right. You examine the faces, willing yourself to look again whenever recognition begins to slip away.
21.city.pass.flavor=A scar appears in every generation, always on the same face beneath a different name. The photographs document one creature's long passage through human lives.
21.city.fail.flavor=You recognize yourself in the oldest photograph. After that, the dates, faces, and your own memories cease to agree; even the room seems to belong to someone else's life.
21.city.info=You may [#BAD]spend 2 Sanity[] to reroll up to 2 dice.
21.city.pass.info=[#GOOD]Gain this Clue.[]
21.city.fail.info=[#BAD]Gain Amnesia, Hallucinations, and Paranoia.[]

22.city.flavor=Behind a private clinic, you find a room of sleepers murmuring the same name. Their keeper turns from a bed, its human features dissolving as it reaches for the key around its neck.
22.city.pass.flavor=You overcome the keeper and force it to explain the sleepers' marks. Its answers expose the clinic's purpose and reveal a rite that can loosen Yig's curse.
22.city.fail.flavor=The keeper drives you back through the clinic and seals the ward. The sleepers' murmuring follows you into the street, too faint to make out a single word.
22.city.info=[#BAD]A Serpent People ambushes you.[]
22.city.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
22.city.fail.info=

23.city.flavor=A courier clutches a sealed message while a ritual wound drains his strength. His pursuer is already leaving the city. You can take part of the wound onto yourself to keep him conscious long enough to speak.
23.city.pass.flavor=Pain tears through you as the courier draws a steady breath. He breaks the seal and tells you who ordered the message carried, and where its instructions lead.
23.city.fail.flavor=The courier can tell you nothing more. Your remaining lead travels with his pursuer, whose route points toward a distant expedition camp.
23.city.pass.info=[#GOOD]Gain this Clue.[]
23.city.fail.info=[#BAD]Move this Clue to the nearest expedition space.[]
23.city.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]move this Clue to the nearest expedition space.[]

24.city.flavor=A green lamp flashes inside an abandoned factory in a pattern you have seen at cult meetings. You follow it between silent machines, looking for whoever is signaling from the gantry.
24.city.pass.flavor=You spot a watcher reaching for a lever and stop short of the machine below. Cornered, he reveals the signal's destination before fleeing into the yard.
24.city.fail.flavor=The lamp was bait. A conveyor lurches into motion beneath you, crushing your leg against a rusted guide before you wrench yourself clear.
24.city.info=
24.city.pass.info=[#GOOD]Gain this Clue.[]
24.city.fail.info=[#BAD]Lose 2 Health and gain Leg Injury.[]

1.wilderness.flavor=A stone slab blocks a chamber beneath the ruins. Old claw marks score its inner edge. You brace yourself against the rock and try to lift it far enough to reach the space beyond.
1.wilderness.pass.flavor=The slab rises just enough. Inside, two layers of carvings record a serpent settlement and the later return of its inhabitants, separated by an age of silence.
1.wilderness.fail.flavor=The slab slips as you force it upward. Its weight throws you against the stone steps, and a sharp pain locks your back before you can try again.
1.wilderness.info=
1.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
1.wilderness.fail.info=[#BAD]Lose 2 Health and gain Back Injury.[]

2.wilderness.flavor=A wayside shrine lists names beneath a serpent whose coils have been broken. Someone scraped away the accompanying ritual. You piece together its surviving signs from fragments scattered in the grass.
2.wilderness.pass.flavor=The fragments describe how Yig's mark can be unbound. A second inscription identifies the people who preserved the rite after their settlement vanished.
2.wilderness.fail.flavor=You arrange the fragments into an invocation instead of a ward. The stone grows slick with venom, and your hands blister where you touched it.
2.wilderness.info=
2.wilderness.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
2.wilderness.fail.info=[#BAD]Lose 2 Health and gain Poisoned.[]

3.wilderness.flavor=An abandoned survey station contains a detailed account of the nearby serpent ruins. Its final entry describes a black sphere hidden beneath the roots. You follow the sketch, watching for the traps its discoverer feared.
3.wilderness.pass.flavor=A thin wire vanishes into the root mass. You step over it and free the sphere from its cradle; no light reaches the object's center, however you turn it.
3.wilderness.fail.flavor=Your sleeve catches a hidden thread. The buried sphere turns toward you, and something in its darkness remembers your face before you can retreat.
3.wilderness.info=[#GOOD]Gain this Clue.[]
3.wilderness.pass.info=[#GOOD]Gain the Cursed Sphere Artifact.[]
3.wilderness.fail.info=[#BAD]Gain Cursed.[]

4.wilderness.flavor=The path breaks beneath your boots, exposing a ravine lined with carved serpents. You catch a root and haul against the weight of your equipment, struggling to reach a ledge bearing fresh footprints.
4.wilderness.pass.flavor=You pull yourself onto the ledge. Beside the footprints, a recently opened cache contains the route followed by the people tending these ancient carvings.
4.wilderness.fail.flavor=The root tears loose. You strike the slope below, and part of your equipment tumbles out of reach before you stop sliding.
4.wilderness.info=
4.wilderness.pass.info=[#GOOD]Gain this Clue.[]
4.wilderness.fail.info=[#BAD]Lose 1 Health and discard 2 Item possessions.[]

5.wilderness.flavor=Survey stakes enclose a clearing where the grass moves against the wind. Snakes crowd the low ground, concealing whatever the surveyors marked. You search for a line of sight through the restless coils.
5.wilderness.pass.flavor=From the right angle, the stakes form a map. Their buried faces carry a second set of markings, recording when the serpents gather and where they go afterward.
5.wilderness.fail.flavor=The shifting grass hides every useful mark. After circling the clearing, you can make no more sense of the stakes than when you arrived.
5.wilderness.info=On an expedition space, [#BAD]gain Poisoned.[]
5.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
5.wilderness.fail.info=

6.wilderness.flavor=Travelers gather around an altar warmed by a fire beneath the earth. They say its vision comes only to those willing to endure the heat. Beyond the altar, shadows coil across bare stone.
6.wilderness.pass.flavor=You endure the burning passage. Within the wavering air, you see the shape of Yig's mark and the gesture by which its binding can be undone.
6.wilderness.fail.flavor=You remain outside the circle. The travelers finish their rite, but from where you stand the rising heat reveals only shapeless light.
6.wilderness.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
6.wilderness.fail.info=
6.wilderness.flavor.2=The awakened god answers through the altar. Fire lashes across the stones, sparing no one who stands near it.
6.wilderness.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue and let one investigator discard Cursed.[]
6.wilderness.info.2=[#BAD]Lose 2 Health.[]

7.wilderness.flavor=An abandoned camp surrounds a low altar covered with fresh scratches. As you bend to examine them, the figure you took for a discarded bedroll rises behind you, hissing through clenched teeth.
7.wilderness.pass.flavor=After the struggle, you can still concentrate on the altar. The scratches form a record of offerings, each tied to a place further along the serpent trails.
7.wilderness.fail.flavor=Venom clouds your sight, and the scratches will not hold still long enough to read. You must leave the altar's meaning unresolved.
7.wilderness.info=[#BAD]A Cultist ambushes you.[]
7.wilderness.pass.info=[#GOOD]Gain this Clue.[]
7.wilderness.fail.info=You are Poisoned and cannot gain this Clue.

8.wilderness.flavor=A sealed vessel hums with a voice too faint to understand. Its keeper says the vapor within will let you hear Yig's message, but the serpent god demands a victim if his invitation goes unanswered.
8.wilderness.pass.flavor=You breathe the vapor, and the voice becomes painfully clear. Between its commands, you hear the names and meeting places of those already serving the serpent god.
8.wilderness.fail.flavor=The vessel darkens before its message reaches you. A hiss passes through the camp, seeking the companions whose voices it heard beside yours.
8.wilderness.pass.info=[#GOOD]Gain this Clue.[]
8.wilderness.fail.info=[#BAD]Discard this Clue and 1 Ally Asset.[]
8.wilderness.info=You may [#BAD]gain Poisoned[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]discard this Clue and 1 Ally Asset.[]

9.wilderness.flavor=Human footprints and a deep serpentine furrow cross a rain-soaked clearing. Both trails vanish at the same patch of exposed stone. You search the surrounding ground for the missing connection.
9.wilderness.pass.flavor=Impressions beneath an overhang preserve the change step by step. Nearby, an older set records the same transformation in reverse.
9.wilderness.fail.flavor=Rain softens the last clear impressions as you examine them. You leave with no reliable way to connect the footprints to the furrow.
9.wilderness.flavor.2=On your way out, snakes sheltering beneath the stone strike as you cross it. You reach clear ground with fresh bites burning along your legs.
9.wilderness.info=
9.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
9.wilderness.fail.info=
9.wilderness.info.2=[#BAD]Lose 2 Health.[]

10.wilderness.flavor=A stone monument stands behind a village whose inhabitants never remove their gloves. Its carvings seem to stir near poisoned blood. While your hosts prepare their evening observance, you look for signs of what they worship.
10.wilderness.pass.flavor=You notice shed scales caught inside a glove left by the fire. The pattern matches the monument, exposing the connection your hosts have carefully concealed.
10.wilderness.fail.flavor=The villagers complete their preparations without a word out of place. Whatever joins them to the monument remains hidden behind their patient smiles.
10.wilderness.info=If Poisoned, [#BAD]advance Doom by 1.[]
10.wilderness.pass.info=[#GOOD]Gain this Clue.[]
10.wilderness.fail.info=

11.wilderness.flavor=The trail passes between identical standing stones. Each time you look back, another has appeared behind you. You study the moss and shadows for something the changing path has failed to copy.
11.wilderness.pass.flavor=One stone casts its shadow toward the sun. Following that inconsistency reveals the boundary of a path that exists partly in another world.
11.wilderness.fail.flavor=You choose a gap between the stones and step into a sky without ground. The path closes behind you, leaving neither tracks nor a direction home.
11.wilderness.info=
11.wilderness.pass.info=[#GOOD]Gain this Clue.[]
11.wilderness.fail.info=[#BAD]Gain Lost in Time and Space.[]

12.wilderness.flavor=An expedition journal lies beneath the roots of a tree carved with Yig's sign. The roots tighten when your shadow touches them. You search for a way to reach the book without disturbing its guardian.
12.wilderness.pass.flavor=You find an opening beside the trunk, but the last roots will yield only to a living hand. Their thorns promise a painful price for the journal.
12.wilderness.fail.flavor=You disturb the guardian before reaching the journal. The carved serpent opens an eye, and its cold attention follows you away from the tree.
12.wilderness.option.1.flavor=You force your hand through the thorns and tear the journal free. Its bloodstained pages preserve the expedition's account of a hidden serpent settlement.
12.wilderness.option.1.info=[#GOOD]Gain this Clue.[]
12.wilderness.option.2.flavor=The roots close around the book. The tree has felt your attempt, and the sign on its bark follows you in every shadow.
12.wilderness.option.2.info=[#BAD]Gain Cursed.[]
12.wilderness.info=
12.wilderness.pass.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]gain Cursed.[]
12.wilderness.fail.info=[#BAD]Gain Cursed.[]

13.wilderness.flavor=Far from the road, a voice begins naming the things you dread. It speaks from the trees, then from inside your own chest. You fix your thoughts on the rhythm of your steps.
13.wilderness.pass.flavor=You let the voice exhaust itself without answering. Ordinary sounds return to the woods, and with them a steadiness you thought you had lost.
13.wilderness.fail.flavor=You answer once, and the voice learns how to sound like someone you trust. By nightfall you can no longer hear a friendly call without wondering what lies behind it.
13.wilderness.info=
13.wilderness.pass.info=[#GOOD]Recover 2 Sanity.[]
13.wilderness.fail.info=[#BAD]Gain Paranoia.[]

14.wilderness.flavor=A broken tablet records an agreement sealed beneath the image of a serpent. Wind has erased the terms on one side. You reconstruct them from the surviving phrases and the pattern of the seal.
14.wilderness.pass.flavor=The missing lines concern the price of breaking the oath. You now understand why the abandoned settlement was marked, and what its survivors tried to conceal.
14.wilderness.fail.flavor=You supply the wrong words and turn the record into a new oath. The seal warms beneath your fingers as it accepts an unwilling witness.
14.wilderness.info=
14.wilderness.pass.info=[#GOOD]Gain this Clue.[]
14.wilderness.fail.info=[#BAD]Gain Cursed.[]

15.wilderness.flavor=A ritual circle has been cut into the hillside, its final groove still unfinished. An ancient serpent priest rises from the trench as you approach, clutching the tool with which it means to join the lines.
15.wilderness.pass.flavor=The priest falls before it can complete the circle. Its tablets explain the rite, and the pressure gathering beneath the hillside slowly recedes.
15.wilderness.fail.flavor=You cannot stop the priest. As you withdraw from the circle, it spits a dark spray across your exposed skin.
15.wilderness.info=[#BAD]A Serpent People ambushes you.[]
15.wilderness.pass.info=[#GOOD]Gain this Clue and retreat Doom by 1.[]
15.wilderness.fail.info=[#BAD]Gain Poisoned.[]

16.wilderness.flavor=The hermit's shelter is empty, but pages pinned beneath stones cover the clearing outside. They stir in sequence despite the still air. You watch for the pattern connecting their symbols.
16.wilderness.pass.flavor=You catch the repeated motion and arrange the pages accordingly. They reveal who taught the hermit, together with a spell copied from his teacher's own scroll.
16.wilderness.fail.flavor=You follow a movement that was never there. Soon every leaf seems to carry writing, and the empty shelter fills with figures that vanish when you turn.
16.wilderness.info=
16.wilderness.pass.info=[#GOOD]Gain this Clue and a Spell.[]
16.wilderness.fail.info=[#BAD]Gain Hallucinations.[]

17.wilderness.flavor=A serpent scholar kneels among the ruins, arranging small vessels around an open inscription. It attacks as soon as it notices you. You try to keep sight of its work through the struggle.
17.wilderness.pass.flavor=In a clear instant during the fight, you see how the vessels correspond to the inscription. The ritual's purpose begins to make sense.
17.wilderness.fail.flavor=The struggle demands all your attention. When you finally look toward the vessels, their arrangement has been scattered beyond recognition.
17.wilderness.fail.info=
17.wilderness.pass.flavor.2=You also retain the sequence of its gestures. Comparing them with the ruins reveals a second meaning concealed within the rite.
17.wilderness.info=[#BAD]A Serpent People ambushes you.[]
17.wilderness.pass.info=[#GOOD]Gain this Clue.[]
17.wilderness.pass.info.2=[#GOOD]Gain 1 additional Clue.[]

18.wilderness.flavor=A patrol surrounds your camp with a description that matches you exactly. Someone wearing your face has been seen near several disappearances. You try to persuade the officers to compare the details.
18.wilderness.pass.flavor=The witness accounts place you miles apart at the same hour. The officers accept your explanation and describe the ritual traces found at each scene.
18.wilderness.fail.flavor=Your account sounds less plausible with every word. The patrol takes you to the nearest city, where an officer begins writing your statement as a confession.
18.wilderness.info=
18.wilderness.pass.info=[#GOOD]Gain this Clue.[]
18.wilderness.fail.info=[#BAD]Move to the nearest City and gain Detained.[]

19.wilderness.flavor=The last caretaker of a ruined shrine agrees to hear why you have come. She has seen strangers ask for Yig's secrets before, and studies you carefully while you explain what you hope to prevent.
19.wilderness.pass.flavor=She opens a recess in the shrine and brings out a record of old petitions. Among them is a plea the serpent god once accepted, and the rite used to carry it.
19.wilderness.fail.flavor=The caretaker closes the shrine. As she turns away, she speaks a short judgment in a language you do not know, and the carved serpents seem to follow her gaze.
19.wilderness.info=
19.wilderness.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
19.wilderness.fail.info=[#BAD]Gain Cursed.[]

20.wilderness.flavor=The missing expedition left an intact map in a rusted field case. Fresh scratches surround a second compartment beneath it. You inspect the latch before trying to uncover what else they brought back.
20.wilderness.pass.flavor=You catch the movement behind the latch and open the compartment from the other side. Inside lies an annotated route omitted from the map above.
20.wilderness.fail.flavor=A snake has nested behind the false bottom. It strikes through the gap before you see it, leaving the hidden compartment unexplored.
20.wilderness.info=[#GOOD]Gain this Clue.[]
20.wilderness.pass.info=[#GOOD]Gain 1 additional Clue.[]
20.wilderness.fail.info=[#BAD]Gain Poisoned.[]

21.wilderness.flavor=A robed figure waits among the ruins with a serpent crown laid before it. It serves a rival power and offers the relic in exchange for your evidence and a binding promise. Its threats include everyone who traveled with you.
21.wilderness.pass.flavor=The figure accepts your pledge and destroys the evidence you brought. It places the ancient crown within your reach, satisfied that the bargain now binds you both.
21.wilderness.fail.flavor=No pact is made. The figure turns its attention toward your companions, and their voices break through the ruins as its terrible answer takes shape.
21.wilderness.pass.info=[#BAD]Discard this Clue[] and [#GOOD]gain the Serpent Crown Artifact.[]
21.wilderness.fail.info=[#BAD]Lose 2 Sanity and discard 2 Ally Assets.[]
21.wilderness.info=You may [#BAD]gain Dark Pact and discard this Clue[] to [#GOOD]gain the Serpent Crown.[] Otherwise, [#BAD]lose 2 Sanity and discard 2 Ally Assets.[]

22.wilderness.flavor=A buried chamber holds two rows of carvings, one cut over the other centuries later. Dust shifts in the channels around your feet. You seek a safe vantage from which to compare the inscriptions.
22.wilderness.pass.flavor=You find a clear section of floor and copy both rows. The older text identifies the builders; the newer records the names under which they returned.
22.wilderness.fail.flavor=The dust erupts into small, striking heads. As venom enters your blood, the carvings shine with the same pattern appearing beneath your skin.
22.wilderness.info=
22.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
22.wilderness.fail.info=[#BAD]Gain Poisoned and Cursed.[]

23.wilderness.flavor=A single vial glows in the ruins of an ancient infirmary. Snakes lie motionless along the shelves around it, almost indistinguishable from the carved fittings. You study their coils before reaching in.
23.wilderness.pass.flavor=You lift the vial without disturbing the sleepers. Its label describes a remedy for the decay of life itself, preserved beneath an unbroken seal.
23.wilderness.fail.flavor=One of the carved fittings moves beneath your sleeve. Fangs pierce your wrist, and you pull back before you can reach the vial.
23.wilderness.info=
23.wilderness.pass.info=[#GOOD]Gain the Elixir of Life Artifact.[]
23.wilderness.fail.info=[#BAD]Gain Poisoned.[]

24.wilderness.flavor=A spring beside the trail tastes faintly of copper. Old warnings suggest its water reacts with serpent venom. You follow the flow upstream, searching for whatever has altered it.
24.wilderness.pass.flavor=You notice the current dividing around something beneath the surface. Clearing the weeds reveals a submerged idol, its open mouth feeding the spring.
24.wilderness.fail.flavor=The stream disappears beneath tangled roots. You search both banks, but the source of the water's strange taste remains beyond your reach.
24.wilderness.info=If Poisoned, [#BAD]lose 1 Health and 1 Sanity.[]
24.wilderness.pass.info=[#GOOD]Gain this Clue.[]
24.wilderness.fail.info=

1.sea.flavor=A trail of damp footprints ends beside a cargo crate that shifts against the ship's roll. Its manifest lists only pottery. You inspect the lashings and the dark spaces beneath the neighboring cargo.
1.sea.pass.flavor=You spot a false panel before opening the crate. Behind it lie a serpent idol and a shipping order addressed to a temple absent from every chart.
1.sea.fail.flavor=You steady yourself on the crate and feel something pierce your glove. A snake slips back between the boards as numbness spreads through your fingers.
1.sea.info=
1.sea.pass.info=[#GOOD]Gain this Clue.[]
1.sea.fail.info=[#BAD]Gain Poisoned.[]

2.sea.flavor=You wake on deck holding a page of coordinates in handwriting that almost resembles yours. Your watch has stopped. You examine the page and your surroundings for a trace of the missing hours.
2.sea.pass.flavor=Salt stains reveal where a second sheet rested against the page. Its reversed impression names the island rendezvous and the passenger who arranged it.
2.sea.fail.flavor=As you study the coordinates, even yesterday begins to fade. The page points inland toward an expedition site, but you can no longer remember who sent you after it.
2.sea.info=
2.sea.pass.info=[#GOOD]Gain this Clue.[]
2.sea.fail.info=[#BAD]Gain Amnesia and move this Clue to the nearest expedition space.[]

3.sea.flavor=Something keeps pace beneath the hull, speaking through the planks of your cabin. It offers lessons drawn from a civilization older than humanity. To receive them, you must open your mind and bind yourself to its service.
3.sea.pass.flavor=The bargain opens a narrow passage between your thoughts and an ancient mind. It guides you through unfamiliar disciplines until their patterns begin to feel like your own.
3.sea.fail.flavor=The passage between your minds remains closed. By morning the voice beneath the hull is gone, and its promised lessons have gone with it.
3.sea.pass.info=[#GOOD]Improve two different skills of your choice.[]
3.sea.fail.info=
3.sea.info=You may [#BAD]spend 2 Sanity and gain Dark Pact[] to [#GOOD]improve two different skills of your choice.[]

4.sea.flavor=The crew hauls aboard an anchor engraved with a calendar no one recognizes. Its dates circle an image of a sleeping serpent. You compare the symbols with accounts of the lands lost beneath this sea.
4.sea.pass.flavor=You recognize the calendar's starting point. The anchor came from a harbor that vanished before human history, and its markings preserve the route to a surviving colony.
4.sea.fail.flavor=You mistake the sequence for a memorial and leave it undisturbed. Beneath the hull, the engraved dates begin to sound like a countdown.
4.sea.info=
4.sea.pass.info=[#GOOD]Gain this Clue.[]
4.sea.fail.info=[#BAD]Advance Doom by 1.[]

5.sea.flavor=Several pages have vanished from the ship's log, all concerning the same passenger. The captain refuses you access to the remaining entries. You press your case while the crew gathers at the cabin door.
5.sea.pass.flavor=The captain finally opens the book. The passenger has boarded this ship under three names, each time accompanied by a crate from the same serpent shrine.
5.sea.fail.flavor=The captain ends the discussion with a gesture. His crew drags you into the passage, and their rough handling leaves you nursing an injury.
5.sea.info=
5.sea.pass.info=[#GOOD]Gain this Clue.[]
5.sea.fail.info=[#BAD]Gain an Injury condition.[]

6.sea.flavor=A sailor admits that a serpent idol was smuggled aboard, then refuses to name the passenger responsible. You try to win his confidence over a meal he has scarcely touched.
6.sea.pass.flavor=He pushes your bowl aside and speaks quickly. The meal was prepared for you, and the person who ordered it keeps the idol hidden in a locked sea chest.
6.sea.fail.flavor=He will not meet your eye. By the time you notice the bitter sediment in your bowl, your tongue has begun to go numb.
6.sea.info=
6.sea.pass.info=[#GOOD]Gain this Clue.[]
6.sea.fail.info=[#BAD]Gain Poisoned.[]

7.sea.flavor=Fog conceals the bow until a lantern swings out of it. The sailor holding it has wrapped a chart around his arm beneath a serpent tattoo. He draws a knife when he sees you reading the marks.
7.sea.pass.flavor=You overcome the sailor and unroll the chart. Its penciled bearings lead between isolated islands, each marked with the same serpent sign.
7.sea.fail.flavor=The sailor vanishes into the fog with the chart. You search the forward deck, but find only the lantern swinging above the empty rail.
7.sea.info=[#BAD]A Cultist ambushes you.[]
7.sea.pass.info=[#GOOD]Gain this Clue.[]
7.sea.fail.info=

8.sea.flavor=A passenger claims he can hear ancient objects calling beneath the sea. He has begun refusing meals and watching the cargo hatch. You ask him what he heard before the ship left port.
8.sea.pass.flavor=He describes a call answered from somewhere inland. The details match the movements of Yig's worshippers, and give you a place to continue the search.
8.sea.fail.flavor=He closes his cabin door after the first question. The next time you pass, even the keyhole has been covered from within.
8.sea.flavor.2=Later, a faint answering note rises from the relics in your possession. You begin to wonder what is listening, and whether it already knows where you sleep.
8.sea.info=
8.sea.pass.info=[#GOOD]Gain this Clue.[]
8.sea.fail.info=
8.sea.info.2=[#BAD]Lose 1 Sanity and gain Paranoia.[]

9.sea.flavor=Tablets recovered from a wreck lie drying beside a body wrapped in sailcloth. Their characters grow clearer as the salt falls away. You attempt to identify the language before the brittle surface crumbles.
9.sea.pass.flavor=You recognize the record of an exile from a vanished continent. The crew entrusts the tablets to you, relieved that someone can give their disturbing cargo a name.
9.sea.fail.flavor=The characters refuse any meaning you can hold. Behind you, the wrapped body begins whispering a translation that stops whenever another sailor enters.
9.sea.info=
9.sea.pass.info=[#GOOD]Gain the Zanthu Tablets Artifact.[]
9.sea.fail.info=[#BAD]Gain Hallucinations.[]

10.sea.flavor=A wreck caught on the reef holds the last records of an expedition to serpent-haunted islands. You search its tilted cabins, pushing through cramped gaps while dark shapes move in the flooded passages.
10.sea.pass.flavor=You find the captain's notes sealed inside a lamp housing. They record the expedition's final landing and the signs that warned him to turn back.
10.sea.fail.flavor=Something strikes your hand beneath the water. Feverish images crowd your sight as you struggle out of the wreck, unable to distinguish broken timbers from moving coils.
10.sea.info=You may [#BAD]spend 2 Health[] to reroll up to 2 dice.
10.sea.pass.info=[#GOOD]Gain this Clue.[]
10.sea.fail.info=[#BAD]Lose 2 Sanity and gain Poisoned.[]

11.sea.flavor=A prisoner breaks free on the afterdeck, scattering his escorts. He clutches a marked chart and looks toward the distant shore. When you block his path, he turns on you with a hiss.
11.sea.pass.flavor=You bring him down before he reaches the rail. The chart and his captors' account together reveal the route by which the cult moves its fugitives.
11.sea.fail.flavor=He clears the rail with the chart still in his fist. The last you see is a narrow wake heading toward the wilderness beyond the coast.
11.sea.info=[#BAD]A Cultist ambushes you.[]
11.sea.pass.info=[#GOOD]Gain this Clue.[]
11.sea.fail.info=[#BAD]Move this Clue to the nearest expedition space.[]

12.sea.flavor=Your boat drifts among wreckage, its papers scattered across water too dark to see through. An unseen swimmer offers to recover both your bearings and your evidence. The voice in your mind asks for a lasting pledge.
12.sea.pass.flavor=You make the pledge. A dry packet rises from the water beside you, and the swimmer guides your boat toward the lights of a passing vessel.
12.sea.fail.flavor=The swimmer withdraws, taking the scattered papers into the dark. You drift without a bearing until a distant ship finds you long after your planned arrival.
12.sea.pass.info=[#GOOD]Gain this Clue.[]
12.sea.fail.info=[#BAD]Discard this Clue and become Delayed.[]
12.sea.info=You may [#BAD]gain Dark Pact[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]discard this Clue and become Delayed.[]

13.sea.flavor=A figure wearing the face of someone lost to this struggle waits outside your cabin. It knows exactly how to greet you. Then its borrowed expression slips, and something ancient reaches through the disguise.
13.sea.pass.flavor=You defeat the impostor and uncover the signs by which it chose its borrowed identity. The knowledge is useful, but the memory of that familiar greeting will not leave you.
13.sea.fail.flavor=The impostor escapes among the passengers. Somewhere on this ship it is already choosing another trusted face through which to continue Yig's work.
13.sea.info=Discard a defeated investigator token from the board. [#BAD]A Serpent People then ambushes you.[]
13.sea.pass.info=[#BAD]Lose 1 Sanity[] and [#GOOD]gain this Clue.[]
13.sea.fail.info=[#BAD]Advance Doom by 1.[]

14.sea.flavor=Two sealed cases lie in the submerged hold of a research vessel. You study the shifting beams and tangled rigging, looking for a route that will still be open when the swell returns.
14.sea.pass.flavor=You bring both cases through the gap. One contains the expedition's observations; the other holds samples that make their most unlikely claims difficult to dismiss.
14.sea.fail.flavor=The swell drives you into the wreckage and closes the opening above. You fight your way out, bruised and gasping, with the darkness of the hold still pressing behind your eyes.
14.sea.info=
14.sea.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
14.sea.fail.info=[#BAD]Lose 2 Health and 2 Sanity.[]

15.sea.flavor=A salvage bell rises with a sealed bronze vessel caught beneath it. As the crew opens the lid, a serpent being unfolds from within, speaking in a furious rush before it attacks.
15.sea.pass.flavor=You keep your thoughts steady enough to follow its words. Through its anger, it reveals the name of the kingdom from which it was cast out.
15.sea.fail.flavor=Its fangs break through during the struggle. A spreading heat around the wound tells you what the bite has left behind.
15.sea.pass.flavor.2=When the struggle ends, its fangs have found no purchase. You have escaped the creature's venom.
15.sea.pass.info.2=
15.sea.fail.flavor.2=The creature's words dissolve into a roar inside your head. You retain none of the history hidden in its outburst.
15.sea.fail.info.2=
15.sea.info=[#BAD]A Serpent People ambushes you.[]
15.sea.pass.info=[#GOOD]Gain this Clue.[]
15.sea.fail.info=[#BAD]Gain Poisoned.[]

16.sea.flavor=A song carries across the water after midnight. Each note makes the rail seem closer and the deck less real. You brace yourself against the pull and try to hold the ship in your thoughts.
16.sea.pass.flavor=The song loses its grip. In the silence afterward, you notice its rhythm echoed by marks cut beneath the rail, linking the summons to someone already aboard.
16.sea.fail.flavor=You lunge toward the water before the crew catches you. Their rescue wrenches your back against the railing, leaving you scarcely able to straighten.
16.sea.info=
16.sea.pass.info=[#GOOD]Gain this Clue.[]
16.sea.fail.info=[#BAD]Gain Back Injury.[]

17.sea.flavor=The radio receives a distress call from a ship that sank a century ago. Beneath the static, another voice gives directions in a slow hiss. You search the signal for a detail that might locate its source.
17.sea.pass.flavor=You distinguish a modern call sign beneath the antique message. The transmission is a mask, concealing orders to a vessel carrying supplies for Yig's followers.
17.sea.fail.flavor=The signal carries on after you remove the headphones. Its directions shift inland, while phantom voices leave you unable to separate any useful bearing from the noise.
17.sea.info=
17.sea.pass.info=[#GOOD]Gain this Clue.[]
17.sea.fail.info=[#BAD]Gain Hallucinations and move this Clue to the nearest expedition space.[]

18.sea.flavor=A hidden mechanism beneath the deck beats in time with distant tremors through the hull. Each stroke sends a faint green light into the water. You examine its moving parts for a way to interrupt the signal.
18.sea.pass.flavor=You find the pin joining the two rhythms and pull it free. The green light dies, and far beneath the ship the answering tremors fall out of step.
18.sea.fail.flavor=The rhythm changes to match your pulse. You back away, but feel it following you through the ship, as though something below can now distinguish you from the others.
18.sea.info=
18.sea.pass.info=[#GOOD]Retreat Doom by 1.[]
18.sea.fail.info=[#BAD]Lose 1 Sanity and gain Paranoia.[]

19.sea.flavor=A passage absent from the ship's plans descends below the waterline. At its far end, unfamiliar stars shine over a still black sea. You examine the threshold for some sign of who made it.
19.sea.pass.flavor=Small devotional marks reveal that its makers fear Yig rather than serve him. Their hidden route explains how fugitives have crossed seas without appearing in any port.
19.sea.fail.flavor=You step too far while studying the frame. Behind you, the corridor becomes another strip of black water, and the ship is nowhere beneath the alien stars.
19.sea.info=
19.sea.pass.info=[#GOOD]Gain this Clue.[]
19.sea.fail.info=[#BAD]Gain Lost in Time and Space.[]

20.sea.flavor=A drifting lifeboat bumps against the hull, carrying a sealed notebook and no visible crew. The boards beneath its seats scrape softly. You lower yourself aboard and look for the source of the sound.
20.sea.pass.flavor=You spot a cobra beneath the bench and lift the notebook from the opposite side. Its entries trace the boat's route from an island sanctuary of Yig.
20.sea.fail.flavor=You reach under the bench before seeing the coiled shape. The cobra strikes hard, and pain gives way to a creeping numbness as you scramble back aboard.
20.sea.info=
20.sea.pass.info=[#GOOD]Gain this Clue.[]
20.sea.fail.info=[#BAD]Lose 1 Health and gain Poisoned.[]

21.sea.flavor=A narrow breach leads into the wreck's strongroom. Inside, a chain moves with a rhythm unlike the waves. You watch the opening carefully before reaching for the documents beyond it.
21.sea.pass.flavor=The chain shifts around a huge sleeping snake. You retrieve the documents through a second gap, finding both its destination and the name of the person who ordered it shipped.
21.sea.fail.flavor=The shape beside the chain coils around your chest. You wrench yourself free of the breach, but every breath afterward carries a deep, sickening pain.
21.sea.info=
21.sea.pass.info=[#GOOD]Gain this Clue.[]
21.sea.fail.info=[#BAD]Lose 2 Health and gain Internal Injury.[]

22.sea.flavor=The ship's framed photographs show a different crew whenever you pass. You take them down and compare them beneath a steady lamp, searching for the detail that survives each change.
22.sea.pass.flavor=Every version includes the same small pouch beside the captain's chair. Inside it, shed snakeskins surround a written invocation responsible for the shifting images.
22.sea.fail.flavor=The faces keep changing until you can no longer remember the crew you boarded with. Even away from the photographs, unfamiliar people appear at the edges of your sight.
22.sea.info=
22.sea.pass.info=[#GOOD]Gain this Clue.[]
22.sea.fail.info=[#BAD]Lose 2 Sanity and gain Hallucinations.[]

23.sea.flavor=A weary pilgrim is confined below deck with a charm the crew refuses to touch. He claims it can turn Yig's attention aside. You ask the captain for permission to speak with him.
23.sea.pass.flavor=The captain relents. The pilgrim shows you how the charm was made and offers its pattern for study, or its protection should Yig's curse ever fall upon you.
23.sea.fail.flavor=The captain refuses, and a sailor drives you away from the hatch with the butt of a boathook. The pilgrim's explanation is lost beneath the shouted orders.
23.sea.option.1.flavor=You let the pilgrim turn the charm toward you. Its surface clouds, then clears, and the weight of Yig's attention finally lifts.
23.sea.option.1.info=[#GOOD]Discard your Cursed condition.[]
23.sea.option.2.flavor=You copy the charm's pattern and the pilgrim's account of its makers. Together they give you a new way to understand the serpent cult's enemies.
23.sea.option.2.info=[#GOOD]Gain this Clue.[]
23.sea.info=
23.sea.pass.info=[#GOOD]Gain this Clue or discard your Cursed condition.[]
23.sea.fail.info=[#BAD]Lose 1 Health.[]

24.sea.flavor=The island's stone guardians split open as you approach, releasing creatures that drag remnants of robes behind their scales. You fight to reach the inscription they were placed here to guard.
24.sea.pass.flavor=You force a path to the inscription and compare it with the creatures around you. Their former names and the cause of their transformation are both recorded in the stone.
24.sea.fail.flavor=The guardians drive you beneath the inscription's shadow. A change passes through your body and mind; practiced movements become clumsy, and hard-earned knowledge slips beyond recall.
24.sea.info=
24.sea.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
24.sea.fail.info=[#BAD]Discard all your improvement tokens.[]
