# Original narrative; gameplay adapted from https://eldritchhorror.fandom.com/wiki/Yig
# Intro instructions omit test outcomes; only the resolved branch is revealed after a test.
1.city.flavor=A torn shipping ledger links a quiet shop to an expedition that vanished years ago.
1.city.info=
1.city.pass.info=[#GOOD]Gain this Clue.[]
1.city.fail.info=[#BAD]Lose 1 Sanity and move this Clue to the nearest expedition space.[]

2.city.flavor=The stranger at the window speaks directly into your thoughts. You fight to remember your own name.
2.city.info=
2.city.pass.info=[#GOOD]Gain this Clue.[]
2.city.fail.info=[#BAD]Gain Hallucinations.[]

3.city.flavor=A collector lets you inspect his sealed cabinet. Something inside has been shedding its skin.
3.city.info=
3.city.pass.info=[#GOOD]Gain this Clue.[]
3.city.fail.info=[#BAD]Lose 1 Health and gain Poisoned.[]

4.city.flavor=A masked worshipper blocks the alley with a curved blade. The answers you need are in his satchel.
4.city.info=[#BAD]A Cultist ambushes you.[]
4.city.pass.info=[#GOOD]Gain this Clue.[]
4.city.fail.info=

5.city.flavor=A frightened porter knows where the strange cargo went. You must persuade him before he leaves town.
5.city.info=
5.city.pass.info=[#GOOD]Gain this Clue.[]
5.city.fail.info=[#BAD]Move this Clue to the nearest expedition space.[]

6.city.flavor=The temple keeper offers a protective rite, but the relics you carry cast unfamiliar shadows.
6.city.info=
6.city.pass.info=[#GOOD]Gain Blessed.[]
6.city.fail.info=[#BAD]Lose 2 Health and gain Poisoned.[]

7.city.flavor=A voice beneath the floor offers forbidden knowledge in return for a promise it will collect later.
7.city.info=You may [#BAD]gain Dark Pact[] to [#GOOD]gain this Clue and let one investigator discard Cursed.[]

8.city.flavor=A weapon lies beneath a glass serpent. The inscriptions around it may explain how to break the seal.
8.city.info=
8.city.pass.info=[#GOOD]Gain this Clue and a Weapon Artifact.[]
8.city.fail.info=[#BAD]Lose 2 Sanity and gain Poisoned.[]

9.city.flavor=You interrupt an initiation beneath an abandoned theater. The last initiate turns to face you.
9.city.info=[#BAD]A Cultist ambushes you.[]
9.city.pass.info=[#GOOD]Gain this Clue and improve Will.[]
9.city.fail.info=

10.city.flavor=Someone concealed a second message inside the first. Finding it means searching a dangerously unstable room.
10.city.info=
10.city.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
10.city.fail.info=[#BAD]Lose 1 Health and gain Leg Injury.[]

11.city.flavor=A stolen manuscript describes the hour when the sleeping god will stir. Its final symbol is still wet.
11.city.info=
11.city.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
11.city.fail.info=[#BAD]Advance Doom by 1 unless you gain Cursed.[]

12.city.flavor=You follow a trail of scales through crowded streets. A hidden observer follows you in turn.
12.city.info=
12.city.pass.info=[#GOOD]Gain this Clue.[]
12.city.fail.info=[#BAD]Gain Poisoned.[]

13.city.flavor=Every passenger on the tram seems to share the same unblinking eyes. You force yourself to keep watching.
13.city.info=
13.city.pass.info=[#GOOD]Gain this Clue.[]
13.city.fail.info=[#BAD]Lose 2 Sanity and gain Paranoia.[]

14.city.flavor=A fleeing informant drops a packet beyond a broken staircase. You search for a safe way down.
14.city.info=
14.city.pass.info=[#GOOD]Gain this Clue.[]
14.city.fail.info=[#BAD]Gain Leg Injury.[]

15.city.flavor=A suspicious official offers access to a warded chamber, but demands that you surrender something of yourself.
15.city.info=You may [#BAD]spend 1 improvement token[] to [#GOOD]let one investigator discard Cursed.[] Otherwise, [#BAD]gain Detained.[]

16.city.flavor=An ally disappears while investigating an elegant townhouse. The person who opens its door is no longer human.
16.city.info=[#BAD]Discard 1 Ally Asset. A Serpent People then ambushes you.[]
16.city.pass.info=[#GOOD]Gain this Clue.[]
16.city.fail.info=[#BAD]Gain Cursed.[]

17.city.flavor=A bookseller unwraps a volume bound in unfamiliar leather. The writing moves like a nest of tiny snakes.
17.city.info=
17.city.pass.info=[#GOOD]Gain a Tome Artifact.[]
17.city.fail.info=[#BAD]Gain Cursed.[]

18.city.flavor=You secure the witness's notes just before the witness sheds a very convincing disguise.
18.city.info=[#GOOD]Gain this Clue.[] Then [#BAD]a Serpent People ambushes you.[]
18.city.fail.info=[#BAD]Gain Poisoned.[]

19.city.flavor=You search a locked office while footsteps echo along the corridor outside.
19.city.info=
19.city.pass.info=[#GOOD]Gain this Clue.[]
19.city.fail.info=[#BAD]Gain Detained.[]

20.city.flavor=A physician recognizes the marks on your skin. His records may reveal how far the infection has spread.
20.city.info=If you are Poisoned, [#BAD]gain Cursed.[]
20.city.pass.info=[#GOOD]Gain this Clue.[]
20.city.fail.info=

21.city.flavor=The wall is covered in photographs of people who never existed. You strain to find a face you can trust.
21.city.info=You may [#BAD]spend 2 Sanity[] to reroll up to 2 dice.
21.city.pass.info=[#GOOD]Gain this Clue.[]
21.city.fail.info=[#BAD]Gain Amnesia, Hallucinations, and Paranoia.[]

22.city.flavor=An ancient jailer guards a room of sleeping captives. Its defeat may free more than their bodies.
22.city.info=[#BAD]A Serpent People ambushes you.[]
22.city.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
22.city.fail.info=

23.city.flavor=The courier will not survive the night without your help. Keeping him alive will take a painful sacrifice.
23.city.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]move this Clue to the nearest expedition space.[]

24.city.flavor=You climb through the machinery of an abandoned factory, following an intermittent green light.
24.city.info=
24.city.pass.info=[#GOOD]Gain this Clue.[]
24.city.fail.info=[#BAD]Lose 2 Health and gain Leg Injury.[]

1.wilderness.flavor=A stone door conceals an old cache. The surrounding ruins suggest that it was sealed for a reason.
1.wilderness.info=
1.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
1.wilderness.fail.info=[#BAD]Lose 2 Health and gain Back Injury.[]

2.wilderness.flavor=A shrine bears the names of those once marked by Yig. You try to reconstruct its cleansing ritual.
2.wilderness.info=
2.wilderness.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
2.wilderness.fail.info=[#BAD]Lose 2 Health and gain Poisoned.[]

3.wilderness.flavor=Among the expedition's records you find directions to a dark sphere half-buried nearby.
3.wilderness.info=[#GOOD]Gain this Clue.[]
3.wilderness.pass.info=[#GOOD]Gain the Cursed Sphere Artifact.[]
3.wilderness.fail.info=[#BAD]Gain Cursed.[]

4.wilderness.flavor=The path collapses into a narrow ravine. You cling to the rock while your equipment drags you downward.
4.wilderness.info=
4.wilderness.pass.info=[#GOOD]Gain this Clue.[]
4.wilderness.fail.info=[#BAD]Lose 1 Health and discard 2 Item possessions.[]

5.wilderness.flavor=The survey markers surround a patch of unusually lush ground. Nothing living approaches its center.
5.wilderness.info=On an expedition space, [#BAD]gain Poisoned.[]
5.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
5.wilderness.fail.info=

6.wilderness.flavor=A blood-worn altar still offers a path out of the serpent's curse. The ground beneath it is growing hot.
6.wilderness.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue and let one investigator discard Cursed.[] If Yig is awake, [#BAD]lose 2 Health.[]

7.wilderness.flavor=A lone worshipper waits beside the abandoned camp. His poison may destroy the evidence before you can read it.
7.wilderness.info=[#BAD]A Cultist ambushes you.[]
7.wilderness.pass.info=[#GOOD]Gain this Clue.[]
7.wilderness.fail.info=You are Poisoned and cannot gain this Clue.

8.wilderness.flavor=The sealed jar contains the answer you need, but opening it will release the vapor trapped inside.
8.wilderness.info=You may [#BAD]gain Poisoned[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]discard this Clue and 1 Ally Asset.[]

9.wilderness.flavor=Two sets of tracks lead toward a forgotten clearing. You search for the point where they became one.
9.wilderness.info=
9.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
9.wilderness.fail.info=
9.wilderness.info.2=[#BAD]Lose 2 Health.[]

10.wilderness.flavor=The monument responds to the venom in your blood. A faint pulse passes through the earth.
10.wilderness.info=If Poisoned, [#BAD]advance Doom by 1.[]
10.wilderness.pass.info=[#GOOD]Gain this Clue.[]
10.wilderness.fail.info=

11.wilderness.flavor=The trail runs between identical stones. Each time you turn back, there is one more behind you.
11.wilderness.info=
11.wilderness.pass.info=[#GOOD]Gain this Clue.[]
11.wilderness.fail.info=[#BAD]Gain Lost in Time and Space.[]

12.wilderness.flavor=You find a living root wrapped around an expedition journal. Separating them will demand more than patience.
12.wilderness.info=
12.wilderness.pass.info=You may [#BAD]spend 2 Health[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]gain Cursed.[]
12.wilderness.fail.info=[#BAD]Gain Cursed.[]

13.wilderness.flavor=The wilderness is silent except for a voice that knows your private fears. You concentrate on your companions' footprints.
13.wilderness.info=
13.wilderness.pass.info=[#GOOD]Recover 2 Sanity.[]
13.wilderness.fail.info=[#BAD]Gain Paranoia.[]

14.wilderness.flavor=A weathered tablet describes an oath between humans and serpents. You try to read its missing terms.
14.wilderness.info=
14.wilderness.pass.info=[#GOOD]Gain this Clue.[]
14.wilderness.fail.info=[#BAD]Gain Cursed.[]

15.wilderness.flavor=An ancient guardian emerges beside a half-completed ritual circle. There may still be time to interrupt its work.
15.wilderness.info=[#BAD]A Serpent People ambushes you.[]
15.wilderness.pass.info=[#GOOD]Gain this Clue and retreat Doom by 1.[]
15.wilderness.fail.info=[#BAD]Gain Poisoned.[]

16.wilderness.flavor=A hermit's shelter contains pages pinned beneath stones. Their sequence forms a working spell.
16.wilderness.info=
16.wilderness.pass.info=[#GOOD]Gain this Clue and a Spell.[]
16.wilderness.fail.info=[#BAD]Gain Hallucinations.[]

17.wilderness.flavor=You catch a serpent scholar studying the ruins. Even surviving its attack may reveal something of its purpose.
17.wilderness.info=[#BAD]A Serpent People ambushes you.[]
17.wilderness.pass.info=[#GOOD]Gain this Clue.[]
17.wilderness.pass.info.2=[#GOOD]Gain 1 additional Clue.[]

18.wilderness.flavor=A patrol mistakes you for the people responsible for the disappearances. You try to explain before they take you away.
18.wilderness.info=
18.wilderness.pass.info=[#GOOD]Gain this Clue.[]
18.wilderness.fail.info=[#BAD]Move to the nearest City and gain Detained.[]

19.wilderness.flavor=The last caretaker of the shrine listens to your story. Her trust may lift an old burden.
19.wilderness.info=
19.wilderness.pass.info=[#GOOD]Gain this Clue and let one investigator discard Cursed.[]
19.wilderness.fail.info=[#BAD]Gain Cursed.[]

20.wilderness.flavor=The missing expedition's map is intact. A second compartment in its case may hold an even better lead.
20.wilderness.info=[#GOOD]Gain this Clue.[]
20.wilderness.pass.info=[#GOOD]Gain 1 additional Clue.[]
20.wilderness.fail.info=[#BAD]Gain Poisoned.[]

21.wilderness.flavor=A crowned figure offers you its ancient treasure. In exchange, it wants your evidence and a promise.
21.wilderness.info=You may [#BAD]gain Dark Pact and discard this Clue[] to [#GOOD]gain the Serpent Crown.[] Otherwise, [#BAD]lose 2 Sanity and discard 2 Ally Assets.[]

22.wilderness.flavor=The buried chamber contains two converging trails of evidence. Its guardians left something else behind as well.
22.wilderness.info=
22.wilderness.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
22.wilderness.fail.info=[#BAD]Gain Poisoned and Cursed.[]

23.wilderness.flavor=A vial still glows among the ruins of an ancient infirmary. You search for signs that its contents remain safe.
23.wilderness.info=
23.wilderness.pass.info=[#GOOD]Gain the Elixir of Life Artifact.[]
23.wilderness.fail.info=[#BAD]Gain Poisoned.[]

24.wilderness.flavor=You press onward through oppressive heat. The venom makes every landmark look strangely familiar.
24.wilderness.info=If Poisoned, [#BAD]lose 1 Health and 1 Sanity.[]
24.wilderness.pass.info=[#GOOD]Gain this Clue.[]
24.wilderness.fail.info=

1.sea.flavor=A stowaway left a trail through the cargo hold. You follow it toward a slowly moving crate.
1.sea.info=
1.sea.pass.info=[#GOOD]Gain this Clue.[]
1.sea.fail.info=[#BAD]Gain Poisoned.[]

2.sea.flavor=You wake on deck with a page of coordinates in your hand. The last port is missing from your memory.
2.sea.info=
2.sea.pass.info=[#GOOD]Gain this Clue.[]
2.sea.fail.info=[#BAD]Gain Amnesia and move this Clue to the nearest expedition space.[]

3.sea.flavor=Something beneath the hull offers to teach you skills no human master knows. Its price reaches beyond this voyage.
3.sea.info=You may [#BAD]spend 2 Sanity and gain Dark Pact[] to [#GOOD]improve two different skills of your choice.[]

4.sea.flavor=An inscription on a salvaged anchor describes a rite intended to wake what sleeps below the waves.
4.sea.info=
4.sea.pass.info=[#GOOD]Gain this Clue.[]
4.sea.fail.info=[#BAD]Advance Doom by 1.[]

5.sea.flavor=The captain has locked away the logbook. You negotiate while the crew prepares to throw you off the ship.
5.sea.info=
5.sea.pass.info=[#GOOD]Gain this Clue.[]
5.sea.fail.info=[#BAD]Gain an Injury condition.[]

6.sea.flavor=A sailor knows which passenger smuggled the serpent idol aboard. He is afraid of what will happen if he talks.
6.sea.info=
6.sea.pass.info=[#GOOD]Gain this Clue.[]
6.sea.fail.info=[#BAD]Gain Poisoned.[]

7.sea.flavor=A worshipper emerges from the fog on the forward deck. He carries a chart marked with the serpent's sign.
7.sea.info=[#BAD]A Cultist ambushes you.[]
7.sea.pass.info=[#GOOD]Gain this Clue.[]
7.sea.fail.info=

8.sea.flavor=The purser can trace the strange cargo, but your relics have already begun to disturb the passengers' dreams.
8.sea.info=
8.sea.pass.info=[#GOOD]Gain this Clue.[]
8.sea.fail.info=
8.sea.info.2=[#BAD]Lose 1 Sanity and gain Paranoia.[]

9.sea.flavor=Stone tablets recovered from a wreck are drying in the cabin. Their ancient text may be a warning.
9.sea.info=
9.sea.pass.info=[#GOOD]Gain the Zanthu Tablets Artifact.[]
9.sea.fail.info=[#BAD]Gain Hallucinations.[]

10.sea.flavor=The wreck shifts beneath you as you search its cabins. You can push your body further if the first search fails.
10.sea.info=You may [#BAD]spend 2 Health[] to reroll up to 2 dice.
10.sea.pass.info=[#GOOD]Gain this Clue.[]
10.sea.fail.info=[#BAD]Lose 2 Sanity and gain Poisoned.[]

11.sea.flavor=A messenger attempts to send the final chart overboard. A cultist rushes to cover his escape.
11.sea.info=[#BAD]A Cultist ambushes you.[]
11.sea.pass.info=[#GOOD]Gain this Clue.[]
11.sea.fail.info=[#BAD]Move this Clue to the nearest expedition space.[]

12.sea.flavor=An unseen passenger offers to recover the lost papers. Refusing may leave you stranded in port.
12.sea.info=You may [#BAD]gain Dark Pact[] to [#GOOD]gain this Clue.[] Otherwise, [#BAD]discard this Clue and become Delayed.[]

13.sea.flavor=A lost investigator's trail ends aboard this vessel. The thing that took their place is still here.
13.sea.info=Discard a defeated investigator token from the board. [#BAD]A Serpent People then ambushes you.[]
13.sea.pass.info=[#BAD]Lose 1 Sanity[] and [#GOOD]gain this Clue.[]
13.sea.fail.info=[#BAD]Advance Doom by 1.[]

14.sea.flavor=The submerged hold contains two waterproof cases. Reaching them means navigating through a maze of wreckage.
14.sea.info=
14.sea.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
14.sea.fail.info=[#BAD]Lose 2 Health and 2 Sanity.[]

15.sea.flavor=A passenger's disguise falls away in the lamplight. You try to grasp what it has revealed before it attacks.
15.sea.info=[#BAD]A Serpent People ambushes you.[]
15.sea.pass.info=[#GOOD]Gain this Clue.[]
15.sea.fail.info=[#BAD]Gain Poisoned.[]

16.sea.flavor=A distant song draws you toward the railing. You brace yourself against the need to follow it.
16.sea.info=
16.sea.pass.info=[#GOOD]Gain this Clue.[]
16.sea.fail.info=[#BAD]Gain Back Injury.[]

17.sea.flavor=You search the radio room for the source of a message that should have been impossible to receive.
17.sea.info=
17.sea.pass.info=[#GOOD]Gain this Clue.[]
17.sea.fail.info=[#BAD]Gain Hallucinations and move this Clue to the nearest expedition space.[]

18.sea.flavor=A hidden device beneath the deck is keeping time with something far below. You look for a way to silence it.
18.sea.info=
18.sea.pass.info=[#GOOD]Retreat Doom by 1.[]
18.sea.fail.info=[#BAD]Lose 1 Sanity and gain Paranoia.[]

19.sea.flavor=An unmarked passage leads below the waterline. Its far end shows a sky with unfamiliar stars.
19.sea.info=
19.sea.pass.info=[#GOOD]Gain this Clue.[]
19.sea.fail.info=[#BAD]Gain Lost in Time and Space.[]

20.sea.flavor=You search a drifting lifeboat. Its sole occupant has left a sealed notebook beneath the seats.
20.sea.info=
20.sea.pass.info=[#GOOD]Gain this Clue.[]
20.sea.fail.info=[#BAD]Lose 1 Health and gain Poisoned.[]

21.sea.flavor=A narrow opening offers access to the wreck's strongroom. You watch for the next movement of the waves.
21.sea.info=
21.sea.pass.info=[#GOOD]Gain this Clue.[]
21.sea.fail.info=[#BAD]Lose 2 Health and gain Internal Injury.[]

22.sea.flavor=The ship's photographs show a different crew every time you examine them. You search for the one constant detail.
22.sea.info=
22.sea.pass.info=[#GOOD]Gain this Clue.[]
22.sea.fail.info=[#BAD]Lose 2 Sanity and gain Hallucinations.[]

23.sea.flavor=A weary pilgrim offers either information or a rite of absolution. You must convince him that your need is real.
23.sea.info=
23.sea.pass.info=[#GOOD]Gain this Clue or discard your Cursed condition.[]
23.sea.fail.info=[#BAD]Lose 1 Health.[]

24.sea.flavor=You haul the last of the evidence from the rising water. A vast pressure pushes against you from beneath the ship.
24.sea.info=
24.sea.pass.info=[#GOOD]Gain this Clue and 1 additional Clue.[]
24.sea.fail.info=[#BAD]Discard all your improvement tokens.[]
