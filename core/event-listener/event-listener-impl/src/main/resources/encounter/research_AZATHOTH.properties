# Rewritten narrative for the Azathoth research encounters; mechanics are unchanged.
# "Orb" is a token on the Green Omen. Every tested encounter narrates both its pass and fail branch.
# Flavor and rules stay separate. An empty outcome info means no additional mechanical effect.
# Question encounters: pass.* is used when you accept, fail.* when you decline.

# ---------------------------------------------------------------- CITY

# Test Observation -1
1.city.flavor=In a dockside warehouse, you hear a clatter between the shelves. A metal crate on jointed legs scuttles toward the loading door. You slip after it.
1.city.pass.flavor=The thing leads you to a cellar where cultists are unloading more of its kind. Their crates bear a shipping mark you can trace, and a crumpled manifest names a second address.
1.city.pass.info.1=[#GOOD]Gain this Clue.[]
1.city.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
1.city.fail.flavor=The crate squeezes through a drainage grate, and its clatter fades beneath the street. You are left alone in the dark warehouse.
1.city.fail.info=

# Test Lore
2.city.flavor=While the orchestra tunes up, a stagehand pockets your money and lets you leaf through the score of Massa di Requiem per Shuggay. The notes are unlike any you have seen, and the chorus is written in a tongue you cannot name.
2.city.pass.flavor=You recognize the chorus as an invocation of Azathoth. You copy the opening bars, then tell the manager you smell gas. He clears the theater before the curtain can rise.
2.city.pass.info=[#GOOD]Gain this Clue.[]
2.city.fail.flavor=You find nothing in the score to justify stopping the performance. By the final act, the audience sways to music that reaches far beyond the theater.
2.city.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Observation
3.city.flavor=A university laboratory reports that its radium has been stolen. The thieves left no fingerprints, but a faint green residue coats the empty lead case.
3.city.pass.flavor=You trace the residue to a basement chapel. Chalk spirals on the floor and a hymn to the Daemon Sultan confirm that the cult of Azathoth took the radium.
3.city.pass.info=[#GOOD]Gain this Clue.[]
3.city.fail.flavor=The trail goes nowhere. The scientists describe in detail what a madman could do with the radium, and you lie awake imagining it.
3.city.fail.info=[#BAD]Lose 1 Sanity.[]

# Test Strength
4.city.flavor=Three geologists were last seen hunched over a stone hauled out of a fresh crater. Their workroom is silent now, and the specimen on the bench throbs with a heat that seeps straight into your marrow.
4.city.pass.flavor=You endure the burning sensation long enough to chip off a sample and record the stone's strange properties.
4.city.pass.info=[#GOOD]Gain this Clue.[]
4.city.fail.flavor=Nausea doubles you over. Even after you stagger out into the street, the burning pain beneath your ribs grows worse.
4.city.fail.info=[#BAD]Gain an Internal Injury Condition.[]

# Test Observation
5.city.flavor=From the operating gallery, you watch the surgeons open the skull of a patient who swears there is a creature in his head. As they lift the bone away, you lean over the rail for a closer look.
5.city.pass.flavor=Something stirs between the folds of the patient's brain. You point it out, and a surgeon traps the translucent, insect-like shan under glass. As it struggles, the patient begins to speak of its masters. You write down his words.
5.city.pass.info.1=[#GOOD]Gain this Clue.[]
5.city.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
5.city.fail.flavor=You see only tissue and blood. You never notice the shan slipping from the patient into your own mind, nor the secrets it carries back to its hive.
5.city.fail.info=[#BAD]Advance Doom by 1 for each Orb on the Green Omen.[]

# Test Influence
6.city.flavor=Edward Pickman Derby, the young poet behind Azathoth and Other Horrors, holds a reading for a small, rapt audience. Afterward, you corner him and ask where his ideas come from.
6.city.pass.flavor=Flattered, Derby confides that the poems came to him in dreams, and he names the bookshop where he bought the volume that started them.
6.city.pass.info=[#GOOD]Gain this Clue.[]
6.city.fail.flavor=Derby laughs off the question and changes the subject. Before dawn, word of your visit reaches the cultists, who hurry their preparations.
6.city.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Will
7.city.flavor=For days your memories have been changing. Something inside your skull is rewriting them, trying to steer you. You fight to remember who you really are.
7.city.pass.flavor=With a final effort, you force the intruder out. A translucent insect crawls from your ear and flutters away, and in its wake you glimpse a sky with the wrong number of suns.
7.city.pass.info=[#GOOD]Gain this Clue.[]
7.city.fail.flavor=Real and false recollections blur together. Whole days of your investigation are simply gone.
7.city.fail.info=[#BAD]Gain an Amnesia Condition.[]

# Test Observation -1
8.city.flavor=For one night only, the observatory hands you the keys to its great refractor. Rumor says a green comet is closing on Earth, and you mean to find it.
8.city.pass.flavor=Near dawn you find it: a faint green smear moving against the stars. You calculate its path, and the result is deeply troubling.
8.city.pass.info.1=[#GOOD]Gain this Clue.[]
8.city.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
8.city.fail.flavor=By dawn your eyes ache, and you still haven't seen the comet. The astronomers ask you to stay until the next clear night.
8.city.fail.info=[#BAD]Become Delayed.[]

# Test Observation -1
9.city.flavor=Streetlamps and neon wash out the night sky, so you barely glimpse the green fire tearing down toward the very block where you stand.
9.city.pass.flavor=You throw yourself behind a parked car as the stone hits. When the smoke clears, you climb into the crater. A piece of green glass at the bottom is still warm to the touch.
9.city.pass.info=[#GOOD]Gain this Clue.[]
9.city.fail.flavor=The impact throws you across the street and through a shop window.
9.city.fail.info=[#BAD]Lose 2 Health.[]

# Test Observation -2
10.city.flavor=On a shelf in a cramped bookshop, a line of ink runs across the spines of several mismatched volumes. It breaks wherever two books meet. You start rearranging them.
10.city.pass.flavor=You slide the last volume into place. The ink lines join to form a chart of the heavens. In the lettering around its edge you find the name of the next sign.
10.city.pass.info.1=[#GOOD]Gain this Clue.[]
10.city.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
10.city.fail.flavor=You shuffle the books for hours, but the pattern escapes you. At closing time, the shopkeeper sends you out into the night.
10.city.fail.info=

# Test Observation -1
11.city.flavor=Behind a curtain at the back of a curio shop, a brass astrological calendar sits on a dusty shelf. Its rings are turning on their own.
11.city.pass.flavor=You learn how to set the rings to guide the movements of the stars. It takes all night, and by morning the lead that brought you here has gone cold.
11.city.pass.info.1=[#BAD]Discard this Clue.[]
11.city.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
11.city.fail.flavor=The rings spin in no order you can follow. You leave the calendar on its dusty shelf.
11.city.fail.info=

# Test Observation
12.city.flavor=A detective asks for your help: a green haze has filled an alley and refuses to clear. Two constables who walked into it are now in the hospital.
12.city.pass.flavor=With a wet cloth over your mouth, you find the source: a fist-sized meteorite, still smoking, embedded in the cobblestones.
12.city.pass.info=[#GOOD]Gain this Clue.[]
12.city.fail.flavor=The mist creeps into your lungs. Your chest burns, and green shapes crowd the edges of your vision.
12.city.fail.info.1=[#BAD]Lose 1 Sanity.[]
12.city.fail.info.2=[#BAD]Gain an Internal Injury Condition.[]

# Question: spend 2 Sanity and gain Dark Pact
13.city.flavor=Deep in the locked stacks, the tome you came for erupts in green fire. The pages do not burn. A voice in the flames offers you the book if you will kneel to Tulzscha.
13.city.question=Will you [#BAD]spend 2 Sanity and gain a Dark Pact Condition[] to [#GOOD]gain this Clue and a Tome Artifact[]?
13.city.pass.flavor=You kneel, and the green fire floods your mind. When it recedes, the book lies cool in your hands, and the mark of the Green Flame burns somewhere deep inside you.
13.city.pass.info=
13.city.fail.flavor=You step back from the flames. The book crumbles to ash, and the voice laughs as it fades.
13.city.fail.info=

# Test Observation
14.city.flavor=The landlady still shudders when she speaks of her silent tenants. The shan used this boarding house as a refuge, yet its rooms stand bare, with none of the strange machinery you were promised.
14.city.pass.flavor=You tap along the walls until one panel sounds hollow. Behind it you find a laboratory, its instruments still humming. A notebook on the bench lists the people who tended the machines for the shan.
14.city.pass.info=[#GOOD]Gain this Clue.[]
14.city.fail.flavor=You leave empty-handed. Beneath your feet, in a room you never found, the shan continue their work.
14.city.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Influence
15.city.flavor=Posters across the city announce the premiere of Massa di Requiem per Shuggay. You go to the authorities to stop the performance before the first note is sung.
15.city.pass.flavor=The police commissioner listens. The theater is closed for safety inspections, and the seized accounts reveal who paid for the production.
15.city.pass.info=[#GOOD]Gain this Clue.[]
15.city.fail.flavor=The officials laugh you out of the office. That evening the overture swells, and every Gate aligned with the stars answers the music.
15.city.fail.info=[#BAD]Advance Doom by 1 for each Gate matching the current Omen.[]

# Info, then Test Observation -2
16.city.flavor=The conductor keeps the composer's handwritten score in his dressing room. While the audience mingles at intermission, you slip past the stage door and tuck the manuscript under your coat.
16.city.info=[#GOOD]Gain the Requiem per Shuggay Artifact.[]
16.city.flavor.2=Back in your room, you comb the score for anything that could help you stop the cult.
16.city.pass.flavor=In the margins, the composer's notes reveal where the score was first performed and who attended.
16.city.pass.info=[#GOOD]Gain this Clue.[]
16.city.fail.flavor=You read too much. The music plays inside your head all night, and you cannot make it stop.
16.city.fail.info=[#BAD]Lose 2 Sanity.[]

# Test Influence -1
17.city.flavor=An old acquaintance from your university days has spent years dabbling in the occult. Over a long dinner, you lay out everything you have discovered.
17.city.pass.flavor=He shares everything he knows, including notes that he swears he has never shown anyone.
17.city.pass.info=[#GOOD]Gain this Clue.[]
17.city.fail.flavor=He says little and listens closely. As you leave, you see him hand his notes to a winged mi-go at the window. On the walk home, every rustle overhead makes you look up.
17.city.fail.info=[#BAD]Gain a Paranoia Condition.[]

# Info, then the Horror test of the ambush decides pass or fail
18.city.flavor=In a disused warehouse, hooded cultists of Tulzscha kneel around a brazier filled with green fire. You watch from the catwalk above until the rusted rail groans under your hand and every face turns upward.
18.city.info=[#BAD]A Cultist ambushes you.[]
18.city.pass.flavor=You keep your nerve through the fight. Afterward, you write down every word of the ritual you overheard.
18.city.pass.info=[#GOOD]Gain this Clue.[]
18.city.fail.flavor=The horror of the fight overwhelms you. The robed figures drag you to their altar and question you until you tell them everything you know.
18.city.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Observation
19.city.flavor=Rumor places a forbidden tome somewhere in a cramped bookstore. You search the dusty shelves.
19.city.pass.flavor=You find the tome behind a false shelf. It describes the court of Azathoth and a rite that disrupts it, and you perform the rite that very night.
19.city.pass.info=[#GOOD]Remove 1 Orb from the Green Omen.[]
19.city.fail.flavor=Instead, you find a book of engravings too horrible to imagine. Each one depicts a sign now gathering in the sky.
19.city.fail.info=[#BAD]Lose 2 Sanity for each Orb on the Green Omen.[]

# Test Influence
20.city.flavor=A stranger introduces himself as a fellow scholar of the occult and proposes a trade of notes. His questions come a little too quickly.
20.city.pass.flavor=His papers fill several gaps in your research. Only later do you spot the green-flame pin on his lapel, and you realize every word you shared will reach the cult.
20.city.pass.info.1=[#GOOD]Gain this Clue.[]
20.city.pass.info.2=[#BAD]Place 1 Orb on the Green Omen.[]
20.city.fail.flavor=He gives nothing away, and neither do you. You part ways with your secrets intact.
20.city.fail.info=

# Test Strength
21.city.flavor=A Xiclotlan, a gray, tree-like alien, has overturned a police car. Two officers are trapped inside, and you rush to pull them free.
21.city.pass.flavor=You drag the officers clear before the creature returns. In gratitude, they tell you everything they have seen of the alien.
21.city.pass.info=[#GOOD]Gain this Clue.[]
21.city.fail.flavor=The Xiclotlan turns on you, and its metallic limbs hammer you into the pavement.
21.city.fail.info=[#BAD]Lose 3 Health.[]

# No test
22.city.flavor=An astronomer insists the world will end before the month is out. You check his calculations twice. The only error you can find gives the world three days longer than it has.
22.city.info.1=[#GOOD]Gain this Clue.[]
22.city.info.2=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Influence -1
23.city.flavor=You ask the local Silver Twilight Lodge for help. Its members receive you politely, then begin to ask pointed questions about what you know.
23.city.pass.flavor=Satisfied that you are no threat, they consult their occult texts and share their predictions about the stars.
23.city.pass.info.1=[#GOOD]Gain this Clue.[]
23.city.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
23.city.fail.flavor=They decide you know too much. Pain builds behind your eyes until the world goes white. You wake in a locked cell with no memory of how you got there.
23.city.fail.info.1=[#BAD]Lose 1 Sanity.[]
23.city.fail.info.2=[#BAD]Gain a Detained Condition.[]

# Info, then question: spend 2 Sanity
24.city.flavor=Night after night, you comb the library for some way to hold Azathoth back. Every account agrees on one point. The stars have already begun to turn.
24.city.info=[#BAD]Advance the Omen by 1.[]
24.city.flavor.2=One crumbling treatise offers a sliver of hope. Its author claims the answer waits on the far side of sanity.
24.city.question=Will you [#BAD]spend 2 Sanity[] to [#GOOD]gain this Clue[]?
24.city.pass.flavor=You read on until the words crawl across the page. Somewhere in the madness, you find the truth.
24.city.pass.info=
24.city.fail.flavor=You close the book. Some truths are not worth the price of your mind.
24.city.fail.info=

# ---------------------------------------------------------------- WILDERNESS

# Test Observation -1
1.wilderness.flavor=A meteor bursts above the treeline, showering the hills with glowing green dust. Whatever it carried has settled somewhere in the undergrowth, and you set out to gather it.
1.wilderness.pass.flavor=You fill a vial with the shimmering powder. Held up to the night sky, it glows brightest toward one constellation, and you realize you can tell where the next sign will appear.
1.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
1.wilderness.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
1.wilderness.fail.flavor=You spend hours crawling through dust that blisters your skin. By dawn your hands are raw, and the glow has faded into the soil.
1.wilderness.fail.info=[#BAD]Lose 1 Health.[]

# Test Observation
2.wilderness.flavor=Winged fungoid things have dug up the very meteorite you came for. Flat on a ridge above their excavation, you watch the mi-go work.
2.wilderness.pass.flavor=They fit shards of the green stone into their machines, which hum to life. The meteorite is a power source, and you note where they are taking it.
2.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
2.wilderness.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
2.wilderness.fail.flavor=One of them turns toward you and raises a device. A cold light washes over you, and you wake hours later with no memory of how you came to be lying in the grass.
2.wilderness.fail.info=[#BAD]Gain an Amnesia Condition.[]

# Info, then Test Will
3.wilderness.flavor=An eerie mist rises from the ground, and the forest dissolves. You stand in the court of Azathoth at the center of all things, where formless servitors pipe their maddening tune.
3.wilderness.info=[#GOOD]Gain this Clue.[]
3.wilderness.flavor.2=Your mind strains to hold on to what you see. You must find your way back before the sight destroys you.
3.wilderness.pass.flavor=You cling to a single thought, your own name, and follow it back to Earth. Behind you the piping falters, and the court falls quiet.
3.wilderness.pass.info=[#GOOD]Remove 1 Orb from the Green Omen.[]
3.wilderness.fail.flavor=You stare too long into the heart of chaos. When the mist finally lifts, part of your mind remains in the court.
3.wilderness.fail.info=[#BAD]Lose 6 Sanity.[]

# Test Observation
4.wilderness.flavor=Out on the open plain, the stars burn thick and close. You lie back in the grass, waiting for the meteor shower the almanac promised.
4.wilderness.pass.flavor=Green streaks cross the sky, and two of them fall to earth. You mark where one lands nearby and note the distant flash of the other.
4.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
4.wilderness.pass.info.2=[#GOOD]Spawn 1 Clue.[]
4.wilderness.fail.flavor=Clouds roll in before midnight. You return to camp cold, damp and empty-handed.
4.wilderness.fail.info=

# Info, then Test Lore -1
5.wilderness.flavor=In a clearing stands a twenty-foot cone of gray metal, its surface warm to the touch. A hatch hangs open.
5.wilderness.info=[#GOOD]Gain this Clue.[]
5.wilderness.flavor.2=The interior is lit by panels that flicker in patterns no human hand designed. You set about deciphering the shan machine.
5.wilderness.pass.flavor=You work out the controls and shut the device down. Far away, a ritual that depended on its signal falls silent.
5.wilderness.pass.info=[#GOOD]Remove 1 Orb from the Green Omen.[]
5.wilderness.fail.flavor=The controls follow no logic you can grasp. You leave the cone humming, its purpose still a mystery.
5.wilderness.fail.info=

# Test Observation
6.wilderness.flavor=By torchlight you examine a cave painting: a shapeless figure enthroned at the heart of a spiral of stars. The pigment is fresh. Someone has been here recently.
6.wilderness.pass.flavor=At the foot of the painting you find pieces of an oil jar. A trail of dark drops leads out of the cave and down to the worshipers' camp.
6.wilderness.pass.info=[#GOOD]Gain this Clue.[]
6.wilderness.fail.flavor=Your torch gutters out. In the darkness, a thin, droning flute begins to play somewhere deep in the cave, and far above, the stars shift.
6.wilderness.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Influence
7.wilderness.flavor=The villagers welcome you to their harvest feast. Over supper, you ask about the old stories of a blind king who lives beyond the stars.
7.wilderness.pass.flavor=An old woman, deep in her cups, describes the village's oldest rite: a feast in honor of the blind king, where the guests ate the dead. She insists it ended long ago.
7.wilderness.pass.info=[#GOOD]Gain this Clue.[]
7.wilderness.fail.flavor=The villagers fall silent and fill your plate. Only after you have eaten do you notice that there are no old people in the village.
7.wilderness.fail.info=[#BAD]Lose 1 Sanity.[]

# Info, then Test Observation
8.wilderness.flavor=Something strikes you between the shoulders as you pass beneath the pines.
8.wilderness.info=[#BAD]Lose 1 Health.[]
8.wilderness.flavor.2=You spin around, but there is nothing here except trees. You search for your attacker.
8.wilderness.pass.flavor=One tree is wrong: its bark is gray metal, and its branches are perfectly spaced. You have found a Xiclotlan, a creature from the planet Xiclotl. It lumbers away, leaving traces you can study.
8.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
8.wilderness.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
8.wilderness.fail.flavor=A branch strikes again and slams you to the ground before you realize that the tree itself is the attacker.
8.wilderness.fail.info=[#BAD]Gain a Back Injury Condition.[]

# Test Lore -1
9.wilderness.flavor=At the center of a great spiral of standing stones rises a weathered obelisk carved with ancient runes.
9.wilderness.pass.flavor=The runes describe the court of Azathoth and a rite that lulls the Daemon Sultan back to sleep. You recite it, and the stones hum in answer.
9.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
9.wilderness.pass.info.2=[#GOOD]Remove 1 Orb from the Green Omen.[]
9.wilderness.fail.flavor=The runes twist as you read them, and the spiral seems to turn around you. You leave dizzy and shaken.
9.wilderness.fail.info=[#BAD]Lose 2 Sanity.[]

# Test Will -1
10.wilderness.flavor=The ground hisses, and a plume of sickly green vapor pours from a crack in the rock. Your eyes stream and your head swims as you stagger toward its source.
10.wilderness.pass.flavor=Holding your breath, you reach into the crack and pull out a warm, glassy shard that glows faintly green.
10.wilderness.pass.info=[#GOOD]Gain this Clue.[]
10.wilderness.fail.flavor=You come to on your back with the taste of copper in your mouth. The crack has gone quiet, and whatever lay inside it has been taken.
10.wilderness.fail.info=[#BAD]Lose 1 Health.[]

# Info, then Test Will -2
11.wilderness.flavor=Alone by your campfire, you hear someone speaking just behind your shoulder. No one is there, yet the voice goes on, explaining things no human mind was meant to hold.
11.wilderness.info=[#GOOD]Gain this Clue.[]
11.wilderness.flavor.2=The voice begins to give orders, and you feel an overwhelming urge to obey.
11.wilderness.pass.flavor=You refuse. The voice falls silent, and what it taught you remains yours.
11.wilderness.pass.info=
11.wilderness.fail.flavor=You obey, surrendering what you know about the Gates. As the shan leaves your mind, you hear it whisper the same command in the voices of people you trust.
11.wilderness.fail.info=[#BAD]As a group, the investigators discard 1 Clue for each Gate matching the current Omen.[]

# Test Lore -2
12.wilderness.flavor=Someone buried a bundle of curiosities here, barely a foot down. As you brush away the soil, several of the carvings remind you of sketches of the Outer Gods from your own notes.
12.wilderness.pass.flavor=You recognize the most important piece: a bone flute carved with spirals, like the pipes played in the court of Azathoth.
12.wilderness.pass.info=[#GOOD]Gain the Flute of the Outer Gods Artifact.[]
12.wilderness.fail.flavor=You cannot tell the relics from the rubbish. Night falls before you can sort them, and you will not dig here in the dark.
12.wilderness.fail.info=

# Test Observation
13.wilderness.flavor=You follow a family home from the fields. They walk in step. When one turns to look back, every head turns with it. You suspect the shan are guiding them.
13.wilderness.pass.flavor=From the hayloft, you hear the family chanting in unison. Between verses they name the farms they will visit next. You write down the names before you slip away.
13.wilderness.pass.info=[#GOOD]Gain this Clue.[]
13.wilderness.fail.flavor=The whole family turns toward you at once. They beat you senseless and leave you in a ditch miles from the farm.
13.wilderness.fail.info.1=[#BAD]Lose 1 Health.[]
13.wilderness.fail.info.2=[#BAD]Gain an Internal Injury Condition.[]

# Test Will -1
14.wilderness.flavor=An old hermit, his eyes glazed and his movements jerky, suddenly lunges at you, shrieking in an alien tongue.
14.wilderness.pass.flavor=You stay calm and hold him off. As he raves, you memorize the alien words, which turn out to be directions.
14.wilderness.pass.info=[#GOOD]Gain this Clue.[]
14.wilderness.fail.flavor=You flee into the woods. For weeks afterward, you watch every stranger for the same glazed stare.
14.wilderness.fail.info=[#BAD]Gain a Paranoia Condition.[]

# Test Observation -1
15.wilderness.flavor=At the bottom of a scorched crater lies a lump of green stone that seems to drink the daylight. You kneel to take samples, so intent on the work that you miss the movement at the crater's rim.
15.wilderness.pass.flavor=A twig snaps behind you. You grab your samples and slip away before the watcher can close in.
15.wilderness.pass.info=[#GOOD]Gain this Clue.[]
15.wilderness.fail.flavor=A wild-eyed man rushes you from the brush and beats you savagely before fleeing with the meteorite.
15.wilderness.fail.info=[#BAD]Gain an Internal Injury Condition.[]

# Test Observation
16.wilderness.flavor=You follow a band of Green Flame cultists through the woods by the faint glow of their lanterns.
16.wilderness.pass.flavor=From the trees, you watch their ritual. Tulzscha's green fire burns on the altar, and you memorize every word of the chant.
16.wilderness.pass.info=[#GOOD]Gain this Clue.[]
16.wilderness.fail.flavor=You lose them in the dark. Moments later, a pillar of green fire rises above the trees as they call upon Tulzscha.
16.wilderness.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Observation
17.wilderness.flavor=You fall asleep and keep falling, spiraling inward toward the center of all things. There, shapeless dancers turn to a thin, endless piping around a throne of seething chaos. You grope through the dream for anything you can bring back.
17.wilderness.pass.flavor=The dancers' movements form a pattern: a map of the places where the Outer Gods are pressing against our world. You wake and write it down.
17.wilderness.pass.info=[#GOOD]Gain this Clue.[]
17.wilderness.fail.flavor=The piping drowns out every thought. Through each Gate aligned with the stars, the horror at the center gazes back at you.
17.wilderness.fail.info=[#BAD]Lose 2 Sanity for each Gate matching the current Omen.[]

# Test Observation -1
18.wilderness.flavor=Deep in the forest rises a temple shaped like a great cone, its walls meeting at angles no human architect would choose. You venture inside.
18.wilderness.pass.flavor=In the innermost chamber, you find an idol of the Idiot God and topple it from its pedestal. A distant drone of pipes falters and falls silent.
18.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
18.wilderness.pass.info.2=[#GOOD]Remove 1 Orb from the Green Omen.[]
18.wilderness.fail.flavor=The temple's angles twist your thoughts. Alien ideas take root in your mind, and you leave carrying a message you never meant to deliver.
18.wilderness.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Lore -1
19.wilderness.flavor=Disguised in borrowed robes, you stand among the cult of the Green Flame as the chant begins. When your turn comes, you try to slip a wrong syllable into the rite.
19.wilderness.pass.flavor=At your altered word, the green fire sputters out. In the dark, you hear the priest give orders to try again at the old mill. You slip away before anyone can see your face.
19.wilderness.pass.info=[#GOOD]Gain this Clue.[]
19.wilderness.fail.flavor=Your sabotage changes nothing. The green fire blazes, and the rite is completed.
19.wilderness.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Observation
20.wilderness.flavor=From behind a boulder you watch green flames run up the robes of a circle of cultists. Still chanting, they sink into the earth like hot coals through snow.
20.wilderness.pass.flavor=You mark the spot where they vanished and find a tunnel mouth ringed with green-black glass.
20.wilderness.pass.info=[#GOOD]Gain this Clue.[]
20.wilderness.fail.flavor=You edge closer for a better look. The earth splits beneath you, and green fire roars up through the crack, stoked by the signs massing overhead.
20.wilderness.fail.info=[#BAD]Lose 2 Health for each Orb on the Green Omen.[]

# Test Influence -1
21.wilderness.flavor=A quiet man lives alone in a hut in the hills. Years ago, surgeons removed part of his brain. He says he remembers little from before the operation. You ask if there is anything he still dreams about.
21.wilderness.pass.flavor=He trusts you enough to speak of the insect that once lived in his head. It showed him the turning of the stars, and he tells you what comes next.
21.wilderness.pass.info=[#GOOD]Move the Omen to any space without advancing Doom.[]
21.wilderness.fail.flavor=He shuts the door in your face. Through the window, you see him sitting very still, staring at the sky.
21.wilderness.fail.info=

# Test Observation -1
22.wilderness.flavor=In a ring of scorched grass lies what is left of a madman who offered himself to Azathoth. You crouch over the blackened remains, searching for whatever he hoped to gain.
22.wilderness.pass.flavor=Beneath the body you find a leather-bound book the fire has scarcely touched. You lose yourself in its pages. By the time you look up, the wind has scattered the ashes and erased the tracks around them.
22.wilderness.pass.info.1=[#BAD]Discard this Clue.[]
22.wilderness.pass.info.2=[#GOOD]Gain the Cultes des Goules Artifact.[]
22.wilderness.fail.flavor=You find nothing but ash. His sacrifice has already been accepted, and the stars turn in answer.
22.wilderness.fail.info=[#BAD]Advance the Omen by 1.[]

# Question: gain Dark Pact; declining places an Orb
23.wilderness.flavor=The hermit's skin writhes as if something is crawling beneath it. He offers you the names of those he serves. In return, you must swear to answer when they call.
23.wilderness.question=Will you [#BAD]gain a Dark Pact Condition[] to [#GOOD]gain this Clue[]? If you decline, [#BAD]place 1 Orb on the Green Omen.[]
23.wilderness.pass.flavor=You accept. The hermit whispers his secrets, and you feel the bargain settle into you like a hook.
23.wilderness.pass.info=
23.wilderness.fail.flavor=Without a bargain, the hermit has no further use for his body. He collapses into a mass of worms that burrow into the soil, carrying his knowledge to his masters.
23.wilderness.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Strength -1
24.wilderness.flavor=You follow a trail of symbols burned into the trees. At the last mark, a towering figure in a cowl steps onto the path. Its weapon crackles with light.
24.wilderness.pass.flavor=You duck inside the figure's reach and wrench the weapon from its grasp. As it retreats into the trees, you recognize the marks burned into the grip. They match the ones that drew you down this path.
24.wilderness.pass.info.1=[#GOOD]Gain this Clue.[]
24.wilderness.pass.info.2=[#GOOD]Gain a Weapon Artifact.[]
24.wilderness.fail.flavor=The weapon strikes you again and again, each blow fed by the Gates aligned with the stars.
24.wilderness.fail.info=[#BAD]Lose 2 Health for each Gate matching the current Omen.[]

# ---------------------------------------------------------------- SEA

# Test Lore
1.sea.flavor=The navigator swears the stars have moved. The ship is lost, and the crew mutters about curses. You study the altered sky, certain that the new pattern means something.
1.sea.pass.flavor=You recognize the alignment from an old treatise: the stars are bending around the path of Ghroth, the Nemesis Moon. You chart a course home and record everything.
1.sea.pass.info.1=[#GOOD]Gain this Clue.[]
1.sea.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
1.sea.fail.flavor=The pattern means nothing to you. The ship drifts for days before a passing steamer tows it back to port.
1.sea.fail.info=[#BAD]Become Delayed.[]

# Info, then Test Strength
2.sea.flavor=A glowing green rock falls from the sky and tears through your ship. Amid the burning debris, you snatch a shard of the stone before the deck goes under.
2.sea.info=[#GOOD]Gain this Clue.[]
2.sea.flavor.2=Now you must reach the floating wreckage before the sea drags you down.
2.sea.pass.flavor=You haul yourself onto a drifting hatch cover and cling to it until a fishing boat finds you at dawn.
2.sea.pass.info=
2.sea.fail.flavor=Each time you reach for a piece of wreckage, another wave rolls you under. By the time you get a grip on a broken spar, you are battered and half drowned.
2.sea.fail.info=[#BAD]Lose 2 Health.[]

# Test Observation
3.sea.flavor=Asleep in your bunk, you find yourself adrift in the void while the stars are snuffed out like candles overhead. You struggle to commit the dying constellations to memory before they are lost.
3.sea.pass.flavor=You wake with the sky still burned into your memory. The missing stars form a pattern that points to where the next sign will appear.
3.sea.pass.info.1=[#GOOD]Gain this Clue.[]
3.sea.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
3.sea.fail.flavor=You wake with your heart pounding, but the details slip away like water through your fingers.
3.sea.fail.info=

# No test
4.sea.flavor=The Nemesis Moon, Ghroth, hangs swollen on the horizon. Its song lies just beyond hearing, yet the waves rise to meet it. You learn much by watching it, and you understand that it heralds the end.
4.sea.info.1=[#GOOD]Gain this Clue.[]
4.sea.info.2=[#BAD]Place 1 Orb on the Green Omen.[]

# Question: gain Dark Pact
5.sea.flavor=You wake to the rustle of wings in the dark. A creature crouches at the foot of your bunk, its wings folded tight. In one claw it holds a relic it claims can wound Azathoth. It will name its price only after you have sworn to pay.
5.sea.question=Will you [#BAD]gain a Dark Pact Condition[] to [#GOOD]gain this Clue and the T'tka Halot Artifact[]?
5.sea.pass.flavor=You give your word, and the creature places the relic in your hands. You reach for the lamp. By the time you have it lit, you are alone with the relic and your promise.
5.sea.pass.info=
5.sea.fail.flavor=You refuse. The creature regards you for a long moment, then unfolds its wings and vanishes into the night.
5.sea.fail.info=

# Test Observation
6.sea.flavor=Meteors streak across the night sky above the ship, more of them every hour. You train your spyglass on the point they seem to come from.
6.sea.pass.flavor=Behind the meteors, a vast, dark moon blots out the stars. It is getting closer, and you carefully chart its course.
6.sea.pass.info.1=[#GOOD]Gain this Clue.[]
6.sea.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
6.sea.fail.flavor=The meteors fade before dawn and leave no answers. The sky keeps turning toward its appointed hour.
6.sea.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Will
7.sea.flavor=Out at sea, the water boils and a volcano belches ash and choking smoke into the sky. Something green flickers in the heart of the eruption. Eyes streaming, you stay at the rail.
7.sea.pass.flavor=A new island rises from the sea, its black rock veined with green crystal. You record every detail before the ship withdraws.
7.sea.pass.info.1=[#GOOD]Gain this Clue.[]
7.sea.pass.info.2=[#GOOD]Gain 1 additional Clue.[]
7.sea.fail.flavor=The fumes overwhelm you. You collapse on deck, coughing blood, and the crew carries you below.
7.sea.fail.info=[#BAD]Gain an Internal Injury Condition.[]

# Info, then Test Observation
8.sea.flavor=A sailor with waxy, swollen skin tells you of a dream that will not leave him. In it he looks down through clear water at a green stone on the seabed. He sketches the reef around it and the stars he sees overhead.
8.sea.info=[#GOOD]Gain this Clue.[]
8.sea.flavor.2=You lay his drawing over the ship's charts, hunting for the spot where the stone must lie.
8.sea.pass.flavor=You recognize the outline of the reef on a chart. A navigator's almanac gives you the one night those stars will stand above it and the sign that will rise at dawn.
8.sea.pass.info=[#GOOD]Move the Omen to any space without advancing Doom.[]
8.sea.fail.flavor=The sketch matches nothing on the charts. The sailor shrugs and goes back to sleep, already dreaming.
8.sea.fail.info=

# Test Observation -1
9.sea.flavor=As the storm clouds part, the moon hangs larger than it should, glowing a sullen red. You study it through the captain's spyglass.
9.sea.pass.flavor=Its surface is pitted, rust-colored and moving. This is Ghroth, the Nemesis Moon, and you record its path across the sky.
9.sea.pass.info=[#GOOD]Gain this Clue.[]
9.sea.fail.flavor=The red moon swims in your vision. Late that night you hear faint music out on the water, and the stars seem to move in time with it.
9.sea.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Lore -1
10.sea.flavor=On a rocky island, one of Azathoth's lizard-like servitors squats on the shore, playing a thin, droning pipe. Each note seems to draw the stars closer together. You search your memory for a way to silence it.
10.sea.pass.flavor=You recall a banishing rite and chant it over the waves. The piper shrieks and dissolves into foul vapor, and the stars settle back into place.
10.sea.pass.info=[#GOOD]Retreat Doom by 1.[]
10.sea.fail.flavor=The words will not come. The piper plays on, and far beyond the sky, something stirs in answer.
10.sea.fail.info=[#BAD]Place 1 Orb on the Green Omen.[]

# Test Observation -1
11.sea.flavor=Nothing lives on this little island anymore. Trees, birds and crabs alike have crumbled into a fine black powder that stirs with every breath of wind. You go looking for whatever did this.
11.sea.pass.flavor=At the island's heart stands a cracked stone altar. Some reckless soul summoned Azathoth here, and a mere sliver of its attention was enough to unmake everything.
11.sea.pass.info=[#GOOD]Gain this Clue.[]
11.sea.fail.flavor=The dust gets into everything and buries every trace. You leave the dead island with no answers.
11.sea.fail.info=

# Test Observation -1
12.sea.flavor=A flat slab on the shore of a tiny island is cut with rings of star symbols, each ring marking a different season of the sky. You crouch beside it and trace the grooves.
12.sea.pass.flavor=The calendar marks the hours when the stars favor the Outer Gods. You chisel away the glyph for the next alignment. Overhead, the stars that were drawing together begin to drift apart.
12.sea.pass.info.1=[#GOOD]Gain this Clue.[]
12.sea.pass.info.2=[#GOOD]Remove 1 Orb from the Green Omen.[]
12.sea.fail.flavor=The calendar remains a mystery. That night you dream of the island, and of something watching from beneath the carved stone.
12.sea.fail.info=[#BAD]Lose 1 Sanity.[]

# Test Strength -1
13.sea.flavor=A wild-eyed passenger holds the captain at knifepoint, screaming about a green star. You lunge to disarm him.
13.sea.pass.flavor=You wrestle the man to the deck. In his cabin, you find a bundle of notes about a ritual planned for the next port.
13.sea.pass.info=[#GOOD]Gain this Clue.[]
13.sea.fail.flavor=The passenger breaks free and bolts below. An explosion tears open the mailroom and cripples the ship. As the crew rigs a towline, you see a bundle of papers marked with a green star drifting away on the current.
13.sea.fail.info.1=[#BAD]Move this Clue to an adjacent space.[]
13.sea.fail.info.2=[#BAD]Become Delayed.[]

# Test Strength
14.sea.flavor=You are charting the stars at the stern when a pair of hands seizes your throat from behind. One of the crew has come for you.
14.sea.pass.flavor=You throw him against the railing. He goes limp, and a translucent shan crawls from his ear. You trap it in an empty lantern for study.
14.sea.pass.info=[#GOOD]Gain this Clue.[]
14.sea.fail.flavor=The sailor savages you until the crew drags him off. Afterward, he remembers nothing of the attack.
14.sea.fail.info.1=[#BAD]Lose 1 Health.[]
14.sea.fail.info.2=[#BAD]Gain a Back Injury Condition.[]

# Test Strength -1
15.sea.flavor=First the pumps failed. Now you catch a deckhand sawing through the line that holds a lifeboat. A shan moves beneath the skin at his temple. You try to wrestle him below decks.
15.sea.pass.flavor=You lock him up and search his cabin. Beneath his bunk lie star charts marked with the ritual hours of the Green Flame.
15.sea.pass.info=[#GOOD]Gain this Clue.[]
15.sea.fail.flavor=He slips your grip, pulls a knife and comes at you with inhuman fury.
15.sea.fail.info=[#BAD]A Cultist ambushes you.[]

# Test Strength -1
16.sea.flavor=On a lonely island you find the fallen stones of a shrine to the Outer Gods. A carving on the base shows how the stones once stood beneath the stars. You set your shoulder against the first one.
16.sea.pass.flavor=As you heave the last stone into place, the stars shift overhead. Only then do you notice how far the tide has risen. The notes you left on the beach are already floating out to sea.
16.sea.pass.info.1=[#BAD]Discard this Clue.[]
16.sea.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
16.sea.fail.flavor=The first stone shifts barely an inch before your strength gives out. You leave the shrine in ruins.
16.sea.fail.info=

# Test Observation -1
17.sea.flavor=At midnight you climb to the lookout platform and study the heavens for any sign of what is coming.
17.sea.pass.flavor=High above the clouds, bizarre geometric shapes drift in silent formation. You sketch them before they vanish.
17.sea.pass.info=[#GOOD]Gain this Clue.[]
17.sea.fail.flavor=The stars seem to rush toward you, and for a moment your mind is flung across space. Even back on deck, the sky will not keep still.
17.sea.fail.info=[#BAD]Gain a Hallucinations Condition.[]

# Test Lore
18.sea.flavor=A shrine on an empty island feeds power to the Daemon Sultan. Your hammer leaves no mark on the stones. You study the spell carved into them, looking for words that might undo it.
18.sea.pass.flavor=At the last word of the counter-rite, the shrine goes cold. You lay a hand on the altar. The pulse you felt in the stone has stopped.
18.sea.pass.info=
18.sea.fail.flavor=The spell resists you, and the shrine pulses brighter with every attempt. Every sign gathering in the heavens draws strength from it.
18.sea.fail.info=[#BAD]Advance Doom by 1 for each Orb on the Green Omen.[]

# Question: search the cabin
19.sea.flavor=One of the passengers is a cultist of Tulzscha. Right now he is pacing the deck, and his cabin door is unlocked.
19.sea.question=Will you search the cultist's cabin to [#GOOD]gain this Clue[]?
19.sea.pass.flavor=You find his journal hidden in the mattress, but footsteps stop outside the door. He has returned early, and he is armed.
19.sea.pass.info=[#BAD]A Cultist ambushes you.[]
19.sea.fail.flavor=You decide the risk is too great and keep out of his way. He spends the rest of the voyage watching you.
19.sea.fail.info=

# No test
20.sea.flavor=Far from any harbor lights, you can see how far the constellations have strayed from your charts. You trace the paths they might take next. In your mind's eye, each path lights up a different set of Gates.
20.sea.info.1=[#GOOD]Gain this Clue.[]
20.sea.info.2=[#GOOD]Move the Omen to any space.[]
20.sea.info.3=[#BAD]Then advance Doom by 1 for each Gate matching the Omen in its new position.[]

# Info, then Test Lore -1 for each Gate matching the current Omen
21.sea.flavor=On the rolling deck, you begin a long and dangerous rite meant to siphon power from the blind idiot god. Each Gate that answers the current sign pulls against your words.
21.sea.info=[#BAD]Roll 1 fewer die for each Gate matching the current Omen.[]
21.sea.pass.flavor=The power flows through you and drains away into the sea. Somewhere beyond the stars, the court of the Daemon Sultan grows weaker.
21.sea.pass.info.1=[#GOOD]Gain this Clue.[]
21.sea.pass.info.2=[#GOOD]Remove 1 Orb from the Green Omen.[]
21.sea.fail.flavor=The current of power reverses and surges back through your hands. When you break off the chant, the pain subsides. The mark it leaves on your palms is a sign of ill luck.
21.sea.fail.info=[#BAD]Gain a Cursed Condition.[]

# Test Observation -1 for each Orb on the Green Omen
22.sea.flavor=Burning streaks fall from the sky and plunge into the reefs of a nearby archipelago. You commandeer a rowboat, determined to recover the fragments before the tide, or anyone else, can claim them.
22.sea.info=[#BAD]Roll 1 fewer die for each Orb on the Green Omen.[]
22.sea.pass.flavor=You pry a fragment from the reef. Fine green roots have already worked their way into the coral. Now you know what takes root wherever a seed of Azathoth falls.
22.sea.pass.info=[#GOOD]Gain this Clue.[]
22.sea.fail.flavor=The fragments sink into the surf before you can reach them. The seeds of Azathoth lie undiscovered, and the stars move on.
22.sea.fail.info=[#BAD]Advance the Omen by 1.[]

# Test Influence -1
23.sea.flavor=An old sailor mutters a curse when you mention Azathoth. You buy him a drink and try to coax out his story.
23.sea.pass.flavor=Between sips, he describes a gaunt stranger in black who would grant any wish to those who signed a great book bound in strange hide. He knew three men who signed. All three came to terrible ends.
23.sea.pass.info=[#GOOD]Gain this Clue.[]
23.sea.fail.flavor=He finishes the drink and leaves without a word. The name frightens him more than you do.
23.sea.fail.info=

# Test Observation -2
24.sea.flavor=A little girl tugs at your sleeve and points upward, begging you to make a wish before the falling star is gone. You search the sky for it.
24.sea.pass.flavor=You find it: a green streak falling far to the west. You calculate its course, and the stars tell you what comes next.
24.sea.pass.info.1=[#GOOD]Gain this Clue.[]
24.sea.pass.info.2=[#GOOD]Move the Omen to any space without advancing Doom.[]
24.sea.fail.flavor=You follow the line of her pointing finger, but the patch of sky above the mast is already dark. The girl lowers her hand.
24.sea.fail.info=
