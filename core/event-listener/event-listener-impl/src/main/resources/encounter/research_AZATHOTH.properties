23.city.fail.info.1=[#BAD]Lose one Sanity[]
23.city.fail.info.2=[#BAD]Gain a Detained Condition[]

23.wilderness.flavor=The hermit's skin seems to writhe unnaturally. He'll help you, if you're willing to strike a bargain.
23.wilderness.question=[#BAD]Gain a Dark Pact Condition[] to [#GOOD]Gain this Clue[]?
23.wilderness.fail.flavor=The man collapses into a conglomeration of worms.
23.wilderness.fail.info=[#BAD]Token is placed on the Green Omen[]

23.sea.flavor=You talk to an old sailor who recognizes the name Azathoth.
#Test Influence-1
23.sea.pass.flavor=He tells you of a traveler who granted wishes to those who wrote their names in the Book of Azathoth. He says no good ever came to those who did.
23.sea.pass.info=[#GOOD]Gain this Clue[]

24.city.flavor=You scour countless tomes for a way to keep Azathoth at bay, but they only confirm your worst fears.
24.city.info=[#BAD]Omen advances[]
24.city.flavor.2=Your only hope is a text that suggests truth can be found in madness.
24.city.question=[#BAD]Spend two Sanity[] to [#GOOD]Gain this Clue[]?

24.wilderness.flavor=You've been led into a trap! A tall figure wielding a powerful, ancient weapon attacks you.
#Test Strength-1
24.wilderness.pass.flavor=You manage to wrestle the weapon away and escape with your life.
24.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
24.wilderness.pass.info.2=[#GOOD]Gain one Weapon Artifact[]
24.wilderness.fail.info=[#BAD]Lose two Health for each Gate\nrepresenting current Omen[]

24.sea.flavor=A small child excitedly points to the sky and tells you to make a wish. You scan the horizon to find I the shooting star.
#Test Observation-2
24.sea.pass.info.1=[#GOOD]Gain this Clue[]
24.sea.pass.info.2=[#GOOD]Select new Omen, Doom stays[]
