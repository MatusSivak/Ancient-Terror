1.city.flavor=Inside a warehouse, you hear a clanging sound and discover a creature that resembles a metallic crate walking around on several legs. You try to follow the thing back to the cult's lair.
# Test Observation-1
1.city.pass.info.1=[#GOOD]Gain this Clue[]
1.city.pass.info.2=[#GOOD]Gain one Clue[]

1.wilderness.flavor=A meteor exploded in the air, scattering a glowing green powder. You try to find a sufficient amount of the compound.
#Test Observation-1
1.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
1.wilderness.pass.info.2=[#GOOD]Select new Omen, Doom stays[]
1.wilderness.fail.flavor=You are exposed to the terrible energy emanating from the substance.
1.wilderness.fail.info=[#BAD]Lose one Health[]

1.sea.flavor=You overhear the navigator say that the stars are not as they should be. The ship is utterly lost. You believe you understand the significance of the new alignment of stars.
#Test Lore
1.sea.pass.info.1=[#GOOD]Gain this Clue[]
1.sea.pass.info.2=[#GOOD]Gain one Clue[]
1.sea.fail.info=[#BAD]Become Delayed[]

2.city.flavor=A few hours before the performance of the opera Massa di Requiem per Shuggay you have a chance to examine the libretto.
#Test Lore
2.city.pass.flavor=You recognize that it's a ritual that honors Azathoth and stop the performance.
2.city.pass.info=[#GOOD]Gain this Clue[]
2.city.fail.flavor=The performance calls to Azathoth.
2.city.fail.info=[#BAD]Token is placed on the Green Omen[]

2.wilderness.flavor=Mi-go have dug up the meteor that you were seeking. Curious, you attempt to spy on them.
#Test Observation
2.wilderness.pass.flavor=You see them use the stones as a power source.
2.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
2.wilderness.pass.info.2=[#GOOD]Gain one Clue[]
2.wilderness.fail.flavor=They shoot you with a weapon that leaves you unconscious for hours.
2.wilderness.fail.info=[#BAD]Gain an Amnesia Condition[]

2.sea.flavor=Your ship is destroyed by a glowing rock that fell from the sky!
2.sea.info=[#GOOD]Gain this Clue[]
2.sea.flavor.2=You struggle to reach wreckage that can keep you afloat.
#Test Strength
2.sea.fail.flavor=The undertow pulls you underwater.
2.sea.fail.info=[#BAD]Lose two Health[]

3.city.flavor=Scientists report that their sample of radium was stolen! Your investigation indicates a connection to worshipers of Azathoth.
#Test Observation
3.city.pass.flavor=You discover signs of cult activity.
3.city.pass.info=[#GOOD]Gain this Clue[]
3.city.fail.flavor=The scientists tell you what horrors the thieves might unleash using the radium.
3.city.fail.info=[#BAD]Lose one Sanity[]

3.wilderness.flavor=An eerie mist surrounds you, and you find yourself in the court of Azathoth!
3.wilderness.info=[#GOOD]Gain this Clue[]
3.wilderness.flavor.2=Your mind can barely endure what you are seeing.
#Test Will
3.wilderness.pass.flavor=You return to Earth with your mind intact.
3.wilderness.pass.info=[#GOOD]Token is discarded from the Omen[]
3.wilderness.fail.info=[#BAD]Lose six Sanity[]

3.sea.flavor=You dream of floating through space, watching stars disappear. You try to recognize constellations so you'll remember which stars disappeared.
#Test Observation
3.sea.pass.info.1=[#GOOD]Gain this Clue[]
3.sea.pass.info.2=[#GOOD]Select new Omen, Doom stays[]

4.city.flavor=A team of geologists have disappeared after studying a chunk of rock that was retrieved from a nearby crater. You visit their lab and feel waves of strange energy emanating from the stone, eroding your body from the inside.
#Test Strength
4.city.pass.flavor=You safely examine the green stone.
4.city.pass.info=[#GOOD]Gain this Clue[]
4.city.fail.flavor=You are forced to leave the area.
4.city.fail.info=[#BAD]Gain an Internal Injury Condition[]

4.wilderness.flavor=This far away from city lights, you get an unparalleled view of the night sky. You comb the sky, hoping to catch sight of a meteor shower.
#Test Observation
4.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
4.wilderness.pass.info.2=[#GOOD]Spawn one Clue[]

4.sea.flavor=The Nemesis Moon, Ghroth, looms in the sky. You don't know why it's here, but you know that it is the harbinger of doom.
4.sea.info.1=[#GOOD]Gain this Clue[]
4.sea.info.2=[#BAD]Token is placed on the Green Omen[]

5.city.flavor=Doctors ask you to observe a trephination. They pull away a piece of his skull, and you examine the brain.
#Test Observation
5.city.pass.flavor=You spot an insect-like creature.
5.city.pass.info.1=[#GOOD]Gain this Clue[]
5.city.pass.info.2=[#GOOD]Gain one Clue[]
5.city.fail.flavor=You don't see the shan, and it overpowers your mind.
5.city.fail.info=[#BAD]Doom advances for each Token on the Omen[]

5.wilderness.flavor=You discover a twenty-foot tall, gray metallic cone!
5.wilderness.info=[#GOOD]Gain this Clue[]
5.wilderness.flavor.2=You try to make sense of the alien technology inside.
#Test Lore-1
5.wilderness.pass.flavor=You manage to operate the shan technology.
5.wilderness.pass.info=[#GOOD]Token is discarded from the Omen[]

5.sea.flavor=You wake up to find a large, winged creature in your cabin. It offers you an object to use in your fight against Azathoth.
5.sea.question=[#BAD]Gain a Dark Pact Condition[] to\n[#GOOD]Gain this Clue[] and\nthe [#GOOD]T'tka Halot Artifact[]?

6.city.flavor=You attend a reading by Edward Pickman Derby from his book Azathoth and Other Horrors and ask him about the occult.
#Test Influence
6.city.pass.info=[#GOOD]Gain this Clue[]
6.city.fail.flavor=He feigns innocence, but later reports the questions to the Cult of the Skull.
6.city.fail.info=[#BAD]Omen advances[]

6.wilderness.flavor=You examine an odd cave painting by torchlight. It depicts Azathoth sitting on a throne in the center or a starry spiral. You search for any signs of the painting's source.
#Test Observation
6.wilderness.pass.flavor=You quickly find pottery shards.
6.wilderness.pass.info=[#GOOD]Gain this Clue[]
6.wilderness.fail.flavor=Your torch eventually goes out, and you begin to hear the sound of a flute.
6.wilderness.fail.info=[#BAD]Omen advances[]

6.sea.flavor=You watch a meteor shower streak across the night sky.
#Test Observation
6.sea.pass.flavor=You see their source is a large, dark moon that's getting closer.
6.sea.pass.info.1=[#GOOD]Gain this Clue[]
6.sea.pass.info.2=[#GOOD]Gain one Clue[]
6.sea.fail.info=[#BAD]Omen advances[]

7.city.flavor=Something in your brain is manipulating your memories, trying to control you.
#Test Will
7.city.pass.flavor=A partially insubstantial insect flies out of your head, leaving knowledge of an alien planet.
7.city.pass.info=[#GOOD]Gain this Clue[]
7.city.fail.flavor=You can't tell which of your memories are real.
7.city.fail.info=[#BAD]Gain an Amnesia Condition[]

7.wilderness.flavor=You ask the villagers about their peculiar folklore.
#Test Influence
7.wilderness.pass.flavor=You recognize references to cannibalistic rituals in honor of Azathoth.
7.wilderness.pass.info=[#GOOD]Gain this Clue[]
7.wilderness.fail.flavor=Something about the food they offer you is disturbing.
7.wilderness.fail.info=[#BAD]Lose one Sanity[]

7.sea.flavor=A volcano throws smoke and burning ash into the air. Despite the toxic fumes, you force yourself to continue watching.
#Test Will
7.sea.pass.flavor=You watch a new island form.
7.sea.pass.info.1=[#GOOD]Gain this Clue[]
7.sea.pass.info.2=[#GOOD]Gain one Clue[]
7.sea.fail.info=[#BAD]Gain an Internal Injury Condition[]

8.city.flavor=The university allows you to use its telescope to search for signs of a green comet.
#Test Observation-1
8.city.pass.info.1=[#GOOD]Gain this Clue[]
8.city.pass.info.2=[#GOOD]Gain one Clue[]
8.city.fail.flavor=You find nothing, looking through the endless depths of space.
8.city.fail.info=[#BAD]Become Delayed[]

8.wilderness.flavor=Something attacks you in the dark.
8.wilderness.info=[#BAD]Lose one Health[]
8.wilderness.flavor.2=To your eyes, there's nothing around you but trees.
#Test Observation
8.wilderness.pass.flavor=You discover a metallic gray tree with evenly spaced branches and identify a strange alien from the planet Xicloti.
8.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
8.wilderness.pass.info.2=[#GOOD]Gain one Clue[]
8.wilderness.fail.flavor=It strikes you again.
8.wilderness.fail.info=[#BAD]Gain a Back Injury Condition[]

8.sea.flavor=A pale, blubbery-looking sailor tells you of a dream he's been having about a green stone at the bottom of the ocean.
8.sea.info=[#GOOD]Gain this Clue[]
8.sea.flavor.2=You try to use his description to determine the actual location.
#Test Observation
8.sea.pass.info=[#GOOD]Select new Omen, Doom stays[]

9.city.flavor=With all the lights in the city, you might not notice the comet streaking toward you.
#Test Observation-1
9.city.pass.flavor=You safely avoid the impact and can examine the greenish stone.
9.city.pass.info=[#GOOD]Gain this Clue[]
9.city.fail.flavor=You are caught in the comet's explosive impact.
9.city.fail.info=[#BAD]Lose two Health[]

9.wilderness.flavor=You discover an obelisk at the center of a spiraling nexus of stones.
#Test Lore-1
9.wilderness.pass.flavor=You decipher ancient runes that mention the Court of Azathoth.
9.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
9.wilderness.pass.info.2=[#GOOD]Token is discarded from the Omen[]
9.wilderness.fail.flavor=The site confuses and unsettles you.
9.wilderness.fail.info=[#BAD]Lose two Sanity[]

9.sea.flavor=As the storm clouds clear from the night sky, the moon looks larger than usual and is giving off a reddish glow.
#Test Observation-1
9.sea.pass.flavor=You recognize Ghroth, the Nemesis Moon.
9.sea.pass.info=[#GOOD]Gain this Clue[]
9.sea.fail.flavor=You cannot hear the Music of the Spheres.
9.sea.fail.info=[#BAD]Omen advances[]

10.city.flavor=In a dusty bookstore you find many volumes that seem to create a puzzle.
#Test Observation-2
10.city.pass.flavor=You reorganize the tomes to their proper order, revealing a ritual that predicts the future.
10.city.pass.info.1=[#GOOD]Gain this Clue[]
10.city.pass.info.2=[#GOOD]Select new Omen, Doom stays[]

10.wilderness.flavor=A jet of noxious, green gas erupts from the ground, and you struggle to remain conscious.
#Test Will-1
10.wilderness.pass.flavor=You find a small chunk of green stone buried here.
10.wilderness.pass.info=[#GOOD]Gain this Clue[]
10.wilderness.fail.flavor=The fumes cause you to pass out, and the meteorite is gone when you awake.
10.wilderness.fail.info=[#BAD]Lose one Health[]

10.sea.flavor=One of Azathoth's lizard-like servitors is on this island playing its pipes. You try to recall a way to stop it.
#Test Lore-1
10.sea.pass.flavor=You perform a banishing ritual.
10.sea.pass.info=[#GOOD]Retreat Doom[]
10.sea.fail.flavor=It continues calling to Azathoth.
10.sea.fail.info=[#BAD]Token is placed on the Green Omen[]

11.city.flavor=You find an astrological calendar among the curios in the back room of an antique store.
#Test Observation-1
11.city.pass.flavor=You discover the device can be used to predict the movements of the stars.
11.city.pass.info.1=[#BAD]Discard this Clue[]
11.city.pass.info.2=[#GOOD]Select new Omen, Doom stays[]

11.wilderness.flavor=In the dark of night, a voice whispers alien secrets to you.
11.wilderness.info=[#GOOD]Gain this Clue[]
11.wilderness.flavor.2=You feel compelled to obey the voices demands.
#Test Will-2
11.wilderness.fail.flavor=A shan steals your memories and flies off to do the same to your colleagues.
11.wilderness.fail.info=[#BAD]Investigators as a group discard Clues equal to the number of Gates representing current Omen[]

11.sea.flavor=All plant and animal life on this small island has been killed, reduced to black dust. You search for the source of this cataclysm.
#Test Observation-1
11.sea.pass.flavor=You find the stone altar where someone was foolish enough to invoke Azathoth.
11.sea.pass.info=[#GOOD]Gain this Clue[]

12.city.flavor=The local authorities ask for your assistance in investigating a strange green mist that has settled in an alley.
#Test Observation
12.city.pass.flavor=You discover the mist originates from a meteorite.
12.city.pass.info=[#GOOD]Gain this Clue[]
12.city.fail.flavor=The vapor insinuates itself into your lungs.
12.city.fail.info.1=[#BAD]Lose one Sanity[]
12.city.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

12.wilderness.flavor=You discover a cache of oddities buried in a shallow grave. Some of your findings remind you of references to the Outer Gods you've seen in your studies.
#Test Lore-2
12.wilderness.pass.flavor=You find a flute imbued with powerful magic.
12.wilderness.pass.info=[#GOOD]Gain the Flute of the Outer Gods Artifact[]

12.sea.flavor=On a small island you discover a star calendar. You examine the calendar and surrounding area.
#Test Observation-1
12.sea.pass.flavor=You find the calendar associates the stars to periods of time.
12.sea.pass.info.1=[#GOOD]Gain this Clue[]
12.sea.pass.info.2=[#GOOD]Token is discarded from the Omen[]
12.sea.fail.flavor=The island remains a mystery to you.
12.sea.fail.info=[#BAD]Lose one Sanity[]

13.city.flavor=Inside the restricted section of the library, the book you sought is suddenly engulfed in green flames. To claim the ancient text, you will have to bow to the will of Tulzscha.
13.city.question=[#BAD]Spend two Sanity[] and\n[#BAD]Gain a Dark Pact Condition[] to\n[#GOOD]Gain this Clue[] and [#GOOD]Tome Artifact[]?

13.wilderness.flavor=You track a family under the control of the shan back to their farm.
#Test Observation
13.wilderness.pass.flavor=You observe them and learn of their plans.
13.wilderness.pass.info=[#GOOD]Gain this Clue[]
13.wilderness.fail.flavor=They take notice, beating you and leaving you in the wild.
13.wilderness.fail.info.1=[#BAD]Lose one Health[]
13.wilderness.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

13.sea.flavor=You attempt to subdue a madman who is threatening the captain of the ship.
#Test Strength-1
13.sea.pass.flavor=You detain the man and search his cabin.
13.sea.pass.info=[#GOOD]Gain this Clue[]
13.sea.fail.flavor=The lunatic disappears, and the ship is badly damaged by an explosion.
13.sea.fail.info.1=[#BAD]Move this Clue to an adjacent space[]
13.sea.fail.info.2=[#BAD]Become Delayed[]

14.city.flavor=You find a safe house used by the shan, but you don't see any signs of their alien technology.
#Test Observation
14.city.pass.flavor=You find a secret panel leading to their laboratory.
14.city.pass.info=[#GOOD]Gain this Clue[]
14.city.fail.flavor=The shan continue their work.
14.city.fail.info=[#BAD]Token is placed on the Green Omen[]

14.wilderness.flavor=An old hermit has been taken over by the shan, and he suddenly assaults you.
#Test Will-1
14.wilderness.pass.flavor=You keep your calm during the surprise attack and take note of the alien language he's speaking.
14.wilderness.pass.info=[#GOOD]Gain this Clue[]
14.wilderness.fail.flavor=The attack leaves you frightened.
14.wilderness.fail.info=[#BAD]Gain a Paranoia Condition[]

14.sea.flavor=As you study the stars in the night sky, a member of the ship's crew attacks you in the dark.
#Test Strength
14.sea.pass.flavor=A shan flees from the sailor's brain.
14.sea.pass.info=[#GOOD]Gain this Clue[]
14.sea.fail.flavor=You are savaged by the man until the other crew members can restrain him.
14.sea.fail.info.1=[#BAD]Lose one Health[]
14.sea.fail.info.2=[#BAD]Gain a Back Injury Condition[]

15.city.flavor=You attend the opera Massa di Requiem per Shuggay and attempt to convince the authorities to stop the show.
#Test Influence
15.city.pass.info=[#GOOD]Gain this Clue[]
15.city.fail.flavor=The opera continues.
15.city.fail.info=[#BAD]Doom advances for number of Gates representing current Omen[]

15.wilderness.flavor=You come across a crater and examine the strange, green meteorite that created it. As you search, you hardly notice you're being watched.
#Test Observation-1
15.wilderness.pass.flavor=You quickly leave the area with your findings.
15.wilderness.pass.info=[#GOOD]Gain this Clue[]
15.wilderness.fail.flavor=A maniac attacks you.
15.wilderness.fail.info=[#BAD]Gain an Internal Injury Condition[]

15.sea.flavor=A member of the ship's crew is under the sway of the shan. You try to throw him in the brig.
#Test Strength-1
15.sea.pass.flavor=You search his cabin and discover star charts.
15.sea.pass.info=[#GOOD]Gain this Clue[]
15.sea.fail.flavor=He escapes your restraints and attacks you.
15.sea.fail.info=[#BAD]A Cultist Monster ambushes you![]

16.city.flavor=The maestro possesses the original libretto for the notorious opera. You sneak backstage during intermission and steal it.
16.city.info=[#GOOD]Gain the Requiem per Shuggay Artifact[]
16.city.flavor.2=You search the pages for the knowledge you seek.
#Test Observation-2
16.city.pass.info=[#GOOD]Gain this Clue[]
16.city.fail.flavor=The libretto's contents wrack your mind.
16.city.fail.info=[#BAD]Lose two Sanity[]

16.wilderness.flavor=You track a group of cultists that worship the Green Flame.
#Test Observation
16.wilderness.pass.flavor=You are able to watch their ritual.
16.wilderness.pass.info=[#GOOD]Gain this Clue[]
16.wilderness.fail.flavor=The cultists evade your pursuit and invoke Tulzscha.
16.wilderness.fail.info=[#BAD]Token is placed on the Green Omen[]

16.sea.flavor=You find a dilapidated shrine to the Outer Gods on a deserted island. The work is arduous, but you attempt to rebuild the shrine.
#Test Strength-1
16.sea.pass.flavor=The restored shrine should appease the Outer Gods.
16.sea.pass.info.1=[#BAD]Discard this Clue[]
16.sea.pass.info.2=[#GOOD]Select new Omen, Doom stays[]

17.city.flavor=You meet with a former colleague who has studied the occult and speak with him at length, about your findings.
#Test Influence-1
17.city.pass.flavor=He shares what he knows.
17.city.pass.info=[#GOOD]Gain this Clue[]
17.city.fail.flavor=He later betrays you, selling your secrets to the mi-go.
17.city.fail.info=[#BAD]Gain a Paranoia Condition[]

17.wilderness.flavor=In your dream, you are dragged down a spiraling vortex to the center of chaos. Amorphous creatures dance to monotonous piping, encircling a being of absolute horror.
#Test Will
17.wilderness.pass.info=[#GOOD]Gain this Clue[]
17.wilderness.fail.info=[#BAD]Lose two Sanity for each Gate\nrepresenting current Omen[]

17.sea.flavor=You search the night sky for cosmic omens.
#Test Observation-1
17.sea.pass.flavor=You see bizarre constructs floating high in the air.
17.sea.pass.info=[#GOOD]Gain this Clue[]
17.sea.fail.flavor=You feel as if your consciousness is being transported across space.
17.sea.fail.info=[#BAD]Gain a Hallucinations Condition[]

18.city.flavor=You track worshipers of Tulzscha to an abandoned warehouse and observe their ritual, but the cultists notice you and attack.
18.city.info=[#BAD]A Cultist Monster ambushes you![]
# (pass or fail horror check)
18.city.pass.flavor=You dedicate their ritual to memory.
18.city.pass.info=[#GOOD]Gain this Clue[]
18.city.fail.flavor=The robed figures torture you for information.
18.city.fail.info=[#BAD]Omen advances[]

18.wilderness.flavor=You explore a strange, conical temple of alien architecture.
#Test Observation-1
18.wilderness.pass.flavor=You discover an idol of the Idiot God.
18.wilderness.pass.info.1=[#GOOD]Gain this Clue[]
18.wilderness.pass.info.2=[#GOOD]Token is discarded from the Omen[]
18.wilderness.fail.flavor=You feel alien thoughts imprinting themselves on your mind.
18.wilderness.fail.info=[#BAD]Omen advances[]

18.sea.flavor=You discover a shrine on a deserted island that empowers the Daemon Sultan. Destroying the altar will require more than brute force.
#Test Lore
18.sea.fail.flavor=You cannot remove the magic.
18.sea.fail.info=[#BAD]Doom advances for each Token on the Omen[]

19.city.flavor=You search the shelves of the dusty bookstore for the rumored tome.
#Test Observation
19.city.pass.flavor=You discover the tome and find it contains information about the Court of Azathoth.
19.city.pass.info=[#GOOD]Token is discarded from the Omen[]
19.city.fail.flavor=You discover something too horrible to imagine.
19.city.fail.info=[#BAD]Lose two Sanity for each Token on the Omen[]

19.wilderness.flavor=You have infiltrated the cult of the Green Flame, and you subtly try to disrupt the ritual.
#Test Lore-1
19.wilderness.pass.flavor=You learn much from your espionage.
19.wilderness.pass.info=[#GOOD]Gain this Clue[]
19.wilderness.fail.flavor=The ritual is completed.
19.wilderness.fail.info=[#BAD]Token is placed on the Green Omen[]

19.sea.flavor=You know a cultist of Tulzscha is aboard the ship. You consider searching his belongings while he's on deck.
19.sea.question=[#GOOD]Gain this Clue?[]
19.sea.pass.flavor=He returns unexpectedly.
19.sea.pass.info=[#BAD]A Cultist Monster ambushes you![]

20.city.flavor=You are contacted by a man who claims to be an occult researcher. The man seems almost too willing to exchange information with you.
#Test Influence
20.city.pass.flavor=His notes are illuminating, but he reports your findings to the Cult of Green Flame.
20.city.pass.info.1=[#GOOD]Gain this Clue[]
20.city.pass.info.2=[#BAD]Token is placed on the Green Omen[]

20.wilderness.flavor=You hide nearby and watch a group of cultists that burst into viridian flames before burrowing into the earth.
#Test Observation
20.wilderness.pass.info=[#GOOD]Gain this Clue[]
20.wilderness.fail.flavor=A pillar of green fire erupts beneath your feet.
20.wilderness.fail.info=[#BAD]Lose two Health for each Token on the Omen[]

20.sea.flavor=Out here, away from the city's lights, you can see clearly that the stars have shifted more than you had predicted.
20.sea.info.1=[#GOOD]Gain this Clue[]
20.sea.info.2=[#GOOD]Select new Omen[]
20.sea.info.3=[#BAD]Doom advances for number of Gates\nrepresenting current Omen[]

21.city.flavor=A police car has been overturned by a Xiclotlan. You race to rescue the men trapped inside.
#Test Strength
21.city.pass.flavor=The grateful officers share everything they know about the alien creature.
21.city.pass.info=[#GOOD]Gain this Clue[]
21.city.fail.flavor=The gray monstrosity attacks you.
21.city.fail.info=[#BAD]Lose three Health[]

21.wilderness.flavor=A former madman has lived in quiet seclusion since part of his brain was surgically removed. You ask him about his experiences.
#Test Influence-1
21.wilderness.pass.flavor=He tells you about the insect that used to live in his head.
21.wilderness.pass.info=[#GOOD]Select new Omen, Doom stays[]

21.sea.flavor=You attempt to perform a complex ritual to steal power from the Idiot God.
21.sea.info=[#BAD]Roll one less die for each Gate\nrepresenting current Omen.[]
#Test Lore (Roll 1 less die for each Gate representing current Omen.)
21.sea.pass.info.1=[#GOOD]Gain this Clue[]
21.sea.pass.info.2=[#GOOD]Token is discarded from the Omen[]
21.sea.fail.flavor=Your body becomes a conduit for negative energy.
21.sea.fail.info=[#BAD]Gain a Cursed Condition[]

22.city.flavor=A noted astronomer has made claims that the end times predicted by the stars are drawing nearer. After studying his notes, you come to the same conclusion.
22.city.info.1=[#GOOD]Gain this Clue[]
22.city.info.2=[#BAD]Token is placed on the Green Omen[]

22.wilderness.flavor=You find the charred remains of a lunatic who was devoted to Azathoth. You search for some hint about his purpose.
#Test Observation-1
22.wilderness.pass.flavor=You stumble across a thickly bound tome.
22.wilderness.pass.info.1=[#BAD]Discard this Clue[]
22.wilderness.pass.info.2=[#GOOD]Gain the Cultes des Goules Artifact[]
22.wilderness.fail.flavor=His sacrifice cannot be undone.
22.wilderness.fail.info=[#BAD]Omen advances[]

22.sea.flavor=A number of comets fall on a nearby chain of islands. You rush to collect them.
22.sea.info=[#BAD]Roll one less die for each Token on the Omen[]
#Test Observation (Roll 1 less die for each Token on the Omen)
22.sea.pass.flavor=You are able to study the meteorites.
22.sea.pass.info=[#GOOD]Gain this Clue[]
22.sea.fail.flavor=The seeds of Azathoth remain undiscovered.
22.sea.fail.info=[#BAD]Omen advances[]

23.city.flavor=You seek help from the local Silver Twilight Lodge.
#Test Influence-1
23.city.pass.flavor=They consult their occult texts.
23.city.pass.info.1=[#GOOD]Gain this Clue[]
23.city.pass.info.2=[#GOOD]Select new Omen, Doom stays[]
