4.tunguska.flavor=You encounter a group of Russian monks fleeing persecution. Something about them seems out of place, and you keep a watchful eye on them as you pass.
#Test Observation

4.tunguska.pass.flavor=Seeing their singed robes, you recognize them as Nestarians. You are suddenly surrounded by flames and must jump through the fire to stop them.
#Test Will-1
4.tunguska.pass.pass.flavor=Their ritual is interrupted.
4.tunguska.pass.pass.info=[#GOOD]Retreat Doom[]
4.tunguska.pass.fail.flavor=You witness their horrific, profane rites.
4.tunguska.pass.fail.info=[#BAD]Lose one Sanity[]

