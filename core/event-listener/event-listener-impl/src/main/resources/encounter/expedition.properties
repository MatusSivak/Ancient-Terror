2.tunguska.pass.flavor=You find a temple with scorched human remains. You try to resist the urge to run away.
#Test Will
2.tunguska.pass.pass.flavor=You uncover a long-buried treasure.
2.tunguska.pass.pass.info=[#GOOD]Gain one Artifact[]
2.tunguska.pass.fail.flavor=The symbols of Cthugha compel you to run away in a mad panic.
2.tunguska.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

