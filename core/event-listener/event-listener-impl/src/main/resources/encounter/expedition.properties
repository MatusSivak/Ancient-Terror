3.tunguska.flavor=As you approach the crater described in Rasputin's notes, toxic fumes pour out of a fissure in the earth. You struggle to stay conscious and continue your descent.
#Test Strength

3.tunguska.pass.flavor=You find the remains of the monk's camp.
3.tunguska.pass.info=[#GOOD]Gain one Artifact[]
3.tunguska.pass.flavor.2=You then search the crater.
#Test Observation-1
3.tunguska.pass.pass.flavor=You find traces of the comet.
3.tunguska.pass.pass.info=[#GOOD]Gain one Clue[]
3.tunguska.pass.fail.flavor=The shattered landscape is difficult to look at.
3.tunguska.pass.fail.info=[#BAD]Lose one Sanity[]

3.tunguska.fail.flavor=The fumes burn your lungs and you cough up blood.
3.tunguska.fail.info=[#BAD]Gain an Internal Injury Condition[]
3.tunguska.fail.flavor.2=You try to convince your guides to help.
#Test Influence
3.tunguska.fail.pass.flavor=They rescue you and recover Rasputin's possessions.
3.tunguska.fail.pass.info=[#GOOD]Gain one Artifact[]
3.tunguska.fail.fail.flavor=You crawl out on your own.
3.tunguska.fail.fail.info=[#BAD]Lose two Health[]

