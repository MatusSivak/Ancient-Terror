1.africa.flavor=The whole jungle shakes, and the ground splits beneath your feet. You fall through the crevice into a vast subterranean tunnel.
#Test Strength

1.africa.pass.flavor=You follow the tunnel to the ancient city of G'harne.
1.africa.pass.info=[#GOOD]Retreat Doom[]
1.africa.pass.flavor.2=If you have read about G'harne, you know to leave quickly.
#Test Lore
1.africa.pass.fail.flavor=You wake up in the jungle with no memory.
1.africa.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.africa.fail.flavor=You land painfully on your spine.
1.africa.fail.info.1=[#BAD]Lose one Health[]
1.africa.fail.info.2=[#BAD]Gain a Back Injury Condition[]
1.africa.fail.flavor.2=While you're stuck here, you examine this tunnel.
#Test Observation-1
1.africa.fail.pass.flavor=You see that it was dug out by a large creature.
1.africa.fail.pass.info=[#GOOD]Retreat Doom[]

################################################

2.africa.flavor=The old N'bangu man's map to the Gray city of the white god relies on landmarks that are now overgrown by the dense jungle. You search carefully to recognize anything familiar.
#Test Observation

2.africa.pass.flavor=You find the remains of a white ape and study the bones.
#Test Lore
2.africa.pass.pass.flavor=You find a hastily drawn map that leads you to a hidden treasure.
2.africa.pass.pass.info=[#GOOD]Gain one Artifact[]
2.africa.pass.fail.flavor=Something about this creature makes you doubt your own humanity.
2.africa.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

2.africa.fail.flavor=Stumbling across a copper mine, you are immediately accused of being a thief or a saboteur. You fight to escape into the jungle.
#Test Strength-1
2.africa.fail.pass.flavor=You find the Gray city.
2.africa.fail.pass.info=[#GOOD]Gain two Clues[]
2.africa.fail.fail.info=[#BAD]Gain a Detained Condition[]

################################################

3.africa.flavor=Suddenly, you are surrounded by leopard men! They quickly capture you, tie you up, and take you back to their village. On the way, you try to free yourself from the ropes that bind you.
#Test Strength

3.africa.pass.flavor=At their village, you spot a rare item sitting on an altar.
3.africa.pass.info=[#GOOD]Gain One Artifact[]
3.africa.pass.flavor.2=You escape and flee from the village as quickly as possible without watching where you are going.
#Test Observation-1
3.africa.pass.fail.flavor=You collide with a statue of Tsathoggua.
3.africa.pass.fail.info=[#BAD]Lose one Sanity[]

3.africa.fail.flavor=Your escape attempt does more harm than good.
3.africa.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.africa.fail.flavor.2=You try to convince the leopard men that you are a messenger from their god.
#Test Influence
3.africa.fail.pass.flavor=They let you go.
3.africa.fail.pass.info=[#GOOD]Gain one Artifact[]
3.africa.fail.fail.flavor=The leopard men attack you with primitive weapons as you escape.
3.africa.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.africa.flavor=In a part of the jungle avoided by all of the local tribes, you find a stone covered with strange dot patterns. You attempt to identify the origin of the shard and interpret the meaning of the patterns.
#Test Lore-1

4.africa.pass.flavor=You identify it as a missing piece of the G'harne Fragments that leads you to a long-forgotten cave. Inside, you search through the ruins of an abandoned lair of Elder things.
#Test Observation-1
4.africa.pass.pass.flavor=You find a lost treasure.
4.africa.pass.pass.info=[#GOOD]Gain one Artifact[]

4.africa.fail.flavor=Your failure hurts your reputation among your peers.
4.africa.fail.info=[#BAD]Lose Influence Improvement[]
4.africa.fail.flavor.2=Soon, a rival expedition tries to steal the fragment.
#Test Strength
4.africa.fail.pass.flavor=You escape with the other expeditions notes.
4.africa.fail.pass.info=[#GOOD]Gain two Clues[]
4.africa.fail.fail.flavor=They leave you wounded.
4.africa.fail.fail.info=[#BAD]Lose two Health[]

################################################

1.pyramids.flavor=Bandits tie your hands and blindfold you. They lower you into catacombs deep under the pyramids and leave you there to die. You try to free yourself from your bonds.
#Test Strength

1.pyramids.pass.flavor=You see now that you are in the Temple of the Sphinx.
1.pyramids.pass.info=[#GOOD]Retreat Doom[]
1.pyramids.pass.flavor.2=You use your knowledge of Egyptology to find an exit.
#Test Lore
1.pyramids.pass.fail.flavor=You wake up with no memory of how you escaped.
1.pyramids.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.pyramids.fail.flavor=While struggling with your bonds, you feel undead hands tearing at you.
1.pyramids.fail.info.1=[#BAD]Lose one Health[]
1.pyramids.fail.info.2=[#BAD]Gain an Internal Injury Condition[]
1.pyramids.fail.flavor.2=You gaze into the darkness.
#Test Observation-1
1.pyramids.fail.pass.flavor=You identify mummies with the heads of animals.
1.pyramids.fail.pass.info=[#GOOD]Retreat Doom[]

################################################

2.pyramids.flavor=Inside the pyramid, you find a hidden passage leading to an undiscovered throne room. You explore the room for indications of its history.
#Test Observation

2.pyramids.pass.flavor=You see a star map adjacent to a world map on the wall. You use the star map to determine a location on the world map.
#Test Lore
2.pyramids.pass.pass.flavor=You discover a hidden cabinet built into the wall.
2.pyramids.pass.pass.info=[#GOOD]Gain one Artifact[]
2.pyramids.pass.fail.flavor=The maps remain a mystery.
2.pyramids.pass.fail.info=[#BAD]Lose two Sanity[]

2.pyramids.fail.flavor=As you search, Nephren-Ka appears! With a wave of his hand, you are overcome by pain.
#Test Strength-1
2.pyramids.fail.pass.flavor=You crawl away.
2.pyramids.fail.pass.info=[#GOOD]Gain two Clues[]
2.pyramids.fail.fail.info.1=[#BAD]Lose one Health[]
2.pyramids.fail.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

################################################

3.pyramids.flavor=You reach for the ancient relic when a small white cat jumps in front of you. To your horror, the cat transforms into a demonic, feline creature and attacks.
#Test Strength

3.pyramids.pass.flavor=The demon shrivels down to a husk, leaving the relic unguarded.
3.pyramids.pass.info=[#GOOD]Gain one Artifact[]
3.pyramids.pass.flavor.2=Examining the item, you may be too distracted to notice the warning hieroglyph.
#Test Observation-1, TODO What about poisoned ?
3.pyramids.pass.fail.flavor=You aren't prepared to evade the poisoned barb.
3.pyramids.pass.fail.info=[#BAD]Lose one Health[]

3.pyramids.fail.flavor=The creature leaves you badly wounded.
3.pyramids.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.pyramids.fail.flavor.2=You cry out for help.
#Test Strength
3.pyramids.fail.pass.flavor=The men who come to find you distract the beast allowing you to procure the relic.
3.pyramids.fail.pass.info=[#GOOD]Gain one Artifact[]
3.pyramids.fail.fail.flavor=As you have to walk without receiving medical attention.
3.pyramids.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.pyramids.flavor=Once you reach Dashur, you begin digging through the rubble that had once been the White Pyramid, hoping to excavate the ancient burial chambers.
#Test Strength-1

4.pyramids.pass.flavor=You uncover a vast labyrinth of underground tunnels. Your only hope of navigating is to translate the hieroglyphs on the wall.
#Test Lore
4.pyramids.pass.pass.flavor=You find your way to the royal treasury.
4.pyramids.pass.pass.info=[#GOOD]Gain one Artifact[]
4.pyramids.pass.fail.flavor=You slowly find your way back to the exit.
4.pyramids.pass.fail.info=[#BAD]Become Delayed[]

4.pyramids.fail.flavor=You exhaust yourself working into the night without result.
4.pyramids.fail.info=[#BAD]Lose one Health[]
4.pyramids.fail.flavor.2=That night, a snake-eyed man dressed like a bedouin approaches you and offers you a deal.
4.pyramids.fail.question=[#BAD]Gain a Dark Pact Condition[] to \n[#GOOD]Improve one Skill of your choice[]

################################################

1.antarctica.flavor=Flying over the area, you see evidence of an ancient stone city, you land your plane as close as you can and climb across the ice to reach the strange architecture.
#Test Strength

1.antarctica.pass.flavor=The murals inside the city tell the story of the elder things.
1.antarctica.pass.info=[#GOOD]Retreat Doom[]
1.antarctica.pass.flavor.2=However, your studies take a toll on your mind.
#Test Will
1.antarctica.pass.fail.flavor=You block everything you've learned from your mind.
1.antarctica.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.antarctica.fail.flavor=You fall through the ice into a stone chamber.
1.antarctica.fail.info.1=[#BAD]Lose one Health[]
1.antarctica.fail.info.2=[#BAD]Gain a Back Injury Condition[]
1.antarctica.fail.flavor.2=You search the dark chamber.
#Test Observation-1
1.antarctica.fail.pass.flavor=You find the husk of an elder thing for study.
1.antarctica.fail.pass.info=[#GOOD]Retreat Doom[]

################################################

2.antarctica.flavor=You hear a faint sound echoing up from the caves that lead down into the darkness. You listen carefully to discern the sound's origin.
#Test Observation

2.antarctica.pass.flavor=You identify the sound of Shoggoths. You escape, but can barely keep yourself conscious waiting for a rescue.
#Test Will
2.antarctica.pass.pass.flavor=You spot something on the cave floor.
2.antarctica.pass.pass.info=[#GOOD]Gain one Artifact[]
2.antarctica.pass.fail.flavor=You pass out and hear the sounds of Shoggoths everywhere you go.
2.antarctica.pass.fail.info=[#BAD]Gain an Hallucinations Condition[]

2.antarctica.fail.flavor="Tekeli-li! Tekeli-li!" You recognize it too late. The Shoggoths overwhelm you.
#Test Strength-1
2.antarctica.fail.pass.flavor=You overcome the threat.
2.antarctica.fail.pass.info=[#GOOD]Gain two Clues[]
2.antarctica.fail.fail.flavor=You escape by jumping off a ledge.
2.antarctica.fail.fail.info=[#BAD]Gain a Leg Injury Condition[]

################################################

3.antarctica.flavor=You find what you believe to be star-shaped burial mounds in the snow. It is physically exhausting, but you try to dig the bodies out of the ice and snow.
#Test Strength

3.antarctica.pass.flavor=An odd relic lies next to the creature's corpse.
3.antarctica.pass.info=[#GOOD]Gain one Artifact[]
3.antarctica.pass.flavor.2=Then you examine the body.
#Test Observation-1
3.antarctica.pass.fail.flavor=You stared too long at this alien horror.
3.antarctica.pass.fail.info=[#BAD]Lose one Sanity[]

3.antarctica.fail.flavor=Chipping through the ice, you slip and injure yourself.
3.antarctica.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.antarctica.fail.flavor.2=The rest of the expedition crew is too terrified to approach and you beg them for help.
#Test Influence
3.antarctica.fail.pass.flavor=They spot something buried in the ice.
3.antarctica.fail.pass.info=[#GOOD]Gain one Artifact[]
3.antarctica.fail.fail.flavor=You crawl back to the camp.
3.antarctica.fail.fail.info=[#GOOD]Lose two Health[]

################################################

4.antarctica.flavor=As you approach the dark tower, the landscape suddenly transforms around you, as if you were witnessing thousands of years passing in an instant. The effect passes quickly but overwhelms your senses.
#Test Will

4.antarctica.pass.flavor=You realize that you've seen the future. In this vision, a being of unthinkable powers escape from this tower, unless you have the knowledge to prevent it.
#Test Lore
4.antarctica.pass.pass.flavor=You restore the seals on the tower.
4.antarctica.pass.pass.info=[#GOOD]Retreat Doom[]
4.antarctica.pass.fail.flavor=Nothing can be done.
4.antarctica.pass.fail.info.1=[#BAD]Lose one Sanity[]
4.antarctica.pass.fail.info.2=[#BAD]Gain a Paranoia Condition[]

4.antarctica.fail.flavor=You see your own severed head, connected to other heads by a strange, fibrous network.
4.antarctica.fail.info.1=[#BAD]Lose one Sanity[]
4.antarctica.fail.info.2=[#BAD]Gain a Hallucinations Condition[]
4.antarctica.fail.flavor.2=You hear many voices in your head, but one struggles to be heard over the others.
#Test Observation-1
4.antarctica.fail.pass.flavor=This voice teaches you the arcane arts.
4.antarctica.fail.pass.info=[#GOOD]Gain one Spell[]

