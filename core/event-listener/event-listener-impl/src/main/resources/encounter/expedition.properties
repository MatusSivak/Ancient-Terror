2.tunguska.fail.pass.flavor=You find a mural of Cthugha.
2.tunguska.fail.pass.info=[#GOOD]Gain two Clues[]
2.tunguska.fail.fail.flavor=A boulder falls on you.
2.tunguska.fail.fail.info=[#BAD]Gain a Back Injury Condition[]

