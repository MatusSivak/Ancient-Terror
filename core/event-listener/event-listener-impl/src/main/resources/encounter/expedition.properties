1.amazon.flavor=You see the vine-covered temple ahead of you, but you're going to have to fight your way through a thick tangle of venomous snakes between yourself and the entrance.
#Test Strength-1

1.amazon.pass.flavor=You enter the Temple of Yig.
1.amazon.pass.info=[#GOOD]Retreat Doom[]
1.amazon.pass.flavor.2=Strange runes are inscribed on the wall in a serpentine design. You must interpret their meaning to avoid their hypnotic effect.
#Test Lore
1.amazon.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.amazon.fail.flavor=You've been bit!
1.amazon.fail.info.1=[#BAD]Lose one Health[]
1.amazon.fail.info.2=[#BAD]Gain an Internal Injury Condition[]
1.amazon.fail.flavor.2=Something about the snakes is odd. You try to identify what makes them unique.
#Test Observation-1
1.amazon.fail.pass.flavor=You notice a crescent on the snake's head.
1.amazon.fail.pass.info=[#GOOD]Retreat Doom[]

################################################

2.amazon.flavor=As you slip into a deep trance and touch the odd stone, the jungle around you subtly changes in appearance. You look for hints regarding this new jungle terrain.
#Test Observation

2.amazon.pass.flavor=You are in some other dimension. You use your arcane skills to return home.
#Test Lore
2.amazon.pass.pass.flavor=You wakeup back in the jungle next to a strange item.
2.amazon.pass.pass.info=[#GOOD]Gain one Artifact[]
2.amazon.pass.fail.flavor=The journey back unsettles you.
2.amazon.pass.fail.info=[#BAD]Lose two Sanity[]

2.amazon.fail.flavor=A towering, larva-like thing grabs you with its tendrils. You struggle fiercely to break free.
#Test Strength-1
2.amazon.fail.pass.flavor=You retrieve a sample of the creature.
2.amazon.fail.pass.info=[#GOOD]Gain two Clues[]
2.amazon.fail.fail.flavor=It throws you high into the air.
2.amazon.fail.fail.info=[#BAD]Gain a Back Injury Condition[]

################################################

3.amazon.flavor=You've heard rumors that a particular secret of the ancients is visible from the top of a hill. You find that climbing the hill side is not an easy task.
#Test Strength

3.amazon.pass.flavor=You find a lost treasure.
3.amazon.pass.info=[#GOOD]Gain one Artifact[]
3.amazon.pass.flavor.2=From this height, you can survey the land for miles.
#Test Observation-1
3.amazon.pass.pass.flavor=You see drawings that are hundreds of feet across.
3.amazon.pass.pass.info=[#GOOD]Gain one Clue[]
3.amazon.pass.fail.flavor=Vertigo sets in.
3.amazon.pass.fail.info=[#BAD]Lose one Sanity[]

3.amazon.fail.flavor=You take too long climbing, and you stumble around in the dark.
3.amazon.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.amazon.fail.flavor.2=You yell for help.
#Test Influence
3.amazon.fail.pass.flavor=The rescue party's flashlights reveal what you tripped over.
3.amazon.fail.pass.info=[#GOOD]Gain one Artifact[]
3.amazon.fail.fail.flavor=You return to your camp alone in the cold and dark.
3.amazon.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.amazon.flavor=Lieutenant Colonel Percy Fawcett disappeared in this area of the jungle searching for the Lost City of Z. You search for any signs of the expedition or the legendary city.
#Test Observation-1

4.amazon.pass.flavor=You discover a young Kuikuro boy who requires convincing before he'll help you.
#Test Influence
4.amazon.pass.pass.flavor=He brings you to an ancient city where Fawcett has left behind his journal.
4.amazon.pass.pass.info=[#GOOD]Gain two Clues[]
4.amazon.pass.fail.flavor=The boy demands payment and disappears.
4.amazon.pass.fail.info=[#BAD]Discard one Item possession[]

4.amazon.fail.flavor=A mosquito bite leaves you sick and feverish.
#Test Strength-1
4.amazon.fail.pass.flavor=You recover quickly, feeling better than before.
4.amazon.fail.pass.info=[#GOOD]Discard one Illness or Injury Condition[]
4.amazon.fail.fail.flavor=Your symptoms grow worse.
4.amazon.fail.fail.info.1=[#BAD]Lose one Health[]
4.amazon.fail.fail.info.2=[#BAD]Gain a Poisoned Condition[]

