#Test Strength

1.tunguska.pass.flavor=Behind you, the color flies up into space. You try to interpret what you've seen.
#Test LORE
1.tunguska.pass.pass.flavor=You're sure that the threat has passed.
1.tunguska.pass.pass.info=[#GOOD]Retreat Doom[]
1.tunguska.pass.fail.flavor=Your mind cannot accept what you've seen.
