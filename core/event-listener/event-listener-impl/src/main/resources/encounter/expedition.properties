1.himalayas.flavor=A horrifying beast suddenly attacks you, almost as if it had stepped right out of your nightmares.
#Spawn a Monster on your space and immediately encounter it

1.himalayas.pass.flavor=The creature from your dreams is defeated.
1.himalayas.pass.info=[#GOOD]Retreat Doom[]
1.himalayas.pass.flavor.2=You look into local legends to find the link between this area and the Dreamlands.
#Test Lore
1.himalayas.pass.fail.flavor=Your uncertainty unhinges your mind.
1.himalayas.pass.fail.info=[#BAD]Lose two Sanity[]

1.himalayas.fail.flavor=Unable to overcome the threat, you run away and look for a place to hide.
#Test Observation
1.himalayas.fail.pass.info.1=[#GOOD]Discard the Monster[]
1.himalayas.fail.pass.info.2=[#GOOD]Retreat Doom[]
1.himalayas.fail.fail.flavor=You cower in fear.
1.himalayas.fail.fail.info=[#BAD]Lose one Sanity[]

################################################

2.himalayas.flavor=You duck into a cave to find shelter from the deadly snowstorm. Inside, the tunnels twist and turn in the dark, making it almost impossible to navigate.
#Test Observation

2.himalayas.pass.flavor=Inside a well-lit laboratory, you find a human brain inside a cylinder. You can speak to the brain, but it disturbs you to do so
#Test Will
2.himalayas.pass.pass.flavor=It tells you where the mi-go store their equipment.
2.himalayas.pass.pass.info=[#GOOD]Gain one Artifact[]
2.himalayas.pass.fail.flavor=You retreat from all human contact.
2.himalayas.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

2.himalayas.fail.flavor=Large, winged, crab-like beings surround you. You're going to have to fight if you want to escape.
#Test Strength-1
2.himalayas.fail.pass.flavor=You subdue the mi-go for study.
2.himalayas.fail.pass.info=[#GOOD]Gain two Clues[]
2.himalayas.fail.fail.flavor=The creatures inject you with a glowing serum.
2.himalayas.fail.fail.info=[#BAD]Gain an Internal Injury Condition[]

################################################

3.himalayas.flavor=The gnoph-keh summons a terrible blizzard to destroy you and your expedition. You'll have to survive the storm before you can continue.
#Test Strength

3.himalayas.pass.flavor=You weather the storm in a cave and find a statue of a three-eyed horror, surrounded by odd relics.
3.himalayas.pass.info=[#GOOD]Gain one Artifact[]
3.himalayas.pass.flavor.2=You try to determine the statue's origin.
#Test Lore-1
3.himalayas.pass.fail.flavor=You do not recognize Rhan-Tegoth, and the icon remains a mystery that haunts your dreams.
3.himalayas.pass.fail.info=[#BAD]Lose two Sanity[]

3.himalayas.fail.flavor=Trapped by the storm, the other members of your expedition panic. You try to calm them.
#Test Influence
3.himalayas.fail.pass.flavor=They are willing to continue, and you make a discovery.
3.himalayas.fail.pass.info=[#GOOD]Gain one Artifact[]
3.himalayas.fail.fail.flavor=Their refusal fills you with doubts.
3.himalayas.fail.fail.info=[#BAD]Gain a Paranoia Condition[]

################################################

4.himalayas.flavor=The Order of the Death's Head has arranged for a mass sacrifice of monks to call forth the Ogress of Ra-Sa. You attack the Order's soldiers to free their prisoners.
#Test Strength

4.himalayas.pass.flavor=The Order abandons the ritual, and you rescue the monks. One of them gratefully gives you a scroll that you attempt to interpret.
#Test Lore-1
4.himalayas.pass.pass.flavor=You acquire arcane knowledge.
4.himalayas.pass.pass.info=[#GOOD]Gain two Spells[]
4.himalayas.pass.fail.flavor=The scroll's strange poetry bleeds into reality.
4.himalayas.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

4.himalayas.fail.flavor=The fight leaves you wounded.
4.himalayas.fail.info=[#BAD]Gain a Leg Injury Condition[]
4.himalayas.fail.flavor.2=The commander of the Order continues chanting, and the sound unnerves you.
#Test Will-1
4.himalayas.fail.pass.flavor=You steal the book he is reading from.
4.himalayas.fail.pass.info=[#GOOD]Gain two Clues[]
4.himalayas.fail.fail.flavor=The commander hexes you.
4.himalayas.fail.fail.info=[#BAD]Gain a Cursed Condition[]

