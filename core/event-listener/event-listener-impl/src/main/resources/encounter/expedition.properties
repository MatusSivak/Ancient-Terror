1.africa.flavor=A low rumble rolls through the jungle like distant thunder. The earth tears open beneath your boots, and you plunge into darkness, clutching at roots as you fall.
#Test Strength

1.africa.pass.flavor=You catch a thick root, slow your fall, and drop safely into a tunnel far older than the jungle above. It leads you to the toppled columns of G'harne, where you smash the idols that still hum with power.
1.africa.pass.info=[#GOOD]Retreat Doom[]
1.africa.pass.flavor.2=Dust sifts from the tunnel roof. You remember reading about that sound in the G'harne Fragments. What did the explorer hear just before his journal broke off?
#Test Lore
1.africa.pass.pass.flavor=Recalling the warnings of the Fragments, you climb toward daylight before the burrowers awaken, your memories intact.
1.africa.pass.fail.flavor=You linger too long among the ruins. The next thing you know, you are lying in the undergrowth under the noon sun, with no idea how you got there.
1.africa.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.africa.fail.flavor=The root snaps, and you hit the tunnel floor back-first with a sickening crack.
1.africa.fail.info.1=[#BAD]Lose one Health[]
1.africa.fail.info.2=[#BAD]Gain a Back Injury Condition[]
1.africa.fail.flavor.2=Unable to climb out, you can only study your surroundings while the pain subsides.
#Test Observation-1
1.africa.fail.pass.flavor=Deep gouges score the walls, carved by something with no hands. Your notes on the burrows later help scholars seal the passages before anything climbs out.
1.africa.fail.pass.info=[#GOOD]Retreat Doom[]
1.africa.fail.fail.flavor=The walls tell you nothing. Hours later, a passing hunter hears your shouts and hauls you out on a rope.

################################################

2.africa.flavor=The N'bangu elder's map points to the Gray City of the white god, but every landmark he drew has vanished under creepers and fallen trees. You comb the undergrowth for anything that matches his sketches.
#Test Observation

2.africa.pass.flavor=A split boulder matches one of his drawings. Beside it lies the skeleton of a great white ape, its skull oddly human. You kneel to examine the bones.
#Test Lore
2.africa.pass.pass.flavor=You recognise the ritual markings on the skull and follow them to a hollow beneath the boulder, where a relic of the Gray City has waited for centuries.
2.africa.pass.pass.info=[#GOOD]Gain one Artifact[]
2.africa.pass.fail.flavor=The longer you stare at the skull, the more it resembles your own. That night, pale long-armed shapes watch you from every tree.
2.africa.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

2.africa.fail.flavor=Lost, you wander into a copper mine. The foremen take you for a thief and set their guards on you, and you must fight your way back to the jungle.
#Test Strength-1
2.africa.fail.pass.flavor=You wrench the gate from a guard's grasp and run until the shouting fades. Through the leaves you see grey walls. You mark the route and copy the crest above the city gate.
2.africa.fail.pass.info=[#GOOD]Gain two Clues[]
2.africa.fail.fail.flavor=The guards wrestle you to the ground, bind your wrists, and lock you in a storeroom to await the district magistrate.
2.africa.fail.fail.info=[#BAD]Gain a Detained Condition[]

################################################

3.africa.flavor=Figures in spotted pelts burst from the brush. The leopard men overpower you, bind you hand and foot, and carry you toward their village. You strain against the ropes.
#Test Strength

3.africa.pass.flavor=The knots loosen as they carry you in. Before anyone notices, you slip free and snatch a strange relic from their altar.
3.africa.pass.info=[#GOOD]Gain one Artifact[]
3.africa.pass.flavor.2=Relic in hand, you slip between the huts. The jungle is only yards away, but someone has strung cords across the paths in the dark.
#Test Observation-1
3.africa.pass.pass.flavor=You weave between the dark huts and are deep among the trees before the drums sound the alarm.
3.africa.pass.fail.flavor=You run straight into a squat idol of Tsathoggua. Its sleepy, toad-like face haunts you long after its worshippers lose your trail.
3.africa.pass.fail.info=[#BAD]Lose one Sanity[]

3.africa.fail.flavor=You twist so hard against the ropes that your captors drop you, and your knee buckles beneath you.
3.africa.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.africa.fail.flavor.2=Lying in the dirt, you have only words left. You proclaim that you are a messenger sent by their god.
#Test Influence
3.africa.fail.pass.flavor=Their chief hesitates, cuts your bonds, and presses a sacred object into your hands. He asks you to carry it back to the god.
3.africa.fail.pass.info=[#GOOD]Gain one Artifact[]
3.africa.fail.fail.flavor=A guard cuts the ropes to make you kneel. You kick his legs out from under him and run. Two spear thrusts catch you before you reach the river.
3.africa.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.africa.flavor=In a stretch of jungle the local tribes refuse to enter, you uncover a stone shard covered with clusters of dots. You try to work out where it came from and what the patterns say.
#Test Lore-1

4.africa.pass.flavor=The dots match the script of the G'harne Fragments; this is a missing piece. Its text guides you to a hidden cave, once the lair of Elder Things, and you search the rubble inside.
#Test Observation-1
4.africa.pass.pass.flavor=Behind a collapsed column lies a device of glass and ridged metal, untouched since the Elder Things departed.
4.africa.pass.pass.info=[#GOOD]Gain one Artifact[]
4.africa.pass.fail.flavor=You sift the rubble until your lamp runs dry, but whatever the Elder Things left behind stays hidden.

4.africa.fail.flavor=You publish a hasty translation, and your colleagues tear it apart. Your standing among scholars suffers a serious blow.
4.africa.fail.info=[#BAD]Lose all improvements to Influence[]
4.africa.fail.flavor.2=Worse, a rival expedition decides the shard is wasted on you and comes to take it by force.
#Test Strength
4.africa.fail.pass.flavor=You drive them off, and in their haste they leave behind a satchel stuffed with their own research.
4.africa.fail.pass.info=[#GOOD]Gain two Clues[]
4.africa.fail.fail.flavor=They beat you badly and leave you bleeding in the mud.
4.africa.fail.fail.info=[#BAD]Lose two Health[]

################################################

1.pyramids.flavor=Bandits ambush you at the dig site. They bind and blindfold you, lower you on a rope into the catacombs beneath the pyramids, and leave you to starve. You twist against the cords.
#Test Strength

1.pyramids.pass.flavor=The cords give way. Tearing off the blindfold, you find yourself in a forgotten shrine of the Sphinx, and you overturn the dark offerings left on its altar.
1.pyramids.pass.info=[#GOOD]Retreat Doom[]
1.pyramids.pass.flavor.2=Now you must find your way out of the maze of tunnels, and only a knowledge of Egyptian lore can guide you.
#Test Lore
1.pyramids.pass.pass.flavor=You read the burial formulas on the walls like road signs, and they lead you up a sloping shaft into the cold desert night.
1.pyramids.pass.fail.flavor=You wander the passages for hours. Later you come to in the sand outside, with no memory of the way out.
1.pyramids.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.pyramids.fail.flavor=As you struggle, withered fingers close around you in the dark and claw at your body.
1.pyramids.fail.info.1=[#BAD]Lose one Health[]
1.pyramids.fail.info.2=[#BAD]Gain an Internal Injury Condition[]
1.pyramids.fail.flavor.2=One of the hands tears your blindfold loose as it retreats. You work a wrist free of the frayed cord and peer into the gloom.
#Test Observation-1
1.pyramids.fail.pass.flavor=As your eyes adjust, you make out rows of mummies with the heads of jackals and ibises. Remembering the old rites, you seal their niches before the rest can wake.
1.pyramids.fail.pass.info=[#GOOD]Retreat Doom[]
1.pyramids.fail.fail.flavor=The darkness gives nothing away. You feel along the walls until you find a shaft of daylight and pull yourself out, no wiser than before.

################################################

2.pyramids.flavor=A loose block inside the pyramid swings inward, revealing a passage to a throne room no archaeologist has ever recorded. You search it for any trace of its builders.
#Test Observation

2.pyramids.pass.flavor=On one wall, a chart of the heavens sits beside a map of the world. If you can match the stars to the map, they should point to a single spot.
#Test Lore
2.pyramids.pass.pass.flavor=One star lies directly over the pyramid on the map. You press its bronze stud, and a niche opens in the wall with a royal treasure inside.
2.pyramids.pass.pass.info=[#GOOD]Gain one Artifact[]
2.pyramids.pass.fail.flavor=You trace the stars until dawn, but the map refuses to make sense, and the stars seem to shift whenever you look away.
2.pyramids.pass.fail.info=[#BAD]Lose two Sanity[]

2.pyramids.fail.flavor=A shadow rises from the throne: Nephren-Ka, the Black Pharaoh. He lifts one hand, and searing pain throws you to the floor.
#Test Strength-1
2.pyramids.fail.pass.flavor=You drag yourself out of the chamber and back into the passage, every detail of the room burned into your memory.
2.pyramids.fail.pass.info=[#GOOD]Gain two Clues[]
2.pyramids.fail.fail.flavor=The pain is too much. Something tears deep inside you before the Pharaoh fades away, laughing.
2.pyramids.fail.fail.info.1=[#BAD]Lose one Health[]
2.pyramids.fail.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

################################################

3.pyramids.flavor=Your hand is inches from the ancient relic when a small white cat leaps onto the plinth. Its body bulges and splits, and a snarling, demonic thing lunges at you.
#Test Strength

3.pyramids.pass.flavor=You wrestle the beast to the floor until it shrivels into a dry husk, leaving the relic yours for the taking.
3.pyramids.pass.info=[#GOOD]Gain one Artifact[]
3.pyramids.pass.flavor.2=Admiring your prize, you barely glance at the warning hieroglyph carved beneath the plinth.
#Test Observation-1, TODO What about poisoned ?
3.pyramids.pass.pass.flavor=Just in time, you recognise the sign of the scorpion and step back as a poisoned barb shoots from the wall.
3.pyramids.pass.fail.flavor=A hidden needle springs from the plinth and pierces your wrist before you can pull away.
3.pyramids.pass.fail.info=[#BAD]Lose one Health[]

3.pyramids.fail.flavor=The creature's claws rake your leg to the bone.
3.pyramids.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.pyramids.fail.flavor.2=Unable to stand, you fend off the beast from the floor and shout for your workers.
#Test Strength
3.pyramids.fail.pass.flavor=You hold it off until they arrive with torches. The creature flees from the flames, and the relic is yours.
3.pyramids.fail.pass.info=[#GOOD]Gain one Artifact[]
3.pyramids.fail.fail.flavor=No one hears you. The creature finally loses interest, and you limp miles back to camp with no one to tend your wounds.
3.pyramids.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.pyramids.flavor=At Dashur, you set to work on the rubble that was once the White Pyramid, determined to dig down to the burial chambers beneath.
#Test Strength-1

4.pyramids.pass.flavor=The rubble gives way to a maze of tunnels. Hieroglyphs cover every wall, and reading them is your only hope of navigating.
#Test Lore
4.pyramids.pass.pass.flavor=The inscriptions guide you to the royal treasury, where a single offering still rests on its pedestal.
4.pyramids.pass.pass.info=[#GOOD]Gain one Artifact[]
4.pyramids.pass.fail.flavor=The glyphs mean nothing to you. It takes hours of wrong turns to find your way back to the surface.
4.pyramids.pass.fail.info=[#BAD]Become Delayed[]

4.pyramids.fail.flavor=You dig until your hands bleed and your back aches, but the rubble yields nothing.
4.pyramids.fail.info=[#BAD]Lose one Health[]
4.pyramids.fail.flavor.2=After dark, a robed stranger with the slit eyes of a serpent walks into your camp. He offers to make you stronger, for a price.
4.pyramids.fail.question=[#BAD]Gain a Dark Pact Condition[] to\n[#GOOD]improve one Skill of your choice[]?
4.pyramids.fail.pass.flavor=You clasp his cold, dry hand. He asks which gift you want. As you answer, a second pulse begins to beat beneath your wrist.
4.pyramids.fail.pass.flavor.2=He tilts his head and studies you. "Someone has already claimed you," he hisses, and walks away.
4.pyramids.fail.fail.flavor=You refuse. The stranger smiles as if he expected it and slips away into the dunes without a sound.

################################################

1.antarctica.flavor=From the air, you spot the outline of a stone city beneath the ice. You land the plane as close as you dare and set out across the treacherous glacier on foot.
#Test Strength

1.antarctica.pass.flavor=You reach the city. A mural shows how the Elder Things sealed a pit beneath the ice. At your feet, one stone has worked loose from the rim. You lever it back into place, and the tapping below stops.
1.antarctica.pass.info=[#GOOD]Retreat Doom[]
1.antarctica.pass.flavor.2=But the history in those murals is vast and inhuman, and it presses hard against your mind.
#Test Will
1.antarctica.pass.pass.flavor=You steady your thoughts, close your notebook, and walk back to the plane with your mind still your own.
1.antarctica.pass.fail.flavor=To stay sane, you push everything you saw out of your mind, until even your own name feels distant.
1.antarctica.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.antarctica.fail.flavor=The ice gives way beneath you, and you land hard on the floor of a buried stone chamber.
1.antarctica.fail.info.1=[#BAD]Lose one Health[]
1.antarctica.fail.info.2=[#BAD]Gain a Back Injury Condition[]
1.antarctica.fail.flavor.2=Bruised and aching, you strike a match and look around.
#Test Observation-1
1.antarctica.fail.pass.flavor=Beside the frozen body of an Elder Thing, you spot a stone plug and a matching hole in the wall. You push the plug home just as something scratches at the far side.
1.antarctica.fail.pass.info=[#GOOD]Retreat Doom[]
1.antarctica.fail.fail.flavor=The match burns out before you see anything. You climb out by hacking footholds into the ice.

################################################

2.antarctica.flavor=A faint, piping sound echoes up from the caves that lead down beneath the ice. You hold your breath and listen, trying to tell where it comes from.
#Test Observation

2.antarctica.pass.flavor=You realise it is the call of Shoggoths, far below. You retreat to a ledge to wait for rescue, fighting to stay calm as the piping goes on and on.
#Test Will
2.antarctica.pass.pass.flavor=Keeping your nerve, you notice something glinting in the ice at your feet, an artifact dropped by some earlier explorer.
2.antarctica.pass.pass.info=[#GOOD]Gain one Artifact[]
2.antarctica.pass.fail.flavor=The piping fills your head until you black out. Even after the rescue, you hear it in every quiet room.
2.antarctica.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

2.antarctica.fail.flavor="Tekeli-li! Tekeli-li!" By the time you recognise the cry, a glistening black mass is pouring out of the tunnel toward you.
#Test Strength-1
2.antarctica.fail.pass.flavor=You drive it back with flares and fire, and it leaves behind a slick of residue that you collect for study.
2.antarctica.fail.pass.info=[#GOOD]Gain two Clues[]
2.antarctica.fail.fail.flavor=With nowhere else to go, you leap from a ledge and land badly on the ice below.
2.antarctica.fail.fail.info=[#BAD]Gain a Leg Injury Condition[]

################################################

3.antarctica.flavor=Beneath the snow you find what look like star-shaped burial mounds. Digging the bodies out of the frozen ground is brutal work, but you set to it.
#Test Strength

3.antarctica.pass.flavor=After hours of digging, you reach one of the bodies. Beside it lies a strange relic, buried with its owner.
3.antarctica.pass.info=[#GOOD]Gain one Artifact[]
3.antarctica.pass.flavor.2=Next, you brush the frost from the corpse and take a closer look.
#Test Observation-1
3.antarctica.pass.pass.flavor=You brush a thin film of ice from its chest. The things that seemed to stir under its skin were bubbles working their way to the surface. You finish your sketch with a steady hand.
3.antarctica.pass.fail.flavor=You lean close to sketch the ridges around its mouth. Only when your pencil touches the page do you notice that the mouth has opened.
3.antarctica.pass.fail.info=[#BAD]Lose one Sanity[]

3.antarctica.fail.flavor=Your pick glances off the ice, and you slip and badly twist your leg.
3.antarctica.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.antarctica.fail.flavor.2=The rest of the crew hang back, too frightened to go near the mounds. You plead with them to help.
#Test Influence
3.antarctica.fail.pass.flavor=Shamed into it, they dig beside you, and one of them unearths a strange object from the ice.
3.antarctica.fail.pass.info=[#GOOD]Gain one Artifact[]
3.antarctica.fail.fail.flavor=No one moves. You drag yourself back to camp alone through the bitter cold.
3.antarctica.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.antarctica.flavor=As you approach the black tower, the land around you ages before your eyes: glaciers advance and retreat, and centuries pass in moments. Then it stops, leaving your senses reeling.
#Test Will

4.antarctica.pass.flavor=You understand that you have glimpsed the future: something terrible breaking free from this tower. Only the right knowledge could stop it.
#Test Lore
4.antarctica.pass.pass.flavor=You recall the ancient signs of binding and carve them fresh across the tower door.
4.antarctica.pass.pass.info=[#GOOD]Retreat Doom[]
4.antarctica.pass.fail.flavor=You know of no way to stop it. From then on, you cannot shake the feeling that the future is watching you.
4.antarctica.pass.fail.info.1=[#BAD]Lose one Sanity[]
4.antarctica.pass.fail.info.2=[#BAD]Gain a Paranoia Condition[]

4.antarctica.fail.flavor=In the vision, you see your own severed head, one of many, all strung together by pale, fibrous threads.
4.antarctica.fail.info.1=[#BAD]Lose one Sanity[]
4.antarctica.fail.info.2=[#BAD]Gain a Hallucinations Condition[]
4.antarctica.fail.flavor.2=Countless voices babble in your skull, but one, fainter than the rest, is trying to tell you something.
#Test Observation-1
4.antarctica.fail.pass.flavor=You focus on that faint voice, and it teaches you words of power before it falls silent.
4.antarctica.fail.pass.info=[#GOOD]Gain one Spell[]
4.antarctica.fail.fail.flavor=The voices drown one another out, and when the vision ends, you remember none of them.

################################################

1.amazon.flavor=The vine-choked temple is in sight, but a writhing knot of venomous snakes lies between you and its doors. You will have to fight your way through.
#Test Strength-1

1.amazon.pass.flavor=You beat a path through the serpents into the Temple of Yig and topple the offering bowls before the next sacrifice.
1.amazon.pass.info=[#GOOD]Retreat Doom[]
1.amazon.pass.flavor.2=Serpentine runes coil along the walls, and their pattern seems to move. You must make sense of them before they hypnotise you.
#Test Lore
1.amazon.pass.pass.flavor=You recognise the runes as a warding prayer and recite its meaning aloud until their pull loosens.
1.amazon.pass.fail.flavor=The coils draw your eye round and round. When you finally look away, you cannot remember how you got here.
1.amazon.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.amazon.fail.flavor=Fangs sink into your calf, and burning venom spreads through your body.
1.amazon.fail.info.1=[#BAD]Lose one Health[]
1.amazon.fail.info.2=[#BAD]Gain an Internal Injury Condition[]
1.amazon.fail.flavor.2=As the fever builds, you notice that these snakes do not behave like ordinary snakes. You look closer to see why.
#Test Observation-1
1.amazon.fail.pass.flavor=Each bears a pale crescent on its head, the mark of Yig's children. You leave the offering the old stories describe, and something ancient in the temple settles back into sleep.
1.amazon.fail.pass.info=[#GOOD]Retreat Doom[]
1.amazon.fail.fail.flavor=The venom blurs your vision, and you stagger away before you can make out anything useful.

################################################

2.amazon.flavor=You touch the strange stone and sink into a deep trance. The jungle around you changes subtly: the colours are wrong, and the trees grow too tall. You search for clues about where you are.
#Test Observation

2.amazon.pass.flavor=Two suns hang in the sky; you have crossed into another dimension. You must draw on your arcane knowledge to find your way back.
#Test Lore
2.amazon.pass.pass.flavor=You wake on the jungle floor beside the stone. Lying next to it is an object that came back with you.
2.amazon.pass.pass.info=[#GOOD]Gain one Artifact[]
2.amazon.pass.fail.flavor=You make it home, but the crossing twists your thoughts in ways you cannot explain.
2.amazon.pass.fail.info=[#BAD]Lose two Sanity[]

2.amazon.fail.flavor=Something huge and grub-like rises from the alien undergrowth and wraps its tendrils around you. You fight to break free.
#Test Strength-1
2.amazon.fail.pass.flavor=You tear loose, and a severed tendril comes away in your hands, still twitching. You keep it for study.
2.amazon.fail.pass.info=[#GOOD]Gain two Clues[]
2.amazon.fail.fail.flavor=It flings you away like a rag doll, and you land hard across a fallen trunk.
2.amazon.fail.fail.info=[#BAD]Gain a Back Injury Condition[]

################################################

3.amazon.flavor=Rumour says that a secret of the ancients can be seen only from the top of a certain hill. The slope is steep and crumbling, but you start to climb.
#Test Strength

3.amazon.pass.flavor=Near the top, wedged in a crevice, you find a relic left by whoever climbed before you.
3.amazon.pass.info=[#GOOD]Gain one Artifact[]
3.amazon.pass.flavor.2=At the summit, the land stretches out for miles below you.
#Test Observation-1
3.amazon.pass.pass.flavor=Enormous lines and figures, hundreds of feet across, are cut into the plain below. You sketch every one of them.
3.amazon.pass.pass.info=[#GOOD]Gain one Clue[]
3.amazon.pass.fail.flavor=The drop yawns beneath you, and dizziness knots your stomach.
3.amazon.pass.fail.info=[#BAD]Lose one Sanity[]

3.amazon.fail.flavor=The climb takes far too long, and in the dark you stumble on the rocks and wrench your leg.
3.amazon.fail.info=[#BAD]Gain a Leg Injury Condition[]
3.amazon.fail.flavor.2=Stranded on the slope, you shout for the others down at camp.
#Test Influence
3.amazon.fail.pass.flavor=They come with lanterns, and in their light you see that you tripped over a carved relic half-buried in the rocks.
3.amazon.fail.pass.info=[#GOOD]Gain one Artifact[]
3.amazon.fail.fail.flavor=No one comes. You limp back to camp alone through the cold, dark night.
3.amazon.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.amazon.flavor=Colonel Percy Fawcett vanished somewhere in this jungle while searching for the Lost City of Z. You search for any trace of his expedition or the city itself.
#Test Observation-1

4.amazon.pass.flavor=You come across a young Kuikuro boy who clearly knows something, but he will not help you unless you win him over.
#Test Influence
4.amazon.pass.pass.flavor=Won over, he leads you to vine-covered ruins. Inside, wrapped in oilcloth, lies Fawcett's journal.
4.amazon.pass.pass.info=[#GOOD]Gain two Clues[]
4.amazon.pass.fail.flavor=The boy points at your pack and demands payment. While you hesitate, he grabs something and vanishes into the trees.
4.amazon.pass.fail.flavor.2=The boy demands payment, but you have nothing worth offering. He shrugs and disappears into the trees.
4.amazon.pass.fail.info=[#BAD]Discard one Item possession[]

4.amazon.fail.flavor=A mosquito bite swells overnight, and by morning you are shaking with fever.
#Test Strength-1
4.amazon.fail.pass.flavor=Back at camp, a medic brings your fever down. While you rest, she treats one of the ailments you brought with you.
4.amazon.fail.pass.flavor.2=The fever breaks before dawn. By the time your companions shoulder their packs, you are on your feet and ready to walk.
4.amazon.fail.pass.info=[#GOOD]Discard one Illness or Injury Condition[]
4.amazon.fail.fail.flavor=The fever only worsens, and your blood feels thick and tainted.
4.amazon.fail.fail.info.1=[#BAD]Lose one Health[]
4.amazon.fail.fail.info.2=[#BAD]Gain a Poisoned Condition[]

################################################

1.himalayas.flavor=A creature lurches out of the blizzard. You have seen it before, but only in your nightmares.
#Spawn a Monster on your space and immediately encounter it

1.himalayas.pass.flavor=You strike down the dream-beast, and the rift it came through seals shut behind it.
1.himalayas.pass.info=[#GOOD]Retreat Doom[]
1.himalayas.pass.flavor.2=The mountain villagers tell of paths into the Dreamlands. You try to work out how this place is connected to them.
#Test Lore
1.himalayas.pass.pass.flavor=The old tales give you the answer: a dream-gate in the high passes, now closed. You leave with your mind at ease.
1.himalayas.pass.fail.flavor=None of it makes sense, and you begin to doubt whether you are truly awake.
1.himalayas.pass.fail.info=[#BAD]Lose two Sanity[]

1.himalayas.fail.flavor=The creature shrugs off your attack. You flee across the snow, searching for somewhere to hide.
#Test Observation
1.himalayas.fail.pass.flavor=You squeeze into a narrow crevice and stay perfectly still. Unable to find you, the creature fades back into the dream it came from.
1.himalayas.fail.pass.info.1=[#GOOD]Discard the Monster[]
1.himalayas.fail.pass.info.2=[#GOOD]Retreat Doom[]
1.himalayas.fail.fail.flavor=You curl up behind a boulder and tremble as the creature's footsteps circle ever closer.
1.himalayas.fail.fail.info=[#BAD]Lose one Sanity[]

################################################

2.himalayas.flavor=Fleeing a deadly snowstorm, you take shelter in a cave. Inside, the tunnels twist and branch in the dark until you can barely tell which way you came.
#Test Observation

2.himalayas.pass.flavor=You find your way into a brightly lit laboratory. On a bench sits a metal cylinder holding a living human brain, and it speaks to you. Every word fills you with dread.
#Test Will
2.himalayas.pass.pass.flavor=You steady your nerves and question it. It tells you where the mi-go keep their instruments, and you take one.
2.himalayas.pass.pass.info=[#GOOD]Gain one Artifact[]
2.himalayas.pass.fail.flavor=Afterwards, you cannot stop wondering whose brain might be inside the people you meet.
2.himalayas.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

2.himalayas.fail.flavor=Pinkish winged things with crab-like claws close in on you from every side. You will have to fight your way out.
#Test Strength-1
2.himalayas.fail.pass.flavor=You club one of the mi-go into stillness and drag its strange body back to camp for study.
2.himalayas.fail.pass.info=[#GOOD]Gain two Clues[]
2.himalayas.fail.fail.flavor=They pin you down and drive a needle full of glowing fluid into your chest.
2.himalayas.fail.fail.info=[#BAD]Gain an Internal Injury Condition[]

################################################

3.himalayas.flavor=A gnoph-keh howls, and the sky answers with a killing blizzard aimed at you and your party. You must survive the storm before you can go on.
#Test Strength

3.himalayas.pass.flavor=You ride out the storm in a cave. Deep inside stands a statue of a three-eyed horror ringed by strange offerings, and you take one of them.
3.himalayas.pass.info=[#GOOD]Gain one Artifact[]
3.himalayas.pass.flavor.2=You study the statue, trying to work out what it depicts.
#Test Lore-1
3.himalayas.pass.pass.flavor=You recognise Rhan-Tegoth from the old texts, and knowing its name strips the idol of its hold over you.
3.himalayas.pass.fail.flavor=You cannot place the idol, and its three eyes follow you into your dreams night after night.
3.himalayas.pass.fail.info=[#BAD]Lose two Sanity[]

3.himalayas.fail.flavor=The storm pins you against an overhang. Your companions begin to panic. You must calm them before anyone bolts into the whiteout.
#Test Influence
3.himalayas.fail.pass.flavor=Your steady words hold them together, and when the snow clears, they help you dig out a relic the storm uncovered.
3.himalayas.fail.pass.info=[#GOOD]Gain one Artifact[]
3.himalayas.fail.fail.flavor=They turn on you, muttering that you led them here to die, and you begin to wonder which of them you can trust.
3.himalayas.fail.fail.info=[#BAD]Gain a Paranoia Condition[]

################################################

4.himalayas.flavor=The Order of the Death's Head is preparing to sacrifice an entire monastery of monks to summon the Ogress of Ra-Sa. You charge the Order's soldiers to free the prisoners.
#Test Strength

4.himalayas.pass.flavor=The soldiers scatter and the rite falls apart. A grateful monk presses an ancient scroll into your hands, and you try to decipher it.
#Test Lore-1
4.himalayas.pass.pass.flavor=The scroll's verses open up to you, and two powerful incantations stay with you.
4.himalayas.pass.pass.info=[#GOOD]Gain two Spells[]
4.himalayas.pass.fail.flavor=The verses will not stay on the page, and soon you see their images in the world around you.
4.himalayas.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

4.himalayas.fail.flavor=A rifle butt cracks against your knee, and you go down in the snow.
4.himalayas.fail.info=[#BAD]Gain a Leg Injury Condition[]
4.himalayas.fail.flavor.2=Above the fighting, the Order's commander keeps chanting, and the sound burrows into your mind.
#Test Will-1
4.himalayas.fail.pass.flavor=You shut out the chant, limp to the commander, and tear the book of rites from his hands.
4.himalayas.fail.pass.info=[#GOOD]Gain two Clues[]
4.himalayas.fail.fail.flavor=He points at you without missing a word, and you feel a hex settle over you.
4.himalayas.fail.fail.info=[#BAD]Gain a Cursed Condition[]

################################################

1.tunguska.flavor=A colour you have no name for drifts through the forest like a glowing fog, creeping over trees and stones. It stings and burns your skin, and you fight your way out of it.
#Test Strength

1.tunguska.pass.flavor=As you break free, the colour rises behind you and streaks up into the sky. You try to make sense of what you have just witnessed.
#Test LORE
1.tunguska.pass.pass.flavor=You recognize the glow from an account of an earlier visitation. You cover the last bright cinder with earth before it can take root again.
1.tunguska.pass.pass.info=[#GOOD]Retreat Doom[]
1.tunguska.pass.fail.flavor=Your mind simply refuses to hold on to what you saw, and the memory slips away.
1.tunguska.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

1.tunguska.fail.flavor=The earth heaves, and you are thrown down hard among the fallen trees.
1.tunguska.fail.info.1=[#BAD]Lose one Health[]
1.tunguska.fail.info.2=[#BAD]Gain a Leg Injury Condition[]
1.tunguska.fail.flavor.2=Grey ash fills the air, but somewhere within it you glimpse a faint, unnatural glow.
#Test Observation-1
1.tunguska.fail.pass.flavor=Near your boot, a thread of colour still joins the rising cloud to a stone. You kick earth over the stone. The thread breaks and the cloud lifts clear of the forest.
1.tunguska.fail.pass.info=[#GOOD]Retreat Doom[]
1.tunguska.fail.fail.flavor=The ash thickens until you can see nothing at all. When it settles, the glow is gone, and you have no idea where.

################################################

2.tunguska.flavor=A chunk of the rock beneath your feet crumbles away, revealing a hollow chamber below. You look for a safe way down.
#Test Observation

2.tunguska.pass.flavor=You climb down into a temple strewn with charred human remains. Every instinct screams at you to run.
#Test Will
2.tunguska.pass.pass.flavor=You stand your ground and sift through the ashes, uncovering a treasure buried here long ago.
2.tunguska.pass.pass.info=[#GOOD]Gain one Artifact[]
2.tunguska.pass.fail.flavor=The fiery sigils of Cthugha burn into your mind, and you flee in blind panic, certain that something is following you.
2.tunguska.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

2.tunguska.fail.flavor=The floor gives way beneath you, and you scramble to avoid being buried in the collapse.
#Test Strength-1
2.tunguska.fail.pass.flavor=You claw your way onto a ledge. Under the dust, the wall bears a great mural of Cthugha.
2.tunguska.fail.pass.info=[#GOOD]Gain two Clues[]
2.tunguska.fail.fail.flavor=A falling boulder slams into your back and pins you down.
2.tunguska.fail.fail.info=[#BAD]Gain a Back Injury Condition[]

################################################

3.tunguska.flavor=Following Rasputin's notes, you approach the crater just as poisonous fumes pour from a crack in the ground. Fighting to stay conscious, you keep climbing down.
#Test Strength

3.tunguska.pass.flavor=At the bottom, you find the remains of the monk's camp and, among them, a strange object he left behind.
3.tunguska.pass.info=[#GOOD]Gain one Artifact[]
3.tunguska.pass.flavor.2=With your prize secured, you start to search the blasted crater floor.
#Test Observation-1
3.tunguska.pass.pass.flavor=Glittering fragments of the fallen comet lie scattered in the scorched earth.
3.tunguska.pass.pass.info=[#GOOD]Gain one Clue[]
3.tunguska.pass.fail.flavor=The twisted, shattered land hurts to look at, and a deep unease settles over you.
3.tunguska.pass.fail.info=[#BAD]Lose one Sanity[]

3.tunguska.fail.flavor=The fumes sear your throat, and you taste blood with every breath.
3.tunguska.fail.info=[#BAD]Gain an Internal Injury Condition[]
3.tunguska.fail.flavor.2=Barely able to breathe, you beg your guides to come down after you.
#Test Influence
3.tunguska.fail.pass.flavor=Your guides haul you to safety and bring Rasputin's belongings up with you.
3.tunguska.fail.pass.info=[#GOOD]Gain one Artifact[]
3.tunguska.fail.fail.flavor=Your guides refuse to come down. You crawl back up the slope alone, gasping for air.
3.tunguska.fail.fail.info=[#BAD]Lose two Health[]

################################################

4.tunguska.flavor=You cross paths with a band of Russian monks who claim to be fleeing persecution. Something about them doesn't seem right, so you keep a close eye on them.
#Test Observation

4.tunguska.pass.flavor=Beneath the scorched hems of their robes, you spot the sign of the Nestarians traced in ash. The ash flares into a ring of fire. To break their rite, you must make yourself step through.
#Test Will-1
4.tunguska.pass.pass.flavor=You burst through the flames and break their circle before the ritual can finish.
4.tunguska.pass.pass.info=[#GOOD]Retreat Doom[]
4.tunguska.pass.fail.flavor=The fire holds you back, and you are forced to watch their unholy rite to its end.
4.tunguska.pass.fail.info=[#BAD]Lose one Sanity[]

4.tunguska.fail.flavor=You suspect nothing until they share their water with you. After a single sip, a burning poison spreads through your body.
#Test Strength-1
4.tunguska.fail.pass.flavor=You fight off the poison and rise to your feet, and the monks flee in terror, leaving their ritual unfinished.
4.tunguska.fail.pass.info=[#GOOD]Retreat Doom[]
4.tunguska.fail.fail.flavor=The poison takes hold, racking your body and filling your mind with burning visions.
4.tunguska.fail.fail.info.1=[#BAD]Lose two Sanity[]
4.tunguska.fail.fail.info.2=[#BAD]Gain a Poisoned Condition[]

################################################
