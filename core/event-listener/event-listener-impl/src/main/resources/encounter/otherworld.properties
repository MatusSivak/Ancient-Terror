##### 1 #####
1.title=Great Hall of Celaeno
1.flavor=You are stunned to see a familiar face reading through tomes of dark sorcery. You try to catch a glimpse of what he's reading without alerting him to your presence.
#Test Observation-1

1.pass.flavor=You learn what he's been reading and realize that he has opened a portal between worlds.
1.pass.info=[#GOOD]Close this Gate[]
1.pass.flavor.2=Afterward, you examine the book that he was reading.
#Test Lore
1.pass.pass.option.1=[#GOOD]Gain one Clue[]
1.pass.pass.option.2=[#GOOD]Gain one Spell[]
1.pass.fail.flavor=You've never encountered such horrors before.
1.pass.fail.info=[#BAD]Lose two Sanity[]

1.fail.flavor=He spots you and unleashes a torrent of arcane energy that tears at your mind.
#Lose 3 Sanity unless you spend 1 Clue.
1.fail.option.1=[#BAD]Lose 3 Sanity[]
1.fail.option.2=[#BAD]Spend one Clue[]

##### 2 #####
2.title=The Future
2.flavor=You stand in Times Square, New York, but not as you know it. The streets are empty, and the buildings have crumbled to dust. It appears that you will fail to save the world, and you try desperately not to fall into despair.
#Test Lore-1

2.pass.flavor=You get to your feet and find what is left of the central library. The books you find there prove useful.
2.pass.info=[#GOOD]Close this Gate[]
2.pass.flavor.2=Deep in the basement of the library, you dig through the archives, searching for clues about the downfall of man.
#Test Observation
2.pass.pass.info=[#GOOD]Gain two Clues[]

2.fail.flavor=As you kneel sobbing on the cracked pavement, a shadow of a man falls over you. "You caused this," the man says calmly. His gold headdress looks somehow familiar.
#Test Lore
2.fail.fail.flavor=You accept the truth in his words.
2.fail.fail.info=[#BAD]Lose six Sanity[]

##### 3 #####
3.title=City of the Great Race
3.flavor=On a high, stone shelf you find books containing the wisdom of both the distant past and the far-flung future. Unfortunately, the tomes were written using a series of strange curvilinear symbols. You do your best to translate the alien language.
#Test Lore-1

3.pass.flavor=You decipher the means to return yourself to your own time.
3.pass.info=[#GOOD]Close this Gate[]
3.pass.flavor.2=After you return, you forget your time with the Great Race, but are plagued by strange dreams.
#Test Will
3.pass.pass.flavor=You explore these visions during your sleep.
3.pass.pass.info=[#GOOD]Gain one Clue[]

3.fail.flavor=The symbols make no sense to you. You fear that you will be stuck here forever and search for a way home. You feel despair eating at you.
3.fail.option.1=[#BAD]Lose two Sanity\nGain a Paranoia Condition[]
3.fail.option.2=[#BAD]Spend one Clue[]

##### 4 #####
4.title=Lost Carcosa
4.flavor=Turning the corner, you suddenly find yourself on stage. Other actors speak their dialogue and look at you expectantly. Someone offstage passes you a script, but the text is difficult to interpret.
#Test Lore-1

4.pass.flavor=The audience applauds your performance and the curtain falls.
4.pass.info=[#GOOD]Close this Gate[]
4.pass.flavor.2=You consider sticking around for the second show in hopes of picking up details you missed the first time.
4.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain two Clues[]?

4.fail.flavor=The other actors glare at you, waiting for you to speak. You hope that by simply acting with confidence they'll believe it's someone else's line.
#Test Influence
4.fail.fail.flavor=The show comes to a stop, and everyone silently leaves the theater.
4.fail.fail.info=[#BAD]Advance Doom[]

##### 5 #####
5.title=The Past
5.flavor=Through the slits in the closet door you see yourself as a small child, sitting up in bed. "Who's there?" asks a frightened voice. You try to calmly persuade your younger self that you're a friend.
#Test Influence-1

5.pass.flavor=The child calms down, but eyes you suspiciously.
5.pass.info=[#GOOD]Close this Gate[]
5.pass.flavor.2="Listen carefully to what I say," you tell yourself. "It might save your life...".
5.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain two Clues[]?

5.fail.flavor=The child screams out for help, and a man bursts into your bedroom. Your father aims his shotgun at your chest, and you attempt to wrestle it away.
#Test Strength
5.fail.fail.flavor=You are peppered with buckshot.
5.fail.fail.info=[#BAD]Lose six Health[]

##### 6 #####
6.title=The Past
6.flavor=You find yourself standing in front of antique scientific equipment. According to the papers the year is 1771. You read through the notes and try to interpret the nature of the experiments.
#Test Lore

6.pass.flavor=Joseph Curwen was using this lab to revive dead wizards from their ashes and interrogate them for arcane knowledge. You use his notes.
6.pass.info=[#GOOD]Close this Gate[]
6.pass.flavor.2=The rest of his results may also prove useful.
6.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain one Spell[]?

6.fail.flavor=These notes make no sense to you. Your reading is interrupted by a terrible moaning sound, and you find malformed creatures trapped in deep wells under the stone floor. The sight of them tears at your mind.
#Test Will
6.fail.fail.info=[#BAD]Lose three Sanity[]

##### 7 #####
7.title=The Dreamlands
7.flavor=In the cavern of flame, the bearded priests Nasht and Kaman-Thah warn you that it is too dangerous to continue. You insist that you possess the knowledge you need and are resolved to enter the Dreamlands.
# Test Will-1, Roll 1 additional die for each Clue you have.

7.pass.flavor=After gaining access to the Dreamlands, you find yourself fighting moonbeasts on a black galley sailing to the moon.
#Test Strength
7.pass.pass.flavor=You steal their treasure and are able to barter with it.
7.pass.pass.info=[#GOOD]Close this Gate[]
7.pass.fail.flavor=You become lost in a forest on the moon.
7.pass.fail.info.1=[#BAD]Lose two Health[]
7.pass.fail.info.2=[#BAD]Become Delayed[]

7.fail.flavor=The gods of dreams exile you back to the waking world and punish you for your overreaching ambition. Your dream and the waking world become indistinguishable.
7.fail.info.1=[#BAD]Become Delayed[]
7.fail.info.2=[#BAD]Gain a Hallucinations Condition[]

##### 8 #####
8.title=The Future
8.flavor=You find yourself in a familiar city, but there's no electricity. The only light comes from the greenish moon, and the only sound is distant screaming. You can feel your reason being overrun by fear.
#Test Will

8.pass.flavor=Resisting the urge to panic, you find a large metal and glass machine that has electricity sparking across its surface. You try to learn how to operate the device.
#Test Lore
8.pass.pass.flavor=You return to your own time.
8.pass.pass.info=[#GOOD]Close this Gate[]
8.pass.fail.flavor=You receive an electrical shock.
8.pass.fail.info=[#BAD]Lose two Health[]

8.fail.flavor=Without thinking, you start walking with a long line of people. You hear screams from the people ahead of you. You try to escape, but the area is being guarded.
#Test Strength
8.fail.fail.flavor=You return home with no memory of what happened.
8.fail.fail.info=[#BAD]Gain an Amnesia Condition[]

##### 9 #####
9.title=City of the Great Race
9.flavor=You are horrified to realize that the body you are inhabiting in this world is not your own. The shock of seeing yourself in an alien, conical shell threatens to shatter your mind.
#Test Will

9.pass.flavor=You steel yourself against the horror of this alien body and try to recall the knowledge necessary to build a device that will return you to your body.
#Test Lore
9.pass.pass.flavor=The machine works.
9.pass.pass.info=[#GOOD]Close this Gate[]
9.pass.fail.flavor=The machine malfunctions.
9.pass.fail.info=[#BAD]Lose two Health[]

9.fail.flavor=The horrible truth shakes the foundations of your mind. You try to banish any knowledge of the arcane from your thoughts, but you lose your grip on reality.
9.fail.option.1=[#BAD]Gain a Hallucinations\nCondition[]
9.fail.option.2=[#BAD]Spend one Clue[]

##### 10 #####
10.title=Yuggoth
10.flavor=You find a room filled with strange metal cylinders. Inside of each cylinder is a living brain that can communicate through a speaker box. You ask them for help.
#Test Influence

10.pass.flavor=They describe how to operate the mi-go's machinery to travel between worlds. Based on what they say, you try to operate the alien devices.
#Test Lore
10.pass.pass.flavor=You return home.
10.pass.pass.info=[#GOOD]Close this Gate[]
10.pass.fail.flavor=The machine shows you horrid vistas you would never want to visit.
10.pass.fail.info=[#BAD]Lose one Sanity[]

10.fail.flavor=The disembodied brains demand that you stay. They tell you terrible secrets they've learned about the fate of the Earth.
10.fail.option.1=[#BAD]Lose 2 Sanity[]
10.fail.option.2=[#BAD]Spend one Clue[]

##### 11 #####
11.title=Great Hall of Celaeno
11.flavor=You are forbidden to enter the library unless you bear the necessary sigil. You draw the symbol to the best of your knowledge.
#Test Lore

11.pass.flavor=After you enter the Great Hall, you realize you must have confidence in your actions so others do not suspect you of trespassing.
#Test Will
11.pass.pass.flavor=You recover the book you are looking for.
11.pass.pass.info=[#GOOD]Close this Gate[]
11.pass.fail.flavor=Your fear gives you away and you are held captive.
11.pass.fail.info=[#BAD]Become Delayed[]

11.fail.flavor=Your drawing proves insufficient and you find yourself back on Earth, struggling to retain your memories of what happened.
11.fail.option.1=[#BAD]Gain an Amnesia Condition[]
11.fail.option.2=[#BAD]Spend one Clue[]

##### 12 #####
12.title=Lost Carcosa
12.flavor=You grow frustrated walking through the empty streets, able to hear people talking and laughing nearby, but unable to catch up to them. You try to focus and distinguish specific words from the mingling conversations.
#Test Observation

12.pass.flavor=The words you hear sound familiar to something you've read. You try to recall their significance.
#Test Lore
12.pass.pass.flavor=You use the words.
12.pass.pass.info=[#GOOD]Close this Gate[]
12.pass.fail.flavor=The words insinuate themselves into every conversation you hear.
12.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

12.fail.flavor=The words remain unintelligible, and you realize that you've become lost in the city while chasing after these voices. You walk, lost, through Carcosa's darkest alleyways and consider time consuming retracing your steps.
12.fail.option.1=[#BAD]Lose two Sanity[]
12.fail.option.2=[#BAD]Become Delayed[]

##### 13 #####
13.title=Yuggoth
13.flavor=You discover a waxen mask and artificial hands. Your mind reels as you realize that the old man you had spoken to earlier was actually some terrible creature disguised as a human.
#Test Will

13.pass.flavor=You realize now that the old man's words carry a secondary meaning. You attempt to decrypt what he said.
#Test Lore
13.pass.pass.flavor=You understand the man's implied instructions.
13.pass.pass.info=[#GOOD]Close this Gate[]
13.pass.fail.flavor=His words lead you in circles.
13.pass.fail.info=[#BAD]Become Delayed[]

13.fail.flavor=What was the nature of that blasphemous horror behind the mask? You consult your notes, trying to find what might disguise itself this way.
#Test Lore-1
13.fail.pass.flavor=You find the data you need.
13.fail.pass.info=[#GOOD]Close this Gate[]
13.fail.fail.flavor=Fear of the unknowable eats at your thoughts.
13.fail.fail.info=[#BAD]Lose three Sanity[]

##### 14 #####
14.title=City of the Great Race
14.flavor=You hear the sound of a terrible gust of wind and listen carefully.
14.question=[#BAD]Spend one Clue[] to determine\nthe origin of the sound?

14.pass.flavor=Something large and powerful is trying to break through a sealed trap door. The racket is startling, and you consider running away.
#Test Will
14.pass.pass.flavor=You resolve to fend off the terrible beast and, with the help of the Yithians, you close this Gate.
14.pass.pass.info=[#GOOD]Close this Gate[]
14.pass.fail.flavor=You flee in terror from approaching threat.
14.pass.fail.info=[#BAD]Lose one Sanity[]

14.fail.flavor=Bursting up through an opening in the floor, a flying polyp attacks!
#Test Strength
14.fail.pass.flavor=The grateful Yithians help you.
14.fail.pass.info=[#GOOD]Close this Gate[]
14.fail.fail.flavor=The encounter leaves you bruised and shaken.
14.fail.fail.info.1=[#BAD]Lose one Health[]
14.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 15 #####
15.title=Yuggoth
15.flavor=You discover a fetid creature with wings and webbed feet. The beast is strange, like something from your wildest dreams.
15.question=[#BAD]Spend one Clue[] to\ninspect this beast?

15.pass.flavor=You believe you've read of a way to use this beast to travel through space.
#Test Lore
15.pass.pass.flavor=You remember that by drinking space-mead you can safely use this byakhee to return home.
15.pass.pass.info=[#GOOD]Close this Gate[]
15.pass.fail.flavor=You drink something you shouldn't have.
15.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

15.fail.flavor=The creature is terrifying, but if you can keep your calm, you will be able to overpower it.
#Test Will
15.fail.pass.flavor=You subdue the creature and use it to return home.
15.fail.pass.info=[#GOOD]Close this Gate[]
15.fail.fail.info=[#BAD]Lose one Health[]

##### 16 #####
16.title=Great Hall of Celaeno
16.flavor=The book you are looking for is not on its proper shelf. You search the surrounding area, but after long hours you have lost the will to keep searching.
#Test Will

16.pass.flavor=The tome was hidden at the back of the shelf. Opening it up you find a series of handwritten instructions scrawled in the margin. You follow the instructions to the best of your understanding.
#Test Lore
16.pass.pass.info=[#GOOD]Close this Gate[]
16.pass.fail.flavor=You become frustrated.
16.pass.fail.info=[#BAD]Lose one Sanity[]

16.fail.flavor=You cannot find the book, but perhaps you unknowingly already have the information you need.
16.fail.question=[#BAD]Spend one Clue[] to [#GOOD]Close this Gate[]?
16.fail.fail.info=[#BAD]Become Delayed[]

##### 17 #####
17.title=Lost Carcosa
17.flavor=Staring out at the cloudy water of Lake Hali, you are horrified to see the entire lake rippling, as if something at the bottom is about to surface. You are seized by a terrible panic that paralyzes you.
#Test Will

17.pass.flavor=Through sheer will, you force yourself to run toward the door you entered through. You find the doorway has been replaced by a blank wall. You try to recall an incantation from your studies that will open the lost portal.
#Test Lore
17.pass.pass.info=[#GOOD]Close this Gate[]
17.pass.fail.flavor=You frantically scratch at the wallpaper.
17.pass.fail.info=[#BAD]Lose one Sanity[]

17.fail.flavor=Suddenly, a flurry of tentacles bursts out of the water. One of the flailing limbs grabs you and tries to pull you into the water. You attempt to bind the creature with powerful magic.
#Test Lore-1
17.fail.pass.flavor=You run for your life.
17.fail.pass.info=[#GOOD]Close this Gate[]
17.fail.fail.flavor=You are dragged into the water.
17.fail.fail.info=[#BAD]Lose two Health[]

##### 18 #####
18.title=The Underworld
18.flavor=You find yourself surrounded by ghouls. However, they don't seem to be antagonistic toward you. In fact, you believe you could persuade them to help you.
#Test Influence

18.pass.flavor=The ghouls direct you into the Tower of Koth in the City of the Gugs. As you ascend the tower's stairs, an enormous gug chases after you. The sound of the monstrosity rattles your nerves.
#Test Will
18.pass.pass.info=[#GOOD]Close this Gate[]
18.pass.fail.flavor=You hide, waiting for it to go away.
18.pass.fail.info=[#BAD]Lose one Sanity[]

18.fail.flavor=Your well-reasoned arguments seem to have no impact, but bribery might.
18.fail.question=[#BAD]Discard one Item[] to [#GOOD]Close this Gate[]?
18.fail.fail.flavor=The ghouls attack you.
18.fail.fail.info.1=[#BAD]Lose one Health[]
18.fail.fail.info.2=[#BAD]Gain an Injury Condition[]

##### 19 #####
19.title=City of the Great Race
19.flavor=You find others who, like you, have had their consciousness pulled into alien bodies from throughout time. You try to convince them to share their knowledge.
#Test Influence

19.pass.flavor=Their stories are highly illuminating.
19.pass.info=[#GOOD]Gain two Clues[]
19.pass.flavor.2=They remind you of a ritual you researched that may provide you with a solution.
#Test Lore-1
19.pass.pass.info=[#GOOD]Close this Gate[]
19.pass.fail.flavor=Your attempts only meet with failure.
19.pass.fail.info=[#BAD]Lose one Sanity[]

19.fail.flavor=You gain nothing from speaking to them. Just being around them sets you on edge. Your mind might unhinge if you continue to push yourself without resting.
19.fail.option.1=[#BAD]Gain a Paranoia Condition\nLose one Sanity[]
19.fail.option.2=[#BAD]Become Delayed[]

##### 20 #####
20.title=Great Hall of Celaeno
20.flavor=The book you are reading describes complex rituals in very abstract terms. You do your best to comprehend the dense material.
#Test Lore

20.pass.flavor=You gradually begin to see a pattern emerge.
20.pass.info=[#GOOD]Gain one Spell[]
20.pass.flavor.2=After staring so long at the book, however, you've forgotten how to get back home. You ask others in the library for help.
#Test Influence-1
20.pass.pass.flavor=An alien creature comes to your aid.
20.pass.pass.info=[#GOOD]Close this Gate[]
20.pass.fail.flavor=You wander the Great Hall.
20.pass.fail.info=[#BAD]Become Delayed[]

20.fail.flavor=The opaque descriptions twist your mind with horrid imagery.
20.fail.info=[#BAD]Gain a Hallucinations Condition[]
20.fail.flavor.2=In your unsteady state, you are overcome by vertigo as you descend the stairs to leave. You must focus to keep your footing.
#Test Will
20.fail.fail.info=[#BAD]Lose two Health[]

##### 21 #####
21.title=The Dreamlands
21.flavor=You are strictly admonished that in the city of Ulthar, no man may kill a cat. As a result, you see the city is filled with cats. If you know the language, you can communicate with these highly intelligent creatures.
#Test Lore

21.pass.flavor=The cats are pleased to chat and share useful secrets.
21.pass.info=[#GOOD]Gain two Clues[]
21.pass.flavor.2=When the topic of food is brought up, dozens of cats take an interest. A crowd of hungry felines surround you.
21.pass.option.1=[#BAD]Become Delayed[]
21.pass.option.2=[#BAD]Spend one Health[]
21.pass.pass.flavor=You feed the cats your rations and go hungry yourself.
21.pass.pass.info=[#GOOD]Close this Gate[]

21.fail.flavor=The cats flee from you, making the people of Ulthar suspicious and they force you into the Enchanted Wood.
21.fail.info=[#BAD]Lose one Health[]
21.fail.flavor.2=While you're out there, you must keep a careful watch to prevent the zoogs from stealing your belongings.
#Test Observation
21.fail.fail.info=[#BAD]Discard one Item possession[]

##### 22 #####
22.title=Yuggoth
22.flavor=The mi-go refuse to go near the city of green pyramids. You summon your courage and explore this abandoned area.
#Test Will

22.pass.flavor=You find lost treasure!
22.pass.info=[#GOOD]Gain one Artifact[]
22.pass.flavor.2=You hear sounds coming from within the pyramids and look for a place to hide.
#Test Observation-1
22.pass.pass.flavor=You stay out of sight until the threat is gone.
22.pass.pass.info=[#GOOD]Close this Gate[]
22.pass.fail.flavor=You wake up uncertain of what's happened.
22.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

22.fail.flavor=You run from the pyramids as fast as you can. Until the mi-go return, you need to rely on your own means of survival.
#Test Strength
22.fail.fail.flavor=You succumb to the harsh elements of this strange world.
22.fail.fail.info.1=[#BAD]Lose one Health[]
22.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 23 #####
23.title=The Abyss
23.flavor=The nightgaunts seem intent on keeping you here in the darkness. You do your best to continue climbing out of these terrible depths without alerting them to your presence.
#Test Observation

23.pass.flavor=You reach the trap door that leads from the Abyss to Sarkomand. The journey has only strengthened your resolve.
23.pass.info=[#GOOD]Improve Will[]
23.pass.flavor.2=Now it will require all of your strength to push open the door.
#Test Strength-1
23.pass.pass.flavor=You are able to escape.
23.pass.pass.info=[#GOOD]Close this Gate[].
23.pass.fail.info=[#BAD]Gain a Back Injury Condition[]

23.fail.flavor=The nightgaunts pick you up and toss you back to the bottom of the Abyss.
23.fail.info=[#BAD]Gain a Leg Injury Condition[]
23.fail.flavor.2=In this dark stony landscape, you struggle to resist fear and hunger.
#Test Will
23.fail.fail.info.1=[#BAD]Lose one Health[]
23.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 24 #####
24.title=Lost Carcosa
24.flavor=At an elaborate masquerade, you talk to decadent party-goers who are all maneuvering to be declared as the proper heir to the crown.
#Test Influence

24.pass.flavor=Believing that you can help him, a guest attempts to bribe you.
24.pass.info=[#GOOD]Gain one Artifact[]
24.pass.flavor.2=Seeing this, the Queen demands that you unmask. She questions you relentlessly in an attempt to discover what you've learned.
24.pass.option.1=[#BAD]Become Delayed[]
24.pass.option.2=[#BAD]Spend two Clues[]
24.pass.pass.flavor=You gain her favor.
24.pass.pass.info=[#GOOD]Close this Gate[]

24.fail.flavor=You suddenly realize you are speaking to the Phantom of Truth.
24.fail.info=[#BAD]Lose one Sanity[]
24.fail.flavor.2=Fear threatens to overwhelm you when you realize he is not wearing a mask.
#Test Will
24.fail.fail.info=[#BAD]Gain a Paranoia Condition[]

##### 25 #####
25.title=The Dreamlands
25.flavor=In Dylath-Leen, a suspicious-looking thug in a dark robe offers you his help. However, he warns you that he's a fugitive being hunted by the prince's agents and will require your protection.
#Test Strength-2

25.pass.flavor=You defend the man from his assailants, and he gratefully invites you aboard his galley to return you to the waking world.
25.pass.info=[#GOOD]Close this Gate[]
25.pass.flavor.2=As you speak to him, it is clear he knows many forgotten truths.
25.pass.question=[#BAD]Become Delayed[] to [#GOOD]Improve Lore[]?

25.fail.flavor=The Eyes of Dylath-Leen capture you and sell you as a slave. You try to persuade the other slaves to fight back.
#Test Influence
25.fail.pass.flavor=The former slaves gratefully help you.
25.fail.pass.info=[#GOOD]Close this Gate[]
25.fail.fail.flavor=You are banished as punishment.
25.fail.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

##### 26 #####
26.title=The Past
26.flavor=Through the shifting sands of the desert, you spot a deranged-looking man. You try to follow him, but he abruptly disappears. You search the wind-swept landscape for any sign of him.
#Test Observation

26.pass.flavor=You find the man inside a cave, examining a mural. You think you recognize Abdul Alhazred and the Nameless City.
#Test Lore-1
26.pass.pass.flavor=The Mad Arab returns you to your home.
26.pass.pass.info=[#GOOD]Close this Gate[]
26.pass.fail.flavor=You leave the cave, forsaken.
26.pass.fail.info=[#BAD]Gain a Cursed Condition[]

26.fail.flavor=You wander in the unrelenting heat of the desert, forcing yourself to keep going
#Test Will-1
26.fail.pass.flavor=You eventually find an object in the sands.
26.fail.pass.info=[#GOOD]Gain one Artifact[]
26.fail.fail.flavor=You collapse in despair.
26.fail.fail.info.1=[#BAD]Lose two Health[]
26.fail.fail.info.2=[#BAD]Gain a Hallucinations Condition[]

##### 27 #####
27.title=Yuggoth
27.flavor=You find a dead mi-go that was carrying a large container of the strange metal known as tok'l. Although valuable, the substance is also extremely heavy, and the container proves difficult to move.
#Test Strength-1

27.pass.flavor=You hope to trade the tok'l to the mi-go in exchange for their help.
#Test Influence-1
27.pass.pass.flavor=The strange, winged crustaceans agree and return you home.
27.pass.pass.info=[#GOOD]Close this Gate[]
27.pass.fail.flavor=The mi-go use a device to steal both the container and your memories.
27.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

27.fail.flavor=The container proves too heavy to carry.
27.fail.info=[#BAD]Gain a Back Injury Condition[]
27.fail.flavor.2=You take only a small sample to study.
#Test Lore-1
27.fail.pass.flavor=The alien substance gives you insight into the arcane arts.
27.fail.pass.info=[#GOOD]Gain one Spell[]

##### 28 #####
28.title=Lost Carcosa
28.flavor=A strange-looking man named Wilde offers to repair your reputation in exchange for information.
28.question=[#BAD]Spend one Clue[] to repair your reputation?

28.pass.flavor=Your reputation is repaired.
28.pass.info=[#GOOD]Improve Influence[]
28.pass.flavor.2=Wilde then tells you that you are the Last King of America. You try to resist this delusion.
#Test Will-1
28.pass.pass.flavor=Wilde troubles you no further and sends you home.
28.pass.pass.info=[#GOOD]Close this Gate[]
28.pass.fail.flavor=You become highly suspicious of threats to your throne.
28.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

28.fail.flavor=After turning down the offer, you find yourself the target of a smear campaign engineered by Wilde. You are certain that you command enough respect to resist his efforts.
#Test Influence-1
28.fail.fail.flavor=People on the street openly glare at you.
28.fail.fail.info.1=[#BAD]Lose one Sanity[]
28.fail.fail.info.2=[#BAD]Discard all Allies[]

##### 29 #####
29.title=The Future
29.flavor=You find yourself in an unknown place. Large beetle-like creatures swarm over the landscape. You search the charred surroundings to find some central location from which they originate.
#Test Observation-1

29.pass.flavor=You reach a city and discover a written form of language.
#Test Lore
29.pass.pass.flavor=You realize that this is the Great Race of Yith in the far future and convince them to send you home.
29.pass.pass.info=[#GOOD]Close this Gate[]
29.pass.fail.flavor=The toxic atmosphere takes a toll on you before you can find an escape.
29.pass.fail.info=[#BAD]Gain a Poisoned Condition[]

29.fail.flavor=One of the beetles tries to dominate your mind.
#Test Will-1
29.fail.pass.flavor=You retain your personality but gain memories of other times.
29.fail.pass.info=[#GOOD]Gain one Clue[]
29.fail.fail.flavor=You trade bodies with the beetle temporarily.
29.fail.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

##### 30 #####
30.title=Plateau of Leng
30.flavor=As you make your way through a web-filled valley, you see an enormous purple spider crawling toward your path. You hope to sneak past the creature.
#Test Observation-1

30.pass.flavor=As you leave the spider behind, you discover the corpse of a previous victim. You find the unfortunate man's journal and translate the strange symbols on the pages.
#Test Lore
30.pass.pass.flavor=You discover a safe path home.
30.pass.pass.info=[#GOOD]Close this Gate[]
30.pass.fail.flavor=You misinterpret the directions.
30.pass.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

30.fail.flavor=The spider sees you and attacks!
#Test Strength-1
30.fail.pass.flavor=You rescue someone else trapped in its web.
30.fail.pass.info=[#GOOD]Gain one random Ally from the deck[]
30.fail.fail.flavor=You're bitten by the spider.
30.fail.fail.info.1=[#BAD]Lose one Health[]
30.fail.fail.info.2=[#BAD]Gain a Poisoned Condition[]
