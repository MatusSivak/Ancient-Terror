##### 1 #####
1.title=Great Hall of Celaeno
1.flavor=Between the towering shelves you spot a scholar you once met in Arkham, hunched over a grimoire of forbidden rites. Keeping to the shadows, you edge close enough to read over his shoulder.
#Test Observation-1

1.pass.flavor=The diagrams on his page describe a rite for tearing open the walls between worlds. He used it to open the very gate you came through, and the counter-sign is written right beside it.
1.pass.info=[#GOOD]Close this Gate[]
1.pass.flavor.2=When he finally shuffles away, you slip into his chair and open the grimoire yourself.
#Test Lore
1.pass.pass.flavor=The cramped script yields its meaning page by page. There is time to take one lesson with you.
1.pass.pass.option.1=[#GOOD]Gain one Clue[]
1.pass.pass.option.1.flavor=You copy his margin notes, a trail of hints about the cult that funds his work.
1.pass.pass.option.2=[#GOOD]Gain one Spell[]
1.pass.pass.option.2.flavor=You commit a short incantation to memory before closing the cover.
1.pass.fail.flavor=The engravings seem to crawl across the page toward your fingers. You slam the book shut, trembling.
1.pass.fail.info=[#BAD]Lose two Sanity[]

1.fail.flavor=He turns sharply, meets your eyes, and hisses a single syllable that drives into your skull like a nail.
#Lose three Sanity unless you spend one Clue.
1.fail.option.1=[#BAD]Lose three Sanity[]
1.fail.option.1.flavor=The word echoes inside your head for hours, scattering every thought you try to hold.
1.fail.option.2=[#BAD]Spend one Clue[]
1.fail.option.2.flavor=You recall a warding phrase from your research and murmur it back at him. His curse breaks against it like surf on a rock.

##### 2 #####
2.title=The Future
2.flavor=Weeds split the pavement of a silent Times Square. The signs are dark and the towers are hollow shells. This is the world after you have failed, and the weight of it presses you to your knees.
#Test Lore-1

2.pass.flavor=You refuse to accept this ending. Among the ruins you find the shell of the public library, and in its reading room an account of the gate that brought you here.
2.pass.info=[#GOOD]Close this Gate[]
2.pass.flavor.2=Before you go, you descend into the flooded stacks below, hoping the records there explain how humanity fell.
#Test Observation
2.pass.pass.flavor=Behind a rusted cabinet you find a bundle of newspapers chronicling the last days. You tuck them into your coat.
2.pass.pass.info=[#GOOD]Gain two Clues[]
2.pass.fail.flavor=Water and mold have ruined every page. Whatever the archives once held is lost to you.

2.fail.flavor=You slump onto the curb. A tall figure crowned in beaten gold steps out of the haze and regards you without pity. "All of this," he says softly, "is your doing."
#Test Lore
2.fail.pass.flavor=You recognize that crown from an old engraving and know him for the Crawling Chaos, a liar above all things. You deny his words, and he fades into the dust.
2.fail.fail.flavor=You have no answer for him. Deep down, you believe every word.
2.fail.fail.info=[#BAD]Lose six Sanity[]

##### 3 #####
3.title=City of the Great Race
3.flavor=The Yithian archive holds histories of ages long past and ages yet to come, but every volume is written in looping, curved glyphs. You settle in to puzzle out the script.
#Test Lore-1

3.pass.flavor=Slowly the glyphs give up their meaning, and among them you find the procedure for sending a mind back to its own era.
3.pass.info=[#GOOD]Close this Gate[]
3.pass.flavor.2=Back home, your memories of the archive fade, but each night your sleep fills with towering cones and endless libraries.
#Test Will
3.pass.pass.flavor=Instead of fighting the dreams, you follow them, and each morning you wake with new fragments of knowledge.
3.pass.pass.info=[#GOOD]Gain one Clue[]
3.pass.fail.flavor=The dreams frighten you, and you force yourself awake before they can show you anything of use.

3.fail.flavor=The glyphs refuse to make sense, and the hours slip away. The fear that you will never leave this place grows with every one of them.
3.fail.option.1=[#BAD]Lose two Sanity\nGain a Paranoia Condition[]
3.fail.option.1.flavor=You begin to suspect the Yithians are keeping you here on purpose, and you see watchers in every corridor.
3.fail.option.2=[#BAD]Spend one Clue[]
3.fail.option.2.flavor=You fall back on your own notes. One familiar symbol among the glyphs is enough hope to keep panic at bay.

##### 4 #####
4.title=Lost Carcosa
4.flavor=You step through a doorway and onto a lit stage. Costumed players fall silent and wait for your line. Someone in the wings presses a script into your hands, but its words rearrange themselves as you read.
#Test Lore-1

4.pass.flavor=You find the rhythm of the play and deliver your lines without a stumble. The curtain falls to thunderous applause, and the stage door opens onto home.
4.pass.info=[#GOOD]Close this Gate[]
4.pass.flavor.2=The play hides more than it shows. Watching another performance might reveal what you missed.
4.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain two Clues[]?
4.pass.pass.flavor=You take a seat in the empty balcony and watch the play again, scribbling notes on everything the actors only hint at.
4.pass.pass.info.1=[#BAD]Become Delayed[]
4.pass.pass.info.2=[#GOOD]Gain two Clues[]
4.pass.pass.flavor.2=You mean to stay for the next show, but you are already far behind schedule and must leave before the second act.
4.pass.fail.flavor=You have had enough of Carcosa's stage, and you slip out before the curtain rises again.

4.fail.flavor=The players glare at you while the silence stretches on. You decide to bluff, speaking boldly as though the line belonged to someone else.
#Test Influence
4.fail.pass.flavor=Your confidence sells it. Another actor picks up the scene, and the play carries on as if nothing had happened.
4.fail.fail.flavor=The performance grinds to a halt. Actors and audience file out without a word, and something vast stirs in the empty theater.
4.fail.fail.info=[#BAD]Advance Doom[]

##### 5 #####
5.title=The Past
5.flavor=You are hiding in the wardrobe of your childhood bedroom. Your younger self sits up in bed and whispers, "Is somebody there?" You ease the door open and try to reassure the child.
#Test Influence-1

5.pass.flavor=The child stops trembling, though those wide eyes never leave you. As the memory of this night settles into place, the way back to your own time opens.
5.pass.info=[#GOOD]Close this Gate[]
5.pass.flavor.2=You could stay a while and pass on what you have learned. Your younger self might remember it when it matters most.
5.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain two Clues[]?
5.pass.pass.flavor=You sit at the foot of the bed until dawn, describing the dark things that wait in the years ahead. When you return, the memories of that talk are waiting for you.
5.pass.pass.info.1=[#BAD]Become Delayed[]
5.pass.pass.info.2=[#GOOD]Gain two Clues[]
5.pass.pass.flavor.2=You want to stay, but you are already far behind schedule. You squeeze the child's hand and step back into the dark.
5.pass.fail.flavor=You tuck the blanket around the child and slip away before you change something you shouldn't.

5.fail.flavor=The child shrieks. Heavy footsteps pound down the hall, and your father bursts in with his hunting gun leveled at the stranger in his house. You lunge for the barrel.
#Test Strength
5.fail.pass.flavor=You twist the gun aside and dive through the window before he can take a second aim.
5.fail.fail.flavor=The gun roars before you can reach it.
5.fail.fail.info=[#BAD]Lose six Health[]

##### 6 #####
6.title=The Past
6.flavor=Dust lies thick on the glass retorts and copper stills around you. A letter on the bench is dated 1771. You leaf through the notebooks beside it, trying to work out what was done here.
#Test Lore

6.pass.flavor=The notes belong to Joseph Curwen, who raised dead sorcerers from their salts and questioned them. One page explains how to seal the passage that brought you here.
6.pass.info=[#GOOD]Close this Gate[]
6.pass.flavor.2=The remaining notebooks are full of formulae. Copying them would take time.
6.pass.question=[#BAD]Become Delayed[] to [#GOOD]Gain one Spell[]?
6.pass.pass.flavor=You spend long hours copying Curwen's formulae until one of them begins to make terrible sense.
6.pass.pass.info.1=[#BAD]Become Delayed[]
6.pass.pass.info.2=[#GOOD]Gain one Spell[]
6.pass.pass.flavor.2=You reach for a fresh sheet of paper, but you are already far behind schedule. Curwen's secrets stay on his bench.
6.pass.fail.flavor=You leave the rest of Curwen's notes where they lie. Some knowledge is not worth the price.

6.fail.flavor=The notes defeat you. Then a wet groaning rises from beneath the floor, and through an iron grate you glimpse half-formed things writhing at the bottom of deep pits.
#Test Will
6.fail.pass.flavor=You tear your eyes from the pits and fix them on the door until the groaning fades behind you.
6.fail.fail.flavor=You cannot look away. Their twisted faces follow you into every dream.
6.fail.fail.info=[#BAD]Lose three Sanity[]

##### 7 #####
7.title=The Dreamlands
7.flavor=Nasht and Kaman-Thah tend the pillar of fire at the bottom of the stairway of light slumber, and the two priests shake their heads at your request. You lay out every scrap of lore you have gathered to prove you are ready to go deeper.
# Test Will-1, Roll 1 additional die for each Clue you have.

7.pass.flavor=Satisfied, the priests let you descend. Before long you are chained to the oars of a black galley rowing toward the moon, and its toad-like masters come to inspect their new cargo.
#Test Strength
7.pass.pass.flavor=You break your chains, overpower the moonbeasts and fill your pockets with their rubies. A merchant in Dylath-Leen gladly trades you passage home for a handful of them.
7.pass.pass.info=[#GOOD]Close this Gate[]
7.pass.fail.flavor=They throw you off on the dark side of the moon, and you stumble through its fungus jungles for days, bruised and starving.
7.pass.fail.info.1=[#BAD]Lose two Health[]
7.pass.fail.info.2=[#BAD]Become Delayed[]

7.fail.flavor=The priests turn their faces away. You wake in your own bed with the smell of smoke in your hair, and for days afterward you cannot tell which world you are standing in.
7.fail.info.1=[#BAD]Become Delayed[]
7.fail.info.2=[#BAD]Gain a Hallucinations Condition[]

##### 8 #####
8.title=The Future
8.flavor=You know these streets, but no lamp burns in any window. A sickly green glow hangs over the rooftops, and far-off cries echo between the buildings. Panic claws at the edges of your mind.
#Test Will

8.pass.flavor=You master your fear and keep moving. In a ruined square stands a towering engine of glass and steel, crackling with sparks. You study its controls.
#Test Lore
8.pass.pass.flavor=The dials turn, the glass hums, and the engine flings you back to your own time.
8.pass.pass.info=[#GOOD]Close this Gate[]
8.pass.fail.flavor=You pull the wrong lever, and a bolt of current throws you across the square.
8.pass.fail.info=[#BAD]Lose two Health[]

8.fail.flavor=Dazed, you fall in with a silent procession shuffling toward the cries. You try to slip out of line, but armed figures watch every side street.
#Test Strength
8.fail.pass.flavor=You shove past a guard and run, losing your pursuers in the dark alleys.
8.fail.fail.flavor=The guards drag you back into line. You remember nothing after that, only waking in your own bed.
8.fail.fail.info=[#BAD]Gain an Amnesia Condition[]

##### 9 #####
9.title=City of the Great Race
9.flavor=You look down and see a ribbed, cone-shaped body where your own should be. The realization that your mind has been placed in an alien shell threatens to tear it apart.
#Test Will

9.pass.flavor=You force down the horror and remember a Yithian device you once read about, one that returns a mind to its own body. You begin to assemble it.
#Test Lore
9.pass.pass.flavor=The device hums to life, and you wake in your own skin.
9.pass.pass.info=[#GOOD]Close this Gate[]
9.pass.fail.flavor=The device overloads and bursts apart in your claws.
9.pass.fail.info=[#BAD]Lose two Health[]

9.fail.flavor=Your mind recoils from the truth, and the room begins to swim. You try to push every arcane thought away before it drowns your reason.
9.fail.option.1=[#BAD]Gain a Hallucinations\nCondition[]
9.fail.option.1.flavor=You can no longer trust your eyes. Shapes stir at the edge of sight long after you leave this place.
9.fail.option.2=[#BAD]Spend one Clue[]
9.fail.option.2.flavor=You fix your thoughts on a scrap of knowledge from your notes and cling to it until the room steadies.

##### 10 #####
10.title=Yuggoth
10.flavor=Shelves of polished metal cylinders line the chamber. Each one holds a living human brain, wired to a small speaking box. You ask the brains for help.
#Test Influence

10.pass.flavor=The voices crackle to life and explain how the mi-go's machines carry travelers between worlds. Following their instructions, you approach the controls.
#Test Lore
10.pass.pass.flavor=The machine opens a path, and you step through onto familiar ground.
10.pass.pass.info=[#GOOD]Close this Gate[]
10.pass.fail.flavor=The machine opens window after window onto worlds you never wish to see.
10.pass.fail.info=[#BAD]Lose one Sanity[]

10.fail.flavor=The brains refuse to let you leave. In flat, buzzing voices they describe the future that awaits the Earth.
10.fail.option.1=[#BAD]Lose two Sanity[]
10.fail.option.1.flavor=You hear every word, and each one leaves its mark on you.
10.fail.option.2=[#BAD]Spend one Clue[]
10.fail.option.2.flavor=You recognize their prophecy from your notes and refuse to hear the rest. The voices dissolve into static.

##### 11 #####
11.title=Great Hall of Celaeno
11.flavor=Only those who bear the proper sigil may pass the library doors. You trace the sign from memory and hope you have it right.
#Test Lore

11.pass.flavor=The doors swing open. Inside, robed keepers watch every visitor, and you must carry yourself as if you belong.
#Test Will
11.pass.pass.flavor=No one questions you. You find the book you came for, and within it the way home.
11.pass.pass.info=[#GOOD]Close this Gate[]
11.pass.fail.flavor=Your nerves betray you. The keepers seize you and hold you for questioning.
11.pass.fail.info=[#BAD]Become Delayed[]

11.fail.flavor=The sigil is wrong. The doors cast you back to Earth, and the memory of your journey begins to slip away.
11.fail.option.1=[#BAD]Gain an Amnesia Condition[]
11.fail.option.1.flavor=By morning, whole days are missing from your memory.
11.fail.option.2=[#BAD]Spend one Clue[]
11.fail.option.2.flavor=You anchor the memories to your notes before they fade, and the gaps fill themselves in.

##### 12 #####
12.title=Lost Carcosa
12.flavor=Laughter and voices drift through Carcosa's empty streets, always just around the next corner. You stop and try to pick single words out of the murmur.
#Test Observation

12.pass.flavor=One phrase rises out of the noise, and you are sure you have read it before. You search your memory for its meaning.
#Test Lore
12.pass.pass.flavor=You speak the phrase aloud, and the streets fold away to reveal the road home.
12.pass.pass.info=[#GOOD]Close this Gate[]
12.pass.fail.flavor=The phrase follows you. Soon you hear it whispered in every conversation around you.
12.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

12.fail.flavor=The voices stay just out of reach. When you finally stop, you have no idea where you are, and retracing your steps through the dark alleys would take a long time.
12.fail.option.1=[#BAD]Lose two Sanity[]
12.fail.option.1.flavor=You press on through the alleys, and the endless whispering frays your nerves.
12.fail.option.2=[#BAD]Become Delayed[]
12.fail.option.2.flavor=You patiently retrace every step, and the voices fall silent behind you.

##### 13 #####
13.title=Yuggoth
13.flavor=In the old man's abandoned study, a face of soft wax hangs from a hook beside a pair of jointed, mechanical hands. The kindly stranger who gave you directions was something else entirely.
#Test Will

13.pass.flavor=You push the revulsion aside. His directions were oddly specific, and you begin to suspect they hid a message.
#Test Lore
13.pass.pass.flavor=Read the right way, his rambling becomes a map back home.
13.pass.pass.info=[#GOOD]Close this Gate[]
13.pass.fail.flavor=Every reading of his words twists into a new riddle, and the hours vanish.
13.pass.fail.info=[#BAD]Become Delayed[]

13.fail.flavor=Your thoughts keep returning to whatever wore that face. You leaf through your notes for any creature known to hide behind a human disguise.
#Test Lore-1
13.fail.pass.flavor=A sketch in your notes matches the thing exactly, and beside it is an account of how its last victim escaped.
13.fail.pass.info=[#GOOD]Close this Gate[]
13.fail.fail.flavor=Your notes offer nothing, and your imagination fills the gap with ever worse shapes.
13.fail.fail.info=[#BAD]Lose three Sanity[]

##### 14 #####
14.title=City of the Great Race
14.flavor=A deep, whistling roar rises from somewhere beneath the basalt floors. All around you, the Yithians go still.
14.question=[#BAD]Spend one Clue[] to trace\nthe source of the roar?

14.pass.flavor=You recall references to sealed wells beneath the city and lead the way to one. Its stone lid shudders as something enormous heaves against it, and every instinct tells you to flee.
#Test Will
14.pass.pass.flavor=You throw your weight onto the lid beside the Yithians until the heaving stops. Grateful, they open the way back to your own time.
14.pass.pass.info=[#GOOD]Close this Gate[]
14.pass.fail.flavor=Your nerve breaks and you run, the howling wind chasing you down the corridors.
14.pass.fail.info=[#BAD]Lose one Sanity[]

14.fail.flavor=Before you can act, the floor cracks open and a half-visible flying polyp howls up out of the darkness!
#Test Strength
14.fail.pass.flavor=You beat back its whirling bulk until the Yithians arrive with their lightning guns. In thanks, they send your mind home.
14.fail.pass.info=[#GOOD]Close this Gate[]
14.fail.fail.flavor=Its winds batter you from wall to wall, and its shrieking stays with you long after the Yithians drive it off.
14.fail.fail.info.1=[#BAD]Lose one Health[]
14.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 15 #####
15.title=Yuggoth
15.flavor=A hulking, reeking thing with bat-like wings and webbed claws crouches on a ledge above you. It is neither bird nor insect nor anything you have a name for.
15.question=[#BAD]Spend one Clue[] to\nstudy this creature?

15.pass.flavor=Its shape matches a woodcut from one of your books. It is a byakhee, a steed that can bear riders across the void.
#Test Lore
15.pass.pass.flavor=You recall the golden mead that lets a rider survive the airless crossing. Fortified, you mount the beast and soar home.
15.pass.pass.info=[#GOOD]Close this Gate[]
15.pass.fail.flavor=You brew the mead from memory and get it wrong. The world dissolves into colors that should not exist.
15.pass.fail.info=[#BAD]Gain a Hallucinations Condition[]

15.fail.flavor=You know nothing about the beast, but it seems to respond to a firm, unwavering presence.
#Test Will
15.fail.pass.flavor=You stare it down until it lowers its head, then climb onto its back and ride it home.
15.fail.pass.info=[#GOOD]Close this Gate[]
15.fail.fail.flavor=It senses your fear and rakes you with its claws before flapping off into the dark.
15.fail.fail.info=[#BAD]Lose one Health[]

##### 16 #####
16.title=Great Hall of Celaeno
16.flavor=Where the tome you need should stand, there is only a gap in the dust. You comb the neighboring aisles for hours as your temper frays.
#Test Will

16.pass.flavor=Your persistence pays off: the book had slipped behind its row. Someone has filled its margins with penciled notes, and you work through them step by step.
#Test Lore
16.pass.pass.flavor=The notes lead you through a short rite, and a doorway home shimmers into being.
16.pass.pass.info=[#GOOD]Close this Gate[]
16.pass.fail.flavor=The notes contradict one another, and you throw the book down in frustration.
16.pass.fail.info=[#BAD]Lose one Sanity[]

16.fail.flavor=You abandon the search. Perhaps the answer is already somewhere in your own notes.
16.fail.question=[#BAD]Spend one Clue[] to [#GOOD]Close this Gate[]?
16.fail.pass.flavor=Sure enough, you find the missing step among your own scribbles, and the gate answers your command.
16.fail.pass.info=[#GOOD]Close this Gate[]
16.fail.fail.flavor=Your notes are no help, and you trudge back into the endless stacks.
16.fail.fail.info=[#BAD]Become Delayed[]

##### 17 #####
17.title=Lost Carcosa
17.flavor=The mist over Lake Hali parts, and the whole surface heaves as though something vast is coming up from below. Your legs refuse to move.
#Test Will

17.pass.flavor=You break free of the paralysis and race back toward the archway you came through, only to find it bricked over. Perhaps an opening charm will help.
#Test Lore
17.pass.pass.flavor=The charm comes back to you word for word, and the bricks dissolve into a doorway home.
17.pass.pass.info=[#GOOD]Close this Gate[]
17.pass.fail.flavor=You stumble over the words, and the bricks stay put while the lake churns behind you.
17.pass.fail.info=[#BAD]Lose one Sanity[]

17.fail.flavor=Slick limbs burst from the water, coil around your ankle and drag you toward the shore. You shout the first binding words you can remember.
#Test Lore-1
17.fail.pass.flavor=The limb recoils as if burned, and you sprint for the gate without looking back.
17.fail.pass.info=[#GOOD]Close this Gate[]
17.fail.fail.flavor=The words come out wrong, and you are hauled under the black water before the thing loses interest.
17.fail.fail.info=[#BAD]Lose two Health[]

##### 18 #####
18.title=The Underworld
18.flavor=A ring of rubbery, dog-faced ghouls closes around you, sniffing curiously rather than snarling. They seem willing to listen.
#Test Influence

18.pass.flavor=They tell you of a trapdoor at the top of the Tower of Koth, deep in the city of the gugs. Halfway up its gigantic steps, you hear a gug's heavy tread behind you.
#Test Will
18.pass.pass.flavor=You steady your nerves and keep climbing until you heave the trapdoor open onto the waking world.
18.pass.pass.info=[#GOOD]Close this Gate[]
18.pass.fail.flavor=Panic drives you into a crack in the stones, and you cower there until the footsteps fade.
18.pass.fail.info=[#BAD]Lose one Sanity[]

18.fail.flavor=The ghouls cackle at your words, but their eyes keep straying to your pack.
18.fail.question=[#BAD]Discard one Item[] to [#GOOD]Close this Gate[]?
18.fail.pass.flavor=You toss them something from your pack. The ghouls squabble over it, then guide you up through their burrows to the surface.
18.fail.pass.info.1=[#BAD]Discard one Item[]
18.fail.pass.info.2=[#GOOD]Close this Gate[]
18.fail.fail.flavor=With nothing to trade, you are just meat to them, and they lunge.
18.fail.fail.info.1=[#BAD]Lose one Health[]
18.fail.fail.info.2=[#BAD]Gain an Injury Condition[]

##### 19 #####
19.title=City of the Great Race
19.flavor=In a vaulted hall you meet other captive minds: a Roman legionary, a scholar from a far-future empire, a woman who speaks of a sunken continent. You coax them to talk.
#Test Influence

19.pass.flavor=One by one they share what they have learned during their captivity.
19.pass.info=[#GOOD]Gain two Clues[]
19.pass.flavor.2=The scholar describes a rite for returning a mind home, and it matches fragments you once studied.
#Test Lore-1
19.pass.pass.flavor=You and the scholar perform the rite together, and you wake in your own body.
19.pass.pass.info=[#GOOD]Close this Gate[]
19.pass.fail.flavor=The rite falters halfway, leaving you shaken and still trapped in your alien shell.
19.pass.fail.info=[#BAD]Lose one Sanity[]

19.fail.flavor=They watch you warily and tell you nothing. Their hollow voices wear at you, and you feel your grip on yourself slipping.
19.fail.option.1=[#BAD]Gain a Paranoia Condition\nLose one Sanity[]
19.fail.option.1.flavor=You keep pressing, and soon you are certain they whisper about you whenever you turn away.
19.fail.option.2=[#BAD]Become Delayed[]
19.fail.option.2.flavor=You retreat to an empty chamber and rest until your thoughts are your own again.

##### 20 #####
20.title=Great Hall of Celaeno
20.flavor=The volume before you speaks of its rites only in riddles and metaphors, never naming a single step plainly.
#Test Lore

20.pass.flavor=Patiently, you match each metaphor to a gesture or a word, and a working spell takes shape.
20.pass.info=[#GOOD]Gain one Spell[]
20.pass.flavor.2=When you finally close the book, the aisles around you look unfamiliar. You will need someone to point you toward the way out.
#Test Influence-1
20.pass.pass.flavor=A tall, many-limbed librarian takes pity on you and escorts you to the way home.
20.pass.pass.info=[#GOOD]Close this Gate[]
20.pass.fail.flavor=The other readers ignore you, and you wander between the shelves for days.
20.pass.fail.info=[#BAD]Become Delayed[]

20.fail.flavor=The riddles bloom into images of things you were never meant to see.
20.fail.info=[#BAD]Gain a Hallucinations Condition[]
20.fail.flavor.2=Shaken, you make for the great spiral stair, but it seems to tilt with every step. You must fight to stay upright.
#Test Will
20.fail.pass.flavor=You keep one hand on the rail and your eyes on your feet until you reach the bottom.
20.fail.fail.flavor=The stair lurches beneath you, and you tumble down a long flight of stone.
20.fail.fail.info=[#BAD]Lose two Health[]

##### 21 #####
21.title=The Dreamlands
21.flavor=Ulthar's oldest law forbids harming a cat, so they lounge on every roof, step and windowsill. If you can speak their tongue, they may have much to tell.
#Test Lore

21.pass.flavor=You greet them properly, and the cats share gossip from the rooftops of three worlds.
21.pass.info=[#GOOD]Gain two Clues[]
21.pass.flavor.2=Then one of them mentions dinner. Within moments you are encircled by dozens of expectant cats, and none of them seem inclined to move.
21.pass.option.1=[#BAD]Become Delayed[]
21.pass.option.1.flavor=You keep your rations to yourself, so the cats keep you to themselves. Hours pass before they let you through.
21.pass.option.2=[#BAD]Spend one Health[]
21.pass.option.2.flavor=You hand out every last ration and go hungry. Content, the cats lead you along a hidden path home.
21.pass.option.2.info=[#GOOD]Close this Gate[]

21.fail.flavor=The cats hiss and scatter at your approach, and the townsfolk decide you must have earned it. They chase you out into the Enchanted Wood with sticks and stones.
21.fail.info=[#BAD]Lose one Health[]
21.fail.flavor.2=Furtive zoogs dart between the trees, eyeing your belongings.
#Test Observation
21.fail.pass.flavor=You slap away a tiny paw reaching into your pack, and the zoogs give up.
21.fail.fail.flavor=You let your attention drift for a moment, and the zoogs swarm over your belongings.
21.fail.fail.info=[#BAD]Discard one Item possession[]

##### 22 #####
22.title=Yuggoth
22.flavor=Not even the mi-go will set foot among the green pyramids. You steel yourself and walk their silent avenues alone.
#Test Will

22.pass.flavor=In a toppled shrine you find something precious that its makers left behind!
22.pass.info=[#GOOD]Gain one Artifact[]
22.pass.flavor.2=A grinding echo rolls out of the nearest pyramid, and you look for somewhere to hide.
#Test Observation-1
22.pass.pass.flavor=You crouch in shadow until the noise fades, then slip out of the city and back through the gate.
22.pass.pass.info=[#GOOD]Close this Gate[]
22.pass.fail.flavor=Something finds your hiding place. Hours later you wake outside the city with no idea how you got there.
22.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

22.fail.flavor=Terror sends you running from the pyramids. Until the mi-go return, you must fend for yourself on this frozen world.
#Test Strength
22.fail.pass.flavor=You dig into a crevice and endure the bitter cold until the mi-go reappear.
22.fail.fail.flavor=The cold and the endless dark sap your strength and your spirit.
22.fail.fail.info.1=[#BAD]Lose one Health[]
22.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 23 #####
23.title=The Abyss
23.flavor=Faceless nightgaunts glide through the dark above, waiting to snatch anyone who climbs. You inch up the rock face, keeping to the deepest shadows.
#Test Observation

23.pass.flavor=You reach the trapdoor into Sarkomand unseen. Surviving that climb has hardened you.
23.pass.info=[#GOOD]Improve Will[]
23.pass.flavor.2=The slab overhead is solid stone, and you must force it open.
#Test Strength-1
23.pass.pass.flavor=With a final heave, the slab grinds aside and you crawl out of the Abyss.
23.pass.pass.info=[#GOOD]Close this Gate[]
23.pass.fail.flavor=The slab holds, and something in your back gives way as you strain against it.
23.pass.fail.info=[#BAD]Gain a Back Injury Condition[]

23.fail.flavor=Rubbery claws seize you, and the nightgaunts drop you onto the rocks far below.
23.fail.info=[#BAD]Gain a Leg Injury Condition[]
23.fail.flavor.2=Alone at the bottom, with no food and no light, you fight to keep hunger and dread at bay.
#Test Will
23.fail.pass.flavor=You keep your mind busy and your fear in check until you are able to climb again.
23.fail.fail.flavor=Hunger and darkness slowly wear down your body and mind.
23.fail.fail.info.1=[#BAD]Lose one Health[]
23.fail.fail.info.2=[#BAD]Lose one Sanity[]

##### 24 #####
24.title=Lost Carcosa
24.flavor=Masked nobles drift through the ballroom, each whispering why they, and no other, should inherit the throne.
#Test Influence

24.pass.flavor=One noble decides you would make a useful ally and presses a rare treasure into your hand.
24.pass.info=[#GOOD]Gain one Artifact[]
24.pass.flavor.2=The Queen has seen everything. She orders your mask removed and begins a relentless interrogation about what you know.
24.pass.option.1=[#BAD]Become Delayed[]
24.pass.option.1.flavor=You give her nothing, so she has you confined in the palace until she tires of the game.
24.pass.option.2=[#BAD]Spend two Clues[]
24.pass.option.2.flavor=You tell her what you have uncovered. Satisfied, she has her servants escort you home.
24.pass.option.2.info=[#GOOD]Close this Gate[]

24.fail.flavor=The guest at your side turns toward you, and you realize you are speaking with the Phantom of Truth.
24.fail.info=[#BAD]Lose one Sanity[]
24.fail.flavor.2=Worse, the pallid face before you is no mask at all.
#Test Will
24.fail.pass.flavor=You look away and hold yourself together until he drifts off into the crowd.
24.fail.fail.flavor=From then on you study every guest, wondering which of them is unmasked as well.
24.fail.fail.info=[#BAD]Gain a Paranoia Condition[]

##### 25 #####
25.title=The Dreamlands
25.flavor=On the black docks of Dylath-Leen, a hooded stranger offers to get you home, provided you keep the prince's men off his back.
#Test Strength-2

25.pass.flavor=You see off the prince's men, and the stranger keeps his word, taking you aboard his galley and sailing for the waking world.
25.pass.info=[#GOOD]Close this Gate[]
25.pass.flavor.2=Over the voyage, it becomes clear that he knows secrets the waking world forgot long ago.
25.pass.question=[#BAD]Become Delayed[] to [#GOOD]Improve Lore[]?
25.pass.pass.flavor=You stay aboard a few more nights while he recounts the lost lore of the Dreamlands.
25.pass.pass.info.1=[#BAD]Become Delayed[]
25.pass.pass.info.2=[#GOOD]Improve Lore[]
25.pass.pass.flavor.2=You would gladly listen longer, but you are already far behind schedule and must go ashore at the first port.
25.pass.fail.flavor=You thank him and go ashore. Whatever else he knows, he keeps to himself.

25.fail.flavor=The prince's agents, the Eyes of Dylath-Leen, take you instead and sell you at the slave market. Chained among the other captives, you begin to whisper of revolt.
#Test Influence
25.fail.pass.flavor=The captives rise up together, and once free, they help you find the way home.
25.fail.pass.info=[#GOOD]Close this Gate[]
25.fail.fail.flavor=Someone betrays the plot, and you are cast out beyond the edge of the world.
25.fail.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

##### 26 #####
26.title=The Past
26.flavor=A ragged figure staggers across the dunes ahead of you, muttering to himself. When you crest the next ridge he is gone, and only the wind remains. You scan the sand for his tracks.
#Test Observation

26.pass.flavor=His tracks end at a cave mouth. Inside, he is tracing a painted mural of a city with no name, and you realize with a chill that this is Abdul Alhazred.
#Test Lore-1
26.pass.pass.flavor=You speak to him of things only an initiate would know, and the Mad Arab agrees to send you home.
26.pass.pass.info=[#GOOD]Close this Gate[]
26.pass.fail.flavor=He shrieks at your clumsy questions and spits a curse after you as you flee.
26.pass.fail.info=[#BAD]Gain a Cursed Condition[]

26.fail.flavor=The tracks vanish beneath the shifting sand. You stagger on under the merciless sun.
#Test Will-1
26.fail.pass.flavor=At last, your foot strikes something hard, half-buried in a dune.
26.fail.pass.info=[#GOOD]Gain one Artifact[]
26.fail.fail.flavor=Your legs give out, and the shimmering heat fills your eyes with visions.
26.fail.fail.info.1=[#BAD]Lose two Health[]
26.fail.fail.info.2=[#BAD]Gain a Hallucinations Condition[]

##### 27 #####
27.title=Yuggoth
27.flavor=A mi-go lies dead in the ice, still clutching a container of tok'l, the dense alien metal its kind prizes. The container is staggeringly heavy.
#Test Strength-1

27.pass.flavor=Straining every muscle, you drag it to the nearest mi-go outpost. Perhaps they will trade for it.
#Test Influence-1
27.pass.pass.flavor=The fungal creatures accept your offer and carry you home through the void.
27.pass.pass.info=[#GOOD]Close this Gate[]
27.pass.fail.flavor=The mi-go take the tok'l with one of their machines, and your memories along with it.
27.pass.fail.info=[#BAD]Gain an Amnesia Condition[]

27.fail.flavor=You heave at the container until something in your back tears.
27.fail.info=[#BAD]Gain a Back Injury Condition[]
27.fail.flavor.2=You settle for chipping off a small sample of the metal.
#Test Lore-1
27.fail.pass.flavor=Under careful study, the strange metal reveals some of its arcane properties.
27.fail.pass.info=[#GOOD]Gain one Spell[]
27.fail.fail.flavor=The sample tells you nothing, and you set it aside.

##### 28 #####
28.title=Lost Carcosa
28.flavor=A hunched little man with waxen, artificial ears and a ledger under his arm introduces himself as Wilde. He offers to clean up your reputation in exchange for a little information.
28.question=[#BAD]Spend one Clue[] to restore your reputation?

28.pass.flavor=Wilde keeps his word, and your name is cleared.
28.pass.info=[#GOOD]Improve Influence[]
28.pass.flavor.2=Then he leans in and confides that you are the rightful Last King of America. The idea is strangely appealing.
#Test Will-1
28.pass.pass.flavor=You laugh off his claim. Wilde loses interest in you and sends you home.
28.pass.pass.info=[#GOOD]Close this Gate[]
28.pass.fail.flavor=The more you think about it, the surer you become, and the more you suspect rivals for your throne.
28.pass.fail.info=[#BAD]Gain a Paranoia Condition[]

28.fail.flavor=You refuse, and soon rumors bearing Wilde's fingerprints spread through Carcosa. You trust that your good name can withstand them.
#Test Influence-1
28.fail.pass.flavor=Your friends stand by you, and Wilde's rumors soon fade.
28.fail.fail.flavor=The rumors spread, strangers glare at you in the street, and even your friends stop calling.
28.fail.fail.info.1=[#BAD]Lose one Sanity[]
28.fail.fail.info.2=[#BAD]Discard all Allies[]

##### 29 #####
29.title=The Future
29.flavor=Under a swollen red sun, the scorched land teems with enormous beetle-like creatures. You follow their trails, hoping to find where they come from.
#Test Observation-1

29.pass.flavor=The trails lead to a vast city whose walls are carved with dense script.
#Test Lore
29.pass.pass.flavor=The script matches Yithian records you have read. These beetles are the Great Race in a far-future form, and you persuade them to send you home.
29.pass.pass.info=[#GOOD]Close this Gate[]
29.pass.fail.flavor=Before you can make sense of the carvings, the toxic air overwhelms you.
29.pass.fail.info=[#BAD]Gain a Poisoned Condition[]

29.fail.flavor=One of the beetles turns toward you, and an alien will forces its way into your mind.
#Test Will-1
29.fail.pass.flavor=You drive it out, but fragments of its memories of other ages stay with you.
29.fail.pass.info=[#GOOD]Gain one Clue[]
29.fail.fail.flavor=For a while, you see the world through the beetle's eyes, and it sees the world through yours.
29.fail.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

##### 30 #####
30.title=Plateau of Leng
30.flavor=Thick webs drape the valley walls, and a bloated purple spider picks its way toward you. You look for a way to slip past unseen.
#Test Observation-1

30.pass.flavor=Beyond the spider's reach, you find the remains of an earlier traveler. His journal is filled with strange symbols, which you set about translating.
#Test Lore
30.pass.pass.flavor=The journal marks a safe road home.
30.pass.pass.info=[#GOOD]Close this Gate[]
30.pass.fail.flavor=You misread his directions and wander off the edge of the world.
30.pass.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

30.fail.flavor=The spider spots you and lunges!
#Test Strength-1
30.fail.pass.flavor=You beat it back and cut free a traveler cocooned in its web, who gladly joins you.
30.fail.pass.info=[#GOOD]Gain one random Ally from the deck[]
30.fail.fail.flavor=Its fangs sink into you before you can tear free.
30.fail.fail.info.1=[#BAD]Lose one Health[]
30.fail.fail.info.2=[#BAD]Gain a Poisoned Condition[]
