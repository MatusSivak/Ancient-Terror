1.flavor=A Tokyo lens maker has built a viewing frame that shows creatures far beyond the workshop. Turning its inner ring appears to pull the chosen image into the room.
1.info=Choose one non-Epic Monster and move it to your space, then encounter it.

2.flavor=A Tokyo engineer offers to help assemble a resonator from recovered parts. The long setup will delay you, but the completed device can deliver a heavy blow to a distant creature.
2.question=[#BAD]Become Delayed[] to assemble the resonator?
2.pass.flavor=You stay through the assembly and direct the resonator toward a creature of your choice. Its concentrated pulse strikes with crushing force.
2.pass.info=[#GOOD]One Monster of your choice\nloses three Health[]

3.flavor=A Tokyo emergency committee has prepared a coordinated strike against the disturbances. You try to persuade its members to concentrate their teams at the location you choose.
#Test Influence
3.pass.flavor=The committee agrees. Its teams deliver a measured strike against every creature at your selected location.
3.pass.info=[#GOOD]Each Monster on a space of your choice\nloses two Health[]
3.fail.flavor=The discussion breaks down during a hurried demonstration. A counterweight hits your back, leaving a persistent injury.
3.fail.info=[#BAD]Gain a Back Injury Condition[]

4.flavor=A Tokyo rest clinic uses a recorded rhythm to help patients through recurring nightmares. During the exercise, you try to face the fear hidden beneath the sound.
#Test Will
4.pass.flavor=You keep your composure through the final repetition. The clinic's protective rite leaves you with a quiet blessing.
4.pass.info=[#GOOD]Gain a Blessed Condition[]
4.fail.flavor=The rhythm breaks into images that continue after the recording stops. You begin seeing fragments of the nightmare while awake.
4.fail.info=[#BAD]Gain a Hallucinations Condition[]

5.flavor=A Tokyo salvage captain has equipment capable of striking one of the creatures threatening the routes. You try to convince her that your chosen target warrants the effort.
#Test Influence-1
5.pass.flavor=She accepts your account and dispatches the equipment. The concentrated attack deals a heavy blow to the creature you choose.
5.pass.info=[#GOOD]One Monster of your choice\nloses three Health[]
5.fail.flavor=She interprets your account as evidence of sabotage and turns you over to the harbor authorities for questioning.
5.fail.info=[#BAD]Gain a Detained Condition[]

6.flavor=A Tokyo signal station has recorded calls apparently coming from monstrous sources. You explain why the operators should use their equipment to interfere with one of them.
#Test Influence
6.pass.flavor=The operators accept your instructions. A directed burst damages the creature you designate.
6.pass.info=[#GOOD]One Monster of your choice loses two Health[]
6.fail.info=[#BAD]Gain a Detained Condition[]

7.flavor=A Tokyo ward maker can sever a lesser creature's hold on this world. He asks for a piece of evidence to anchor the working.
7.question=[#BAD]Spend one Clue[]?
7.pass.flavor=You supply the evidence and identify an eligible creature. The ward closes around its connection to this world and drives it out of the field.
7.pass.info=[#GOOD]Discard one non-Epic Monster of your choice[]

8.flavor=A Tokyo transport researcher has found a ritual that exchanges a creature's surroundings without carrying its companions. You ask her to let you use the apparatus.
#Test Influence
8.pass.flavor=She grants access. You can redirect an eligible creature from its current location to a place of your choice.
8.pass.info=[#GOOD]Move one non-Epic Monster of your choice\nfrom any space to another space[]


9.flavor=A Tokyo archivist shows you a damaged diagram for interrupting a creature's pulse at a distance. You try to reconstruct the missing ritual sequence.
#Test Lore-1
9.pass.flavor=You restore the sequence and direct its sharp interruption at a creature of your choice, weakening it.
9.pass.info=[#GOOD]One Monster of your choice loses two Health[]
9.fail.flavor=The missing section fills itself with images of failing hearts. You close the diagram, deeply distressed by what you have seen.
9.fail.info=[#BAD]Lose two Sanity[]

10.flavor=In your Tokyo lodging, the room's echo begins answering in a voice that has never belonged to you. You resist its insistence that you repeat the answer.
#Test Will
10.fail.flavor=You repeat the answer before you can stop yourself. The echo vanishes, leaving you shaken and burdened by a persistent curse.
10.fail.info.1=[#BAD]Lose one Sanity[]
10.fail.info.2=[#BAD]Gain a Cursed Condition[]

11.flavor=A Tokyo clock repairer remembers fragments of a cadence that made a pursuing creature recoil. You compare the fragments with ritual measures you know.
#Test Lore-2
11.pass.flavor=You reconstruct the cadence and direct it against a creature of your choice. The completed rhythm tears through its defenses.
11.pass.info=[#GOOD]One Monster of your choice loses two Health[]

12.flavor=A Tokyo inquiry asks you to explain why ordinary patrols have failed against the disturbances. You present a plan for removing the most fragile creatures from the streets.
#Test Influence
12.pass.flavor=The inquiry accepts the plan. Coordinated patrols remove every non-Epic creature with a Toughness of one.
12.pass.info=[#GOOD]Discard all non-Epic Monsters with one Toughness[]
12.fail.flavor=The panel considers your account incriminating. You are detained while the inquiry continues.
12.fail.info=[#BAD]Gain a Detained Condition[]

13.flavor=A Tokyo botanical station has developed a volatile repellent. You try to persuade its staff to release enough for a coordinated attack on one infested location.
#Test Influence-2
13.pass.flavor=The staff agree to your plan. The repellent weakens every creature at the location you select.
13.pass.info=[#GOOD]Each Monster on a space of your choice\nloses two Health[]
13.fail.flavor=The argument distracts an attendant during the demonstration. Escaping vapor poisons you before the container is sealed.
13.fail.info=[#BAD]Gain a Poisoned Condition[]

14.flavor=A Tokyo rescue instructor asks you to demonstrate that you can handle the heavy equipment needed to confront a creature. You attempt the demanding lifting exercise.
#Test Strength-2
14.pass.flavor=Your demonstration earns the team's assistance. They direct a forceful attack at a creature you choose.
14.pass.info=[#GOOD]One Monster of your choice loses two Health[]

15.flavor=A Tokyo stage mechanic has found ritual instructions concealed in a moving model. You study the sequence that could turn its force against a distant creature.
#Test Lore-1
15.pass.flavor=You align the movements and release their force toward a chosen creature, injuring it.
15.pass.info=[#GOOD]One Monster of your choice loses two Health[]
15.fail.flavor=The model releases its force into the workshop. You are struck and badly frightened by the shape that briefly fills the machinery.
15.fail.info.1=[#BAD]Lose one Health[]
15.fail.info.2=[#BAD]Lose one Sanity[]

16.flavor=A Tokyo observatory has locked away a device that can sever weaker creatures from the world. You inspect its controls and safeguards for a usable setting.
#Test Observation
16.pass.flavor=You identify the setting and direct it at an eligible creature. Its outline breaks apart and disappears from the field.
16.pass.info=[#GOOD]Discard one non-Epic Monster\nwith Toughness three or less[]
16.fail.flavor=You trigger a reversed setting. The room disappears around you, leaving you stranded outside familiar time and space.
16.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]


1.pass.flavor=You fix the frame on a creature it can draw through. The image becomes solid beside you, close enough that you must confront it immediately.
1.pass.flavor.2=No creature within the frame's reach appears in the glass. You set the ring back without bringing anything into the workshop.
2.pass.flavor.2=You are already held up and cannot undertake the long assembly. The parts remain on the engineer's bench.
2.pass.flavor.3=You complete the lengthy assembly, but no creature is available to receive the pulse. The resonator falls silent after costing you the time.
2.fail.flavor=You decline the long setup. The engineer puts away the components without firing the device.
3.pass.flavor.2=The committee accepts your plan, but no creatures remain to direct the teams against. The operation ends without a strike.
5.pass.flavor.2=The captain agrees to help, but there is no creature to target. Her equipment remains secured aboard the salvage vessel.
6.pass.flavor.2=The operators accept the instructions, but no creature remains on which to focus the burst. The station returns to ordinary monitoring.
6.fail.flavor=The operators regard your knowledge of the signals as suspicious. Security officers hold you for further inquiry.
7.pass.flavor.2=You contribute the evidence, but no creature falls within the ward's power. The preparation yields no banishment.
7.fail.flavor=You keep your evidence. The ward maker leaves the working unfinished.
7.fail.flavor.2=You have no evidence to anchor the working. The ward maker cannot begin.
8.pass.flavor.2=She grants access, but there is no creature the apparatus can move. Its indicators remain dark.
8.fail.flavor=She refuses access to the apparatus. You leave without changing any creature's position.
9.pass.flavor.2=You restore the sequence, but no creature is available to receive it. The completed working fades unused.
10.pass.flavor=You let the echo speak itself into silence. By morning the room returns only ordinary sounds, and you leave unharmed.
11.pass.flavor.2=The cadence is complete, but no creature is available to hear it. The last note dies without effect.
11.fail.flavor=The fragments will not fit a usable measure. The repairer closes the notebook without recovering the cadence.
12.pass.flavor.2=The inquiry accepts the plan, but no creatures match the patrols' limited targets. No removals follow.
13.pass.flavor.2=The staff approve the release, but no creatures are present to target. The sealed containers remain at the station.
14.pass.flavor.2=You complete the demonstration, but no creature is available for the team to attack. The equipment returns to storage.
14.fail.flavor=You cannot complete the lift safely. The instructor ends the demonstration without committing the team.
15.pass.flavor.2=You align the movements, but find no creature to target. The model completes an empty cycle and stops.
16.pass.flavor.2=You find the setting, but no non-Epic creature of Toughness three or less is available. The device powers down without a target.
