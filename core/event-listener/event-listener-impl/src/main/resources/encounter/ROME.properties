1.flavor=A Rome restoration crew finds a damaged protective circle under a courtyard. Rebuilding it with the caretaker will occupy the rest of your day.
1.question=[#BAD]Become Delayed[] to [#GOOD]Gain a Blessed Condition[]?

2.flavor=Each night in Rome, you dream that every door in your lodging opens onto the same dark room. You practice staying calm long enough to choose your own way out.
#Test Will
2.pass.flavor=You cross the room without obeying its whispered directions. The discipline of choosing for yourself strengthens your resolve.
2.pass.info=[#GOOD]Improve Will[]
2.fail.flavor=You wake before reaching a door, exhausted by another night of helpless wandering.
2.fail.info=[#BAD]Lose one Sanity[]

3.flavor=At a Rome street checkpoint, officials have stopped a caretaker carrying supplies to an isolated chapel. You try to convince them that his errand is harmless.
#Test Influence
3.pass.flavor=They release him and his supplies. Before continuing, he offers a prayer that leaves you under a palpable blessing.
3.pass.info=[#GOOD]Gain a Blessed Condition[]
3.fail.flavor=Your objections draw suspicion. The officials take you aside and hold you for questioning.
3.fail.info=[#BAD]Gain a Detained Condition[]

4.flavor=A Rome librarian keeps a private collection of accounts written by people who survived impossible events. You ask her to share one useful to your investigation.
#Test Influence
4.pass.flavor=She chooses an account of patient resistance under extraordinary pressure. Its practical lessons help you hold your own resolve more firmly.
4.pass.info=[#GOOD]Improve Will[]

5.flavor=Helping a Rome rescue crew keep order through a difficult night teaches you how to hold your nerve when others are frightened.
5.info=[#GOOD]Improve Will[]
5.flavor.2=At dawn, a panicked crowd blocks the narrow exit. You try to persuade them to move in turns instead of forcing the barrier.
#Test Influence
5.fail.flavor=The barrier breaks under the press of bodies. You are knocked against the stonework and emerge bruised and badly shaken.
5.fail.info.1=[#BAD]Lose one Health[]
5.fail.info.2=[#BAD]Lose one Sanity[]

6.flavor=A Rome relief committee is deciding whether to support your work. You try to explain the danger without making your account sound like a threat.
#Test Influence-1
6.pass.flavor=The committee accepts your account. Its chaplain offers a blessing for the work ahead.
6.pass.info=[#GOOD]Gain a Blessed Condition[]
6.fail.flavor=Your appeal ends in bitter rejection. The encounter shakes your confidence and strips away any blessing you brought with you.
6.fail.info.1=[#BAD]Lose one Sanity[]
6.fail.info.2=[#BAD]Discard a Blessed Condition[]

7.flavor=A Rome apothecary has recovered a cordial used in an abandoned concentration exercise. Drinking it may sharpen a skill, but you will have to resist its disturbing aftereffects.
7.question=Drink one to [#GOOD]Improve one Skill of your choice[]?
7.pass.flavor=The cordial sharpens the faculty you choose to exercise. An unfamiliar pressure follows, and you brace yourself against it.
#Test Will
7.fail.info=[#BAD]Gain a Cursed Condition[]

8.flavor=An overnight vigil at a Rome shelter teaches you to maintain your composure through exhaustion and uncertainty.
8.info=[#GOOD]Improve Will[]
8.flavor.2=In the morning, you find handprints burned into the locked cellar door from the inside. You steady yourself before examining them.
#Test Will-1
8.fail.info=[#BAD]Gain a Paranoia Condition[]

9.flavor=While inspecting a Rome cistern, you are struck by a shape hidden beneath the maintenance platform. You struggle to force the heavy barrier between yourself and the attacker.
#Test Strength
9.fail.flavor=The barrier catches your leg as the shape surges past. You pull free bleeding, with an injury that makes every step painful.
9.fail.info.1=[#BAD]Lose one Health[]
9.fail.info.2=[#BAD]Gain a Leg Injury Condition[]

10.flavor=A Rome conservator has concealed a record of survivors inside a closed exhibition. You look for a way past the watchmen to read it.
#Test Observation
10.pass.flavor=You reach the record and study how its witnesses kept their courage. Their methods give you a steadier approach to your own fears.
10.pass.info=[#GOOD]Improve Will[]
10.fail.flavor=A watchman catches you behind the barrier. You are taken into custody before reaching the record.
10.fail.info=[#BAD]Gain a Detained Condition[]

11.flavor=A Rome researcher demonstrates how a small, measured interference can halt a much larger process. You work through the diagrams to understand her proof.
#Test Lore-1
11.pass.flavor=You identify a useful application and preserve the diagram as evidence. Seeing a practical way to resist the threat strengthens your resolve.
11.pass.info.1=[#GOOD]Gain one Clue[]
11.pass.info.2=[#GOOD]Improve Will[]
11.fail.flavor=The diagrams seem to prove that every effort is futile. You leave deeply distressed by a conclusion you cannot disprove.
11.fail.info=[#BAD]Lose two Sanity[]

12.flavor=A Rome herbalist has inherited an incomplete protective rite. You compare the quantities and ceremonial instructions before preparing its mixture.
#Test Lore-1
12.pass.flavor=The corrected mixture completes the rite. A warm sense of protection remains with you as a blessing.
12.pass.info=[#GOOD]Gain a Blessed Condition[]
12.fail.flavor=You misread a quantity and swallow the result. The bitterness becomes a spreading sickness: the mixture has poisoned you.
12.fail.info=[#BAD]Gain a Poisoned Condition[]

13.flavor=A Rome fountain keeper invites you to help renew the small ward beneath its basin. As the final line is spoken, a blessing settles over you.
13.info=[#GOOD]Gain a Blessed Condition[]
13.flavor.2=The reflected street in the water continues farther than the real one. You resist the urge to follow its impossible perspective.
#Test Will-1
13.fail.flavor=You step toward the reflected street and find no paving beneath your foot. The fountain carries you into a place beyond familiar time and space.
13.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

14.flavor=A Rome instructor asks you to surrender a useful object before beginning a lesson in acting without familiar comforts. You may contribute an Item to the exercise.
14.question=[#BAD]Discard one Item possession[]?
14.pass.flavor=You give up the object and work through the lesson without it. Learning to act despite that absence strengthens your determination.
14.pass.info=[#GOOD]Improve Will[]

15.flavor=A Rome caretaker offers to guide you through a vigil for people lost without a grave. Facing the records will demand more emotional strength than an ordinary visit.
15.question=[#BAD]Spend 2 Sanity[] to face your fears?
15.pass.flavor=You endure the difficult vigil and speak each unfinished farewell. The caretaker's closing prayer leaves you blessed.
15.pass.info=[#GOOD]Gain a Blessed Condition[]

16.flavor=In a Rome courthouse, a witness is pressured to withdraw an account of a disappearance. You watch closely for the methods she uses to keep her story intact.
#Test Observation
16.pass.flavor=You notice how she returns to concrete details whenever the questions become threatening. The technique gives you a firmer grip on your own resolve.
16.pass.info=[#GOOD]Improve Will[]
16.fail.flavor=You miss her method and absorb only the threats. You leave shaken, fearing that the same pressure is being prepared for you.
16.fail.info.1=[#BAD]Lose one Sanity[]
16.fail.info.2=[#BAD]Gain a Paranoia Condition[]

1.pass.flavor=You stay until the circle is repaired. The caretaker's final prayer leaves you blessed, though your other appointments have passed.
1.pass.flavor.2=You are already held up and cannot commit to the restoration. The caretaker continues without you, and the promised blessing remains unfinished.
1.fail.flavor=You leave the tools with the caretaker and return to your own work before the repairs begin.
4.fail.flavor=She cannot be persuaded to open the private cabinet. You leave without reading any of the accounts.
5.pass.flavor=The crowd accepts your instructions and files out safely. You leave with the steadiness the long night taught you.
6.fail.flavor.2=Your appeal ends in bitter rejection. You leave shaken, with no blessing to lose or comfort to take from the meeting.
7.pass.flavor.2=You let the pressure pass without yielding to it. The exercise ends with the training you received and no further price.
7.fail.flavor=The pressure settles into a persistent sense of misfortune. You leave the exercise carrying a curse.
7.fail.flavor.2=You leave the cordial unopened. The apothecary puts it back in the cabinet, and you undertake no exercise.
8.pass.flavor=You document the marks without letting them dictate what you fear. The discipline of the vigil remains with you.
8.fail.flavor=You become certain the unseen hands are now searching for your door. You cannot stop checking who is following you.
9.pass.flavor=You shove the barrier into place and climb out before it can reach you again. The cistern falls quiet behind the locked hatch.
13.pass.flavor=You break eye contact and step back onto dry paving. The ward's blessing stays with you, and the reflection becomes ordinary water.
14.fail.flavor=You keep your belongings and decline the exercise. The instructor prepares for another pupil.
14.fail.flavor.2=You have no suitable Item to contribute. The instructor cannot begin this exercise with you.
15.fail.flavor=You leave the records closed and step back into the courtyard before the vigil begins.
15.fail.flavor.2=You cannot spare the strength needed for the vigil. The caretaker closes the records gently and lets you leave in peace.
