#1
1.city.flavor=A delivery cart draws up outside the pawnbroker's. From the back of the shop you can see the display case, the parcels waiting for collection, and the owner's reflection in the glass.
1.city.pass.flavor=The driver rings the bell. While the owner leans out to sign for a parcel, the shop is yours for a moment.
1.city.pass.option.1=[#GOOD]Gain one Item\nfrom the Reserve[]
1.city.pass.option.1.flavor=You slip your choice from the display into your coat and leave with the deliveryman.
1.city.pass.option.2=[#GOOD]Gain one random Item\nfrom the deck[]
1.city.pass.option.2.flavor=You tuck an unopened parcel under your arm. Nobody questions a customer carrying brown paper and string.
1.city.fail.flavor=You have one hand inside the display case when a key turns in the lock behind you. The owner keeps you there until the police arrive.
1.city.fail.info=[#BAD]Gain a Detained Condition[]

1.wilderness.flavor=A collapsed tent flaps beside a cold fire pit. The surveyor inside has been dead for weeks, his eyes still fixed on something in the trees. His pack is untouched, and you work it loose from his stiff fingers without looking where he was looking.
1.wilderness.info.1=[#GOOD]Gain one random Item from the deck[]
1.wilderness.info.2=[#BAD]Lose one Sanity[]

1.sea.flavor=Splintered planks and a drifting lifebuoy mark the place where a ship went down. The captain slows the engines so you can scan the debris from the rail.
1.sea.pass.flavor=Among the wreckage bobs a sealed sea chest stamped with a museum's crest. The crew hauls it aboard. Packed in straw inside lies something far older than the ship that carried it.
1.sea.pass.info=[#GOOD]Gain one Artifact[]
1.sea.fail.flavor=Every promising shape turns out to be another broken crate. By the time you give up, the ship has missed the tide and must wait for the next one.
1.sea.fail.info=[#BAD]Become Delayed[]

#2
2.city.flavor=Two constables name a price for leaving your investigation alone. You ask to make one telephone call and let them hear whose number you give the operator.
2.city.pass.flavor=At the sound of the commissioner's voice, one constable takes off his cap. On the back of the bribe envelope he writes the address of a warehouse the police have been watching.
2.city.pass.info=[#GOOD]Spawn one Clue[]
2.city.fail.flavor=The line rings and rings. A nearby pawnbroker lends you enough to send the constables away, then opens his ledger to a clean page.
2.city.fail.info=[#BAD]Gain a Debt Condition[]

2.wilderness.flavor=Miles from any road, a ring of stones surrounds a patch of freshly turned earth. A symbol is scratched into every stone. When you kneel to dig, the symbols seem to press against the backs of your eyes.
2.wilderness.pass.flavor=You make yourself keep digging. A foot down, your spade strikes a tin box. Inside is a notebook filled with a scholar's cramped notes about the stones.
2.wilderness.pass.option.1=[#GOOD]Gain one Clue[]
2.wilderness.pass.option.1.flavor=A map at the back of the notebook has one place circled again and again. You copy it into your own notes.
2.wilderness.pass.option.2=[#GOOD]Improve Lore[]
2.wilderness.pass.option.2.flavor=You read by firelight until dawn. By morning, the symbols on the stones make a terrible kind of sense.
2.wilderness.fail.flavor=You drop the spade and stumble out of the ring. Long after the stones are out of sight, you can feel the symbols on the back of your neck, as if someone had drawn them there.
2.wilderness.fail.info=[#BAD]Gain a Cursed Condition[]

2.sea.flavor=A grey fog swallows the ship and the compass needle starts to spin. For hours the crew hears bells where no buoy should be. When the fog finally lifts, the coastline ahead is not the one you were sailing for.
2.sea.info.1=[#GOOD]Move one space[]
2.sea.info.2=[#BAD]Lose one Sanity[]

#3
3.city.flavor=A masked man reaches across the haberdasher's counter for the till. His partner braces the door shut. Beside you stands a rack of heavy bolts of wool.
3.city.pass.flavor=You tip the rack against the lookout's knees. He scrambles to his feet and both men run for the street, leaving the till untouched. The shopkeeper insists on thanking you.
3.city.pass.option.1=[#GOOD]Gain one Item\nfrom the Reserve[]
3.city.pass.option.1.flavor=The shopkeeper leads you to the front counter and lets you pick your reward.
3.city.pass.option.2=[#GOOD]Gain one random Item\nfrom the deck[]
3.city.pass.option.2.flavor=From beneath the counter, the shopkeeper brings out a paper-wrapped parcel he had been saving for a friend.
3.city.fail.flavor=A fist catches you in the ribs. While you struggle for breath, the lookout takes something of yours and slips outside.
3.city.fail.flavor.2=The lookout drives an elbow into your ribs. He pats you down, finds nothing worth taking, and flees after his partner.
3.city.fail.info.1=[#BAD]Lose one Health[]
3.city.fail.info.2=[#BAD]Discard one Item possession[] if you have one

3.wilderness.flavor=Under a crust of lichen, a standing stone is covered in rows of tiny carved figures. They are older than any script you know, but they repeat in a pattern you might be able to follow.
3.wilderness.pass.flavor=You trace the pattern with your fingertips until it falls into place: a calendar of rites, and a sequence of words meant to be spoken aloud.
3.wilderness.pass.option.1=[#GOOD]Gain one Clue[]
3.wilderness.pass.option.1.flavor=According to the calendar, one site is due for its next rite. You note its location before you leave.
3.wilderness.pass.option.2=[#GOOD]Gain one Spell[]
3.wilderness.pass.option.2.flavor=You say the words softly. The air around the stone thickens, and you know you will not forget them.
3.wilderness.fail.flavor=The longer you stare, the more the figures blur together. By dusk you have filled three pages with sketches, and none of them make sense.

3.sea.flavor=Below decks, an old sailor hums a ballad about a widow who sailed the world gathering the scattered pieces of her drowned husband. You have heard those verses before, in a much older language.
3.sea.pass.flavor=It is a temple hymn from the banks of the Nile. When you sing the next verse in the original words, the sailor grins and teaches you the rest. As the last note fades, your aches ease and a gentle warmth settles over you.
3.sea.pass.info.1=[#GOOD]Gain a Blessed Condition[]
3.sea.pass.info.2=[#GOOD]Recover one Health[]
3.sea.pass.info.3=[#GOOD]Recover one Sanity[]
3.sea.fail.flavor=The tune slips away before you can place it. The sailor finishes his song, knocks out his pipe and rolls over in his hammock.

#4
4.city.flavor=Three Syndicate men stop you on the back stairs. The eldest taps a pencil against his collection book and asks what your safety is worth.
4.city.pass.flavor=You point out that plenty of paying customers use these stairs. At the sound of footsteps below, he pockets his pencil and waves you through.
4.city.fail.flavor=The man with the pencil steps aside as if to let you pass. His companion trips you on the landing. Your knee takes your full weight on the stone.
4.city.fail.info=[#BAD]Gain a Leg Injury Condition[]

4.wilderness.flavor=A landslide has buried the trail under a slope of loose rock. Going the long way around would cost you days.
4.wilderness.pass.flavor=Goat droppings on a narrow ledge above the slide give you an idea. Following the animals' path, you are past the rubble by noon and making good time.
4.wilderness.pass.info=[#GOOD]Move one space[]
4.wilderness.fail.flavor=Halfway across the rubble, a stone rolls out from under your boot. You slide several yards and land hard, your ankle twisted beneath you.
4.wilderness.fail.info.1=[#BAD]Lose one Health[]
4.wilderness.fail.info.2=[#BAD]Gain a Leg Injury Condition[]

4.sea.flavor=Smoke rises from a bonfire on a tiny island, but no one waves from the shore. You row a dinghy to the beach to find whoever lit it.
4.sea.pass.flavor=Footprints lead from the fire to a cleft in the rocks. Hiding inside is a shipwrecked radio operator clutching her logbook. She tells you what sank her ship and asks to go with you.
4.sea.pass.info.1=[#GOOD]Gain one Clue[]
4.sea.pass.info.2=[#GOOD]Gain one random Ally from the deck[]
4.sea.fail.flavor=The footprints end at the waterline, as if their owner had walked into the sea. All the way back to the ship, you feel eyes on your back.
4.sea.fail.info=[#BAD]Gain a Paranoia condition[]

#5
5.city.flavor=A stranger in a threadbare suit sets a long case between your feet. He offers you what's inside and listens a little too closely when you ask his price.
5.city.pass.flavor=You name the case you're working on. The stranger shows you his badge. He worked that case too, he says, and if you're going any further, you'll need the weapon more than he does.
5.city.pass.info=[#GOOD]Gain one random Weapon\nfrom the deck[]
5.city.fail.flavor=He has you repeat your offer so the officer behind you can hear it. Then he opens his coat to show you his badge.
5.city.fail.info=[#BAD]Gain a Detained Condition[]

5.wilderness.flavor=The hill is too even and too smooth to be natural. Something was built here long ago and buried. With the right lead, you might find the way in.
5.wilderness.question=[#BAD]Spend one Clue[] to [#GOOD]gain one Artifact[] ?
5.wilderness.pass.flavor=You compare your notes with the shape of the hill and find a capstone under the turf. It slides aside onto a stairway. At the bottom, among dust and brittle bones, something has waited a very long time for you.
5.wilderness.pass.info.1=[#BAD]Spend one Clue[]
5.wilderness.pass.info.2=[#GOOD]Gain one Artifact[]
5.wilderness.pass.flavor.2=You pace the slope until sunset, but with nothing to guide you, one patch of turf looks just like another. Whatever lies beneath stays buried.
5.wilderness.fail.flavor=You mark the hill on your map and move on. Whatever is down there has waited this long; it can wait a little longer.

5.sea.flavor=The first mate points to a patch of unnaturally calm water. A steamer full of antiquities sank here twenty years ago, he says, and the ship carries a brass diving helmet that hasn't been used in months.
5.sea.question=[#BAD]Become Delayed[] to [#GOOD]gain one Artifact[] ?
5.sea.pass.flavor=You spend the day in the murk, feeling your way along the wreck. Wedged in a cabin you find a crate stamped with a museum's mark. The ship waits while the crew winches it up.
5.sea.pass.info.1=[#BAD]Become Delayed[]
5.sea.pass.info.2=[#GOOD]Gain one Artifact[]
5.sea.pass.flavor.2=You reach for the helmet, but your journey is already behind schedule. The captain won't hold the ship another day, and the wreck slips away in the wake.
5.sea.fail.flavor=You shake your head. The helmet goes back into its locker, and the calm water falls behind you.

#6
6.city.flavor=In a secondhand bookshop, little drawings mark the shelves. A note in the catalogue promises a rare volume to anyone who can use those marks to find it.
6.city.pass.flavor=The drawings are printer's marks. You follow them to a volume shelved spine inward. Across the cover, in the same hand as the note, someone has written, "You've earned it."
6.city.pass.info=[#GOOD]Gain one Tome Artifact[]
6.city.fail.flavor=You trace a woodcut moth through three editions of the same sermon. By closing time you have learned a good deal about sermons and nothing about the missing book.

6.wilderness.flavor=A farmer's daughter stops you on the road. Her grandfather, a retired professor, wandered into the hills two days ago and has not come back.
6.wilderness.pass.flavor=You find his walking stick, then his tracks, then the man himself, sitting in a gully and reading aloud to the crows. Back at the farm, he presses a book from his library into your hands.
6.wilderness.pass.info=[#GOOD]Gain one Tome Artifact[]
6.wilderness.fail.flavor=You search until dark without finding a trace. In the morning the girl tells you her grandfather walked home during the night and can't remember where he has been.

6.sea.flavor=A schooner with no lamps lit drifts alongside. Pale sailors stand motionless at her rail. Through the mist you can just make out the name painted on her bow.
6.sea.pass.flavor=You recognize the name from an old maritime register and call out her captain's name. The ghost raises a hand in salute and offers you something across the water.
6.sea.pass.option.1=[#GOOD]Gain one Clue[]
6.sea.pass.option.1.flavor=The captain points one translucent finger toward the horizon, and you know where your next lead lies.
6.sea.pass.option.2=[#GOOD]Improve Will[]
6.sea.pass.option.2.flavor=The captain's gaze meets yours, and you feel the courage of a man who steered into a storm rather than abandon his crew.
6.sea.fail.flavor=You call out the wrong name. The ghostly crew turns as one to stare at you, and a chill that has nothing to do with the sea settles into your bones.
6.sea.fail.info=[#BAD]Gain a Cursed Condition[]

#7
7.city.flavor=By the last hand of the evening, there is more on the card table than you can afford to lose. Across from you, the one opponent who hasn't folded studies your face.
7.city.pass.flavor=Your opponent folds. When you show your bluff, a spectator laughs so hard she spills her drink. She makes room at her table and introduces you to someone who can help with your case.
7.city.pass.info=[#GOOD]Gain one random Ally from the deck[]
7.city.fail.flavor=Your opponent calls and lays down three queens. The dealer passes you a pencil to sign for what you owe.
7.city.fail.info=[#BAD]Gain a Debt Condition[]

7.wilderness.flavor=A gust tears your map from your hands and carries it into a ravine. From here, you will have to find your way by the sun, the stars and the lay of the land.
7.wilderness.pass.flavor=You read the moss on the trees and the run of the streams. By nightfall you reach the next landmark, earlier than you planned.
7.wilderness.pass.info=[#GOOD]Move one space[]
7.wilderness.fail.flavor=On the third day you come upon your own campfire, still warm. You begin to suspect that the hills move whenever you look away.
7.wilderness.fail.info.1=[#BAD]Become Delayed[]
7.wilderness.fail.info.2=[#BAD]Gain a Madness Condition[]

7.sea.flavor=A squall strikes without warning. The deck pitches out from under you, and a wave hurls you against the mast. Between flashes of lightning, you could swear the sea is laughing.
7.sea.info.1=[#BAD]Lose one Sanity[]
7.sea.info.2=[#BAD]Gain a Back Injury Condition[]

#8
8.city.flavor=In the warm back room of a tavern, the regulars teach you a song. By the third chorus you remember what it feels like to laugh.
8.city.info=[#GOOD]Recover two Sanity[]
8.city.flavor.2=As the fiddler strikes up another tune, a stranger squeezes onto the bench beside you.
8.city.pass.flavor=You catch the stranger's wrist just as their fingers reach your pocket. They join in the chorus and sidle toward the door.
8.city.fail.flavor=The fiddle drowns out the snap of a clasp. By the time you check your belongings, the stranger is gone with something of yours.
8.city.fail.flavor.2=You notice the stranger's hand only as it slips out of your pocket. Judging by their sour expression, the search was a waste of time.
8.city.fail.info=[#BAD]Discard one Item possession[] if you have one

8.wilderness.flavor=Beyond the light of your campfire, voices begin to chant in a language you half recognize. You take a burning stick and start tracing a ward in the dirt around you.
8.wilderness.pass.flavor=The ward holds. The chanting stops at its edge, then fades. At dawn you follow the trampled grass to a clearing littered with dropped belongings, among them a monogrammed cufflink and a letter signed by a local alderman.
8.wilderness.pass.option.1=[#GOOD]Gain one Clue[]
8.wilderness.pass.option.1.flavor=The letter names a meeting place. You copy down the address before burning the page.
8.wilderness.pass.option.2=[#GOOD]Improve Influence[]
8.wilderness.pass.option.2.flavor=You pocket the cufflink and the letter. The next time you meet the alderman, he will listen very carefully to anything you have to say.
8.wilderness.fail.flavor=Your hand slips on the last stroke of the ward. The chanting falters, then begins again, and now your name is part of it.
8.wilderness.fail.info=[#BAD]Gain a Cursed Condition[]

8.sea.flavor=Behind the coal bunkers you find a young stowaway shaking with fear. He flinches when you reach out, but his eyes say he has something to tell.
8.sea.pass.flavor=You share your rations and talk quietly until he stops trembling. Then he tells you about the island where his village slid into the sea, and about the things that crawled out of it.
8.sea.pass.info=[#GOOD]Gain one Clue[]
8.sea.fail.flavor=He scrambles away into the dark between the bunkers. By morning, the crew swears there is no stowaway aboard.

#9
9.city.flavor=Someone has been dragging people into the storm drains. You follow a cry for help to an iron ladder, where a Deep One crouches between a captive and the lowest rung.
9.city.pass.flavor=You wrench the creature's webbed fingers from the ladder and send it tumbling into the culvert. Once above ground, the person you freed insists on coming with you.
9.city.pass.info=[#GOOD]Gain one random Ally from the deck[]
9.city.fail.flavor=The creature rakes your forearm. You haul yourself up the ladder one-handed as its claws scrape the iron under your heel.
9.city.fail.info=[#BAD]Lose one Health[]

9.wilderness.flavor=In the dead of night, something huge crashes through your camp and scatters the fire. In the glow of the embers you see yellow eyes and far too many teeth.
9.wilderness.pass.flavor=You seize a burning branch and drive it into the creature's face until it flees howling into the dark. If you can face that, you can face anything.
9.wilderness.pass.info=[#GOOD]Improve Will[]
9.wilderness.fail.flavor=The beast's jaws close on your leg before you can fight it off. It drags you halfway out of the camp, then lets go and vanishes between the trees.
9.wilderness.fail.info.1=[#BAD]Lose one Health[]
9.wilderness.fail.info.2=[#BAD]Gain a Leg Injury Condition[]

9.sea.flavor=The captain invites you to dine in his cabin. Harpoons hang on the walls, and one of them is bent in a way no whale could bend it. You steer the conversation toward his voyages.
9.sea.pass.flavor=Over brandy, he tells you about the night that harpoon was bent, down to the exact coordinates. He has never told anyone else.
9.sea.pass.info=[#GOOD]Spawn one Clue[]
9.sea.fail.flavor=The captain smiles politely and spends the rest of the evening talking about the price of coal.

#10
10.city.flavor=A detective shows you the room where the latest ritual killing took place. Someone has washed the floor. You steady yourself and kneel where the water ran under the door.
10.city.pass.flavor=A scrap of tracing paper clings to the threshold. Against the light, the lines on it resolve into a street plan with one building circled.
10.city.pass.info=[#GOOD]Spawn one Clue[]
10.city.fail.flavor=Under the door is a handprint in blood. You spread your fingers above it. The print spreads its fingers too.
10.city.fail.info=[#BAD]Lose two Sanity[]

10.wilderness.flavor=A fever has taken hold of you, and the trail ahead shimmers in the heat. Stopping out here would be dangerous, so you grit your teeth and keep walking.
10.wilderness.pass.flavor=The next morning, the fever breaks. You wake soaked with sweat, weak but clear-headed.
10.wilderness.fail.flavor=The fever deepens. The trees bend down to whisper to you, and someone walks at your side, though you set out alone.
10.wilderness.fail.info=[#BAD]Gain a Hallucinations Condition[]

10.sea.flavor=Gunshots wake you after midnight. Deep Ones have swarmed aboard and are tearing at the engine room hatch. You grab the nearest weapon and run below.
10.sea.pass.flavor=Back to back with the stokers, you drive the creatures over the rail. The engineer checks the boilers and declares that the ship can sail on.
10.sea.fail.flavor=By the time the last creature slides back into the sea, the engine is wrecked. The ship drifts for days before a passing freighter tows you into port.
10.sea.fail.info=[#BAD]Become Delayed[]

#11
11.city.flavor=At dusk a voice calls from a grave with no headstone. The dead man asks you to hear his testimony. Each time he describes his last night, his voice gives out at the same word.
11.city.pass.flavor=You wait through the silence. At last he speaks his killer's name and the earth falls quiet. On the walk home, you can hear birdsong again.
11.city.pass.info=[#GOOD]Recover two Sanity[]
11.city.fail.flavor=You turn to leave before he finishes. His whisper follows you through the gate, and now every passerby seems to be listening too.
11.city.fail.info=[#BAD]Gain a Paranoia Condition[]

11.wilderness.flavor=A note scrawled in the margin of your map marks a mountain lake whose waters are said to quiet a troubled mind. Reaching it would mean a long detour.
11.wilderness.question=[#BAD]Become Delayed[] to [#GOOD]Recover three Sanity[] or [#GOOD]Discard Madness Condition[]?
11.wilderness.pass.flavor=You reach the lake at dusk. The water is so still that the stars seem to lie beneath it. You wade in and float for a long time.
11.wilderness.pass.info=[#BAD]Become Delayed[]
11.wilderness.pass.flavor.2=You turn toward the lake, but you are already far behind schedule. There is no time left for another detour.
11.wilderness.option.1=[#GOOD]Recover three Sanity[]
11.wilderness.option.1.flavor=When you climb out, the cold has scoured away weeks of dread. That night you sleep without dreaming.
11.wilderness.option.2=[#GOOD]Discard Madness Condition[]
11.wilderness.option.2.flavor=As you surface, a weight slides from your mind like a wet coat from your shoulders. The thought that has haunted you for weeks is now only a memory.
11.wilderness.fail.flavor=You fold the map and keep to the road. The lake will still be there if you ever need it.

11.sea.flavor=A deckhand mutters to himself in a tongue you have only ever seen on clay tablets. When you answer him in kind, he stops and stares.
11.sea.pass.flavor=He grips your wrist and recites a long, rhythmic verse until you can repeat it word for word. Then he goes back to coiling rope as if nothing had happened.
11.sea.pass.info=[#GOOD]Gain one Spell[]
11.sea.fail.flavor=You stumble over a word. His face twists, and he spits a phrase at you whose syllables keep burning in your ears long after he walks away.
11.sea.fail.info=[#BAD]Gain a Cursed Condition[]

#12
12.city.flavor=At a council hearing, a Syndicate runner leaves the seat beside him empty. You sit down and offer to introduce him to someone on the committee in exchange for a favor.
12.city.pass.flavor=The committee agrees to hear him out. As you leave, he presses a folded list into your hand. Everyone on it owes him a favor.
12.city.pass.option.1=[#GOOD]Gain one Service\nfrom the Reserve[]
12.city.pass.option.1.flavor=You point to a familiar name on the list. The runner arranges the service before the committee adjourns.
12.city.pass.option.2=[#GOOD]Gain one random Service\nfrom the deck[]
12.city.pass.option.2.flavor=You leave the choice to the runner. That afternoon someone calls to offer help and gives his name as a reference.
12.city.fail.flavor=The council clerk calls the meeting to order before you can make the introduction. When you look around, the runner's chair is empty.

12.wilderness.flavor=Behind a curtain of ivy, crude red handprints cover the mouth of a cave. A narrow passage leads deeper. You squeeze inside, and the rock closes in until you can barely draw breath.
12.wilderness.pass.flavor=You crawl on through the dark until the passage opens into a small chamber. On a stone shelf, untouched for thousands of years, lies an offering left by the people who made the handprints.
12.wilderness.pass.info=[#GOOD]Gain one Artifact[]
12.wilderness.fail.flavor=The walls press closer. In the beam of your torch, the handprints follow you deeper, until you touch one that is still wet. You claw your way back to daylight, shaking.
12.wilderness.fail.info=[#BAD]Lose two Sanity[]

12.sea.flavor=A rogue wave sweeps the deck and tears your bag from your shoulder. As it sinks, you take a deep breath and dive in after it.
12.sea.pass.flavor=Your lungs burn, but you catch the strap just before the bag vanishes into the depths. The crew hauls you back aboard, soaked to the skin and still holding everything you brought.
12.sea.fail.flavor=The cold drives the air from your lungs. You surface empty-handed, and something you were carrying is gone for good.
12.sea.fail.flavor.2=You surface empty-handed and gasping. Only after you climb back aboard do you remember that the bag held nothing but a change of clothes.
12.sea.fail.info=[#BAD]Discard one Item possession[] if you have one

#13
13.city.flavor=A warehouse watchman has chalked over one entry on his tally board. You can still make out the word ARMS. Over a cigarette, you ask where the crate went.
13.city.pass.flavor=He rubs the chalk from his fingers and unlocks a coal shed. Inside is the open crate. He lets you take the weapon on top in return for your silence.
13.city.pass.info=[#GOOD]Gain one random Weapon\nfrom the deck[]
13.city.fail.flavor=He sends you down an unlit loading ramp. Halfway down, a plank gives way under your boot and your shin strikes an iron brace.
13.city.fail.info.1=[#BAD]Lose one Health[]
13.city.fail.info.2=[#BAD]Gain a Leg Injury Condition[]

13.wilderness.flavor=A missionary lies at the bottom of a ravine with a broken leg. His mission is a day's walk away across rough country, and he cannot walk.
13.wilderness.pass.flavor=You carry him on your back across streams and ridges. When the mission bell comes into earshot, he lays a hand on your head and speaks a blessing over you.
13.wilderness.pass.info=[#GOOD]Gain a Blessed Condition[]
13.wilderness.fail.flavor=On the second ridge, something in your back gives way with a sharp crack. You both reach the mission, but it is the missionary who has to call for help.
13.wilderness.fail.info=[#BAD]Gain a Back Injury Condition[]

13.sea.flavor=Water is gushing into the cargo hold through a split seam. The bosun presses a mallet into your hands and points at the leak.
13.sea.pass.flavor=You drive the last wedge home and the flooding stops. As you climb out, the bosun lets you keep something from a crate that burst open in the flood.
13.sea.pass.info=[#GOOD]Gain one random Item from the deck[]
13.sea.fail.flavor=You fight the rushing water until a loose crate slams into your chest. The leak is sealed in the end, but you are left coughing up seawater and blood.
13.sea.fail.info=[#BAD]Lose two Health[]

#14
14.city.flavor=The travelers' club needs a speaker for its island retreat. Over tea, the secretary asks what you have seen that might draw a crowd on a rainy evening.
14.city.pass.flavor=By the time the tea goes cold, the members have booked your talk. The secretary slips you a rail ticket and a steamship ticket for the journey.
14.city.pass.info.1=[#GOOD]Gain one Ship Ticket[]
14.city.pass.info.2=[#GOOD]Gain one Train Ticket[]
14.city.fail.flavor=Your account of the crossing sounds much like the last speaker's. The secretary pours you another cup, then turns the conversation to the weather.

14.wilderness.flavor=You wake to something crawling across your wrist: a hairy black spider as large as your palm. You need to get it off without startling it.
14.wilderness.pass.flavor=You hold your breath and coax it onto a twig, then lay the twig gently in the grass. The spider vanishes into the undergrowth.
14.wilderness.fail.flavor=Your hand twitches. The spider sinks its fangs into your wrist and scuttles off, and a burning numbness creeps up your arm.
14.wilderness.fail.info.1=[#BAD]Lose one Sanity[]
14.wilderness.fail.info.2=[#BAD]Gain a Poisoned Condition[]

14.sea.flavor=The sailors trade stories about a galleon whose gold was never recovered. Their details match a wreck you once read about in a forgotten archive.
14.sea.pass.flavor=Following your directions, the divers bring up a chest of tarnished coins. You share the haul with the crew, and soon your name is toasted in every port along the coast.
14.sea.pass.info=[#GOOD]Improve Influence[]
14.sea.fail.flavor=Days of diving bring up nothing but weed. The sailors decide you owe them for their trouble and help themselves to your belongings.
14.sea.fail.flavor.2=Days of diving bring up nothing but weed. The sailors decide you owe them and take the only thing of value they can find among your belongings.
14.sea.fail.flavor.3=Days of diving bring up nothing but weed. The sailors search your belongings for payment, find nothing worth taking and leave you alone, grumbling.
14.sea.fail.info=[#BAD]Discard two Item or\nTrinket possessions[] if you have them

#15
15.city.flavor=A street conjurer bets you can't follow a coin under three brass cups. His assistant watches your pockets more closely than the trick.
15.city.pass.flavor=You turn over the assistant's cuff and the coin drops out. The crowd roars. When you ask for room to pass, people step aside and tip their hats.
15.city.pass.info=[#GOOD]Improve Influence[]
15.city.fail.flavor=The coin is still spinning when the crowd breaks up. The assistant has rifled your gear and pocketed a keepsake besides.
15.city.fail.flavor.2=You lift the last cup to find it empty. The assistant has already slipped away with a piece of your gear.
15.city.fail.flavor.3=The coin disappears. Only when you reach for your keepsake do you realize the assistant made that vanish too.
15.city.fail.flavor.4=As you bend over the cups, the assistant tries your pockets. Finding nothing worth stealing, he whistles to his partner and they move on.
15.city.fail.info.1=[#BAD]Discard one Item possession[] if you have one
15.city.fail.info.2=[#BAD]Discard one Trinket possession[] if you have one

15.wilderness.flavor=In a hollow that appears on none of your maps, a spring bubbles up beneath a moss-covered shrine. The water glitters even in the shade.
15.wilderness.pass.flavor=The carvings on the shrine tell of a spring that heals any wound. You fill a flask with the glittering water and seal it carefully.
15.wilderness.pass.info=[#GOOD]Gain one Elixir Artifact[]
15.wilderness.fail.flavor=While you puzzle over the carvings, a magpie lands on your pack and flies off with something shiny.
15.wilderness.fail.flavor.2=While you puzzle over the carvings, a magpie lands on your pack. It finds nothing shiny and flies off squawking.
15.wilderness.fail.info=[#BAD]Discard one Trinket possession[] if you have one

15.sea.flavor=A flash of lightning reveals a shape on the horizon, taller than the ship's mast. It is moving against the wind.
15.sea.pass.flavor=You tell yourself it was a cloud and repeat it until you believe it. By morning the sea is calm and the horizon is empty.
15.sea.fail.flavor=You cannot stop seeing it. All night you stand at the rail, sure that the next flash will show it closer.
15.sea.fail.info.1=[#BAD]Lose one Sanity[]
15.sea.fail.info.2=[#BAD]Gain a Paranoia condition[]

#16
16.city.flavor=Old city directories list the same bookseller at a dozen addresses. In every sketch of the shopfront, the shadow of the sign falls at a different angle.
16.city.pass.flavor=You plot the angles on a street map. The lines meet at a courtyard where the bookseller is taking down his sign for the night. He hands you a volume reserved in your name.
16.city.pass.info=[#GOOD]Gain one Tome Artifact[]
16.city.fail.flavor=You follow the shadows until you find your own front door in one of the sketches. Someone has drawn you standing outside it, peering in.
16.city.fail.info=[#BAD]Lose two Sanity[]

16.wilderness.flavor=Your last provisions have spoiled, and the nearest town is days away. If you want to eat, you will have to hunt.
16.wilderness.pass.flavor=You find rabbit tracks and set a snare. That night you roast your catch over the fire and feel your strength return.
16.wilderness.pass.info=[#GOOD]Recover two Health[]
16.wilderness.fail.flavor=The game eludes you. Hunger finally drives you to eat the spoiled food, and you spend the night doubled over with cramps.
16.wilderness.fail.info=[#BAD]Gain a Poisoned Condition[]

16.sea.flavor=A pod of dolphins circles the ship, so close that the crew cannot get underway. They seem to be asking you to stay.
16.sea.question=[#BAD]Become Delayed[] to [#GOOD]spend the night here[] ?
16.sea.pass.flavor=You drop anchor and sleep on deck. In your dreams, a bearded old man rides a great shell drawn by dolphins and shows you where your enemies are hiding.
16.sea.pass.info=[#GOOD]Spawn two Clues[]
16.sea.fail.flavor=You order the ship to steam ahead. The dolphins follow for a mile, then dive and are gone, leaving you to wonder what they wanted to show you.
