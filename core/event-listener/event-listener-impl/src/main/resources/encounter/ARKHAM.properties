1.flavor=A night class meets above an Arkham locksmith's shop. Its instructor asks you to distinguish a protective formula from three convincing imitations.
# Test Lore+1
1.pass.flavor=You identify the working formula. The instructor lets you copy a complete spell from the class notebook.
1.pass.info=[#GOOD]Gain one Spell[]

2.flavor=A bookbinder has stitched several discarded pages into a single ritual. You try to determine which words belong together before reading them aloud.
#Test Lore
2.pass.flavor=You separate the binding instructions from the incantation and leave with a working spell.
2.pass.info=[#GOOD]Gain one Incantation Spell[]
2.fail.flavor=The pages turn in your hands, although you cannot recall opening the book. Your own recent memories now have blank leaves between them.
2.fail.info=[#BAD]Gain an Amnesia Condition[]

3.flavor=An Arkham clock repairer has found a spoken working hidden in a customer's repair notes. She offers to teach it if you contribute a piece of evidence to her investigation.
3.question=[#BAD]Spend one Clue[] to share what you know?
3.pass.flavor=Your evidence identifies the missing phrase. She demonstrates the completed incantation until you can repeat it unaided.
3.pass.info=[#GOOD]Gain one Incantation Spell[]

4.flavor=Floodwater has exposed inscriptions beneath an Arkham footbridge. You search the slippery stonework for a line that remains legible from beginning to end.
#Test Observation
4.pass.flavor=Under a loose coping stone, you find the complete wording of an incantation and copy it before the river rises.
4.pass.info=[#GOOD]Gain one Incantation Spell[]
4.fail.flavor=Your foot slips between submerged stones. You wrench it free, scraping yourself badly before climbing back to the bank.
4.fail.info=[#BAD]Lose one Health[]

5.flavor=An Arkham typesetter gives you an incantation assembled from letters that kept falling out of a locked printing frame. You copy the working before examining the reversed line beneath it.
5.info=[#GOOD]Gain one Incantation Spell[]
5.flavor.2=The reversed line seems to explain who has been rearranging the type. You try to translate it without confusing its letters with the moving shadows on the wall.
#Test Lore
5.fail.flavor=You finish the line and see tiny figures carrying letters across every surface. They remain visible even after the printing room is locked.
5.fail.info=[#BAD]Gain a Hallucinations Condition[]

6.flavor=A child brings you a slate recovered from an empty Arkham classroom. Its chalk marks spell a complete incantation, which you carefully transcribe.
6.info=[#GOOD]Gain one Incantation Spell[]
6.flavor.2=Fresh marks appear beneath your copy, listing places you have just visited. You steady yourself against the feeling that an unseen pupil is following you.
#Test Will+1
6.fail.info=[#BAD]Gain a Paranoia condition[]

7.flavor=A laundress has saved the numbered tags from robes delivered to her Arkham shop. You suspect their washing instructions conceal a ritual and a meeting place.
#Test Lore-1
7.pass.flavor=The instructions resolve into an incantation and directions to a gathering. You learn the working and send word so the meeting can be investigated.
7.pass.info.1=[#GOOD]Gain one Incantation Spell[]
7.pass.info.2=[#GOOD]Spawn one Clue[]

8.flavor=At a riverside shelter, a volunteer shows you a protective verse scratched into a brass bowl. You examine the unfamiliar symbols around its rim.
#Test Lore
8.pass.flavor=You understand how the verse is completed. As you speak it, the bowl rings once and a quiet certainty settles over you like a blessing.
8.pass.info=[#GOOD]Gain a Blessed Condition[]
8.fail.flavor=You mistake the repeated symbols for warnings addressed to you. For the rest of the evening, every whispered conversation sounds like a plot.
8.fail.info=[#BAD]Gain a Paranoia condition[]

9.flavor=An Arkham music teacher has found two spells hidden in separate parts of a long choral score. Working through both parts will occupy the rest of your visit.
9.question=[#BAD]Become Delayed[] to [#GOOD]Gain two Spells[]?

10.flavor=A pattern of candle stubs runs through the allotments outside Arkham. You examine the wax trails for the spoken instructions that accompanied the planting.
#Test Observation
10.pass.info=[#GOOD]Gain one Incantation Spell[]
10.fail.flavor=You follow the wrong trail into a locked tool shed. Something waiting behind the door launches itself at you.
10.fail.info=[#BAD]A Monster ambushes you![]

11.flavor=An Arkham station's discarded timetable lists departures in a script older than the railway. You try to read the repeated line at the bottom.
#Test Lore
11.pass.info=[#GOOD]Gain one Incantation Spell[]
11.fail.flavor=Every destination becomes a description of your own death. You drop the timetable, badly shaken by the journeys it has shown you.
11.fail.info=[#BAD]Lose two Sanity[]

12.flavor=An Arkham instrument maker has built a device that measures distances to places outside the world. You try to persuade her to demonstrate its spoken controls.
#Test Influence-1
12.pass.flavor=She teaches you the complete working used to probe the empty distances beyond reality.
12.pass.info=[#GOOD]Gain a Plumb the Void Spell[]
12.fail.flavor=Denied a lesson, you touch an unmarked control. The workshop falls away, leaving you adrift somewhere without a recognizable time or place.
12.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

13.flavor=On a deserted Arkham tram, the conductor asks for a fare in words you have never spoken. You hold your nerve as the windows fill with a sky that has no stars.
#Test Will
13.pass.flavor=You remain seated until the conductor repeats the fare slowly. You recognize and memorize an incantation before stepping back onto an ordinary street.
13.pass.info=[#GOOD]Gain one Incantation Spell[]
13.fail.flavor=You jump as the carriage tilts into darkness, striking your back against the platform. The pain persists, along with the memory of that empty sky.
13.fail.info.1=[#BAD]Lose one Sanity[]
13.fail.info.2=[#BAD]Gain a Back Injury Condition[]

14.flavor=An Arkham mason shows you a rubbing from a foundation stone. The marks are crowded into the spaces between ordinary builder's measurements, and you try to decipher them.
#Test Lore-2
14.pass.info=[#GOOD]Gain one Incantation Spell[]

15.flavor=A delivery office in Arkham keeps receiving letters addressed to the same nonexistent room. You study the clerk's sorting notes for a repeated instruction.
#Test Observation
15.pass.flavor=Each routing mark supplies another word of an incantation. You copy the completed sequence before the mail is bundled away.
15.pass.info=[#GOOD]Gain one Incantation Spell[]
15.fail.flavor=While reaching behind a sorting rack, you pull it down onto yourself. You crawl out bruised, with a deep pain in your back.
15.fail.info.1=[#BAD]Lose one Health[]
15.fail.info.2=[#BAD]Gain a Back Injury Condition[]

16.flavor=An Arkham demolition crew finds a recipe book with no ingredients in any of its recipes. You study the measurements and commands to discover what they actually prepare.
#Test Lore
16.pass.info=[#GOOD]Gain one Incantation Spell[]
16.fail.flavor=The quantities become impossible to imagine, yet images of them fill your mind. You leave distressed, still seeing shapes too large for the rooms around you.
16.fail.info.1=[#BAD]Lose one Sanity[]
16.fail.info.2=[#BAD]Gain a Hallucinations Condition[]



1.fail.flavor=Your chosen formula lacks its closing phrase. The instructor erases the board before you can reconstruct the lesson.
3.fail.flavor=You keep your findings to yourself. She closes the repair ledger and returns to her clocks.
3.fail.flavor.2=You have no evidence to add to the ledger. Without that contribution, the repairer cannot complete the lesson for you.
5.pass.flavor=You recognize an instruction meant for the typesetter and cover it before it takes hold. The incantation you copied is safe to keep.
6.pass.flavor=You wipe the slate clean and leave it behind. No further marks appear, and you carry away only the spell you learned.
6.fail.flavor=You conceal the slate, but cannot stop checking every doorway for its unseen writer. Even familiar faces now seem to be watching you.
7.fail.flavor=The tags make sense only as laundry instructions. The robes are collected before you can learn anything more.
9.pass.flavor=You stay until the lamps burn low, mastering both workings while the streets outside empty for the night.
9.pass.flavor.2=Your existing commitments already prevent you from making the appointment. The teacher cannot hold another session, and you learn neither working.
9.fail.flavor=You leave before the rehearsal begins. The teacher packs away the score for another evening.
10.pass.flavor=The wax has preserved an impression of a discarded page. You recover a complete incantation from the shallow lettering.
11.pass.flavor=The line gives a spoken method for crossing a boundary. You write down the incantation before the ink fades.
14.pass.flavor=You read the spaces as carefully as the marks and uncover a complete incantation hidden in the proportions.
14.fail.flavor=The missing edges make the rubbing impossible to translate. The mason returns to work, and you leave without a working formula.
16.pass.flavor=One recipe describes a spoken working rather than a meal. You reconstruct the incantation from its precise sequence of instructions.
