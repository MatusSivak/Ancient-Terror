1.flavor=A Sydney wharf crew teaches you to lift and brace heavy cargo safely. Several demanding shifts build your strength and confidence with the work.
1.info=[#GOOD]Improve Strength[]
1.flavor.2=An incorrect tally places a missing crate under your name. You explain the movements of the cargo to the harbor officials.
#Test Influence
1.fail.info=[#BAD]Gain a Detained Condition[]

2.flavor=A Sydney rescue team trains you to haul people clear of damaged structures. The repeated exercises make you stronger.
2.info=[#GOOD]Improve Strength[]
2.flavor.2=During a real call, a shed frame begins collapsing across the escape route. You strain to brace it long enough to get clear.
#Test Strength-1
2.fail.info=[#BAD]Lose two Health[]

3.flavor=During a Sydney swimming lesson, the deep water seems to open beneath you without a bottom. You master your fear and try to keep to the instructor's rhythm.
#Test Will
3.pass.flavor=You finish the demanding lengths without abandoning your form. The training strengthens you.
3.pass.info=[#GOOD]Improve Strength[]
3.fail.flavor=You reach the edge in panic, unable to dismiss the depth you thought you saw. The memory leaves you shaken.
3.fail.info=[#BAD]Lose one Sanity[]

4.flavor=A Sydney outfitter has reserved a small stock of weapons for trusted customers. You try to arrange a useful purchase on terms you can meet.
# Test Influence-1
4.pass.info=[#GOOD]Gain one random Weapon from the deck[]
4.fail.flavor=The negotiations leave you responsible for a brokerage fee without securing a weapon. You sign a promise to settle the debt.
4.fail.info=[#BAD]Gain a Debt Condition[]

5.flavor=A Sydney expedition trainer offers practical conditioning in exchange for a useful piece of research. You may contribute one of your leads.
5.question=[#BAD]Spend one Clue[]?
5.pass.flavor=Your evidence helps plan a safer route. In return, the trainer takes you through exercises that build your strength.
5.pass.info=[#GOOD]Improve Strength[]

6.flavor=A Sydney maintenance crew needs help hauling equipment through a narrow service shaft. You try to control your fear of the darkness and confined space.
#Test Will
6.pass.flavor=You keep calm enough to complete the hard work. The repeated hauling improves your strength.
6.pass.info=[#GOOD]Improve Strength[]
6.fail.info=[#BAD]Lose one Sanity[]

7.flavor=A Sydney ferryman is accused of abandoning passengers who disappeared between landings. You offer testimony about the crossing's unusual conditions.
#Test Influence
7.pass.flavor=Your account convinces the officials to release him. His grateful prayer leaves you blessed.
7.pass.info=[#GOOD]Gain a Blessed Condition[]
7.fail.flavor=The officials treat your account as an attempt to conceal the disappearance. You are detained for further questioning.
7.fail.info=[#BAD]Gain a Detained Condition[]

8.flavor=A Sydney salvage clerk has an unclaimed weapon among the day's finds. He can release it after the claim period ends, if you stay long enough to complete the paperwork.
8.question=[#BAD]Become Delayed[] to\n[#GOOD]Gain one random Weapon from the deck[]?

9.flavor=At a Sydney warehouse, the night crew hears footsteps on a floor removed years ago. You try to keep your nerve and complete the demanding shift.
#Test Will
9.pass.flavor=You finish moving the cargo without abandoning your rhythm. The work adds to your strength.
9.pass.info=[#GOOD]Improve Strength[]
9.fail.flavor=You leave in panic as the footsteps reach the missing stairs. Afterward, you keep seeing someone descend through empty air.
9.fail.info.1=[#BAD]Lose one Sanity[]
9.fail.info.2=[#BAD]Gain a Hallucinations Condition[]

10.flavor=A Sydney auctioneer asks you to identify a weapon concealed among mislabeled salvage. You watch the lot numbers and the hurried movements of the other bidders.
#Test Observation-1
10.pass.flavor=You spot the switched label and recover an available weapon from the disputed stock.
10.pass.info=[#GOOD]Gain 1 random Weapon from the deck[]
10.fail.flavor=You follow the wrong lot and lose track of your belongings. An Item or Trinket disappears with the outgoing salvage.
10.fail.info=[#BAD]Discard one Item or Trinket possession[]

11.flavor=At a Sydney loading yard, something beneath a tarpaulin lunges toward the night shift. You try to force a freight barrier across its path.
#Test Strength
11.fail.flavor=The barrier rebounds into you. You escape badly bruised, with a deep injury across your back.
11.fail.info.1=[#BAD]Lose two Health[]
11.fail.info.2=[#BAD]Gain a Back Injury Condition[]

12.flavor=Smoke fills a Sydney goods shed after an oil lamp overturns. You look for a route that will let you carry the heavy emergency gear outside.
#Test Observation-1
12.pass.flavor=You identify a clear path and complete the repeated carries. The strenuous work strengthens you.
12.pass.info=[#GOOD]Improve Strength[]
12.fail.flavor=You follow an aisle that has already filled with smoke. Recovery and the ensuing safety inquiry consume the time you meant to spend elsewhere.
12.fail.info=[#BAD]Become Delayed[]

13.flavor=A Sydney warehouse guard has found an unfamiliar seal on an intercepted shipment. He offers a weapon from the stores if you can contribute evidence that explains it.
13.question=[#BAD]Spend one Clue[] to answer his questions?
13.pass.flavor=Your evidence resolves his doubts about the shipment. He releases an available weapon to support your investigation.
13.pass.info=[#GOOD]Gain one random Weapon from the deck[]

14.flavor=A Sydney physiologist has copied a series of exercises from a ritual diagram. You study the symbols to separate useful movements from dangerous commands.
#Test Lore
14.pass.flavor=You identify and perform the sound sequence. The exercises leave your body better conditioned.
14.pass.info=[#GOOD]Improve Strength[]
14.fail.flavor=You follow a command that releases a bitter vapor from the apparatus. You leave poisoned and shaken by the shapes you saw within it.
14.fail.info.1=[#BAD]Lose one Sanity[]
14.fail.info.2=[#BAD]Gain a Poisoned Condition[]
        
15.flavor=A Sydney rowing coach offers an extended session on the training rig. Taking part will keep you occupied beyond your planned departure.
15.question=[#BAD]Become Delayed[] to train with him?
15.pass.info=[#GOOD]Improve Strength[]

16.flavor=A Sydney patrol has lost a weapons crate along a damaged service road. You examine the tracks and scattered packing material to find where it went.
#Test Observation
16.pass.flavor=You locate the crate and help secure the missing stock. An available weapon is released to you for your assistance.
16.pass.info=[#GOOD]Gain one random Weapon from the deck[]
16.fail.flavor=You step into a concealed washout while following the wrong tracks. The fall cuts you and leaves your leg painfully injured.
16.fail.info.1=[#BAD]Lose one Health[]
16.fail.info.2=[#BAD]Gain a Leg Injury Condition[]
1.pass.flavor=Your account clears up the tally. You leave the office freely, keeping the conditioning gained on the wharf.
1.fail.flavor=The officials reject your explanation and hold you while they investigate the missing crate.
2.pass.flavor=You hold the frame until the route is clear and step away before it falls. The day's training has served you well.
2.fail.flavor=The frame drives you into the rubble. You drag yourself out with painful cuts and bruises.
4.pass.flavor=The outfitter accepts your terms and supplies an available weapon from the stockroom.
5.fail.flavor=You keep the evidence and leave before the training begins.
5.fail.flavor.2=You have no lead to exchange. The trainer cannot offer the proposed session.
6.fail.flavor=The shaft feels as though it is closing around you. You retreat distressed before you can finish the work.
8.pass.flavor=You wait until the deadline passes and receive the available weapon. The paperwork has delayed your own departure.
8.pass.flavor.2=You are already held up and cannot commit to the additional wait. The weapon remains in the salvage office.
8.fail.flavor=You leave before the claim period expires. The clerk keeps the weapon in storage.
10.fail.flavor.2=You lose track of the lot numbers and recover no weapon. With no Item or Trinket to misplace, you leave with nothing further lost.
11.pass.flavor=You push the barrier home and escape through the side gate. Whatever is beneath the tarpaulin stays behind the locked yard.
13.fail.flavor=You decline the exchange. The guard returns to his inventory without opening the stores.
13.fail.flavor.2=You have no evidence that can answer his question. The guard keeps the weapons secured.
15.pass.flavor=You complete the demanding session and build your strength, though your other plans must wait.
15.pass.flavor.2=You are already held up and cannot take on the session. The coach assigns the rig to another trainee.
15.fail.flavor=You decline the session and leave the rowing crew to its practice.
