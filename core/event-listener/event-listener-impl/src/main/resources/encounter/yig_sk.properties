# Keep English glyph keywords (Clue, Health, Will, etc.) in rules; translate surrounding prose.
# Špeciálne stretnutia v K'n-yane, výzvy záhad a prebudenej strany Yiga.
knyan.header=K'n-yan
knyan.nothing=Nič ďalšie sa nestane.
knyan.progress=[#GOOD]Posuň aktívnu záhadu.[]

knyan.1.intro=Za falošnou stenou v mohyle objavíš točité schodisko vedúce k modrej žiare. Cestu ti však zatarasia kamenné dvere. Vyryté znaky na nich obklopujú zelený kameň, ktorý pulzuje svetlom.
knyan.1.pass.flavor=S námahou otvoríš dvere. Znaky okolo kameňa sú varovaním pred tým, čo sa skrýva v hlbinách. Možno sa z nich dá vyčítať aj mapa podzemia.
knyan.1.pass.fail.info=[#BAD]Získaj Prekliatie.[]
knyan.1.fail.info=[#BAD]Strať 1 Health.[]
knyan.1.fail.flavor=Staré schody sa ti rozpadnú pod nohami a zrútiš sa do tmy. V hlbinách sa pohne čosi obrovské. Pocítiš, ako sa ti do mysle tlačí jeho prítomnosť.
knyan.1.fail.fail.info=[#BAD]Skaza postúpi o 1.[]

knyan.2.intro=V zasypanej knižnici nájdeš kovové valce s kronikami K'n-yanu. Záznamy siahajú až do čias vlády hadích ľudí. Písmo sa zakaždým preskupí, keď odvrátiš zrak.
knyan.2.pass.question=Chceš [#BAD]minúť 1 Clue[] na rozlúštenie skrytého záznamu a [#GOOD]posunúť aktívnu záhadu[]? Inak [#BAD]získaš Paranoju.[]
knyan.2.paranoia.info=[#BAD]Získaj Paranoju.[]
knyan.2.fail.flavor=Pohybujúce sa znaky sa ti vryjú do mysle a vtiahnu ťa do príbehu kroniky. Zúfalo sa snažíš vymaniť z ich moci.
knyan.2.fail.fail.info=[#BAD]Strať 1 Sanity a získaj Prekliatie.[]

knyan.3.intro=Laboratóriá hadích ľudí sú zničené a opustené. Medzi rozbitými nádobami však objavíš stopy čohosi, čo sa tadiaľ vlieklo. Vydáš sa po nich.
knyan.3.pass.flavor=Stopy končia pri kadi, v ktorej sa stále myká tvor z nedokončeného pokusu. Vedľa ležia zápisky jeho tvorcov. Pokúšaš sa ich rozlúštiť.
knyan.3.pass.fail.info=[#BAD]Strať 1 Sanity a získaj Paranoju.[]
knyan.3.cursed.info=[#BAD]Získaj Prekliatie.[]
knyan.3.fail.question=Chceš [#BAD]získať Otravu[], aby si sa vyhol Prekliatiu?

knyan.4.intro=Spod ulíc sa ozýva tichý hlas. Ponúka ti všetky tajomstvá mesta, ak mu dovolíš usídliť sa v tvojej mysli. Snažíš sa ubrániť vlastnú vôľu.
knyan.4.pass.flavor=Ochrániš vlastné myšlienky a dovolíš hlasu hovoriť. Jeho šepot ti odhaľuje len útržky posolstva, ktoré sa snažíš spojiť do zrozumiteľného celku.
knyan.4.pass.fail.info=[#BAD]Strať 2 Sanity. Stávaš sa Zdržaným.[]
knyan.4.fail.info=[#BAD]Získaj Halucinácie.[]
knyan.4.fail.flavor=Šepot ovládne tvoju myseľ. V uliciach zaliatych modrým svetlom sa zjavujú nezmyselné, desivé výjavy. Hľadáš v nich súvislosť, ktorá by ti pomohla pochopiť, čo sa deje.
knyan.4.fail.fail.info=[#BAD]Strať 2 Sanity.[]

knyan.5.intro=V podzemnej sieni ťa nesmrteľní obyvatelia K'n-yanu prijmú v úplnom tichu. Prihovorí sa ti iba ich hovorca. Pozorne zvažuje každé tvoje slovo.
knyan.5.pass.flavor=Nedáš sa zastrašiť hovorcovým nepreniknuteľným pohľadom. Zhromaždení nesmrteľní mlčky čakajú, čo im ponúkneš.
knyan.5.pass.fail.info=[#BAD]Presuň sa na susedné miesto. Stávaš sa Zdržaným.[]
knyan.5.escape.title=Uteč na susedné miesto
knyan.5.fail.info=[#BAD]Strať 1 Health a získaj Vnútorné zranenie.[]

knyan.6.intro=V prachu pred modlou Otca hadov nájdeš zvlečené hadie šupiny. Strážca chrámu je stále nažive a nespúšťa z teba oči.
knyan.6.pass.flavor=Všimneš si, ako medzi vyrezávanými ozdobami žmurknú oči. Potlačíš strach a vykročíš v ústrety strážcovi chrámu.
knyan.6.pass.fail.info=[#BAD]Strať 2 Sanity.[]
knyan.6.fail.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
knyan.6.fail.defeated.info=[#GOOD]Porazil si Hadích ľudí.[]\nStretnutie sa končí bez posunu aktívnej záhady.
knyan.6.fail.survived.info=Prepadnutie sa skončilo.\nStretnutie sa končí bez posunu aktívnej záhady.

knyan.7.intro=Komnata, ktorú hľadáš, sa ukrýva kdesi v ruinách. Zakaždým, keď sa k nej priblížiš, steny sa pohnú a stočia ako telo obrovského hada.
knyan.7.pass.flavor=Zbadáš vchod do komnaty, no steny sa už so škrípaním sťahujú k sebe. Zaprieš sa do kameňa celou váhou, aby si priechod udržal otvorený.
knyan.7.pass.fail.info=[#BAD]Strať 2 Health.[]
knyan.7.fail.info=[#BAD]Získaj stav Stratený v čase a priestore.[]

knyan.8.intro=Zablúdiš do arény, kde obyvatelia K'n-yanu pre zábavu sledujú zápasy zajatcov. Strážca ťa sotí na piesočnaté bojisko a dav zaburáca.
knyan.8.pass.info=[#GOOD]Zlepši Influence.[]
knyan.8.pass.flavor=Víťazstvom si získaš priazeň davu. Starec v rúchu ti prinesie zvláštny dar. Keď ho začneš skúmať, celá aréna stíchne.
knyan.8.pass.fail.info=[#BAD]Získaj Otravu.[]
knyan.8.fail.flavor=Hodia ťa späť medzi divákov, ktorí sa ti posmievajú. V zmätku sa nepozorovane vytratíš a hľadáš cestu hlbšie do mesta.

