# Špeciálne stretnutia v K'n-yane, výzvy záhad a prebudenej strany Yiga.
knyan.header=K'n-yan
knyan.nothing=Nič ďalšie sa nestane.
knyan.progress=[#GOOD]Posuň aktívnu záhadu.[]

knyan.1.intro=Za falošnou stenou mohyly sa schodisko točí dolu k modrej žiare. Cestu zahradzujú kamenné dvere, ich glyfy obkolesujú pulzujúci zelený kameň.
knyan.1.pass.flavor=Dvere s námahou otvoríš. Glyfy okolo kameňa tvoria varovanie a možno aj mapu toho, čo leží pod nimi.
knyan.1.pass.fail.info=[#BAD]Získaj Prekliatie.[]
knyan.1.fail.info=[#BAD]Strať 1 Zdravie.[]
knyan.1.fail.flavor=Ošúchané schody sa rozpadnú a ty sa zrútiš do tmy. Čosi obrovské dole sa pohne a jeho pozornosť ti doľahne na myseľ.
knyan.1.fail.fail.info=[#BAD]Skaza postúpi o 1.[]

knyan.2.intro=Kovové valce v zasypanej knižnici uchovávajú kroniky K'n-yanu až do čias, keď vládli hadí ľudia. Písmo sa plazí vždy, keď odvrátiš zrak.
knyan.2.pass.question=[#BAD]Minúť 1 Stopu[] na rozlúštenie skrytého záznamu a [#GOOD]posunúť aktívnu záhadu[]? Inak [#BAD]získaš Paranoju.[]
knyan.2.paranoia.info=[#BAD]Získaj Paranoju.[]
knyan.2.fail.flavor=Plaziace sa písmo sa ovinie okolo tvojich myšlienok a vtiahne ťa hlbšie do záznamu. Zápasíš, aby si si vytrhol myseľ na slobodu.
knyan.2.fail.fail.info=[#BAD]Strať 1 Príčetnosť a získaj Prekliatie.[]

knyan.3.intro=Laboratóriá hadích ľudí ležia rozbité a opustené, no čosi sa medzi rozbitými nádobami vlečie. Ideš po jeho stope.
knyan.3.pass.flavor=Stopa končí pri nedokončenom pokuse, ktorý sa vo svojej kadi stále myká. Poznámky jeho tvorcov ležia vedľa, ak ich dokážeš prečítať.
knyan.3.pass.fail.info=[#BAD]Strať 1 Príčetnosť a získaj Paranoju.[]
knyan.3.cursed.info=[#BAD]Získaj Prekliatie.[]
knyan.3.fail.question=[#BAD]Získať Otravu[], aby si nezískal Prekliatie?

knyan.4.intro=Spod ulíc sa ozve tichý hlas a ponúka všetky tajomstvá mesta výmenou za miesto v tvojej mysli. Bojuješ, aby tvoje myšlienky zostali tvoje.
knyan.4.pass.flavor=Oddelíš svoje myšlienky múrom a necháš šepot hovoriť. Jeho posolstvo prichádza v útržkoch, ktoré musíš poskladať.
knyan.4.pass.fail.info=[#BAD]Strať 2 Príčetnosti a staneš sa Zdržaným.[]
knyan.4.fail.info=[#BAD]Získaj Halucinácie.[]
knyan.4.fail.flavor=Šepot zaplaví tvoju myseľ a modro osvetlené ulice sa naplnia nemožnými víziami. V tom šialenstve hľadáš vzorec.
knyan.4.fail.fail.info=[#BAD]Strať 2 Príčetnosti.[]

knyan.5.intro=V zapadnutej sieni ťa nesmrteľný ľud K'n-yanu prijme v dokonalom tichu. Prihovorí sa ti jediný hovorca a váži každé tvoje slovo.
knyan.5.pass.flavor=Hovorcov bezvekový pohľad opätuješ bez mihnutia oka. Tiché zhromaždenie čaká, čo im môžeš ponúknuť.
knyan.5.pass.fail.info=[#BAD]Presuň sa na susedné miesto a staneš sa Zdržaným.[]
knyan.5.escape.title=Uteč na susedné miesto
knyan.5.fail.info=[#BAD]Strať 1 Zdravie a získaj Vnútorné zranenie.[]

knyan.6.intro=Pred idolom Otca hadov leží v prachu zvlečená koža a šupiny. Čokoľvek stráži tento chrám, stále žije a stále sleduje.
knyan.6.pass.flavor=Medzi rezbami žmurkne pár očí. Upokojíš nervy a vykročíš čeliť strážcovi chrámu.
knyan.6.pass.fail.info=[#BAD]Strať 2 Príčetnosti.[]
knyan.6.fail.info=[#BAD]Prepadnú ťa Hadí ľudia.[]
knyan.6.fail.defeated.info=[#GOOD]Porazil si Hadích ľudí.[]\nStretnutie končí bez posunu aktívnej záhady.
knyan.6.fail.survived.info=Prepadnutie sa skončilo.\nStretnutie končí bez posunu aktívnej záhady.

knyan.7.intro=Komnata, ktorú hľadáš, leží kdesi v týchto ruinách, no steny sa posúvajú a skladajú ako závity obrovského hada vždy, keď sa priblížiš.
knyan.7.pass.flavor=Zazrieš vchod do komnaty práve vo chvíli, keď sa steny začnú so škrípaním zatvárať. Oprieš sa do kameňa celou váhou.
knyan.7.pass.fail.info=[#BAD]Strať 2 Zdravia.[]
knyan.7.fail.info=[#BAD]Získaj Stratený v čase a priestore.[]

knyan.8.intro=Vpadneš do arény, kde ľud K'n-yanu pre zábavu sleduje zápasy zajatcov. Stráž ťa sotí do piesku a dav zareve.
knyan.8.pass.info=[#GOOD]Zlepši Vplyv.[]
knyan.8.pass.flavor=Tvoje víťazstvo ti získa priazeň davu. Starec v róbe prinesie zvláštny dar a aréna stíchne, kým si ho prezeráš.
knyan.8.pass.fail.info=[#BAD]Získaj Otravu.[]
knyan.8.fail.flavor=Odhodia ťa späť do posmešného davu. V zmätku sa vytratíš a hľadáš cestu hlbšie do mesta.

