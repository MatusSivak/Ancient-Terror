1.flavor=A Buenos Aires conservator has found writing inside the joined rings of a salvaged brass instrument. You study the marks to discover how the rings should separate.
#Test Lore+1
1.pass.flavor=The rings open in the order prescribed by the symbols, revealing a folded spell that the conservator lets you keep.
1.pass.info=[#GOOD]Gain one Spell[]
1.fail.flavor=A ring snaps under your mistaken adjustment. You sign an account for the repair before leaving the workshop.
1.fail.info=[#BAD]Gain a Debt Condition[]

2.flavor=A Buenos Aires dyer teaches you the ritual she uses to keep a stubborn black stain from spreading through her cloth. You copy each stage of the working.
2.info=[#GOOD]Gain one Ritual Spell[]
2.flavor.2=The dye has begun forming letters overnight. You study their ritual meaning to find out whether the stain can follow you.
#Test Lore
2.fail.flavor=You cannot establish where the boundary lies. Every dark mark on your clothes now looks like evidence that something followed you home.
2.fail.info=[#BAD]Gain a Paranoia Condition[]

3.flavor=A Buenos Aires survey student has reconstructed most of a ritual from old boundary stones. She offers the complete lesson if you contribute evidence to her research.
3.question=[#BAD]Spend one Clue[] to [#GOOD]Gain one Ritual Spell[]

4.flavor=Behind a Buenos Aires warehouse, a night watchman demonstrates a ritual that keeps a sealed cargo hold quiet. You commit the working to memory.
4.info=[#GOOD]Gain one Ritual Spell[]
4.flavor.2=The rhythm makes the dock lights seem very far away. You struggle to remain alert as the watch changes and unfamiliar guards approach.
#Test Will
4.fail.flavor=You emerge from the trance in a guarded office. Unable to explain your presence aboard the cargo vessel, you are held for questioning.
4.fail.info=[#BAD]Gain a Detained Condition[]

5.flavor=A Buenos Aires physician has arranged mirrors around a machine recovered from a buried workshop. You study the ritual diagrams needed to align its reflections.
#Test Lore
5.pass.flavor=You align the mirrors and step through a wash of warm light. A sense of protection remains with you after the machine goes dark.
5.pass.info=[#GOOD]Gain a Blessed Condition[]
5.fail.flavor=The mirrors reflect versions of you that have never been human. You stagger away, unable to dismiss what you saw.
5.fail.info=[#BAD]Lose two Sanity[]


6.flavor=At a Buenos Aires repair yard, empty water tanks resonate with a measured sequence of knocks. You compare the rhythm with ritual patterns you know.
#Test Lore
6.pass.flavor=The knocks encode the movements of a complete ritual. You write down the sequence before the tanks fall silent.
6.pass.info=[#GOOD]Gain one Ritual Spell[]
6.fail.flavor=The rhythm becomes the sound of frantic hands inside each tank. You leave shaken despite finding every tank empty.
6.fail.info=[#BAD]Lose one Sanity[]

7.flavor=A retired Buenos Aires stage carpenter can demonstrate two workings hidden in an old set design. Each lesson takes hours, and staying will disrupt your plans.
7.question=[#BAD]Become Delayed[] to listen to him?
7.pass.flavor=You remain through both demonstrations, learning two spells as the workshop clocks pass the hour you meant to leave.
7.pass.info=[#GOOD]Gain two Spells[]

8.flavor=A Buenos Aires librarian has catalogued a ritual as ordinary bookkeeping. You study the columns to reconstruct the working concealed among the sums.
#Test Lore
8.pass.flavor=You read the repeated totals as stages of a ceremony and copy a complete ritual from the ledger.
8.pass.info=[#GOOD]Gain one Ritual Spell[]

9.flavor=A tram in Buenos Aires stops beside an unlit depot. Through the windows you notice workers making the same gestures in an exact, repeating order.
#Test Observation -1
9.pass.flavor=You catch the gestures and their timing before the tram moves again, enough to reconstruct the ritual they perform.
9.pass.info=[#GOOD]Gain one Ritual Spell[]
9.fail.flavor=The figures vanish when the lights return, but their movements persist in every reflection you pass.
9.fail.info=[#BAD]Gain a Hallucinations Condition[]

10.flavor=A Buenos Aires estate sale includes a box of ritual diagrams drawn over one another. You try to separate the original workings from the later corrections.
#Test Lore-1
10.pass.info=[#GOOD]Gain two Spells[]
10.fail.flavor=The overlapping commands scramble workings you already know. Half of your spells slip beyond recall before you can close the box.
10.fail.info=[#BAD]Discard half of your Spells[]

11.flavor=A Buenos Aires map dealer keeps correcting a street that no longer exists. You watch his hands and the paper for the source of the changes.
#Test Observation
11.pass.flavor=You see a second hand moving beneath the paper and recover a marked fragment as evidence. The sight leaves you shaken even with something concrete to investigate.
11.pass.info.1=[#BAD]Lose one Sanity[]
11.pass.info.2=[#GOOD]Gain one Clue[]
11.fail.flavor=The street changes whenever you look away. You leave frightened and convinced that someone is rearranging the city to keep you under watch.
11.fail.info.1=[#BAD]Lose one Sanity[]
11.fail.info.2=[#BAD]Gain a Paranoia Condition[]

12.flavor=A Buenos Aires radio troupe rehearses a drama in which every listener is addressed by name. You hold your concentration as the broadcast begins describing your own room.
#Test Will
12.pass.flavor=You keep track of the repeated directions and recover a ritual from the script without accepting its invitation.
12.pass.info=[#GOOD]Gain one Ritual Spell[]
12.fail.flavor=The voice seems to follow you out of the studio. You leave distressed, certain that an unseen audience is listening to your every move.
12.fail.info.1=[#BAD]Lose one Sanity[]
12.fail.info.2=[#BAD]Gain a Paranoia Condition[]

13.flavor=A Buenos Aires midwife shows you scraps from a notebook that survived a clinic fire. You search the soot-stained pages for the words that accompanied her treatments.
#Test Observation-1
13.pass.info=[#GOOD]Gain a Healing Words Spell[]
13.fail.flavor=The burned pages whisper the names of patients who never arrived. You close the notebook, shaken by their insistent requests.
13.fail.info=[#BAD]Lose one Sanity[]

14.flavor=A Buenos Aires dockworker has copied a disturbing phrase from the inside of a sealed crate. You examine the words for both their ritual meaning and their origin.
#Test Lore-1
14.pass.info.1=[#GOOD]Gain one Clue[]
14.pass.info.2=[#GOOD]Gain one Ritual Spell[]
14.fail.flavor=The phrase unravels a spell in your memory. You recoil from the sudden emptiness, losing both the working and your composure.
14.fail.info.1=[#BAD]Lose one Sanity[]
14.fail.info.2=[#BAD]Discard one Spell[]

15.flavor=A Buenos Aires drainage crew uncovers a tiled chamber beneath a flooded street. You study its ceremonial pattern before the pumps wash away the remaining pigment.
#Test Lore
15.pass.info=[#GOOD]Gain one Ritual Spell[]
15.fail.flavor=The pattern makes you feel buried beneath a rising river. You flee the chamber gasping, unable to shake the imagined water from your lungs.
15.fail.info=[#BAD]Lose two Sanity[]

16.flavor=At a Buenos Aires chemical works, an attendant is trapped in a room filling with toxic vapor. Reaching the release wheel will expose you to the fumes.
16.question=[#BAD]Gain a Poisoned Condition[] to save him?
16.pass.flavor=You open the vent and bring the attendant out, breathing enough vapor to poison yourself. He teaches you the Poison Mist working used to control the leak.
16.pass.info=[#GOOD]Gain a Poison Mist Spell[]
16.fail.flavor=You remain outside as the window clouds over. The attendant's unanswered knocking leaves you deeply distressed.
16.fail.info=[#BAD]Lose two Sanity[]
2.pass.flavor=The letters describe a boundary you have not crossed. You leave reassured, carrying the ritual you learned.
3.pass.flavor=Your evidence supplies the missing connection. She teaches you the ritual and checks your notes before you leave.
3.pass.info=[#GOOD]Gain one Ritual Spell[]
3.fail.flavor=You decline to contribute. The student gathers her rubbings and continues the work alone.
3.fail.flavor.2=You have no evidence to exchange. The student cannot complete the lesson without it.
4.pass.flavor=You break the rhythm and explain your presence before the guards reach you. You leave freely with the ritual still clear in your memory.
7.pass.flavor.2=You are already held up and cannot undertake the long lesson. The carpenter rolls the design away without teaching either working.
7.fail.flavor=You leave the carpenter to finish his repairs. The long lesson will have to wait for someone else.
8.fail.flavor=The columns refuse to resolve into a coherent sequence. You return the ledger without learning a working.
10.pass.flavor=You distinguish two complete spells beneath the corrections and copy both before the papers are sold.
10.fail.flavor.2=The contradictory commands yield no usable working. You have no spells for the confusion to erase, and leave empty-handed.
13.pass.flavor=You recover the complete spoken working used to mend injuries and record it as Healing Words.
14.pass.flavor=You identify the ritual and a mark tracing the crate's journey. You leave with a new working and a concrete piece of evidence.
14.fail.flavor.2=The phrase offers nothing you can understand. Though you know no spell for it to unravel, its sound still leaves you badly shaken.
15.pass.flavor=The tiles specify a complete ritual. You record its stages while the last of the colored water drains away.
16.fail.flavor.2=Already poisoned, you cannot endure the fumes long enough to reach the wheel. The unanswered knocking stays with you as you retreat.
