1.flavor=In an Istanbul lodging house, a voice speaks through an empty speaking tube, answering questions before you ask them. You hold your nerve and attempt a measured conversation.
#Test Will
1.pass.flavor=You learn to choose words that keep the voice listening instead of interrupting. The experience sharpens your ability to make yourself heard.
1.pass.info=[#GOOD]Improve Influence[]
1.fail.flavor=The replies anticipate even your unspoken fears. Long after the tube falls silent, you cannot trust that your thoughts are private.
1.fail.info=[#BAD]Gain a Madness Condition[]

2.flavor=An Istanbul interpreter needs evidence to settle a dispute between two crews who each claim the other vanished at sea. You may contribute one of your leads.
2.question=[#BAD]Spend one Clue[] to find the cultists?
2.pass.flavor=Your evidence lets both crews speak from common ground. Helping the interpreter negotiate their agreement teaches you how to win a difficult audience.
2.pass.info=[#GOOD]Improve Influence[]

3.flavor=An Istanbul tenants' association shows you how to present a petition so every household is heard. The practice makes your appeals more effective.
3.info=[#GOOD]Improve Influence[]
3.flavor.2=While delivering the petition, you cross a stairwell filled with a humming pressure. You struggle to keep moving without giving in to panic.
#Test Will
3.fail.flavor=The pressure drives you against the stair rail. You escape with painful bruises along your arms and chest.
3.fail.info=[#BAD]Lose two Health[]

4.flavor=At an Istanbul repair market, several instructors offer very different lessons under the same sign. You negotiate for training suited to the skill you want to practice.
#Test Influence-1
4.pass.info=[#GOOD]Improve one Skill of your choice[]
4.fail.flavor=You misunderstand the terms and receive only a demonstration. The instructor still presents a bill you must promise to pay.
4.fail.info=[#BAD]Gain a Debt Condition[]

5.flavor=An Istanbul cooperative offers long practical lessons in several trades. Staying for one will take the time you set aside for your next journey.
5.question=[#BAD]Become Delayed[] to [#GOOD]Improve one Skill of your choice[]?


6.flavor=An Istanbul conservator challenges your interpretation of a ritual object. You work through its history carefully enough to defend your account.
#Test Lore
6.pass.flavor=Your explanation earns a place in the conservator's discussions. Practicing your arguments with the group makes you a more persuasive speaker.
6.pass.info=[#GOOD]Improve Influence[]

7.flavor=An Istanbul translators' circle invites you to mediate its disagreements. Their precise corrections teach you to make your own arguments clearer.
7.info=[#GOOD]Improve Influence[]
7.flavor.2=The final document describes voices that borrow a reader's mouth. You steady yourself as its sentences begin matching the movement of your lips.
#Test WILL
7.fail.info=[#BAD]Lose two Sanity[]

8.flavor=In an Istanbul passage, the same footsteps halt whenever yours do. You use a metalworker's polished display to examine the street behind you.
#Test Observation
8.pass.flavor=You spot the pursuer and warn a nearby caretaker, who ushers you through a protected doorway. A prayer for your safety leaves you blessed.
8.pass.info=[#GOOD]Gain a Blessed Condition[]
8.fail.flavor=You watch the wrong reflection. A sudden blow to your back sends you to the paving, leaving a painful injury.
8.fail.info=[#BAD]Gain a Back Injury Condition[]

9.flavor=Istanbul ferry workers suspect that forged orders are directing passengers toward an abandoned landing. You examine the notices for evidence that will convince the harbor office.
#Test Observation-1
9.pass.flavor=You expose the repeated forgery and help the workers present their case. The experience strengthens your ability to persuade officials.
9.pass.info=[#GOOD]Improve Influence[]
9.fail.flavor=Someone catches you examining the notices and kicks the gangway loose. Your fall leaves a lasting injury in your leg.
9.fail.info=[#BAD]Gain a Leg Injury Condition[]

10.flavor=At an Istanbul travelers' club, visiting specialists trade short lessons between departures. You try to persuade one to teach the skill you need.
#Test Influence-1
10.pass.flavor=A specialist agrees to a focused lesson. You practice the skill you chose until the method becomes clearer.
10.pass.info=[#GOOD]Improve one Skill of your choice[]
10.fail.flavor=Every introduction sends you to another waiting room. You miss your own departure without finding a teacher.
10.fail.info=[#BAD]Become Delayed[]

11.flavor=Sleeping in Istanbul, you dream of a workshop whose doors open onto lessons from lives you never led. You hold your concentration as the corridors try to pull you elsewhere.
#Test Will-1
11.pass.flavor=You complete one chosen lesson and wake with its movements still familiar enough to practice.
11.pass.info=[#GOOD]Improve one Skill of your choice[]
11.fail.flavor=You lose the thread leading back to your bed. The workshop doors close around a place beyond ordinary time and space.
11.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

12.flavor=An Istanbul archive messenger is trapped behind a barrier while a hostile crowd tries to seize his satchel. You brace the barrier and pull him toward the exit.
#Test Strength
12.pass.flavor=You bring him clear. Working afterward with the archive's advocates teaches you how to make your testimony count.
12.pass.info=[#GOOD]Improve Influence[]
12.fail.flavor=The barrier collapses onto you. You escape bruised, with a deep internal pain beneath your ribs.
12.fail.info.1=[#BAD]Lose one Health[]
12.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

13.flavor=An Istanbul evening school offers practical instruction in return for a useful piece of research. You may exchange a lead for training in a skill of your choice.
13.question=[#BAD]Spend one Clue[] to\n[#GOOD]Improve one Skill of your choice[]?

14.flavor=An Istanbul neighborhood committee needs help interpreting an old agreement about its shared cistern. You study the document in the sealed maintenance tunnels.
#Test Lore-1
14.pass.flavor=You resolve the disputed clause and explain it to both sides. The negotiations give you useful practice in winning agreement.
14.pass.info=[#GOOD]Improve Influence[]
14.fail.flavor=You spend too long over the document before noticing the stale air. The fumes leave you poisoned when you finally reach the street.
14.fail.info=[#BAD]Gain a Poisoned Condition[]

15.flavor=An Istanbul well inspector brings you a rubbing of marks found beneath several newly cracked foundations. You compare them with ritual notation you know.
#Test Lore
15.pass.flavor=The marks specify the same buried meeting point. You keep the rubbing as evidence of a deliberate pattern.
15.pass.info=[#GOOD]Gain one Clue[]
15.fail.flavor=The marks seem to describe something moving beneath your feet. You leave shaken and cannot stop listening for its approach.
15.fail.info.1=[#BAD]Lose one Sanity[]
15.fail.info.2=[#BAD]Gain a Paranoia Condition[]

16.flavor=An Istanbul archive is sorting petitions whose authors have vanished from official records. You work through the exhaustion to recover a coherent account.
#Test Will
16.pass.flavor=You reconstruct the petitioners' common demand and present it to the archivists. The difficult explanation strengthens your ability to persuade.
16.pass.info=[#GOOD]Improve Influence[]
16.fail.flavor=Fatigue distracts you during the sorting. An Item or Trinket slips into a sealed shipment and is carried away before you can retrieve it.
16.fail.info=[#BAD]Discard one Item or Trinket possession[]
2.fail.flavor=You keep your evidence and leave the interpreter to continue the negotiations alone.
2.fail.flavor.2=You have no lead that can support the discussion. The interpreter cannot bring you into the negotiations.
3.pass.flavor=You control your breathing and reach the upper landing safely. The petition and your newly practiced arguments remain intact.
4.pass.flavor=You agree on a useful course and complete its practical exercises, training the skill you choose.
5.pass.flavor=You remain for a complete lesson in your chosen field. The practice pays off, though your departure must wait.
5.pass.flavor.2=You are already held up and cannot commit to another long session. The class begins without you.
5.fail.flavor=You keep your travel plans and leave before the lesson begins.
6.fail.flavor=You cannot support the interpretation. The conservator returns to the restoration, and the discussion ends without an invitation.
7.pass.flavor=You stop reading aloud and close the document deliberately. You leave with the circle's lessons and no further consequence.
7.fail.flavor=You hear your own voice continue after you have stopped speaking. The experience leaves you deeply shaken.
13.pass.flavor=Your evidence becomes the class's worked example. In return, an instructor guides you through exercises in the skill you select.
13.pass.info=[#GOOD]Improve one Skill of your choice[]
13.fail.flavor=You keep the lead for your investigation. The instructor turns to the students already enrolled.
13.fail.flavor.2=You have no evidence to contribute to the class. The proposed exchange cannot go ahead.
16.fail.flavor.2=You stop before the account becomes clear. With no Item or Trinket among your belongings, the departing shipment takes nothing of yours.
