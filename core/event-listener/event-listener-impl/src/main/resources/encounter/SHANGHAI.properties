1.flavor=A Shanghai conservator lets you compare ritual objects with the ordinary tools from which they were made. The differences teach you how to recognize occult adaptations.
1.info=[#GOOD]Improve Lore[]
1.flavor.2=One object's shadow continues moving after it is covered. You keep your composure while trying to look away.
#Test WILL
1.fail.flavor=The shadow follows the edges of your sight. Even in daylight, you keep seeing it move across objects no one else finds unusual.
1.fail.info=[#BAD]Gain a Hallucinations Condition[]

2.flavor=A Shanghai mechanics' association runs practical classes after work. You try to persuade its coordinator to arrange instruction in the skill you need.
#Test Influence
2.pass.info=[#GOOD]Improve one Skill of your choice[]
2.fail.flavor=Your insistence starts an argument at the doorway. In the resulting shove, you fall against a workbench and leave bruised.
2.fail.info=[#BAD]Lose one Health[]

3.flavor=A Shanghai printer saves damaged notices that customers refuse to collect. You examine them for repeated signs of ritual activity.
#Test Observation
3.pass.flavor=You distinguish a pattern beneath the printing errors. Comparing its variations deepens your understanding of how the working is constructed.
3.pass.info=[#GOOD]Improve Lore[]
3.fail.flavor=The notices describe unrelated horrors with no pattern you can use. Their accumulated details leave you shaken.
3.fail.info=[#BAD]Lose one Sanity[]

4.flavor=A Shanghai shipping warehouse holds dismantled ritual apparatus. Studying the exposed mechanisms teaches you how several unfamiliar workings function.
4.info=[#GOOD]Improve Lore[]
4.flavor.2=The warehouse is about to close. You watch the rounds and door signals to find your way out without becoming trapped in the security inspection.
#Test Observation
4.fail.flavor=You miss the exit signal and are caught in the locked inspection area. Sorting out your presence takes the rest of your available time.
4.fail.info=[#BAD]Become Delayed[]

5.flavor=A Shanghai restoration workshop trades access to its ritual diagrams for useful research. You may contribute a lead in exchange for a lesson.
5.question=[#BAD]Spend one Clue[] to [#GOOD]Improve Lore[]?

6.flavor=A Shanghai translator has been comparing instructions found in objects from unrelated ports. You write to explain why your investigation would benefit from her findings.
#Test Influence
6.pass.flavor=She agrees to walk you through the recurring structures. The lesson strengthens your understanding of unfamiliar rituals.
6.pass.info=[#GOOD]Improve Lore[]

7.flavor=A Shanghai instructor offers a lengthy exercise using a slowly settling bowl of colored sand. Once begun, it will occupy the time you meant to spend elsewhere.
7.question=[#BAD]Become Delayed[] to complete the exercise?
7.pass.flavor=You stay through the exercise and practice the skill you selected against the changing patterns. Your other plans must wait.
7.pass.info=[#GOOD]Improve one Skill of your choice[]

8.flavor=At a Shanghai landing, a caretaker is pinned beneath a capsized ferry awning. You dive beneath the frame and try to lift it clear.
#Test Strength
8.pass.flavor=You free the caretaker and bring him to the steps. His prayer of gratitude leaves a blessing with you.
8.pass.info=[#GOOD]Gain a Blessed Condition[]
8.fail.flavor=You cannot shift the frame before harbor guards arrive. Mistaking your actions for sabotage, they detain you while the accident is investigated.
8.fail.info=[#BAD]Gain a Detained Condition[]

9.flavor=A Shanghai collector has assembled diagrams from several vanished workshops. You ask him to explain their shared symbols and let you study them.
#Test Influence
9.pass.flavor=He opens the portfolio and compares the symbols with you. The detailed lesson improves your grasp of the occult.
9.pass.info=[#GOOD]Improve Lore[]
9.fail.flavor=He distracts you with an empty portfolio while an accomplice takes an Artifact or Trinket from your belongings.
9.fail.info=[#BAD]Discard one Artifact or one Trinket[]

10.flavor=A Shanghai salvage yard has hidden a cabinet of ritual plans behind a false inventory wall. You inspect its seams for a way to open it quietly.
#Test Observation
10.pass.flavor=You reach the plans and compare their construction. The shared principles teach you more than any single diagram could.
10.pass.info=[#GOOD]Improve Lore[]
10.fail.flavor=The false wall falls across you when you release the wrong catch. You escape bruised, with a persistent internal pain.
10.fail.info.1=[#BAD]Lose one Health[]
10.fail.info.2=[#BAD]Gain an Internal Injury Condition[]

11.flavor=A Shanghai caretaker teaches you the structure of the wards protecting an old storehouse. The lesson expands your knowledge of ritual boundaries.
11.info=[#GOOD]Improve Lore[]
11.flavor.2=Below the storehouse, something has begun forcing the sealed doors apart. You help brace them against the pressure.
#Test Strength-2
11.pass.flavor=You force the doors shut and secure the braces. Seeing the wards hold again restores some of your peace of mind.
11.pass.info=[#GOOD]Recover two Sanity[]
11.fail.flavor=The doors burst inward and throw you to the floor. You retreat injured and shaken by what moved beyond them.
11.fail.info.1=[#BAD]Lose one Health[]
11.fail.info.2=[#BAD]Lose one Sanity[]

12.flavor=A Shanghai archive needs help matching ritual diagrams to their mislabeled objects. The cataloguing will take long enough to disrupt your other plans.
12.question=[#BAD]Become Delayed[] to help them?
12.pass.flavor=You stay until the objects and diagrams agree. The comparison deepens your knowledge, though the work has delayed your departure.
12.pass.info=[#GOOD]Improve Lore[]

13.flavor=A Shanghai broker offers instruction drawn from memories that are not his own. His written terms bind you to a future service whose nature he refuses to name.
13.question=[#BAD]Gain a Dark Pact Condition[] to\n[#GOOD]Improve one Skill of your choice[]
13.fail.flavor=You refuse the agreement. The broker describes where you will sleep tonight, and you leave convinced that someone is watching you.
13.fail.info=[#BAD]Gain a Paranoia Condition[]

14.flavor=A Shanghai instrument maker has devised a painful concentration exercise using a vibrating hand rest. You try to endure it long enough to complete the training.
#Test Will-1
14.pass.info=[#GOOD]Improve one Skill of your choice[]
14.fail.flavor=The pain overwhelms you and you collapse against the apparatus. You wake injured, with a blank stretch where your recent memories should be.
14.fail.info.1=[#BAD]Lose one Health[]
14.fail.info.2=[#BAD]Gain an Amnesia Condition[]

15.flavor=In a Shanghai lodging, you dream of a classroom drifting away from your sleeping body. You concentrate on the route back while an unseen teacher demonstrates a chosen exercise.
#Test Will-1
15.pass.flavor=You keep the route in mind and wake with enough of the lesson to practice the skill you selected.
15.pass.info=[#GOOD]Improve one Skill of your choice[]
15.fail.flavor=You lose sight of the bed before the lesson ends. The classroom drifts into a place outside ordinary time and space.
15.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

16.flavor=A Shanghai fumigation chamber begins venting toward you. Feeding a spell into its damaged ward may seal the breach, but the working will be consumed.
16.question=[#BAD]Discard one Spell[]?
16.fail.info.1=[#BAD]Lose one Health[]
16.fail.info.2=[#BAD]Gain a Poisoned Condition[]


1.pass.flavor=You turn your attention to the conservator's notes until the shadow stops. You leave with the lesson you came for.
2.pass.flavor=The coordinator finds a suitable teacher. You spend the session practicing the skill you select.
4.pass.flavor=You follow the final delivery cart through the open gate. The knowledge you gained leaves with you.
5.pass.flavor=Your evidence helps the restorers compare two techniques. Their explanation gives you a better grasp of ritual construction.
5.pass.info=[#GOOD]Improve Lore[]
5.fail.flavor=You keep your research and leave the diagrams covered on the workshop table.
5.fail.flavor.2=You have no evidence to contribute. The restorers postpone the lesson and return to their own work.
6.fail.flavor=She declines to discuss unfinished work. Your visit ends without access to her comparisons.
7.pass.flavor.2=You are already held up and cannot commit to the session. The instructor covers the bowl before the exercise begins.
7.fail.flavor=You decline the long session and leave before the sand is poured.
9.fail.flavor.2=He distracts you with an empty portfolio, but you carry no Artifact or Trinket for his accomplice to steal. You leave without a lesson.
12.pass.flavor.2=You are already held up and cannot join the long cataloguing session. The archive closes the collection without your participation.
12.fail.flavor=You decline the work and leave the archivists to continue sorting.
13.pass.flavor=You sign the binding agreement. A borrowed memory becomes a practical lesson in the skill you choose, leaving the broker's future claim unsettled.
13.fail.flavor.2=Your existing pact prevents another binding agreement. The broker's intimate knowledge of your movements still leaves you afraid of being watched.
14.pass.flavor=You hold steady through the final vibration and apply the exercise to the skill you choose to practice.
16.pass.flavor=You sacrifice a spell to the ward. The breach seals and the vapor withdraws before it can reach you.
16.fail.flavor=You preserve your spells and try to reach the exit. The escaping vapor burns your skin and leaves you poisoned.
16.fail.flavor.2=You know no spell the ward can consume. The escaping vapor burns you and leaves you poisoned before you reach the exit.
