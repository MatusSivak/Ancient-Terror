THE_SPY.health.flavor=Trish falls in and out of consciousness when you visit her in the hospital, but she happily turns over her equipment.
THE_SPY.health.info=[#GOOD]Gain all of her possessions[]
THE_SPY.health.flavor.2=Unfortunately, her journal has been seized by the police. You'll have to convince the local authorities to turn the book over to you.
#Test Influence
THE_SPY.health.pass.flavor=You can read through all of Trish's notes.
THE_SPY.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SPY.health.pass.info.2=Discard this defeated investigator.
THE_SPY.health.fail.flavor=The knowledge is lost.
THE_SPY.health.fail.info=Discard this defeated investigator.

THE_SPY.sanity.flavor=The doctor grimly hands you the items Trish had when she was brought in.
THE_SPY.sanity.info=[#GOOD]Gain all of her possessions[]
THE_SPY.sanity.flavor.2="It's not good", he warns. Inside her padded cell, she's written on every surface with a thick black pen. The text is a mix of dozens of codes. You start searching for anything you recognize.
#Test Observation
THE_SPY.sanity.pass.flavor=You spot a hidden message in a familiar code.
THE_SPY.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SPY.sanity.pass.info.2=Discard this defeated investigator.
THE_SPY.sanity.fail.flavor=Trish's message remains locked away.
THE_SPY.sanity.fail.info=Discard this defeated investigator.

THE_SOLDIER.health.flavor=While you are collecting Mark's things, you smell smoke in the hospital.
THE_SOLDIER.health.info=[#GOOD]Gain all of his possessions[]
THE_SOLDIER.health.flavor.2=The hospital has been set on fire, and you run to Mark's room and try to carry him to safety.
#Test Strength
THE_SOLDIER.health.pass.flavor=Mark is able to tell you who set the fire.
THE_SOLDIER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SOLDIER.health.pass.info.2=Discard this defeated investigator.
THE_SOLDIER.health.fail.flavor=The smoke overcomes Mark, and he dies outside the hospital.
THE_SOLDIER.health.fail.info=Discard this defeated investigator.

THE_SOLDIER.sanity.flavor=You take custody of Mark's belongings and arrange to visit him in the asylum.
THE_SOLDIER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_SOLDIER.sanity.flavor.2=To your dismay, Mark is convinced that you are a creature disguising itself as human. You do your best to convince him that you are telling the truth.
#Test Influence
THE_SOLDIER.sanity.pass.flavor=He shows you sketches he made of the horrible monsters that he's been hunting.
THE_SOLDIER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SOLDIER.sanity.pass.info.2=Discard this defeated investigator.
THE_SOLDIER.sanity.fail.flavor=Mark screams accusations of murder at you.
THE_SOLDIER.sanity.fail.info=Discard this defeated investigator.

THE_ASTRONOMER.health.flavor=Norman can barely move in his hospital bed and points to his notes and suitcase.
THE_ASTRONOMER.health.info=[#GOOD]Gain all of his possessions[]
THE_ASTRONOMER.health.flavor.2=He begs you to use telescope to record the current locations of the stars. The work is slow and demanding, but you focus as best you can to give him accurate results.
#Test Will
THE_ASTRONOMER.health.pass.flavor=Norman's insight into the Ancient One proves accurate.
THE_ASTRONOMER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ASTRONOMER.health.pass.info.2=Discard this defeated investigator.
THE_ASTRONOMER.health.fail.flavor=Norman can make no sense of the night sky.
THE_ASTRONOMER.health.fail.info=Discard this defeated investigator.

THE_ASTRONOMER.sanity.flavor=The doctors would like you to look at Norman's notes and belongings.
THE_ASTRONOMER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_ASTRONOMER.sanity.flavor.2=They are trying to gain some insight into his catatonic state. You try to convince them to move Norman to a room with a view of the night sky.
#Test Influence
THE_ASTRONOMER.sanity.pass.flavor=Norman becomes slightly responsive, and you are able to question him.
THE_ASTRONOMER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ASTRONOMER.sanity.pass.info.2=Discard this defeated investigator.
THE_ASTRONOMER.sanity.fail.flavor=Norman's condition grows steadily worse.
THE_ASTRONOMER.sanity.fail.info=Discard this defeated investigator.

THE_POLITICIAN.health.flavor=The nurse at the front desk hands you a parcel.
THE_POLITICIAN.health.info=[#GOOD]Gain all of his possessions[]
THE_POLITICIAN.health.flavor.2="Mr. Kane said to give you this package, but the doctor insists that no visitors be admitted". You try to convince her to make an exception for you.
#Test Influence
THE_POLITICIAN.health.pass.flavor=You find that Charlie's health is beyond recovery, but he's still in good spirits and you have a long talk.
THE_POLITICIAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_POLITICIAN.health.pass.info.2=Discard this defeated investigator.
THE_POLITICIAN.health.fail.flavor=Charlie spends the rest of his days cut off from all human contact.
THE_POLITICIAN.health.fail.info=Discard this defeated investigator.

THE_POLITICIAN.sanity.flavor=The first thing Charlie does when you enter the restaurant is hand you all of his belongings.
THE_POLITICIAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_POLITICIAN.sanity.flavor.2=He offers you deals, promising to sell you Atlantis and introduce you to Caesar. You negotiate carefully with him.
#Test Influence
THE_POLITICIAN.sanity.pass.flavor=He tells you all he knows in exchange for your napkin ring and a salt shaker.
THE_POLITICIAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_POLITICIAN.sanity.pass.info.2=Discard this defeated investigator.
THE_POLITICIAN.sanity.fail.flavor=Charlie gets angry and insists that you'll be sorry when he's the President of the world.
THE_POLITICIAN.sanity.fail.info=Discard this defeated investigator.

THE_ENTERTAINER.health.flavor=Marie's belongings are in boxes by her front door.
THE_ENTERTAINER.health.info=[#GOOD]Gain all of her possessions[]
THE_ENTERTAINER.health.flavor.2=Since she received the ugly scar across her throat, she hasn't uttered a word. She just listens to recordings of her songs on her Victrola. You ask her to share what she's learned.
#Test Influence
THE_ENTERTAINER.health.pass.flavor=She absently points to a journal she's been keeping and returns to her songs.
# TODO LATER Improve LORE and gain one Glamour Spell
THE_ENTERTAINER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ENTERTAINER.health.pass.info.2=Discard this defeated investigator.
THE_ENTERTAINER.health.fail.flavor=She never responds and drinks herself to death over the following months.
THE_ENTERTAINER.health.fail.info=Discard this defeated investigator.

THE_ENTERTAINER.sanity.flavor=The police tell you she bled to death in her hotel room after drawing on the walls with a mixture of powders and her own blood. She left a note naming you as her hair.
THE_ENTERTAINER.sanity.info=[#GOOD]Gain all of her possessions[]
THE_ENTERTAINER.sanity.flavor.2=Looking at the photo of what she drew, you think you recognize certain voodoo symbols.
#Test Lore
THE_ENTERTAINER.sanity.pass.flavor=You understand the sigil's protective significance.
THE_ENTERTAINER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ENTERTAINER.sanity.pass.info.2=Discard this defeated investigator.
THE_ENTERTAINER.sanity.fail.flavor=Marie takes the secrets she learned from her grand-mere to the grave.
THE_ENTERTAINER.sanity.fail.info=Discard this defeated investigator.

THE_PSYCHIC.health.flavor=Somehow, Jacqueline knew you would be at this cafe to receive the parcel.
THE_PSYCHIC.health.info=[#GOOD]Gain all of her possessions[]
THE_PSYCHIC.health.flavor.2=Strangely, everyone here encountered her sometime after she was injured. You try to convince everyone to share their story.
#Test Influence
THE_PSYCHIC.health.pass.flavor=You get the whole message Jacqueline hoped to convey.
THE_PSYCHIC.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_PSYCHIC.health.pass.info.2=Discard this defeated investigator.
THE_PSYCHIC.health.fail.flavor=The story is incomplete and makes no sense.
THE_PSYCHIC.health.fail.info=Discard this defeated investigator.

THE_PSYCHIC.sanity.flavor=You visit Jacqueline in the asylum and claim her belongings.
THE_PSYCHIC.sanity.info=[#GOOD]Gain all of her possessions[]
THE_PSYCHIC.sanity.flavor.2=She seems lost in her own world, talking to visions only she sees. You do your best to interpret what she's seeing based on what she says.
#Test Lore
THE_PSYCHIC.sanity.pass.flavor=You have a clear idea of what she's experiencing.
THE_PSYCHIC.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_PSYCHIC.sanity.pass.info.2=Discard this defeated investigator.
THE_PSYCHIC.sanity.fail.flavor=Jacqueline remains trapped in a world only she can see.
THE_PSYCHIC.sanity.fail.info=Discard this defeated investigator.

THE_SHAMAN.health.flavor=By the time you find Akachi, she's slipped into a coma. Doctor's aren't certain if she will recover.
THE_SHAMAN.health.info=[#GOOD]Gain all of her possessions[]
THE_SHAMAN.health.flavor.2=The hospital staff has grown very fond of her, and you try to convince them to tell you what she said to them while she was conscious.
#Test Influence
THE_SHAMAN.health.pass.flavor=You hear many stories.
THE_SHAMAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SHAMAN.health.pass.info.2=Discard this defeated investigator.
THE_SHAMAN.health.fail.flavor=You can't get anyone to share Akachi's story with you.
THE_SHAMAN.health.fail.info=Discard this defeated investigator.

THE_SHAMAN.sanity.flavor=Akachi's mind has left this world and she no longer has interest in material goods.
THE_SHAMAN.sanity.info=[#GOOD]Gain all of her possessions[]
THE_SHAMAN.sanity.flavor.2=An Odinani man gives you a bitter drink to help you reach her. After you drink it, you are assaulted by nightmarish visions, but you force yourself to keep searching for her.
#Test Will
THE_SHAMAN.sanity.pass.flavor=You hear Akachi's voice sharing all she's learned.
THE_SHAMAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SHAMAN.sanity.pass.info.2=Discard this defeated investigator.
THE_SHAMAN.sanity.fail.flavor=You curl up in a corner until the drink wears off.
THE_SHAMAN.sanity.fail.info=Discard this defeated investigator.

THE_MUSICIAN.health.flavor=Seeing Jim in the hospital bed is heartbreaking. He hands you a key to a safety deposit box.
THE_MUSICIAN.health.info=[#GOOD]Gain all of his possessions[]
THE_MUSICIAN.health.flavor.2=The severity of the injuries means that he'll never speak or play music again. You gently try to coax him into writing down everything he's learned.
#Test Influence
THE_MUSICIAN.health.pass.flavor=Jim fills a dozen sheets of paper with arcane illustrations.
THE_MUSICIAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_MUSICIAN.health.pass.info.2=Discard this defeated investigator.
THE_MUSICIAN.health.fail.flavor=All Jim wants is to listen to a record of his own music played over and over.
THE_MUSICIAN.health.fail.info=Discard this defeated investigator.

THE_MUSICIAN.sanity.flavor=At the cemetery gate, you find Jim' old suitcase and hear wild and erratic music ahead.
THE_MUSICIAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_MUSICIAN.sanity.flavor.2=Summoning all your nerve, you walk toward the crowd of dancing cadavers that surround Jim.
#Test Will
THE_MUSICIAN.sanity.pass.flavor=You spend the night learning the secrets of the dead.
THE_MUSICIAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_MUSICIAN.sanity.pass.info.2=Discard this defeated investigator.
THE_MUSICIAN.sanity.fail.flavor=You run, and Jim is never seen by a living soul again.
THE_MUSICIAN.sanity.fail.info=Discard this defeated investigator.

THE_SAILOR.health.flavor=Silas has hidden his belongings in the prearranged cache, but the man himself is nowhere to be found.
THE_SAILOR.health.info=[#GOOD]Gain all of his possessions[]
THE_SAILOR.health.flavor.2=You search local hospitals filled with the unidentified dead or dying.
#Test Observation
THE_SAILOR.health.pass.flavor=You find Silas alive but incapacitated, and you arrange a private nurse to watch over him.
THE_SAILOR.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SAILOR.health.pass.info.2=Discard this defeated investigator.
THE_SAILOR.health.fail.flavor=Silas dies alone and unrecognized.
THE_SAILOR.health.fail.info=Discard this defeated investigator.

THE_SAILOR.sanity.flavor=You find Silas.
THE_SAILOR.sanity.info=[#GOOD]Gain all of his possessions[]
THE_SAILOR.sanity.flavor.2=He has grown pale, and his breath has become a loud wheeze. He tells you, "I'm Marsh. It's in my blood. Not long now, I'll join my family, down in the deep." You ask a doctor to watch him overnight.
#Test Influence
THE_SAILOR.sanity.pass.flavor=The sailor shares all he's learned before dying peacefully in his sleep.
THE_SAILOR.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SAILOR.sanity.pass.info.2=Discard this defeated investigator.
THE_SAILOR.sanity.fail.flavor=Silas surrenders his humanity and disappears into the sea.
THE_SAILOR.sanity.fail.info=Discard this defeated investigator.

THE_MARTIAL_ARTIST.health.flavor=When you reach the hospital, you find Lily's things, but she is not in her bed.
THE_MARTIAL_ARTIST.health.info=[#GOOD]Gain all of her possessions[]
THE_MARTIAL_ARTIST.health.flavor.2=You quickly find that she's been kidnapped by the cultists! You fight to free her.
#Test Strength
THE_MARTIAL_ARTIST.health.pass.flavor=You interrogate the cultists, and Lily is safely returned to the hospital to begin the slow healing process.
THE_MARTIAL_ARTIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_MARTIAL_ARTIST.health.pass.info.2=Discard this defeated investigator.
THE_MARTIAL_ARTIST.health.fail.flavor=Lily disappears into the darkness.
THE_MARTIAL_ARTIST.health.fail.info=Discard this defeated investigator.

THE_MARTIAL_ARTIST.sanity.flavor=You barely recognize the small woman huddled in an alleyway, her few belongings scattered next to her.
THE_MARTIAL_ARTIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_MARTIAL_ARTIST.sanity.flavor.2="It wasn't true," Lily sobs. "I have no destiny. I cannot fight the darkness." You reassure her that she has already done her part and that others will finish the task.
#Test Influence
THE_MARTIAL_ARTIST.sanity.pass.flavor=She chants over you, passing her destiny on to you.
THE_MARTIAL_ARTIST.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_MARTIAL_ARTIST.sanity.pass.info.2=Discard this defeated investigator.
THE_MARTIAL_ARTIST.sanity.fail.flavor=Lilly eventually falls into a catatonic state.
THE_MARTIAL_ARTIST.sanity.fail.info=Discard this defeated investigator.

THE_REDEEMED_CULTIST.health.flavor=In her hospital, Diana tells you to pick up your things and bids you farewell.
THE_REDEEMED_CULTIST.health.info=[#GOOD]Gain all of her possessions[]
THE_REDEEMED_CULTIST.health.flavor.2=You infer that she is being watched. Using your knowledge of the Silver Twilight, you try to determine which doctor can be trusted.
#Test Lore
THE_REDEEMED_CULTIST.health.pass.flavor=You move Diana to a new hospital and she shares her secrets with you.
THE_REDEEMED_CULTIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_REDEEMED_CULTIST.health.pass.info.2=Discard this defeated investigator.
THE_REDEEMED_CULTIST.health.fail.flavor=Diana remains under the Lodge's watchful eye.
THE_REDEEMED_CULTIST.health.fail.info=Discard this defeated investigator.

THE_REDEEMED_CULTIST.sanity.flavor=It's obviously Diana, but she claims to be a woman named Iris who has lived in this city her whole life. In her trash, you find Diana's things.
THE_REDEEMED_CULTIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_REDEEMED_CULTIST.sanity.flavor.2=It's clear that she has disassociated from her former life. You share all of your memories of Diana to restore her identity.
#Test Influence
THE_REDEEMED_CULTIST.sanity.pass.flavor=She tells you of the horrors that brought her to this state.
THE_REDEEMED_CULTIST.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_REDEEMED_CULTIST.sanity.pass.info.2=Discard this defeated investigator.
THE_REDEEMED_CULTIST.sanity.fail.flavor=Diana sternly asks you to leave her alone.
THE_REDEEMED_CULTIST.sanity.fail.info=Discard this defeated investigator.

THE_BOUNTY_HUNTER.health.flavor=Whatever hit Tony hit him hard. His doctors aren't sure if he'll ever awaken from the coma. As the closest thing he has to family, you're placed in charge of his belongings.
THE_BOUNTY_HUNTER.health.info=[#GOOD]Gain all of his possessions[]
THE_BOUNTY_HUNTER.health.flavor.2=You pour over his notes and receipts, looking for what he'd been hunting.
#Test Observation
THE_BOUNTY_HUNTER.health.pass.flavor=You discern a pattern to the work he'd been doing.
THE_BOUNTY_HUNTER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOUNTY_HUNTER.health.pass.info.2=Discard this defeated investigator.
THE_BOUNTY_HUNTER.health.fail.flavor=You see a series of jobs for money and nothing more.
THE_BOUNTY_HUNTER.health.fail.info=Discard this defeated investigator.

THE_BOUNTY_HUNTER.sanity.flavor=You find Tony in an abandoned building surrounded by bone chips, clumps of hair, and other grisly souvenirs. He doesn't seem to care about any of his other belongings any more.
THE_BOUNTY_HUNTER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_BOUNTY_HUNTER.sanity.flavor.2=He's beyond all reason. All he wants to do is sell you some of his "trophies".
#Test Influence
THE_BOUNTY_HUNTER.sanity.pass.flavor=He tells you the story behind each purchase.
THE_BOUNTY_HUNTER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOUNTY_HUNTER.sanity.pass.info.2=Discard this defeated investigator.
THE_BOUNTY_HUNTER.sanity.fail.flavor=He yells at you, warning you never to return or he'll put your hide up for sale.
THE_BOUNTY_HUNTER.sanity.fail.info=Discard this defeated investigator.

THE_EX_CONVICT.health.flavor=Skids' lawyer turns over all of his belongings to you.
THE_EX_CONVICT.health.info=[#GOOD]Gain all of his possessions[]
THE_EX_CONVICT.health.flavor.2=He tells you that Skids is hurt very badly. He's being tried for murder. You do what you can to convince the court of his innocence.
#Test Influence
THE_EX_CONVICT.health.pass.flavor=Skids is declared not gulity, and he shares everything he knows before retiring to a quiet life.
THE_EX_CONVICT.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_EX_CONVICT.health.pass.info.2=Discard this defeated investigator.
THE_EX_CONVICT.health.fail.flavor=Skids gets a life sentence with no hope for parole. You later hear that Skids was killed in a prison fight.
THE_EX_CONVICT.health.fail.info=Discard this defeated investigator.

THE_EX_CONVICT.sanity.flavor=After a long crime spree, Skids has agreed to surrender himself to you. As a show of good faith, he gives you everything he has.
THE_EX_CONVICT.sanity.info=[#GOOD]Gain all of his possessions[]
THE_EX_CONVICT.sanity.flavor.2=When you see him, you can tell Skids you once knew is gone, and that this was a trap. He attacks, hoping to take your valuables.
#Test Strength
#TODO LATER improve influence and gain 1 Relic Unique Asset
THE_EX_CONVICT.sanity.pass.flavor=You overpower him and find the treasure Skids had stolen.
THE_EX_CONVICT.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_EX_CONVICT.sanity.pass.info.2=Discard this defeated investigator.
THE_EX_CONVICT.sanity.fail.flavor=The police intervene and Skids is killed trying to escape.
THE_EX_CONVICT.sanity.fail.info=Discard this defeated investigator.

THE_EXPEDITION_LEADER.health.flavor="It's all in the drawer," Leo tells you. "Take it and leave me here to die. I deserve it."
THE_EXPEDITION_LEADER.health.info=[#GOOD]Gain all of his possessions[]
THE_EXPEDITION_LEADER.health.flavor.2=Leo's injuries have left him bedridden and in agony in this hotel. Worse, he's lost his will to live. You try to convince him that he hasn't failed his friends.
#Test Influence
THE_EXPEDITION_LEADER.health.pass.flavor=He draws you several maps and promises to let you check him into a hospital.
THE_EXPEDITION_LEADER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_EXPEDITION_LEADER.health.pass.info.2=Discard this defeated investigator.
THE_EXPEDITION_LEADER.health.fail.flavor=He never speaks to you again.
THE_EXPEDITION_LEADER.health.fail.info=Discard this defeated investigator.

THE_EXPEDITION_LEADER.sanity.flavor=You find Leo's canvas bag in his hotel room.
THE_EXPEDITION_LEADER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_EXPEDITION_LEADER.sanity.flavor.2=While you are distracted, Leo attacks you. His face is covered in tribal markings, and he speaks a hodgepodge of tribal dialects. You try to subdue him.
#Test Strength
THE_EXPEDITION_LEADER.sanity.pass.flavor=You get Leo to an asylum, and the doctors learn some of what happened to him.
THE_EXPEDITION_LEADER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_EXPEDITION_LEADER.sanity.pass.info.2=Discard this defeated investigator.
THE_EXPEDITION_LEADER.sanity.fail.flavor=Leo is gone when you regain consciousness.
THE_EXPEDITION_LEADER.sanity.fail.info=Discard this defeated investigator.

THE_ACTRESS.health.flavor="I'm fine, darling. Help yourself, by the way." Lola nods at the equipment strewn across the hotel room.
THE_ACTRESS.health.info=[#GOOD]Gain all of her possessions[]
THE_ACTRESS.health.flavor.2=As convincing as she is, you know she's in pain. You try to persuade her to visit a hospital.
#Test Influence
THE_ACTRESS.health.pass.flavor=She sighs a breath of relief and tells you of all the horrors she's encountered.
THE_ACTRESS.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ACTRESS.health.pass.info.2=Discard this defeated investigator.
THE_ACTRESS.health.fail.flavor=The day after Lola leaves the city, she succumbs to her wounds.
THE_ACTRESS.health.fail.info=Discard this defeated investigator.

THE_ACTRESS.sanity.flavor=The trail of Lola's belongings lead you into a derelict theater.
THE_ACTRESS.sanity.info=[#GOOD]Gain all of her possessions[]
THE_ACTRESS.sanity.flavor.2=She's on the stage wringing her blood-soaked hads and reciting, "Will these hands ne'er be clean?" You try to direct her performance, hoping to better reveal her character. 
#Test Influence
THE_ACTRESS.sanity.pass.flavor=She tells you of the Tattered King, indicating a goat she's killed.
THE_ACTRESS.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ACTRESS.sanity.pass.info.2=Discard this defeated investigator.
THE_ACTRESS.sanity.fail.flavor=Lola's dialogue degenerates into gibberish.
THE_ACTRESS.sanity.fail.info=Discard this defeated investigator.

THE_ROOKIE_COP.health.flavor=Tommy's equipment is in his hotel, but no one has seen him for days.
THE_ROOKIE_COP.health.info=[#GOOD]Gain all of his possessions[]
THE_ROOKIE_COP.health.flavor.2=You try to pick up the threads of his investigation.
#Test Observation
THE_ROOKIE_COP.health.pass.flavor=You find Tommy tied up in a warehouse, beaten to within an inch of his life, and you get him back to his family in Boston to care for him.
THE_ROOKIE_COP.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ROOKIE_COP.health.pass.info.2=Discard this defeated investigator.
THE_ROOKIE_COP.health.fail.flavor=Muldoon never turns up.
THE_ROOKIE_COP.health.fail.info=Discard this defeated investigator.

THE_ROOKIE_COP.sanity.flavor=Tommy tells you he's fine, but his tremors tell you a different story. He offers you his investigation notes.
THE_ROOKIE_COP.sanity.info.1=[#BAD]Discard all of his possessions[]
THE_ROOKIE_COP.sanity.info.2=[#GOOD]Retreat Doom[]
THE_ROOKIE_COP.sanity.flavor.2=You try to convince him that he has to give up the investigation.
#Test Influence
THE_ROOKIE_COP.sanity.pass.flavor=He accepts the truth and turns his beloved Becky over to you.
THE_ROOKIE_COP.sanity.pass.info.1=[#GOOD]Gain Carbine Rifle[]
THE_ROOKIE_COP.sanity.pass.info.2=Discard this defeated investigator.
THE_ROOKIE_COP.sanity.fail.flavor=He won't stop investigating, and his body is found a few days later.
THE_ROOKIE_COP.sanity.fail.info=Discard this defeated investigator.

THE_VIOLINIST.health.flavor=Tragically, the incident cracked her skull, scarred her face, and left her completely deaf. The doctors place you in charge of her belongings.
THE_VIOLINIST.health.info=[#GOOD]Gain all of her possessions[]
THE_VIOLINIST.health.flavor.2=She's only awake for short periods of time. You try to keep her attention and learn what she knows.
#Test Influence
THE_VIOLINIST.health.pass.flavor=She communicates the message being sent to her through her music.
THE_VIOLINIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_VIOLINIST.health.pass.info.2=Discard this defeated investigator.
THE_VIOLINIST.health.fail.flavor=She drifts off to sleep again.
THE_VIOLINIST.health.fail.info=Discard this defeated investigator.

THE_VIOLINIST.sanity.flavor=Patrice doesn't speak. She just plays the violin. You can take what you like without objections.
THE_VIOLINIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_VIOLINIST.sanity.flavor.2=The music she plays is so discordant and unnerving, it's hard to endure.
#Test Will
THE_VIOLINIST.sanity.pass.flavor=The sounds eventually open a part of your mind that you've never experienced before, connecting you to dimensional energies.
THE_VIOLINIST.sanity.pass.info.1=[#GOOD]Close one Gate[]
THE_VIOLINIST.sanity.pass.info.2=Discard this defeated investigator.
THE_VIOLINIST.sanity.fail.flavor=The sounds devolve into sharp, uneven noises, and then to silence.
THE_VIOLINIST.sanity.fail.info=Discard this defeated investigator.

THE_BOOTLEGGER.health.flavor=Out of the blue, Finn sends you everything he owns.
THE_BOOTLEGGER.health.info=[#GOOD]Gain all of his possessions[]
THE_BOOTLEGGER.health.flavor.2=You've never known him to give anything away. Something must be wrong. When you search for him, most people tell you he died in a fire. Learning more requires some persuasion.
#Test Influence
THE_BOOTLEGGER.health.pass.flavor=You find him alive but burned beyond recovery, and he tells you he cannot complete the job he was hired for.
# TODO LATER gain one task unique asset
THE_BOOTLEGGER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOOTLEGGER.health.pass.info.2=Discard this defeated investigator.
THE_BOOTLEGGER.health.fail.flavor=You never find him.
THE_BOOTLEGGER.health.fail.info=Discard this defeated investigator.

THE_BOOTLEGGER.sanity.flavor=You don't know how, but Finn managed to sneak his belongings into your room.
THE_BOOTLEGGER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_BOOTLEGGER.sanity.flavor.2=Finn's intense paranoia keeps him apart from all human contact, but occasionally, you catch a glimpse of something that reminds you of him.
#Test Observation
THE_BOOTLEGGER.sanity.pass.flavor=You find a final message from him, telling you all he's learned from the shadows.
THE_BOOTLEGGER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOOTLEGGER.sanity.pass.info.2=Discard this defeated investigator.
THE_BOOTLEGGER.sanity.fail.flavor=No trace of Finn is ever seen again.
THE_BOOTLEGGER.sanity.fail.info=Discard this defeated investigator.

THE_HANDYMAN.health.flavor=The abandoned house is where Wilson was supposed to be. You see his belongings, but no sign of the man.
THE_HANDYMAN.health.info=[#GOOD]Gain all of his possessions[]
THE_HANDYMAN.health.flavor.2=About to give up, you hear a faint scraping coming from the walls. You tear down the plaster and lath as quickly as you can.
#Test Strength
THE_HANDYMAN.health.pass.flavor=You pull him out, barely alive, and he tells you what he's discovered.
THE_HANDYMAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_HANDYMAN.health.pass.info.2=Discard this defeated investigator.
THE_HANDYMAN.health.fail.flavor=You don't get him out in time, and he takes his secret with him to the grave.
THE_HANDYMAN.health.fail.info=Discard this defeated investigator.

THE_HANDYMAN.sanity.flavor=When you find Wilson, he's surrounded by countless shards of glass and loose stones he's arranged in some way that is only meaningful to him.
THE_HANDYMAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_HANDYMAN.sanity.flavor.2=As you watch, he moves the debris around in obscure patterns. You spend a few hours trying to speak with him.
#Test Influence
THE_HANDYMAN.sanity.pass.flavor=You understand the message he's struggling to communicate.
THE_HANDYMAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_HANDYMAN.sanity.pass.info.2=Discard this defeated investigator.
THE_HANDYMAN.sanity.fail.flavor=He never speaks another sane word.
THE_HANDYMAN.sanity.fail.info=Discard this defeated investigator.

THE_WAITRESS.health.flavor=After weeks of fruitless searching, Agnes suddenly find you. She's carrying everything she owns in bags.
THE_WAITRESS.health.info=[#GOOD]Gain all of her possessions[]
THE_WAITRESS.health.flavor.2=Her head is badly wounded, and she fades in and out of coherence. You try to persuade her to go to a doctor.
#Test Influence
THE_WAITRESS.health.pass.flavor=She understands how badly she's been hurt, and with what little focus she can manage, she shares the wisdom of two lifetimes.
THE_WAITRESS.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_WAITRESS.health.pass.info.2=Discard this defeated investigator.
THE_WAITRESS.health.fail.flavor=She leaves never to be seen again.
THE_WAITRESS.health.fail.info=Discard this defeated investigator.

THE_WAITRESS.sanity.flavor=You find Agnes in a dark alley, surrounded by the remains of her belongings.
THE_WAITRESS.sanity.info=[#GOOD]Gain all of her possessions[]
THE_WAITRESS.sanity.flavor.2=She doesn't recognize you or her own name. She speaks to you in a long-dead language.
#Test Lore
THE_WAITRESS.sanity.pass.flavor=You realize she's trying to share her arcane knowledge.
THE_WAITRESS.sanity.pass.info.1=[#GOOD]Gain two Spells[]
THE_WAITRESS.sanity.pass.info.2=Discard this defeated investigator.
THE_WAITRESS.sanity.fail.flavor=She sees you don't understand and speaks one final enchantment before disappearing from the face of the Earth.
THE_WAITRESS.sanity.fail.info=Discard this defeated investigator.