THE_SPY.health.flavor=Trish's burgundy hat rests on a parcel of her equipment beside the ward desk. A note asks you to continue tracing the erased freight routes.
THE_SPY.health.info=[#GOOD]Gain all of her possessions[]
THE_SPY.health.flavor.2=An insurance clerk has impounded her carbon copies. You explain that releasing them could save the people living along the next shipment's route.
#Test Influence
THE_SPY.health.pass.flavor=The clerk releases the copies. Trish identifies the next consignment from her bed, giving you time to obstruct its journey before she withdraws from the work.
THE_SPY.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SPY.health.pass.info.2=Discard this defeated investigator.
THE_SPY.health.fail.flavor=The clerk seals the file. Trish is transferred to long-term care before you can recover the route, and her investigation ends here.
THE_SPY.health.fail.info=Discard this defeated investigator.

THE_SPY.sanity.flavor=Trish has surrendered her travel case to the station attendant. She sits beneath the departure board, unable to separate ordinary announcements from the warnings she used to send.
THE_SPY.sanity.info=[#GOOD]Gain all of her possessions[]
THE_SPY.sanity.flavor.2=Her telegram slips repeat the same damaged letters. You compare the marks, looking for the deliberate errors she used to hide a message.
#Test Observation
THE_SPY.sanity.pass.flavor=The misplaced letters spell out a freight depot and a departure time. You send a warning ahead; Trish leaves with an attendant, her traveling days over.
THE_SPY.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SPY.sanity.pass.info.2=Discard this defeated investigator.
THE_SPY.sanity.fail.flavor=Every apparent pattern breaks on the next slip. Her attendant gathers the papers and takes her away before you can extract a warning.
THE_SPY.sanity.fail.info=Discard this defeated investigator.

THE_SOLDIER.health.flavor=Mark's recovery kit waits beneath his old field jacket. A collapsed storehouse has left him unable to walk, but he insists that you take his remaining supplies.
THE_SOLDIER.health.info=[#GOOD]Gain all of his possessions[]
THE_SOLDIER.health.flavor.2=A fallen loading beam pins the cabinet containing his list of threatened veterans. You brace yourself and try to lift it clear.
#Test Strength
THE_SOLDIER.health.pass.flavor=You wrench the cabinet free. Mark names the next veteran whose tag has begun to warm, allowing a warning to reach him while Mark enters permanent care.
THE_SOLDIER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SOLDIER.health.pass.info.2=Discard this defeated investigator.
THE_SOLDIER.health.fail.flavor=The beam will not shift before the damaged floor gives way. The list is buried, and Mark is carried away without the means to continue his search.
THE_SOLDIER.health.fail.info=Discard this defeated investigator.

THE_SOLDIER.sanity.flavor=Mark has packed his equipment for you with military precision. He remains beside a row of empty chairs, calling roll for men who cannot answer.
THE_SOLDIER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_SOLDIER.sanity.flavor.2=He believes each spoken name summons another disappearance. You ask him to trust the warning network he built and tell you which names remain in danger.
#Test Influence
THE_SOLDIER.sanity.pass.flavor=He whispers the next names into your ear. You pass them to his contacts before he leaves the investigation in their hands.
THE_SOLDIER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SOLDIER.sanity.pass.info.2=Discard this defeated investigator.
THE_SOLDIER.sanity.fail.flavor=He folds the roster shut and will say no more. His old comrades take him home, leaving the next disappearance impossible to predict.
THE_SOLDIER.sanity.fail.info=Discard this defeated investigator.

THE_ASTRONOMER.health.flavor=Norman's waistcoat hangs beside his sickbed, its watch pocket empty. He gives you his equipment and the unfinished atlas of coastlines photographed inside sealed instruments.
THE_ASTRONOMER.health.info=[#GOOD]Gain all of his possessions[]
THE_ASTRONOMER.health.flavor.2=He asks you to count the gaps between the ward clock's ticks while he compares two plates. The missing seconds bring a pressure behind your eyes that you must endure.
#Test Will
THE_ASTRONOMER.health.pass.flavor=You keep the count steady. Norman identifies when the next theft of time will occur, enough warning to interrupt it; he then entrusts the observatory to others.
THE_ASTRONOMER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ASTRONOMER.health.pass.info.2=Discard this defeated investigator.
THE_ASTRONOMER.health.fail.flavor=You lose the count as the room seems to tilt. The plates no longer align, and Norman retires without locating the next interruption.
THE_ASTRONOMER.health.fail.info=Discard this defeated investigator.

THE_ASTRONOMER.sanity.flavor=The observatory porter releases Norman's belongings to you. The astronomer sits surrounded by stopped clocks, insisting that morning has already happened several times.
THE_ASTRONOMER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_ASTRONOMER.sanity.flavor.2=You ask him to describe one familiar stretch of coastline, hoping a concrete detail will draw him out of the repeating hours.
#Test Influence
THE_ASTRONOMER.sanity.pass.flavor=He fixes on a headland and gives you the hour at which it will appear. You can prepare for the breach while his colleagues take over his care.
THE_ASTRONOMER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ASTRONOMER.sanity.pass.info.2=Discard this defeated investigator.
THE_ASTRONOMER.sanity.fail.flavor=He begins the same sentence at every silent chime. His colleagues close the observatory, and no usable prediction emerges.
THE_ASTRONOMER.sanity.fail.info=Discard this defeated investigator.

THE_POLITICIAN.health.flavor=Charlie's staff have packed his belongings beneath the municipal office's dark windows. His injuries have forced him out of office, but one demolition order remains unsigned.
THE_POLITICIAN.health.info=[#GOOD]Gain all of his possessions[]
THE_POLITICIAN.health.flavor.2=The acting administrator refuses to disturb him. You argue that the vanished district's records must be secured before his authority expires.
#Test Influence
THE_POLITICIAN.health.pass.flavor=Granted a brief visit, you obtain the order freezing demolition. The district's hidden machinery must wait, and Charlie hands his duties to his staff.
THE_POLITICIAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_POLITICIAN.health.pass.info.2=Discard this defeated investigator.
THE_POLITICIAN.health.fail.flavor=The administrator takes away the unsigned order. Charlie leaves public life before you can preserve the district's last opportunity for intervention.
THE_POLITICIAN.health.fail.info=Discard this defeated investigator.

THE_POLITICIAN.sanity.flavor=Charlie gives you his belongings from behind a desk covered in place cards. He keeps appointments with the missing residents as though they were still arriving.
THE_POLITICIAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_POLITICIAN.sanity.flavor.2=You take a seat and ask him to explain the empty district's budget as if you were a new member of his committee.
#Test Influence
THE_POLITICIAN.sanity.pass.flavor=He follows the figures to a payment due that evening. His staff can block it and slow the work beneath the district; Charlie lets them close his office.
THE_POLITICIAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_POLITICIAN.sanity.pass.info.2=Discard this defeated investigator.
THE_POLITICIAN.sanity.fail.flavor=He calls for a vote from the empty chairs. His staff escort him home, and the accounts remain unintelligible.
THE_POLITICIAN.sanity.fail.info=Discard this defeated investigator.

THE_ENTERTAINER.health.flavor=Marie's stage clothes and equipment have been boxed for you. A chest injury has ended her engagements, and she listens to her concert recording with the sound turned low.
THE_ENTERTAINER.health.info=[#GOOD]Gain all of her possessions[]
THE_ENTERTAINER.health.flavor.2=She keeps stopping before the voice beneath the chorus begins. You gently ask her to mark the addresses she heard, without playing the recording again.
#Test Influence
THE_ENTERTAINER.health.pass.flavor=She writes a short list on the back of a concert bill. You can warn the next audience before it gathers; Marie closes her songbook and rests.
# TODO LATER Improve LORE and gain one Glamour Spell
THE_ENTERTAINER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ENTERTAINER.health.pass.info.2=Discard this defeated investigator.
THE_ENTERTAINER.health.fail.flavor=She slides the record back into its sleeve without marking an address. Her tour is canceled, and its hidden itinerary remains unknown.
THE_ENTERTAINER.health.fail.info=Discard this defeated investigator.

THE_ENTERTAINER.sanity.flavor=A theater attendant gives you Marie's belongings. She has covered the rehearsal room with scraps of the verse her audience sang, but cannot distinguish her own voice from the other one.
THE_ENTERTAINER.sanity.info=[#GOOD]Gain all of her possessions[]
THE_ENTERTAINER.sanity.flavor.2=The lines describe distances in an unfamiliar ritual measure. You try to interpret the directions before the scraps are cleared away.
#Test Lore
THE_ENTERTAINER.sanity.pass.flavor=The verse describes how to break the listeners' gathering circle. You record the counter-ritual while the attendant leads Marie to a quiet room.
THE_ENTERTAINER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ENTERTAINER.sanity.pass.info.2=Discard this defeated investigator.
THE_ENTERTAINER.sanity.fail.flavor=The measures never resolve into a usable route. The room is cleared for her care, taking the last coherent version of the verse with it.
THE_ENTERTAINER.sanity.fail.info=Discard this defeated investigator.

THE_PSYCHIC.health.flavor=Jacqueline's violet shawl lies across the cabinet of unclaimed objects she has left you. Her injuries prevent her from making any more visits to their owners.
THE_PSYCHIC.health.info=[#GOOD]Gain all of her possessions[]
THE_PSYCHIC.health.flavor.2=Several travelers have come to collect their belongings. You ask them to describe where they were going when she warned them about the final room.
#Test Influence
THE_PSYCHIC.health.pass.flavor=Their separate journeys converge on one address. You send word before its door can claim another traveler, while Jacqueline gives up her search to recover.
THE_PSYCHIC.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_PSYCHIC.health.pass.info.2=Discard this defeated investigator.
THE_PSYCHIC.health.fail.flavor=The travelers refuse to discuss their destinations. They depart separately, and Jacqueline is no longer able to follow the connection herself.
THE_PSYCHIC.health.fail.info=Discard this defeated investigator.

THE_PSYCHIC.sanity.flavor=Jacqueline has placed her equipment outside the room where she now sits. Every object she touches seems to bring her back to the same unseen doorway.
THE_PSYCHIC.sanity.info=[#GOOD]Gain all of her possessions[]
THE_PSYCHIC.sanity.flavor.2=She describes the door's carvings in fragments between long silences. You compare them with protective symbols you know.
#Test Lore
THE_PSYCHIC.sanity.pass.flavor=You recognize the pattern that keeps the door anchored here and how to weaken it. Her family takes her somewhere quiet while you carry the warning onward.
THE_PSYCHIC.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_PSYCHIC.sanity.pass.info.2=Discard this defeated investigator.
THE_PSYCHIC.sanity.fail.flavor=The carvings could belong to any of a dozen rites. Her family ends the visit, and the doorway remains beyond your understanding.
THE_PSYCHIC.sanity.fail.info=Discard this defeated investigator.

THE_SHAMAN.health.flavor=Akachi's blue headwrap rests beside her bed; her staff and traveling things have been entrusted to you. She was injured investigating a well that began calling several names at once.
THE_SHAMAN.health.info=[#GOOD]Gain all of her possessions[]
THE_SHAMAN.health.flavor.2=The families she helped have each heard part of the dispute beneath the water. You ask them to set aside their differences long enough to recount it together.
#Test Influence
THE_SHAMAN.health.pass.flavor=Their accounts reveal which spring must be opened to quiet the older quarrel. They prepare to act while Akachi remains in their care.
THE_SHAMAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SHAMAN.health.pass.info.2=Discard this defeated investigator.
THE_SHAMAN.health.fail.flavor=Old grievances drown out the accounts. Akachi's neighbors carry her home, and the quarrel under the wells continues without a mediator.
THE_SHAMAN.health.fail.info=Discard this defeated investigator.

THE_SHAMAN.sanity.flavor=Akachi has left her possessions at the dry spring. She sits nearby, listening so intently to the voices below that she no longer responds to ordinary conversation.
THE_SHAMAN.sanity.info=[#GOOD]Gain all of her possessions[]
THE_SHAMAN.sanity.flavor.2=You lower your head over the stones and hold your own thoughts steady against the overlapping demands, trying to hear the agreement she sought.
#Test Will
THE_SHAMAN.sanity.pass.flavor=You endure long enough to hear the terms of a truce. The families can postpone the threatened reckoning, and they lead Akachi away from the spring.
THE_SHAMAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SHAMAN.sanity.pass.info.2=Discard this defeated investigator.
THE_SHAMAN.sanity.fail.flavor=The voices become indistinguishable. You step back, and Akachi's companions take her home before either of you can recover the proposed truce.
THE_SHAMAN.sanity.fail.info=Discard this defeated investigator.

THE_MUSICIAN.health.flavor=Jim's turquoise suit hangs over the chair beside his bed. He gives you his traveling equipment; his hands are too badly injured to repair or play an instrument.
THE_MUSICIAN.health.info=[#GOOD]Gain all of his possessions[]
THE_MUSICIAN.health.flavor.2=The names on his concert bills are incomplete. You ask him to recall which listeners remembered the same missing person.
#Test Influence
THE_MUSICIAN.health.pass.flavor=He dictates the links between several names, exposing a disappearance planned for tonight. You send a warning as Jim entrusts his remaining work to you.
THE_MUSICIAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_MUSICIAN.health.pass.info.2=Discard this defeated investigator.
THE_MUSICIAN.health.fail.flavor=He cannot bring the faces back to mind. His family packs away the concert bills, and his search ends without another name to follow.
THE_MUSICIAN.health.fail.info=Discard this defeated investigator.

THE_MUSICIAN.sanity.flavor=Jim's equipment waits in its cases at a shuttered dance hall. He sits inside humming the note from the flooded-cellar trumpet, overwhelmed by memories that belong to his listeners.
THE_MUSICIAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_MUSICIAN.sanity.flavor.2=Each repetition brings the sensation that someone close to you has vanished. You hold your ground long enough to hear the names between the notes.
#Test Will
THE_MUSICIAN.sanity.pass.flavor=You remember a name being erased from the next concert bill and can warn its owner. Jim falls quiet, leaving the search in your hands.
THE_MUSICIAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_MUSICIAN.sanity.pass.info.2=Discard this defeated investigator.
THE_MUSICIAN.sanity.fail.flavor=You retreat before the next name takes shape. When his friends arrive to care for him, the humming has stopped and the lead is gone.
THE_MUSICIAN.sanity.fail.info=Discard this defeated investigator.

THE_SAILOR.health.flavor=Silas has left you his sea bag and salvage gear. A lifeboat crushed him against the quay, and the harbor infirmary lists its patients only by berth number.
THE_SAILOR.health.info=[#GOOD]Gain all of his possessions[]
THE_SAILOR.health.flavor.2=You check the admissions ledger against the arrival times of boats carrying duplicate crew lists, searching for his entry.
#Test Observation
THE_SAILOR.health.pass.flavor=You locate his berth. He points out the next ship named by the lifeboats, giving its crew time to change course while he remains ashore for care.
THE_SAILOR.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_SAILOR.health.pass.info.2=Discard this defeated investigator.
THE_SAILOR.health.fail.flavor=The records cannot distinguish him from the other unidentified arrivals. His trail ends in the crowded wards, and the next crew sails unwarned.
THE_SAILOR.health.fail.info=Discard this defeated investigator.

THE_SAILOR.sanity.flavor=Silas puts his sea bag into your hands and sits facing inland. He insists that every ship in the harbor is already listed among the dead.
THE_SAILOR.sanity.info=[#GOOD]Gain all of his possessions[]
THE_SAILOR.sanity.flavor.2=You ask him to remember the crew he brought home by changing course, and to help one more captain do the same.
#Test Influence
THE_SAILOR.sanity.pass.flavor=He dictates a safe heading and the vessel that needs it. You relay the warning before his friends take him away from the waterfront.
THE_SAILOR.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_SAILOR.sanity.pass.info.2=Discard this defeated investigator.
THE_SAILOR.sanity.fail.flavor=He refuses to name another ship. His friends bring him inland, and the harbor's next scheduled loss remains a secret.
THE_SAILOR.sanity.fail.info=Discard this defeated investigator.

THE_MARTIAL_ARTIST.health.flavor=Lily has left her training clothes and equipment in your care. Injured at a warehouse where altered dockworkers were being moved, she waits on the far side of a jammed shutter.
THE_MARTIAL_ARTIST.health.info=[#GOOD]Gain all of her possessions[]
THE_MARTIAL_ARTIST.health.flavor.2=The shutter's counterweight has broken. You try to raise it long enough to bring Lily and her written observations out.
#Test Strength
THE_MARTIAL_ARTIST.health.pass.flavor=You lift the shutter and carry her clear. Her notes identify the next shipment of altered workers, allowing it to be interrupted while she recovers.
THE_MARTIAL_ARTIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_MARTIAL_ARTIST.health.pass.info.2=Discard this defeated investigator.
THE_MARTIAL_ARTIST.health.fail.flavor=The shutter holds until the warehouse guards return. You must leave; Lily is moved out of reach, along with the shipment's destination.
THE_MARTIAL_ARTIST.health.fail.info=Discard this defeated investigator.

THE_MARTIAL_ARTIST.sanity.flavor=Lily has folded her red practice jacket over her belongings for you. She watches every passerby's shadow, unable to trust even movements she once knew by heart.
THE_MARTIAL_ARTIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_MARTIAL_ARTIST.sanity.flavor.2=You ask her to guide you through one familiar exercise, using the rhythm of her old lessons to make conversation possible.
#Test Influence
THE_MARTIAL_ARTIST.sanity.pass.flavor=The familiar lesson lets her explain which delayed movement betrays the next impostor. You carry the warning to the docks while her students take her home.
THE_MARTIAL_ARTIST.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_MARTIAL_ARTIST.sanity.pass.info.2=Discard this defeated investigator.
THE_MARTIAL_ARTIST.sanity.fail.flavor=She stops at the first movement, certain your shadow followed too late. Her students end the lesson, and you leave without the warning.
THE_MARTIAL_ARTIST.sanity.fail.info=Discard this defeated investigator.

THE_REDEEMED_CULTIST.health.flavor=Diana hands over her belongings in a small recovery room, her burial-society ledger still tied shut. She was injured sealing one of the reserved graves.
THE_REDEEMED_CULTIST.health.info=[#GOOD]Gain all of her possessions[]
THE_REDEEMED_CULTIST.health.flavor.2=A trustee has left instructions disguised as a funerary prayer. You study its ritual clauses to find which storehouse holds the next arrival.
#Test Lore
THE_REDEEMED_CULTIST.health.pass.flavor=You identify the storehouse and the rite that must be interrupted. Diana surrenders her last keys and leaves the society's pursuit to you.
THE_REDEEMED_CULTIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_REDEEMED_CULTIST.health.pass.info.2=Discard this defeated investigator.
THE_REDEEMED_CULTIST.health.fail.flavor=The clauses conceal their meaning too well. Diana is moved into hiding, and the next arrival remains beyond your reach.
THE_REDEEMED_CULTIST.health.fail.info=Discard this defeated investigator.

THE_REDEEMED_CULTIST.sanity.flavor=Diana has abandoned her belongings beside an empty account book. She insists the society never existed, then checks the door whenever a carriage passes.
THE_REDEEMED_CULTIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_REDEEMED_CULTIST.sanity.flavor.2=You recall a former member she helped escape, asking her to explain how she made that person's reserved grave unusable.
#Test Influence
THE_REDEEMED_CULTIST.sanity.pass.flavor=She describes the false burial entry that halted an arrival. You can repeat the obstruction elsewhere while her friends take her into care.
THE_REDEEMED_CULTIST.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_REDEEMED_CULTIST.sanity.pass.info.2=Discard this defeated investigator.
THE_REDEEMED_CULTIST.sanity.fail.flavor=She denies recognizing the name and closes the book. Her friends end the visit, leaving the society's accounts unbroken.
THE_REDEEMED_CULTIST.sanity.fail.info=Discard this defeated investigator.

THE_BOUNTY_HUNTER.health.flavor=Tony's long coat and field equipment are delivered to you from a railway camp. He was badly injured getting another worker out, and cannot return to the trail.
THE_BOUNTY_HUNTER.health.info=[#GOOD]Gain all of his possessions[]
THE_BOUNTY_HUNTER.health.flavor.2=His receipts are pinned to a bundle of survey maps. You compare dates and mileages to work out where the recruiters are heading.
#Test Observation
THE_BOUNTY_HUNTER.health.pass.flavor=The expenses reveal a camp omitted from the maps. A warning can reach its workers before the recruiters do, while Tony remains in medical care.
THE_BOUNTY_HUNTER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOUNTY_HUNTER.health.pass.info.2=Discard this defeated investigator.
THE_BOUNTY_HUNTER.health.fail.flavor=The receipts contradict the maps at every junction. Tony's contacts disperse before you can identify the next camp, and his pursuit ends.
THE_BOUNTY_HUNTER.health.fail.info=Discard this defeated investigator.

THE_BOUNTY_HUNTER.sanity.flavor=Tony has placed his belongings outside a rented office. Inside, he repeatedly takes statements from empty chairs, unable to tell rescued workers from those still missing.
THE_BOUNTY_HUNTER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_BOUNTY_HUNTER.sanity.flavor.2=You sit in one chair and ask him to explain why the railway company wanted the surveyor's maps more than the man himself.
#Test Influence
THE_BOUNTY_HUNTER.sanity.pass.flavor=He names the route that must remain unfinished. You pass it to the workers organizing against the company; Tony lets a trusted friend close the office.
THE_BOUNTY_HUNTER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOUNTY_HUNTER.sanity.pass.info.2=Discard this defeated investigator.
THE_BOUNTY_HUNTER.sanity.fail.flavor=He begins the interview again without answering. His friend takes him away, and the company's next route stays hidden.
THE_BOUNTY_HUNTER.sanity.fail.info=Discard this defeated investigator.

THE_EX_CONVICT.health.flavor=Skids' travel bag and handmade tools have been released to you. A collapsing doorway injured him while he was tracing the street that once opened behind the prison wall.
THE_EX_CONVICT.health.info=[#GOOD]Gain all of his possessions[]
THE_EX_CONVICT.health.flavor.2=The ward supervisor thinks his account is a fever story. You ask for a brief conversation before he is moved to a distant convalescent home.
#Test Influence
THE_EX_CONVICT.health.pass.flavor=Allowed inside, you learn which bell shuts the hidden street. You can keep the passage closed during its next use; Skids leaves its watch to you.
THE_EX_CONVICT.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_EX_CONVICT.health.pass.info.2=Discard this defeated investigator.
THE_EX_CONVICT.health.fail.flavor=The supervisor refuses the visit. Skids is transferred with the crucial bell still unidentified, and his work on the passage ends.
THE_EX_CONVICT.health.fail.info=Discard this defeated investigator.

THE_EX_CONVICT.sanity.flavor=Skids has given you his belongings, but remains at a boarded doorway with both hands on the frame. He hears the prison count through every wall.
THE_EX_CONVICT.sanity.info=[#GOOD]Gain all of his possessions[]
THE_EX_CONVICT.sanity.flavor.2=He tries to force his way into the collapsing passage. You grapple with him to pull him clear before the bell sounds.
#Test Strength
#TODO LATER improve influence and gain 1 Relic Unique Asset
THE_EX_CONVICT.sanity.pass.flavor=You draw him back and see the mechanism that keeps the passage open. Its weakness gives you a way to delay another opening while his friends take him to safety.
THE_EX_CONVICT.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_EX_CONVICT.sanity.pass.info.2=Discard this defeated investigator.
THE_EX_CONVICT.sanity.fail.flavor=He tears away into the passage before the bell shuts it. The blank wall returns, leaving you unable to follow him or interfere with the route.
THE_EX_CONVICT.sanity.fail.info=Discard this defeated investigator.

THE_EXPEDITION_LEADER.health.flavor=Leo's field pack and folded maps wait beside his stretcher. Injuries have ended his latest journey, but he still refuses to let anyone answer the voices beyond the shutters.
THE_EXPEDITION_LEADER.health.info=[#GOOD]Gain all of his possessions[]
THE_EXPEDITION_LEADER.health.flavor.2=He distrusts spoken reports now. You ask him to use the written procedure he taught his teams and record the valley's safe approach.
#Test Influence
THE_EXPEDITION_LEADER.health.pass.flavor=He draws a route that avoids the listening ground. A relief party can block the approach used by the voices, and Leo accepts that his own expeditions are over.
THE_EXPEDITION_LEADER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_EXPEDITION_LEADER.health.pass.info.2=Discard this defeated investigator.
THE_EXPEDITION_LEADER.health.fail.flavor=He tears up every route as soon as he draws it. The relief party leaves without directions, and Leo withdraws from the search.
THE_EXPEDITION_LEADER.health.fail.info=Discard this defeated investigator.

THE_EXPEDITION_LEADER.sanity.flavor=Leo has left his equipment outside a room papered with expedition notes. He hears his companions calling from the street, although the voices arrive without footsteps.
THE_EXPEDITION_LEADER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_EXPEDITION_LEADER.sanity.flavor.2=He starts dragging open a door that has been nailed shut. You struggle to hold it closed and bring him away from the answering voices.
#Test Strength
THE_EXPEDITION_LEADER.sanity.pass.flavor=You secure the door and recover the note naming their next meeting place. Others can disrupt the summons while Leo is taken somewhere quiet.
THE_EXPEDITION_LEADER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_EXPEDITION_LEADER.sanity.pass.info.2=Discard this defeated investigator.
THE_EXPEDITION_LEADER.sanity.fail.flavor=He forces the door wide and follows the voices. By the time you reach the street, both Leo and the promised meeting place are lost to you.
THE_EXPEDITION_LEADER.sanity.fail.info=Discard this defeated investigator.

THE_ACTRESS.health.flavor=Lola's gold evening dress hangs beside a packed trunk she has left for you. An injury sustained while tracing a borrowed memory has ended her tour.
THE_ACTRESS.health.info=[#GOOD]Gain all of her possessions[]
THE_ACTRESS.health.flavor.2=She keeps discussing the accident as if it happened to a character. You ask her to tell it once in her own words so a doctor can help.
#Test Influence
THE_ACTRESS.health.pass.flavor=She recalls the address behind the memory and the hour its owner is expected. You can warn them in time; Lola leaves the stage to recover.
THE_ACTRESS.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ACTRESS.health.pass.info.2=Discard this defeated investigator.
THE_ACTRESS.health.fail.flavor=She returns to the character's invented history. Her company takes her away for treatment before the real address can be recovered.
THE_ACTRESS.health.fail.info=Discard this defeated investigator.

THE_ACTRESS.sanity.flavor=Lola's belongings have been set aside in a dressing room. She changes her posture and voice with every costume, unable to remember which life is her own.
THE_ACTRESS.sanity.info=[#GOOD]Gain all of her possessions[]
THE_ACTRESS.sanity.flavor.2=You offer to rehearse a scene in which each stranger says where they are going. You try to keep her attention on one role at a time.
#Test Influence
THE_ACTRESS.sanity.pass.flavor=One borrowed voice gives the address where the costumes are being collected. You can interrupt the collection while her company takes charge of her care.
THE_ACTRESS.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_ACTRESS.sanity.pass.info.2=Discard this defeated investigator.
THE_ACTRESS.sanity.fail.flavor=The roles begin answering over one another. The company closes the dressing room, and no destination survives the performance.
THE_ACTRESS.sanity.fail.info=Discard this defeated investigator.

THE_ROOKIE_COP.health.flavor=Tommy's uniform jacket hangs above a carefully packed set of belongings left for you. He was injured following the identical shoes from the boardinghouse and has not reported back.
THE_ROOKIE_COP.health.info=[#GOOD]Gain all of his possessions[]
THE_ROOKIE_COP.health.flavor.2=You compare his property labels with the missing-person notices, looking for the address he visited last.
#Test Observation
THE_ROOKIE_COP.health.pass.flavor=The matching label leads to an injured Tommy and a register of the next intended disappearances. You arrange his care and send warnings before those names can be erased.
THE_ROOKIE_COP.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_ROOKIE_COP.health.pass.info.2=Discard this defeated investigator.
THE_ROOKIE_COP.health.fail.flavor=The labels lead to rooms already emptied. Tommy's investigation ends in a missing-person notice of his own, with no register recovered.
THE_ROOKIE_COP.health.fail.info=Discard this defeated investigator.

THE_ROOKIE_COP.sanity.flavor=Tommy has ordered his compromised belongings destroyed. Before they are cleared away, he tells you which boardinghouse must be evacuated; the warning buys time, though he cannot stop reliving the search.
THE_ROOKIE_COP.sanity.info.1=[#BAD]Discard all of his possessions[]
THE_ROOKIE_COP.sanity.info.2=[#GOOD]Retreat Doom[]
THE_ROOKIE_COP.sanity.flavor.2=He keeps reaching for another blank report. You ask him to let someone else carry the investigation from here.
#Test Influence
THE_ROOKIE_COP.sanity.pass.flavor=He accepts that he must step away and arranges for a carbine from the station's stores to reach you. A colleague escorts him home.
THE_ROOKIE_COP.sanity.pass.info.1=[#GOOD]Gain Carbine Rifle[]
THE_ROOKIE_COP.sanity.pass.info.2=Discard this defeated investigator.
THE_ROOKIE_COP.sanity.fail.flavor=He turns back to the blank report and refuses further help. His colleagues end your visit; the investigation passes on without his assistance.
THE_ROOKIE_COP.sanity.fail.info=Discard this defeated investigator.

THE_VIOLINIST.health.flavor=Patrice's blue concert dress and equipment have been packed for you. Injuries from a collapsing rehearsal room have left her unable to travel or play.
THE_VIOLINIST.health.info=[#GOOD]Gain all of her possessions[]
THE_VIOLINIST.health.flavor.2=She has marked one dangerous bar in the changing score. You ask her to explain the marks during the brief intervals when she can concentrate.
#Test Influence
THE_VIOLINIST.health.pass.flavor=She dictates the alteration that prevents the courtyard from appearing. You send the correction to the publisher while Patrice leaves the work in your care.
THE_VIOLINIST.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_VIOLINIST.health.pass.info.2=Discard this defeated investigator.
THE_VIOLINIST.health.fail.flavor=Her concentration fails before the correction is complete. Her attendants end the visit, and the publisher receives no warning it can use.
THE_VIOLINIST.health.fail.info=Discard this defeated investigator.

THE_VIOLINIST.sanity.flavor=Patrice's belongings have been entrusted to you. She continues tracing a score on an empty music stand, absorbed in a performance no one else can hear.
THE_VIOLINIST.sanity.info=[#GOOD]Gain all of her possessions[]
THE_VIOLINIST.sanity.flavor.2=The deserted courtyard begins to show through the windows. You resist the urge to flee and follow the silence between her movements.
#Test Will
THE_VIOLINIST.sanity.pass.flavor=You hold steady through the missing final rest and understand how to end an opening between worlds. Patrice's performance stops; her companions lead her away.
THE_VIOLINIST.sanity.pass.flavor.2=You follow the missing final rest, but no open passage remains for the cadence to seal. Patrice's silent performance ends, and her companions lead her away without changing the world beyond the windows.
THE_VIOLINIST.sanity.pass.info.1=[#GOOD]Close one Gate[]
THE_VIOLINIST.sanity.pass.info.2=Discard this defeated investigator.
THE_VIOLINIST.sanity.fail.flavor=You look away before the final movement. The windows show the street again, and Patrice is taken into care without revealing how to end the passage.
THE_VIOLINIST.sanity.fail.info=Discard this defeated investigator.

THE_BOOTLEGGER.health.flavor=Finn's delivery truck has arrived without him, its remaining contents assigned to you. A roadside accident has ended his driving, and his contacts are hiding him from the tollhouse keepers.
THE_BOOTLEGGER.health.info=[#GOOD]Gain all of his possessions[]
THE_BOOTLEGGER.health.flavor.2=The drivers will not disclose his refuge to a stranger. You explain that you need his last detour to keep another convoy out of danger.
#Test Influence
THE_BOOTLEGGER.health.pass.flavor=They arrange a visit. Finn marks the route around the next tollhouse before retiring from the road, denying its keepers another collection.
# TODO LATER gain one task unique asset
THE_BOOTLEGGER.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOOTLEGGER.health.pass.info.2=Discard this defeated investigator.
THE_BOOTLEGGER.health.fail.flavor=The drivers close ranks. Finn vanishes into their care without passing on the detour, and you cannot warn the next convoy in time.
THE_BOOTLEGGER.health.fail.info=Discard this defeated investigator.

THE_BOOTLEGGER.sanity.flavor=Finn has left his belongings at a delivery yard. He no longer trusts any road to lead to the same day on which he entered it.
THE_BOOTLEGGER.sanity.info=[#GOOD]Gain all of his possessions[]
THE_BOOTLEGGER.sanity.flavor.2=His route book is covered in crossed-out hours and bridges. You search for the small marks he once used to distinguish safe detours.
#Test Observation
THE_BOOTLEGGER.sanity.pass.flavor=You find a route deliberately left unmarked and identify the collection it avoids. The drivers can delay the keepers' work while Finn stays off the roads.
THE_BOOTLEGGER.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_BOOTLEGGER.sanity.pass.info.2=Discard this defeated investigator.
THE_BOOTLEGGER.sanity.fail.flavor=Each promising route ends at another crossed-out hour. Finn's contacts take him into seclusion, and his final detour remains unreadable.
THE_BOOTLEGGER.sanity.fail.info=Discard this defeated investigator.

THE_HANDYMAN.health.flavor=Wilson's yellow work apron is folded over the equipment he has left you. He is trapped beneath a fallen service platform, injured while tracing the pipes below a building.
THE_HANDYMAN.health.info=[#GOOD]Gain all of his possessions[]
THE_HANDYMAN.health.flavor.2=The platform blocks both Wilson and the valve he was trying to reach. You take hold of its bent support and try to haul it aside.
#Test Strength
THE_HANDYMAN.health.pass.flavor=You raise the platform and pull him free. He explains which valve can interrupt the buried machinery before the ambulance takes him away.
THE_HANDYMAN.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_HANDYMAN.health.pass.info.2=Discard this defeated investigator.
THE_HANDYMAN.health.fail.flavor=The support buckles without lifting the platform. Rescue crews send you out; Wilson's findings remain buried, and he cannot continue the work.
THE_HANDYMAN.health.fail.info=Discard this defeated investigator.

THE_HANDYMAN.sanity.flavor=Wilson has set his equipment outside a workshop filled with models of the buried structure. He moves the same lengths of pipe from one model to another without speaking.
THE_HANDYMAN.sanity.info=[#GOOD]Gain all of his possessions[]
THE_HANDYMAN.sanity.flavor.2=You ask him to show you a repair as though you were an apprentice, naming familiar tools to draw him into the explanation.
#Test Influence
THE_HANDYMAN.sanity.pass.flavor=He points out a junction that can halt the structure's expansion. You copy the arrangement while his neighbors bring him home to rest.
THE_HANDYMAN.sanity.pass.info.1=[#GOOD]Retreat Doom[]
THE_HANDYMAN.sanity.pass.info.2=Discard this defeated investigator.
THE_HANDYMAN.sanity.fail.flavor=He dismantles the model before explaining it. His neighbors close the workshop, and the junction is lost among the loose pieces.
THE_HANDYMAN.sanity.fail.info=Discard this defeated investigator.

THE_WAITRESS.health.flavor=Agnes has brought you her belongings in bags from the diner. An accident on one of the impossible roads has left her too injured to stand through another shift.
THE_WAITRESS.health.info=[#GOOD]Gain all of her possessions[]
THE_WAITRESS.health.flavor.2=She fears that leaving the counter will strand her unusual customers. You ask her to trust someone else with the route notebook and accept medical care.
#Test Influence
THE_WAITRESS.health.pass.flavor=She identifies the road on which the next group will disappear. You send a warning while her coworkers take her to the hospital; her watch at the counter is over.
THE_WAITRESS.health.pass.info.1=[#GOOD]Retreat Doom[]
THE_WAITRESS.health.pass.info.2=Discard this defeated investigator.
THE_WAITRESS.health.fail.flavor=She closes the notebook without identifying the road. Her coworkers arrange her care, but no one can carry on the unfinished warning.
THE_WAITRESS.health.fail.info=Discard this defeated investigator.

THE_WAITRESS.sanity.flavor=Agnes' belongings wait behind the empty counter. She answers every question with directions to towns absent from any map, no longer recognizing the diner around her.
THE_WAITRESS.sanity.info=[#GOOD]Gain all of her possessions[]
THE_WAITRESS.sanity.flavor.2=Two recurring sets of directions sound more like spoken workings than roads. You apply your knowledge of ritual language to distinguish them.
#Test Lore
THE_WAITRESS.sanity.pass.flavor=You recover two complete enchantments hidden in the directions. Her coworkers take Agnes somewhere quiet, leaving you to put the workings to use.
THE_WAITRESS.sanity.pass.info.1=[#GOOD]Gain two Spells[]
THE_WAITRESS.sanity.pass.info.2=Discard this defeated investigator.
THE_WAITRESS.sanity.fail.flavor=Neither sequence resolves into a complete working. Her coworkers end the visit, and Agnes' directions fade into disconnected place names.
THE_WAITRESS.sanity.fail.info=Discard this defeated investigator.

THE_BUTLER.health.flavor=Carson has arranged his belongings for you as carefully as a dinner service. His injuries prevent him from leaving the household's infirmary.
THE_BUTLER.health.info=[#GOOD]Gain all possessions.[]
THE_BUTLER.health.flavor.2=He worries that the rescued servants will be sent back to the dining room. You explain how they can be kept safe and ask for his final seating plan.
THE_BUTLER.health.pass.flavor=Reassured, he marks the chair where the replacement host will appear. You can prevent another dinner while Carson relinquishes his duties.
THE_BUTLER.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_BUTLER.health.pass.info.2=Discard this defeated investigator.
THE_BUTLER.health.fail.flavor=He cannot be reassured enough to discuss the plan. The household closes around his care, and the next dinner remains beyond your reach.
THE_BUTLER.health.fail.info=Discard this defeated investigator.

THE_BUTLER.sanity.flavor=Carson's belongings have been packed for you in the servants' hall. He spends each evening correcting place settings for guests whose names change as he writes them.
THE_BUTLER.sanity.info=[#GOOD]Gain all possessions.[]
THE_BUTLER.sanity.flavor.2=One place setting remains untouched as all the others change. You compare the seating plans, looking for the detail Carson keeps checking.
THE_BUTLER.sanity.pass.flavor=You recognize the empty place that completes the invitation and can keep it unfilled. The former staff escort Carson away from the house.
THE_BUTLER.sanity.pass.info.1=[#GOOD]Retreat Doom.[]
THE_BUTLER.sanity.pass.info.2=Discard this defeated investigator.
THE_BUTLER.sanity.fail.flavor=The changing names defeat your interpretation. The staff take Carson to safety, but you cannot identify the invitation's missing part.
THE_BUTLER.sanity.fail.info=Discard this defeated investigator.

THE_PRIEST.health.flavor=Mateo has ordered his remaining possessions given up; his injuries have ended his journeys along the impossible postal route. He offers you a prayer of protection before the parcels are carried away.
THE_PRIEST.health.info=[#GOOD]Gain one Boon Condition. Discard Mateo's possessions.[]
THE_PRIEST.health.flavor.2=The letters still plead for help from the demolished village. You hold to the promise of his prayer despite the certainty that you cannot answer them all.
THE_PRIEST.health.pass.flavor=Your resolve holds through the last plea, and Mateo pronounces a blessing over the work you will carry on. He leaves the route in other hands.
THE_PRIEST.health.pass.info.1=[#GOOD]Gain Blessed.[]
THE_PRIEST.health.pass.info.2=Discard this defeated investigator.
THE_PRIEST.health.fail.flavor=The unanswered pleas overwhelm your concentration. Mateo bids you a quiet farewell; his earlier prayer is all you carry from the visit.
THE_PRIEST.health.fail.info=Discard this defeated investigator.

THE_PRIEST.sanity.flavor=Mateo's belongings wait beside a sack of undeliverable letters. He reads each plea aloud to an empty chapel, then starts again before reaching its address.
THE_PRIEST.sanity.info=[#GOOD]Gain all possessions.[]
THE_PRIEST.sanity.flavor.2=You ask him to remember the first parcel and the ordinary supplies its writers needed, hoping to bring him back to a single journey.
THE_PRIEST.sanity.pass.flavor=He names the sorting office where the impossible letters enter the post. You can interrupt their delivery while his fellow clergy take over his care.
THE_PRIEST.sanity.pass.info.1=[#GOOD]Retreat Doom.[]
THE_PRIEST.sanity.pass.info.2=Discard this defeated investigator.
THE_PRIEST.sanity.fail.flavor=He begins another letter without hearing you. His colleagues close the chapel, and the route remains untraced.
THE_PRIEST.sanity.fail.info=Discard this defeated investigator.

THE_NUN.health.flavor=Mary's infirmary ledger rests atop the belongings she has placed in your care. Injured while investigating another shared voice, she can no longer make her rounds.
THE_NUN.health.info=[#GOOD]Gain all possessions.[]
THE_NUN.health.flavor.2=A recording of the patients' answers includes a voice that seems to know your thoughts. You steady yourself and listen for the names Mary has marked.
THE_NUN.health.pass.flavor=You hear the full sequence of names that silences the sender. You pass it to the wards while Mary retires from the investigation.
THE_NUN.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_NUN.health.pass.info.2=Discard this defeated investigator.
THE_NUN.health.fail.flavor=You stop the recording before the sequence is complete. The infirmary takes Mary into care, leaving the other wards without her answer.
THE_NUN.health.fail.info=Discard this defeated investigator.

THE_NUN.sanity.flavor=Mary has surrendered her belongings at the infirmary door. She repeats the ward register under her breath, afraid that any pause will let the unfamiliar voice return.
THE_NUN.sanity.info=[#GOOD]Gain all possessions.[]
THE_NUN.sanity.flavor.2=You gently name the patients she helped recover and ask her which hospital first sent word of the shared voice.
THE_NUN.sanity.pass.flavor=She recognizes a name and supplies the hospital's address. A warning can reach its staff while her sisters take her away from the wards.
THE_NUN.sanity.pass.info.1=[#GOOD]Retreat Doom.[]
THE_NUN.sanity.pass.info.2=Discard this defeated investigator.
THE_NUN.sanity.fail.flavor=She cannot separate your question from the voice she fears. Her sisters end the visit before any address can be recovered.
THE_NUN.sanity.fail.info=Discard this defeated investigator.

THE_EXPLORER.health.flavor=Ursula's survey bag has been left with you at a field hospital. A fall on the oversized staircase has ended her work on the moving circles.
THE_EXPLORER.health.info=[#GOOD]Gain all possessions.[]
THE_EXPLORER.health.flavor.2=The medical team restricts visits. You explain that one detail from her last survey could keep the next expedition out of danger.
THE_EXPLORER.health.pass.flavor=Allowed a short visit, you learn where to break the circle of stakes. You send instructions ahead while Ursula turns her routes over to another surveyor.
THE_EXPLORER.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_EXPLORER.health.pass.info.2=Discard this defeated investigator.
THE_EXPLORER.health.fail.flavor=The team refuses to disturb her. Her survey closes without the missing detail, and the next circle cannot be interrupted.
THE_EXPLORER.health.fail.info=Discard this defeated investigator.

THE_EXPLORER.sanity.flavor=Ursula has abandoned her equipment beside a map drawn across the floor. She believes she is still descending the staircase and cannot find the way back.
THE_EXPLORER.sanity.info=[#GOOD]Gain all possessions.[]
THE_EXPLORER.sanity.flavor.2=The staircase begins to appear beneath your own feet as she describes it. You fight the vertigo and keep calling her back toward the landing.
THE_EXPLORER.sanity.pass.flavor=She directs your hand to a fold in the map, and you draw an ancient object through from the landing. Her attendants take Ursula away from the unfinished descent.
THE_EXPLORER.sanity.pass.info.1=[#GOOD]Gain one Artifact.[]
THE_EXPLORER.sanity.pass.info.2=Discard this defeated investigator.
THE_EXPLORER.sanity.fail.flavor=You recoil as the imagined steps fall away beneath you. Her attendants remove the map before you can reach the landing, and her survey ends without a recovery.
THE_EXPLORER.sanity.fail.info=Discard this defeated investigator.

THE_REPORTER.health.flavor=Rex's waterproof satchel and other belongings wait beside his bed. He was injured preventing a disaster from the changing proofs, and cannot reach the next address himself.
THE_REPORTER.health.info=[#GOOD]Gain all possessions.[]
THE_REPORTER.health.flavor.2=He keeps dismissing his notes as another story no editor will print. You ask him to trust you with the unpublished warning.
THE_REPORTER.health.pass.flavor=He gives you the address and the hour before the proof can change. You send someone ahead to avert it while Rex leaves reporting behind.
THE_REPORTER.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_REPORTER.health.pass.info.2=Discard this defeated investigator.
THE_REPORTER.health.fail.flavor=He turns the notes face down without naming the address. His attendants end the interview, and the unpublished warning is lost.
THE_REPORTER.health.fail.info=Discard this defeated investigator.

THE_REPORTER.sanity.flavor=Rex has left his belongings at the press office. He sits beneath tomorrow's proofs, unable to distinguish an event he prevented from one still approaching.
THE_REPORTER.sanity.info=[#GOOD]Gain all possessions.[]
THE_REPORTER.sanity.flavor.2=An obituary keeps changing between the same three columns. Each revision describes your own death more closely; you force yourself to read through to the final line.
THE_REPORTER.sanity.pass.flavor=The marks offer a bargain: let the next obituary attach itself to you, and three approaching disasters can be postponed. Rex leaves the proofs in your care while you decide.
THE_REPORTER.sanity.pass.info.1=[#GOOD]You may gain a Cursed Condition to retreat Doom 3 times.[]
THE_REPORTER.sanity.pass.info.2=Discard this defeated investigator.
THE_REPORTER.sanity.pass.option.1.flavor=You write your name beneath the obituary. Three disaster reports drain from the proofs, leaving a persistent shadow across every account of your own future.
THE_REPORTER.sanity.pass.option.2.flavor=You leave the signature line blank. The three reports remain in tomorrow's edition; you must face their warnings without taking the obituary upon yourself.
THE_REPORTER.sanity.fail.flavor=You turn away before the final line, unable to endure another version of your death. Rex is taken into care with the predictions still unbroken.
THE_REPORTER.sanity.fail.info=Discard this defeated investigator.

THE_PROFESSOR.health.flavor=Harvey's reference books and traveling effects have been entrusted to you. Injuries sustained at one of the doors have confined him to a recovery ward.
THE_PROFESSOR.health.info=[#GOOD]Gain all possessions.[]
THE_PROFESSOR.health.flavor.2=The tablet fragments contradict his published translation. You work through the older grammar with him to identify the error.
THE_PROFESSOR.health.pass.flavor=You locate the instruction that would open the next door and strike it from the translation. Harvey entrusts his remaining research to you and rests.
THE_PROFESSOR.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_PROFESSOR.health.pass.info.2=Discard this defeated investigator.
THE_PROFESSOR.health.fail.flavor=The grammar offers two incompatible readings. Harvey grows too tired to continue, leaving the dangerous instruction unidentified.
THE_PROFESSOR.health.fail.info=Discard this defeated investigator.

THE_PROFESSOR.sanity.flavor=Harvey has given up his possessions to the faculty office. He repeatedly withdraws and rewrites the same sentence, certain that every correction creates another door.
THE_PROFESSOR.sanity.info=[#GOOD]Gain all possessions.[]
THE_PROFESSOR.sanity.flavor.2=You ask him to explain his first mistaken conclusion as if you were a student, hoping familiar teaching will steady his thoughts.
THE_PROFESSOR.sanity.pass.flavor=He describes the false assumption sustaining one of the openings. You can challenge the rite that depends on it while his colleagues arrange his care.
THE_PROFESSOR.sanity.pass.info.1=[#GOOD]Retreat Doom.[]
THE_PROFESSOR.sanity.pass.info.2=Discard this defeated investigator.
THE_PROFESSOR.sanity.fail.flavor=He strikes through the sentence again without explaining it. His colleagues put away the fragments, and the opening remains unchallenged.
THE_PROFESSOR.sanity.fail.info=Discard this defeated investigator.

THE_DILETTANTE.health.flavor=Jenny's blue traveling coat hangs beside the luggage she has forwarded to you. Her injuries have forced her to direct the shipping inquiry from a recovery room.
THE_DILETTANTE.health.info=[#GOOD]Gain all possessions.[]
THE_DILETTANTE.health.flavor.2=You ask her to authorize supplies for the people who will carry on her work, explaining what they need before her accounts are placed in trust.
THE_DILETTANTE.health.pass.flavor=She signs an open requisition against the company's available stock. You may draw from the reserve while her trustees take over her affairs.
THE_DILETTANTE.health.pass.info.1=[#GOOD]Gain any Assets from the reserve.[]
THE_DILETTANTE.health.pass.info.2=Discard this defeated investigator.
THE_DILETTANTE.health.fail.flavor=She cannot authorize the requisition before the trustees close the accounts. Her part in the inquiry ends with the luggage already entrusted to you.
THE_DILETTANTE.health.fail.info=Discard this defeated investigator.

THE_DILETTANTE.sanity.flavor=Jenny has left her belongings in a shipping office. She searches the same passenger photographs for people she now believes are waiting aboard an unsailed vessel.
THE_DILETTANTE.sanity.info=[#GOOD]Gain all possessions.[]
THE_DILETTANTE.sanity.flavor.2=As she reads a passenger list, you hear water rising against the office walls. You hold your nerve and keep listening for the payment behind the voyage.
THE_DILETTANTE.sanity.pass.flavor=She identifies the payment keeping the next impossible voyage in motion. You can have it stopped while her crew escorts her home.
THE_DILETTANTE.sanity.pass.info.1=[#GOOD]Retreat Doom.[]
THE_DILETTANTE.sanity.pass.info.2=Discard this defeated investigator.
THE_DILETTANTE.sanity.fail.flavor=The sound of water drives you from the room before she reaches the payment. Her crew takes charge of her care, and the prepaid voyage remains on the books.
THE_DILETTANTE.sanity.fail.info=Discard this defeated investigator.

THE_SALESMAN.health.flavor=Bob's sample case and other belongings have been left with you. An accident involving one of the returned devices has left him unable to travel.
THE_SALESMAN.health.info=[#GOOD]Gain all possessions.[]
THE_SALESMAN.health.flavor.2=A jammed demonstration stand still conceals the maker's plate he was trying to reach. You brace the frame and try to force it open.
THE_SALESMAN.health.pass.flavor=You open the stand and uncover the workshop supplying the false purchases. A warning can halt its next delivery while Bob retires from the route.
THE_SALESMAN.health.pass.info.1=[#GOOD]Retreat Doom.[]
THE_SALESMAN.health.pass.info.2=Discard this defeated investigator.
THE_SALESMAN.health.fail.flavor=The frame will not open without destroying the plate. Bob's rounds end with the workshop still unidentified.
THE_SALESMAN.health.fail.info=Discard this defeated investigator.

THE_SALESMAN.sanity.flavor=Bob has handed over his belongings, but continues writing refunds for customers no one else can see. He cannot tell an honest order from another impossible return.
THE_SALESMAN.sanity.info=[#GOOD]Gain all possessions.[]
THE_SALESMAN.sanity.flavor.2=You present yourself as a customer and ask him to complete one ordinary transaction, carefully following the familiar steps of his sales routine.
THE_SALESMAN.sanity.pass.flavor=He signs a wholesale authorization covering the stock currently available to you. You may draw from the reserve before his associates close the business and take him home.
THE_SALESMAN.sanity.pass.info.1=[#GOOD]Gain any Assets from the reserve.[]
THE_SALESMAN.sanity.pass.info.2=Discard this defeated investigator.
THE_SALESMAN.sanity.fail.flavor=He tears up the order and starts another refund. His associates close the business before any purchase can be authorized.
THE_SALESMAN.sanity.fail.info=Discard this defeated investigator.
