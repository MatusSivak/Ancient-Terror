# Yig special K'n-yan encounters, mystery prompts and awakened-side prompts.
knyan.header=K'n-yan
knyan.nothing=Nothing else happens.
knyan.progress=[#GOOD]Advance the Active Mystery.[]

knyan.1.intro=Behind the mound's false wall, a stairway spirals down toward a blue glow. A stone door bars the way, its glyphs ringing a pulsing green stone.
knyan.1.pass.flavor=You heave the door open. The glyphs around the stone form a warning, and perhaps a map of what lies below.
knyan.1.pass.fail.info=[#BAD]Gain Cursed.[]
knyan.1.fail.info=[#BAD]Lose 1 Health.[]
knyan.1.fail.flavor=The worn steps crumble and you tumble into the dark. Something vast below stirs, and its attention presses against your mind.
knyan.1.fail.fail.info=[#BAD]Advance Doom by 1.[]

knyan.2.intro=Metal cylinders in a buried library hold the chronicles of K'n-yan, back to the age when serpent men ruled. The script crawls whenever you look away.
knyan.2.pass.question=[#BAD]Spend 1 Clue[] to decipher the hidden record and [#GOOD]advance the Active Mystery[]? Otherwise, [#BAD]gain Paranoia.[]
knyan.2.paranoia.info=[#BAD]Gain Paranoia.[]
knyan.2.fail.flavor=The crawling script coils around your thoughts and drags you deeper into the record. You struggle to tear your mind free.
knyan.2.fail.fail.info=[#BAD]Lose 1 Sanity and gain Cursed.[]

knyan.3.intro=The serpent men's laboratories lie shattered and abandoned, yet something has been dragging itself between the broken vessels. You follow its trail.
knyan.3.pass.flavor=The trail ends at an unfinished experiment, still twitching in its vat. Its makers' notes lie beside it, if you can read them.
knyan.3.pass.fail.info=[#BAD]Lose 1 Sanity and gain Paranoia.[]
knyan.3.cursed.info=[#BAD]Gain Cursed.[]
knyan.3.fail.question=[#BAD]Gain Poisoned[] to avoid gaining Cursed?

knyan.4.intro=A soft voice rises from beneath the streets, offering every secret of the city in exchange for a place in your mind. You fight to keep your thoughts your own.
knyan.4.pass.flavor=You wall off your own thoughts and let the whisper speak. Its message arrives in fragments you must piece together.
knyan.4.pass.fail.info=[#BAD]Lose 2 Sanity and become Delayed.[]
knyan.4.fail.info=[#BAD]Gain Hallucinations.[]
knyan.4.fail.flavor=The whisper floods your mind, and the blue-lit streets fill with impossible visions. You search for a pattern in the madness.
knyan.4.fail.fail.info=[#BAD]Lose 2 Sanity.[]

knyan.5.intro=In a sunken hall, the deathless people of K'n-yan receive you in perfect silence. A single spokesman addresses you, weighing every word you say.
knyan.5.pass.flavor=You meet the spokesman's ageless stare without flinching. The silent assembly waits to hear what you can offer them.
knyan.5.pass.fail.info=[#BAD]Move to an adjacent space and become Delayed.[]
knyan.5.escape.title=Escape to an adjacent space
knyan.5.fail.info=[#BAD]Lose 1 Health and gain Internal Injury.[]

knyan.6.intro=Shed scales litter the dust before an idol of the Father of Serpents. Whatever guards this temple is still alive, and still watching.
knyan.6.pass.flavor=Among the carvings, a pair of eyes blinks. You steady your nerves and step forward to face the temple's guardian.
knyan.6.pass.fail.info=[#BAD]Lose 2 Sanity.[]
knyan.6.fail.info=[#BAD]A Serpent People ambushes you.[]
knyan.6.fail.defeated.info=[#GOOD]You defeated the Serpent People.[]\nThe encounter ends without advancing the Active Mystery.
knyan.6.fail.survived.info=The ambush is over.\nThe encounter ends without advancing the Active Mystery.

knyan.7.intro=The chamber you seek lies somewhere in these ruins, but the walls slide and fold like the coils of a great snake whenever you draw near.
knyan.7.pass.flavor=You glimpse the chamber's entrance just as the walls begin to grind shut. You throw your weight against the stone.
knyan.7.pass.fail.info=[#BAD]Lose 2 Health.[]
knyan.7.fail.info=[#BAD]Gain Lost in Time and Space.[]

knyan.8.intro=You stumble into an arena where the people of K'n-yan watch captives fight for sport. A guard shoves you onto the sand as the crowd roars.
knyan.8.pass.info=[#GOOD]Improve Influence.[]
knyan.8.pass.flavor=Your victory wins the crowd's favor. A robed elder brings forward a strange offering, and the arena falls silent as you examine it.
knyan.8.pass.fail.info=[#BAD]Gain Poisoned.[]
knyan.8.fail.flavor=You are hurled back into the jeering crowd. In the confusion, you slip away and search for a path deeper into the city.

