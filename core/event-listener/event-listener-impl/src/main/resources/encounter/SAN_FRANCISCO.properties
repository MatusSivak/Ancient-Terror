1.flavor=A San Francisco insurance investigator offers lessons in reading a damaged room. You try to negotiate useful instruction within the funds you have available.
#Test Influence
1.pass.flavor=She agrees to teach you how to distinguish an accident from a deliberate disturbance. The exercises sharpen your observation.
1.pass.info=[#GOOD]Improve Observation[]
1.fail.flavor=You cannot reach an agreement on tuition. The consultation fee still leaves you with an unpaid bill.
1.fail.info=[#BAD]Gain a Debt Condition[]

2.flavor=Following a San Francisco delivery route teaches you to notice marks left by people who do not want their movements recorded.
2.info=[#GOOD]Improve Observation[]
2.flavor.2=The route ends at a door sealed with a ritual knot. You examine the binding to find a safe way to loosen it.
#Test Lore
2.fail.flavor=The binding snaps against your hand and fills your thoughts with a sudden scream. You leave both injured and shaken.
2.fail.info.1=[#BAD]Lose one Health[]
2.fail.info.2=[#BAD]Lose one Sanity[]

3.flavor=In a San Francisco holding room, a witness describes a locked building that followed him from street to street. You try to remain composed through his account.
#Test Will
3.pass.flavor=You listen without flinching. Grateful to be believed, he completes a protective prayer that leaves you blessed.
3.pass.info=[#GOOD]Gain a Blessed Condition[]
3.fail.flavor=You panic at a detail that seems to describe your own lodging. The guards refuse to release you until the disturbance is investigated.
3.fail.info=[#BAD]Gain a Detained Condition[]

4.flavor=A San Francisco workshop offers an intensive course in several practical disciplines. Staying for it will keep you away from your investigation longer than planned.
4.question=[#BAD]Become Delayed[] to stay for a few days?
4.pass.flavor=You complete the course in your chosen field. The new practice is useful, though your journey has been delayed.
4.pass.info=[#GOOD]Improve one Skill of your choice[]

5.flavor=A San Francisco harbor examiner offers to teach you how to detect falsified cargo records if you contribute evidence from your own work.
5.question=[#BAD]Spend one Clue[] to [#GOOD]Improve Observation[]?

6.flavor=In a San Francisco excavation, a wall bears a perfect impression of a creature far larger than the tunnel. You try to control your fear while the survey crew examines it.
#Test Will-1
6.pass.flavor=You remain long enough to help the specialists compare their methods. One gives you practical instruction in the skill you choose.
6.pass.info=[#GOOD]Improve one Skill of your choice[]
6.fail.flavor=You bolt toward the entrance and fall through a gap in the staging. Your leg twists painfully beneath you.
6.fail.info=[#BAD]Gain a Leg Injury Condition[]

7.flavor=A San Francisco fire investigator teaches you how to reconstruct the movement of a blaze from its smallest traces.
7.info=[#GOOD]Improve Observation[]
7.flavor.2=One recovered door bears marks that describe how the fire was invited inside. You try to distinguish the closing words from a second invitation.
#Test Lore-1
7.fail.flavor=You complete the invitation aloud. A trail of small misfortunes begins before you have even left the room.
7.fail.info=[#BAD]Gain a Cursed Condition[]

8.flavor=A San Francisco projectionist shows you footage in which something moves only between frames. You keep watching despite the growing sense that it has noticed you.
#Test Will
8.pass.flavor=You learn to compare the gaps rather than the images. The exercise makes subtle changes easier for you to spot.
8.pass.info=[#GOOD]Improve Observation[]
8.fail.flavor=The missing frames seem to contain more time than the film itself. Your sense of what happens between one moment and the next begins to break down.
8.fail.info=[#BAD]Gain a Madness Condition[]

9.flavor=A San Francisco building inspector trains you to detect hidden alterations before taking you through a condemned apartment block.
9.info=[#GOOD]Improve Observation[]
9.flavor.2=At night, the corridors appear to reconnect behind you. You hold your nerve and keep comparing them with the plan.
#Test Will-1
9.fail.info=[#BAD]Lose two Sanity[]

10.flavor=A San Francisco telegraph office has received instructions for a route that joins any two places. Following it requires a painful effort to hold both destinations in your mind.
10.question=[#BAD]Spend two Sanity[] to \n[#GOOD]move to a space of your choice[]?

11.flavor=A San Francisco broker offers two lessons drawn from a sealed book: sharper observation and another discipline of your choice. The price is a binding promise of future service.
11.question=[#BAD]Gain a Dark Pact Condition[] to \n[#GOOD]Improve Observation[] and\n[#GOOD]Improve one Skill of your choice[]?

12.flavor=A San Francisco cartographer has mapped places that disappear when no one watches them. You study the ritual geometry behind his observations.
#Test Lore
12.pass.flavor=You understand how to predict which details will vanish first. The method sharpens your ability to notice what others overlook.
12.pass.info=[#GOOD]Improve Observation[]
12.fail.flavor=A line on the map opens across the room and strikes like a taut wire. You stumble away injured and terrified.
12.fail.info.1=[#BAD]Lose one Health[]
12.fail.info.2=[#BAD]Lose one Sanity[]

13.flavor=A San Francisco repair crew asks you to document an electrical accident. Their careful comparison of damage teaches you to notice small physical traces.
13.info=[#GOOD]Improve Observation[]
13.flavor.2=The final photograph shows someone standing inside an intact transformer. You steady yourself before looking closely.
#Test Will-1
13.fail.flavor=You cannot stop imagining the person still waiting inside the metal. The thought leaves you deeply unsettled.
13.fail.info=[#BAD]Lose two Sanity[]

14.flavor=In a San Francisco boardinghouse, several guests describe the same impossible machine in different languages. You use your knowledge of symbols to compare their accounts.
#Test Lore-1
14.pass.flavor=You recover one coherent exercise from the descriptions and apply it to the skill you choose to practice.
14.pass.info=[#GOOD]Improve one Skill of your choice[]
14.fail.flavor=The descriptions join into a doorway instead of a diagram. You step through before recognizing that it leads beyond familiar time and space.
14.fail.info=[#BAD]Gain a Lost in Time and Space Condition[]

15.flavor=A San Francisco craft teacher knows an unusual method for learning through reflected movements. You try to persuade her that you can be trusted with a lesson.
#Test Influence-1
15.pass.flavor=She agrees and guides you through the method. You apply it to a skill of your choice.
15.pass.info=[#GOOD]Improve one Skill of your choice[]
15.fail.flavor=The interview collapses into an argument beside a covered mirror. Something strikes from beneath the cloth, leaving you hurt and frightened.
15.fail.info.1=[#BAD]Lose one Health[]
15.fail.info.2=[#BAD]Lose one Sanity[]

16.flavor=At a San Francisco freight yard, a leaking canister bursts beside you. You drag its heavy lid shut and try to force the fumes away before breathing too much.
#Test Strength
16.pass.flavor=You contain the leak and learn to recognize the small warning marks the crew had missed. Your eye for such details improves.
16.pass.info=[#GOOD]Improve Observation[]
16.fail.flavor=You cannot close the lid in time. The fumes poison you, and fear of another hidden leak follows you long after you leave the yard.
16.fail.info.1=[#BAD]Gain a Poisoned Condition[]
16.fail.info.2=[#BAD]Gain a Paranoia Condition[]
2.pass.flavor=You release the correct loop and step back before the knot tightens again. Your new attention to hidden marks remains useful.
4.pass.flavor.2=You are already held up and cannot take on the course. The instructor releases your place to another student.
4.fail.flavor=You decline the course and leave before the first demonstration.
5.pass.flavor=Your evidence provides a useful example. The examiner shows you how to spot altered dates and substituted seals.
5.pass.info=[#GOOD]Improve Observation[]
5.fail.flavor=You keep the evidence for yourself. The examiner returns to the day's manifests without beginning the lesson.
5.fail.flavor.2=You have no evidence to contribute. The proposed exchange cannot go ahead.
7.pass.flavor=You recognize the invitation and stop before repeating it. The fire investigator's practical lessons are all you carry away.
9.pass.flavor=You use the plan to reach the exit without following the changing corridors. The inspector's methods stay clear in your mind.
9.fail.flavor=You find the same room behind every exit. By morning, the repeated search has left you deeply distressed.
10.pass.flavor=You endure the strain and choose where the route will end. The office doorway opens onto your selected destination.
10.fail.flavor=You put down the instructions and remain where you are. The ordinary street outside has not changed.
10.fail.flavor.2=You cannot spare the concentration the route demands. You leave the instructions untouched and stay in San Francisco.
11.pass.flavor=You accept the pact and receive both lessons. The methods are useful, but the broker still holds your promise.
11.pass.flavor.2=Your existing pact prevents another binding agreement. The broker closes the book without teaching you.
11.fail.flavor=You refuse the terms. The broker returns the book to its case and lets you leave without instruction.
13.pass.flavor=You describe only what the photograph actually shows and put it away. The crew's observational methods remain useful.
