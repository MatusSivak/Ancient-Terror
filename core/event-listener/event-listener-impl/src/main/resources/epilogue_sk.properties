# Slovenské epilógy. Chýbajúce kľúče sa preberajú z anglického epilogue.properties.
victory.congratulations=[#GOOD]Gratulujeme!\nZahnal si Prastarého.[]
victory.hallOfFame=Sieň slávy ťa víta!
victory.yourName=Tvoje meno:

CROWN_OF_THE_SERPENT.title=Epilóg: Hadia koruna
CROWN_OF_THE_SERPENT=Koruna sa stále leskne, no hlasy v nej spútané zmĺkli. Po celom svete sa cudzí ľudia prebúdzajú zo snov, ktoré nedokážu vysvetliť. Relikviu zamkneš a dúfaš, že táto sloboda vydrží.
DESCENDANTS_OF_YIG.title=Epilóg: Potomkovia Yiga
DESCENDANTS_OF_YIG=Posledné z plemena zmizne pod rozbitým oltárom. Prvý raz po týždňoch sú lesné chodníky tiché. Tvoji spoločníci si zbalia veci a ani sa neobzrú.
KN_YAN_UNEARTHED.title=Epilóg: Odhalený K'n-yan
KN_YAN_UNEARTHED=Zapečatíš chodbu pod mohylou. Poznanie prinesené z K'n-yanu stačí na to, aby zmarilo plány hadích služobníkov, hoci nikto sa nevie zhodnúť, koľko z neho by malo prežiť v tvojich denníkoch.
MIGRATION_OF_SERPENTS.title=Epilóg: Sťahovanie hadov
MIGRATION_OF_SERPENTS=Zbiehajúce sa stopy sa rozpadnú. Správ o nemožných sťahovaniach ubúda a tábory expedícií opäť odpovedajú na rádiové volania. Kdesi v divočine bol zmarený pradávny zámer.
RISE_OF_THE_SERPENT_PEOPLE.title=Epilóg: Vzostup hadích ľudí
RISE_OF_THE_SERPENT_PEOPLE=Skryté laboratóriá jedno po druhom stmavnú. Ich prežívajúci páni sa stiahnu na miesta, na ktoré ľudstvo zabudlo. Vieš, že si ťa zapamätajú, aj keby sa svet nikdy nedozvedel, čo si vykonal.
THE_WINGED_SERPENT.title=Epilóg: Okrídlený had
THE_WINGED_SERPENT=Obrovský tieň sa zrúti z oblakov. Úsvit zastihne prístav zbitý, no živý. Medzi troskami zničíš posledné znamenia, ktoré by mohli privolať pána toho stvorenia späť.
SERPENTS_NEST.title=Epilóg: Hadie hniezdo
SERPENTS_NEST=Yig sa stiahne do hlbín a zanechá za sebou rozvrátené kráľovstvo. Prežívajúci kultisti sa rozpŕchnu. Svet sa dočká ďalšieho rána a zatiaľ to stačí.